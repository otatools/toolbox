            const elapsed = performance.now() - startTime;
            const charCount = Math.floor(elapsed / 80); // 速度を80に固定
            el.innerText = baseText + text.substring(0, charCount);
            if (charCount >= text.length) {
                clearInterval(timer);
                resolve();
            }

        };

// 変換して確定した文字を消すと、子どもが何を打ったか分からなくなって困るので、消さない。
// カタカナ（半角も）は自動でひらがなに直し、漢字などが残っていたら「ひらがなで入れてね」と表示するだけにする。
const toHiragana = (s) => (s || "").normalize('NFKC')
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
    .replace(/[\s　]/g, '');
const isHiraganaName = (s) => /^[ぁ-ゖー]+$/.test(s);
const nameInputs = [document.getElementById('p-last-name'), document.getElementById('p-first-name')];
function updateKanaWarning() {
    let anyBad = false;
    nameInputs.forEach(el => {
        const bad = el.value !== "" && !isHiraganaName(el.value);
        el.classList.toggle('is-invalid', bad);
        if (bad) anyBad = true;
    });
    document.getElementById('kana-warning').classList.toggle('hidden', !anyBad);
}
nameInputs.forEach(el => {
    let composing = false;
    const fix = () => {
        if (composing) return;
        const h = toHiragana(el.value);
        if (h !== el.value) el.value = h;
        updateKanaWarning();
    };
    el.addEventListener('compositionstart', () => { composing = true; });
    el.addEventListener('compositionend', () => { composing = false; setTimeout(fix, 0); });
    el.addEventListener('input', (e) => { if (e.isComposing || composing) return; fix(); });
    el.addEventListener('blur', () => { composing = false; fix(); });
});

// iOSのピンチ拡大を止める
['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {

// 万一拡大されてしまった時の保険（自己修復）
function resetZoomIfNeeded() {
    if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
    const meta = document.querySelector('meta[name="viewport"]');
    if (!meta) return;
    const original = meta.getAttribute('content');
    meta.setAttribute('content', original + ', maximum-scale=1.0');
    requestAnimationFrame(() => meta.setAttribute('content', original));
}
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resetZoomIfNeeded);
    window.visualViewport.addEventListener('scroll', resetZoomIfNeeded);
}

// Fisher-Yatesで公平にシャッフルする（sort(() => Math.random()-0.5) は偏るので使わない）
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}
const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];

// ユーザーが入力した名前などをinnerHTMLへ挿入する前に必ずエスケープする
function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

        const old = m.get(k);
        if (!old || (p.joinedAt || 0) > (old.joinedAt || 0)) m.set(k, p);
    });
    return [...m.values()];
};

// プレイヤーのサブコレクションだけを掃除する（部屋番号を使い回した時の残骸が残らないように）
async function purgeRoomPlayers(roomId) {
    try {
        const playersSnap = await getDocs(collection(db, "rooms", roomId, "players"));
        await Promise.all(playersSnap.docs.map(p => deleteDoc(doc(db, "rooms", roomId, "players", p.id))));
    } catch (e) {
        console.error("プレイヤー情報の削除に失敗しました:", e);
    }
}

// 部屋を完全に削除する（プレイヤーのサブコレクションも含めて掃除する）。
// 定期的な全件掃除はやめて、親機が部屋を閉じた/ゲームを終えたタイミングでその都度削除する方式にした。
async function closeRoom(roomId) {
    if (!roomId) return;
    try {
        await purgeRoomPlayers(roomId);
        await deleteDoc(doc(db, "rooms", roomId));
    } catch (e) {
        console.error("部屋の削除に失敗しました:", e);
    }
}

// 親機がボタンを使わずにブラウザを閉じた/再読み込みした時のための保険。
// 以前は部屋だけを消していたが、それだと中のプレイヤー情報が取り残されて二度と掃除できなかった。
// そこで「とじた」印だけを付け、プレイヤーごとの掃除は次に部屋を作る人の cleanupStaleRooms に任せる。
let leavingByButton = false;
function closeRoomOnUnload() {
    if (isHost && myRoomId && !leavingByButton) {
        try { updateDoc(doc(db, "rooms", myRoomId), { status: "closed" }).catch(() => {}); } catch (e) {}
    }
}
window.addEventListener('pagehide', closeRoomOnUnload);
window.addEventListener('beforeunload', closeRoomOnUnload);

// 部屋とプレイヤーには「消してよい日時」(expireAt) を入れておく。
// Firebaseのコンソールで TTL ポリシー（rooms と players の expireAt）を設定すれば、取り残しも自動で消える。
const ROOM_LIFE_MS = 3 * 60 * 60 * 1000;
const expireAt = () => Timestamp.fromMillis(Date.now() + ROOM_LIFE_MS);

// 部屋を作るついでに、古い部屋（2時間以上前）と、親機がいなくなった部屋を少しずつ掃除する。
// 1回で最大5件ずつ。全件は読まない。
const STALE_ROOM_MS = 2 * 60 * 60 * 1000;
async function cleanupStaleRooms() {
    try {
        const cutoff = Date.now() - STALE_ROOM_MS;
        const [oldSnap, closedSnap] = await Promise.all([
            getDocs(query(collection(db, "rooms"), where("createdAt", "<", cutoff), limit(5))),
            getDocs(query(collection(db, "rooms"), where("status", "==", "closed"), limit(5)))
        ]);
        const ids = new Set([...oldSnap.docs, ...closedSnap.docs].map(d => d.id));
        for (const id of ids) await closeRoom(id);
    } catch (e) {
        console.error("古い部屋の掃除に失敗しました:", e);
    }
}

document.getElementById('btn-create-mode').onclick = async () => {

await setDoc(doc(db, "rooms", myRoomId), {
    status: "waiting",
    host: myProfile.name,
    createdAt: Date.now(),

});
enterLobby(myRoomId);
};

    myProfile = profile; myRoomId = rId; await enterLobby(rId);
} catch (e) {

}

// ===== 部屋の状態 =====
// waiting（入室受付）→ started（ちょうさ中）→ timeup（時間です！席にもどろう）→ finished（結果発表）
let roomStatus = "waiting";
let lastRoomData = null;
let openingRunning = false;   // 事件の紹介演出の最中か
let timeupShown = false, resultsShown = false;
let gameStartedLocally = false;

async function enterLobby(roomId) {
await setDoc(doc(db, "rooms", roomId, "players", myProfile.key), { ...myProfile, isHost, answer: null, answerTime: null, joinedAt: Date.now(), expireAt: expireAt() });
document.getElementById('display-room-id').innerText = roomId;
document.getElementById('top-room-id').innerText = roomId;   // 左上の小さい番号は、ゲームが始まってから出す

document.getElementById('setup-screen').classList.add('hidden');
document.getElementById('join-screen').classList.add('hidden');
document.getElementById('lobby-screen').classList.remove('hidden');
if(isHost) { document.getElementById('host-controls').classList.remove('hidden'); applyTexts(modeSel.value); }
else document.getElementById('guest-waiting').classList.remove('hidden');
document.getElementById('lobby-count').classList.toggle('hidden', !isHost);
document.getElementById('player-list').classList.toggle('hidden', !isHost);

// 入室者の一覧を見張るのは親機だけ。
// 子機も見張ると「だれかが入る・答える」たびに全員が読み取りをして、40人だと1回のゲームで数千回になる。
if (isHost) onSnapshot(collection(db, "rooms", roomId, "players"), (snap) => {
const list = document.getElementById('player-list');
const rawPlayers = [];
snap.forEach(d => { const p = d.data(); p.key = p.key || d.id; rawPlayers.push(p); });
const lobbyPlayers = dedupePlayers(rawPlayers);
let answeredCount = 0;
lobbyPlayers.forEach(p => { if(p.answer) answeredCount++; });
lobbyPlayers.sort((a, b) => a.idNum - b.idNum);
// ゲーム開始後は、ヒントの順番とずれないよう開始時の名簿(finalPlayers)を差し替えない
if (!gameStartedLocally) players = lobbyPlayers;
list.innerHTML = lobbyPlayers.map(p => `<span class="lobby-chip">${escapeHtml(p.name)}</span>`).join("");
document.getElementById('player-count').innerText = lobbyPlayers.length;
// 全員が推理を送ったら「時間です！」へ（ちょうさ中のときだけ）
if(isHost && roomStatus === "started" && lobbyPlayers.length > 0 && answeredCount === lobbyPlayers.length) goTimeup("all");
});

onSnapshot(doc(db, "rooms", roomId), (d) => {
if (!d.exists()) {
    if (!isHost) { alert("この部屋はとじられました"); location.reload(); }
    return;
}
const data = d.data(); if(!data) return;
if (data.status === "closed") {
    if (!isHost) { alert("この部屋はとじられました"); location.reload(); }
    return;
}
lastRoomData = data;
roomStatus = data.status;
if (data.status !== "waiting" && data.finalPlayers && !gameStartedLocally) {
    applyTexts(data.mode);
    const updatedMe = data.finalPlayers.find(p => p.key === myProfile.key) || data.finalPlayers.find(p => p.name === myProfile.name && p.idNum === myProfile.idNum);
    if(updatedMe) myProfile = updatedMe;
    players = data.finalPlayers;
    startGame(data);
}
if (data.status === "started" && data.endTime) updateTimer(data.endTime);
if (data.status === "timeup") showTimeup(data);
if (data.status === "finished") showResults(data);
});
}

// ===== ヒントづくり =====
// 目標：1つのヒントで、だいたい半分くらいに絞れる。40人なら5人くらいに聞くと犯人が分かる。
//       4人でも、全員のヒントを合わせれば必ず犯人が1人に決まる。

const covers = (p, a, b) => p.aS != null && p.aS <= a && p.aE >= b;   // a時〜b時のあいだ、ずっとアリバイがある

function buildHintPool(c, ps, crimeH, mode) {
    const hi = mode === "high";
    const H = hi ? "犯人" : "はん人";
    const ID = hi ? "出席番号" : "出せき番号";
    const ONE = hi ? "一の位" : "一のくらい";
    const pool = [];
    const add = (cat, text, fn) => pool.push({ cat, text, fn });

    // --- 名前 ---
    add("name", `${H}の上の名前は${c.lastName.length}文字だ。`, p => p.lastName.length === c.lastName.length);
    add("name", `${H}の下の名前は${c.firstName.length}文字だ。`, p => p.firstName.length === c.firstName.length);
    add("name", `${H}の上の名前と下の名前をあわせると${c.fullName.length}文字だ。`, p => p.fullName.length === c.fullName.length);
    const chars = new Set();
    ps.forEach(p => [...p.fullName].forEach(ch => { if (/[ぁ-ゖ]/.test(ch)) chars.add(ch); }));
    chars.forEach(ch => {
        const has = c.fullName.includes(ch);
        add("name", `${H}の名前には「${ch}」の字が${has ? "入っている" : "入っていない"}。`, p => p.fullName.includes(ch) === has);
    });
    add("name", `${H}の上の名前は「${c.lastName[0]}」から始まる。`, p => p.lastName[0] === c.lastName[0]);
    add("name", `${H}の下の名前は「${c.firstName[0]}」から始まる。`, p => p.firstName[0] === c.firstName[0]);
    if (hi) {
        const rows = { "あ行": /[あいうえお]/, "か行": /[かきくけこがぎぐげご]/, "さ行": /[さしすせそざじずぜぞ]/, "た行": /[たちつてとだぢづでど]/, "な行": /[なにぬねの]/, "は行": /[はひふへほばびぶべぼぱぴぷぺぽ]/, "ま行": /[まみむめも]/, "や行": /[やゆよ]/, "ら行": /[らりるれろ]/ };
        Object.keys(rows).forEach(r => {
            const has = rows[r].test(c.fullName);
            add("name", `${H}の名前には「${r}」の字が${has ? "入っている" : "入っていない"}。`, p => rows[r].test(p.fullName) === has);
        });
        const L = c.fullName.length;
        add("name", `${H}の名前は、全部で${L}文字以上だ。`, p => p.fullName.length >= L);
        add("name", `${H}の名前は、全部で${L}文字以下だ。`, p => p.fullName.length <= L);
    }

    // --- 番号・たん生日 ---
    [2, 3, 5, 10, 15, 20].forEach(w => {
        for (let s = 1; s + w - 1 <= 40; s += (w >= 10 ? 5 : w)) {
            const e = s + w - 1;
            if (c.idNum >= s && c.idNum <= e) add("num", `${H}の${ID}は、${s}番から${e}番のあいだだ。`, p => p.idNum >= s && p.idNum <= e);
        }
    });
    add("num", `${H}の${ID}の${ONE}は${c.idNum % 10}だ。`, p => p.idNum % 10 === c.idNum % 10);
    [2, 3, 4, 6].forEach(w => {
        for (let s = 1; s + w - 1 <= 12; s += (w >= 4 ? 2 : w)) {
            const e = s + w - 1;
            if (c.m >= s && c.m <= e) add("num", `${H}は、${s}月から${e}月のあいだに生まれた。`, p => p.m >= s && p.m <= e);
        }
    });
    if (c.d <= 15) add("num", `${H}のたん生日は、1日から15日のあいだだ。`, p => p.d <= 15);
    else add("num", `${H}のたん生日は、16日から31日のあいだだ。`, p => p.d >= 16);
    [[1, 10], [11, 20], [21, 31]].forEach(([s, e]) => {
        if (c.d >= s && c.d <= e) add("num", `${H}のたん生日は、${s}日から${e}日のあいだだ。`, p => p.d >= s && p.d <= e);
    });
    if (hi) {
        const ev = c.idNum % 2 === 0;
        add("num", `${H}の${ID}は${ev ? "ぐう数" : "き数"}だ。`, p => (p.idNum % 2 === 0) === ev);
        [3, 4, 5].forEach(n => {
            const is = c.idNum % n === 0;
            add("num", `${H}の${ID}は${n}の倍数${is ? "だ" : "ではない"}。`, p => (p.idNum % n === 0) === is);
        });
        [10, 15, 20, 25, 30].forEach(k => {
            if (c.idNum >= k) add("num", `${H}の${ID}は${k}以上だ。`, p => p.idNum >= k);
            else add("num", `${H}の${ID}は${k - 1}以下だ。`, p => p.idNum <= k - 1);
        });
        const mev = c.m % 2 === 0;
        add("num", `${H}のたん生月の数字は${mev ? "ぐう数" : "き数"}だ。`, p => (p.m % 2 === 0) === mev);
        [3, 4, 5, 6, 7, 8, 9].forEach(k => {
            if (c.m <= k) add("num", `${H}のたん生月の数字は${k}以下だ。`, p => p.m <= k);
            else add("num", `${H}のたん生月の数字は${k + 1}以上だ。`, p => p.m >= k + 1);
        });
        const dev = c.d % 2 === 0;
        add("num", `${H}のたん生日の数字は${dev ? "ぐう数" : "き数"}だ。`, p => (p.d % 2 === 0) === dev);
        if (c.idNum > c.m) add("num", `${H}の${ID}は、たん生月の数字より大きい。`, p => p.idNum > p.m);
        else if (c.idNum < c.m) add("num", `${H}の${ID}は、たん生月の数字より小さい。`, p => p.idNum < p.m);
        if (c.d > c.idNum) add("num", `${H}のたん生日の数字は、${ID}より大きい。`, p => p.d > p.idNum);
        else if (c.d < c.idNum) add("num", `${H}のたん生日の数字は、${ID}より小さい。`, p => p.d < p.idNum);
    }

    // --- 服の色 ---
    const parts = [["cloth", "服"], ["pants", "ズボン"], ["socks", "くつ下"]];
    parts.forEach(([k, label]) => add("cloth", `${H}の${label}は${c[k]}だ。`, p => p[k] === c[k]));
    const wears = (p, col) => p.cloth === col || p.pants === col || p.socks === col;
    colors.forEach(col => {
        const has = wears(c, col);
        add("cloth", `${H}は、${col}のものを身につけて${has ? "いる" : "いない"}。`, p => wears(p, col) === has);
    });
    [[0, 2], [0, 1], [1, 2]].forEach(([i, j]) => {
        const [ki, li] = parts[i], [kj, lj] = parts[j];
        const same = c[ki] === c[kj];
        add("cloth", `${H}の${li}と${lj}は、${same ? "同じ色" : "ちがう色"}だ。`, p => (p[ki] === p[kj]) === same);
    });
    if (hi) {
        colors.forEach(col => {
            const has = c.cloth === col || c.pants === col;
            if (has) add("cloth", `${H}は、服かズボンのどちらかが${col}だ。`, p => p.cloth === col || p.pants === col);
        });
        const allDiff = (p) => p.cloth !== p.pants && p.pants !== p.socks && p.cloth !== p.socks;
        const d3 = allDiff(c);
        add("cloth", d3 ? `${H}の服・ズボン・くつ下は、3つとも色がちがう。` : `${H}の服・ズボン・くつ下には、同じ色のものがある。`, p => allDiff(p) === d3);
    }

    // --- 持ち物 ---
    ITEM_KEYS.forEach(icon => {
        const has = hasItem(c, icon);
        add("item", `${H}は${itemLabel(icon)}を持って${has ? "いる" : "いない"}。`, p => hasItem(p, icon) === has);
    });
    if (hi) {
        for (let i = 0; i < ITEM_KEYS.length; i++) for (let j = i + 1; j < ITEM_KEYS.length; j++) {
            const a = ITEM_KEYS[i], b = ITEM_KEYS[j];
            if (!hasItem(c, a) && !hasItem(c, b)) add("item", `${H}は${itemLabel(a)}も${itemLabel(b)}も持っていない。`, p => !hasItem(p, a) && !hasItem(p, b));
            else add("item", `${H}は${itemLabel(a)}か${itemLabel(b)}のどちらかを持っている。`, p => hasItem(p, a) || hasItem(p, b));
        }
    }

    // --- 時間（アリバイ） ---
    // 「はん行は○時から○時のあいだにおきた」→ その時間ずっとアリバイがある人は犯人ではない
    const crimeWord = hi ? "犯行" : "はん行";
    for (let a = crimeH - 2; a <= crimeH; a++) for (let b = crimeH + 1; b <= crimeH + 3; b++) {
        if (a < 8 || b > 15 || b - a > 3) continue;
        add("time", `${crimeWord}は${a}時から${b}時のあいだにおきた。`, p => !covers(p, a, b));
    }
    return pool;
}

// 人数に合わせて、ヒントを全員に1つずつ配る
function assignHints(c, ps, crimeH, mode) {
    const N = ps.length;
    const ci = ps.findIndex(p => p.key === c.key);
    const ALL = (1n << BigInt(N)) - 1n;
    const CBIT = 1n << BigInt(ci);
    const popcount = (m) => { let n = 0; while (m) { m &= m - 1n; n++; } return n; };

    // 目標の「1つのヒントで残る割合」：k個のヒントで1人になる割合（40人→約0.48、4人→約0.63）
    const k = Math.min(5, Math.max(2, N - 1));
    const target = Math.pow(N, -1 / k);
    const minCount = Math.max(2, Math.ceil(N * target * 0.55));
    const maxCount = Math.min(N - 1, Math.max(minCount, Math.floor(N * Math.min(0.85, target * 1.45))));

    const seen = new Set();
    let cand = [];
    buildHintPool(c, ps, crimeH, mode).forEach(h => {
        let mask = 0n;
        ps.forEach((p, i) => { if (h.fn(p)) mask |= 1n << BigInt(i); });
        if (!(mask & CBIT)) return;                // 犯人に当てはまらないヒントは使わない（念のため）
        if (seen.has(h.text)) return;
        seen.add(h.text);
        cand.push({ ...h, mask, count: popcount(mask) });
    });
    let usable = cand.filter(h => h.count >= minCount && h.count <= maxCount);
    if (usable.length < 3) usable = cand.filter(h => h.count >= 2 && h.count < N);
    if (usable.length === 0) usable = cand.filter(h => h.count < N);
    if (usable.length === 0) return ps.map(() => TX[mode].noHint);

    const cats = ["time", "name", "num", "cloth", "item"];

    // ヒントhを足したとき、「need個より少ないヒント」だけで犯人が決まってしまわないか
    const okToAdd = (h, S, need) => {
        if (need >= 2 && h.mask === CBIT) return false;
        const rec = (start, acc, depth) => {
            if (depth === 0) return true;
            for (let i = start; i < S.length; i++) {
                const m = acc & S[i].mask;
                if (m === CBIT) return false;
                if (!rec(i + 1, m, depth - 1)) return false;
            }
            return true;
        };
        return rec(0, h.mask, need - 2);
    };

    // 1つずつヒントを足していき、全部合わせたときにちょうど犯人1人になるようにする
    const tryBuild = (need) => {
        const S = [];
        let cur = ALL;
        const order = shuffleArray([...cats]);
        for (let guard = 0; guard < 200 && cur !== CBIT; guard++) {
            let picked = null;
            for (let s = 0; s < cats.length && !picked; s++) {
                const cat = order[(S.length + s) % cats.length];
                const cur1 = popcount(cur);
                const opts = usable.filter(h => h.cat === cat && !S.includes(h) && (cur & h.mask) !== cur && okToAdd(h, S, need));
                if (!opts.length) continue;
                // 今残っている人を、半分くらいに減らすものを優先する
                opts.sort((x, y) => Math.abs(popcount(cur & x.mask) / cur1 - 0.5) - Math.abs(popcount(cur & y.mask) / cur1 - 0.5));
                picked = pickOne(opts.slice(0, Math.max(1, Math.ceil(opts.length / 2))));
            }
            if (!picked) return null;
            S.push(picked);
            cur &= picked.mask;
        }
        if (cur !== CBIT || S.length > N) return null;
        // ヒントの種類を少し増やす（条件をこわさないものだけ）。大人数では同じヒントを2〜3人で持つ
        const distinctTarget = N <= 12 ? N : Math.ceil(N * 0.55);
        const extras = shuffleArray(usable.filter(h => !S.includes(h)));
        for (const h of extras) {
            if (S.length >= distinctTarget) break;
            if (okToAdd(h, S, need)) S.push(h);
        }
        // 全員に1つずつ配る（必要なヒントは必ず全部入れ、あとは順番にくり返す）
        const base = shuffleArray([...S]);
        const list = [];
        for (let i = 0; i < N; i++) list.push(base[i % base.length]);
        return list;
    };

    // need：このくらいの人数に聞かないと犯人が決まらない（40人なら5人）
    const need0 = N >= 30 ? 5 : (N >= 20 ? 4 : (N >= 8 ? 3 : 2));
    for (let need = need0; need >= 1; need--) {
        for (let attempt = 0; attempt < 150; attempt++) {
            const list = tryBuild(need);
            if (list) return shuffleArray(list).map(h => h.text);
        }
    }
    // どうしても組めないとき（同じ特ちょうの人ばかりなど）は、絞れるヒントをそのまま配る
    return ps.map(() => pickOne(usable).text);
}

// 服の色・持ち物・アリバイを配る
function assignTraits(playerList, crimeH) {
    const n = playerList.length;
    ["cloth", "pants", "socks"].forEach(cat => {
        const pool = [];
        for (let i = 0; i < n; i++) pool.push(colors[i % colors.length]);
        shuffleArray(pool);
        playerList.forEach((p, idx) => { p[cat] = pool[idx]; });
    });
    // 持ち物：9こから3こ。どの持ち物もだいたい同じ人数になるようにする
    const itemUse = {}; ITEM_KEYS.forEach(k => itemUse[k] = 0);
    shuffleArray([...playerList]).forEach(p => {
        const sorted = shuffleArray([...ITEM_KEYS]).sort((a, b) => itemUse[a] - itemUse[b]);
        const mine = sorted.slice(0, 3);
        mine.forEach(k => itemUse[k]++);
        p.items = mine.join(" ");
    });
    // アリバイ：8時〜15時のうち2〜4時間。犯人以外の約半分が、犯行時こくにアリバイを持つ
    const randAlibi = () => {
        if (Math.random() < 0.12) return null;
        const L = pickOne([2, 3, 4]);
        const s = 8 + Math.floor(Math.random() * (15 - 8 - L + 1));
        return [s, s + L];
    };
    const culprit = pickOne(playerList);
    playerList.forEach(p => {
        let a = randAlibi();
        if (p === culprit) {
            let guard = 0;
            while (a && a[0] <= crimeH && a[1] >= crimeH + 1 && guard++ < 50) a = randAlibi();
            if (a && a[0] <= crimeH && a[1] >= crimeH + 1) a = null;
        }
        p.aS = a ? a[0] : null;
        p.aE = a ? a[1] : null;
        p.isCulprit = (p === culprit);
    });
    return culprit;
}

document.getElementById('start-game-btn').onclick = async () => {
    if(players.length < 2) { alert("2人より少ないと始められません"); return; }

    if (btn.disabled) return;
    btn.disabled = true;

    lsSet('detective_mode', mode);
    const crimeH = pickOne([9, 10, 11, 12, 13]);   // 犯行時こく：crimeH時〜crimeH+1時
    const finalPlayers = players.map(p => ({ ...p }));
    const culprit = assignTraits(finalPlayers, crimeH);
    const incident = pickOne(incidentData);
    const duration = parseInt(document.getElementById('game-duration').value);
    const endTime = Date.now() + (duration * 60 * 1000);
    const assignedHints = assignHints(culprit, finalPlayers, crimeH, mode);
    try {
        await updateDoc(doc(db, "rooms", myRoomId), {
            status: "started",
            mode: mode,
            culpritName: culprit.name,
            culpritKey: culprit.key,
            incident: incident.title[mode],
            detail: incident.detail[mode],
            endTime: endTime,
            hints: assignedHints,
            finalPlayers: finalPlayers,
            crimeHour: crimeH
        });
    } catch (e) {
        console.error(e); btn.disabled = false; alert("開始できませんでした。もう一度ためしてね");
    }
};

let timerIntervalId = null;
function updateTimer(endTime) {
    const display = document.getElementById('timer-display');
    document.getElementById('game-timer').classList.remove('hidden');
    if (timerIntervalId) clearInterval(timerIntervalId);
    const tick = () => {
        const remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
        display.innerText = `${t("timerLeft")} ${Math.floor(remaining/60)}:${(remaining%60).toString().padStart(2,'0')}`;
        if(remaining <= 0) { clearInterval(timerIntervalId); timerIntervalId = null; if(isHost) goTimeup("time"); }
    };
    tick();
    timerIntervalId = setInterval(tick, 1000);
}

const alibiText = (p) => (p.aS != null) ? `${p.aS}時〜${p.aE}時` : t("noAlibi");

async function startGame(data) {
    if(gameStartedLocally) return;
    gameStartedLocally = true;
    openingRunning = true;
    document.getElementById('room-id-display-top').classList.remove('hidden');
    const overlay = document.getElementById('event-overlay');
    const typeBox = document.getElementById('event-typewriter');
    const titleDisp = document.getElementById('event-title-display');
    // ゲーム画面の中身は、演出の前に作っておく
    document.getElementById('incident-text').innerText = data.incident;
    const hintOrder = data.finalPlayers; // ヒントは開始時の名簿の順番で配られている
    let myIndex = hintOrder.findIndex(p => p.key === myProfile.key);
    if (myIndex < 0) myIndex = hintOrder.findIndex(p => p.name === myProfile.name && p.idNum === myProfile.idNum);
    document.getElementById('my-hint').innerText = (myIndex >= 0 && data.hints[myIndex]) ? data.hints[myIndex] : (myIndex < 0 ? t("lateJoin") : t("noHint"));
    renderInvestigationList();

    if (data.status === "started") {
        overlay.classList.remove('hidden');
        await runTypewriter(typeBox, t("opening") + "\n\n" + data.detail, 80);
        await robustWait(2000);
        titleDisp.innerText = "【" + data.incident + "】";
        titleDisp.classList.add('stamp-anim');
        await robustWait(2000);
        overlay.classList.add('hidden');
    }
    openingRunning = false;
    document.getElementById('lobby-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    switchTab('tab-hint');
    // 演出のあいだに時間切れ・結果発表になっていたら、そちらを出す
    if (roomStatus === "timeup" && lastRoomData) showTimeup(lastRoomData);
    if (roomStatus === "finished" && lastRoomData) showResults(lastRoomData);
}

window.toggleStatus = (idx, status) => {

    if(status === 'suspect') row.classList.add('status-suspect');
    else if(status === 'safe') row.classList.add('status-safe');
};
window.resetStatus = (idx) => {
    const row = document.getElementById(`investigate-p-${idx}`);
    row.classList.remove('status-suspect', 'status-safe');
    delete investigationStatus[idx];
};
window.renderSuspectButtons = () => {
    const container = document.getElementById('suspect-list');

        const isSafe = investigationStatus[idx] === 'safe';
        const btn = document.createElement('button');
        btn.style.opacity = isSafe ? "0.5" : "1";
        btn.style.background = isSafe ? "#333" : "#a6894a";
        btn.style.color = isSafe ? "#888" : "#1a2e22";

        container.appendChild(btn);
    });
};

async function submitAnswer(key, name, idNum) {
    if (roomStatus !== "started" || hasAnswered) return;
    if(!confirm(t("confirm", { name, id: idNum }))) return;
    hasAnswered = true;
    const solveTabBtn = document.getElementById('tab-btn-solve');
    if (solveTabBtn) { solveTabBtn.disabled = true; solveTabBtn.style.opacity = '0.5'; }
    // 自分のヒントは、ほかのたんていが見られるように表示したままにする（だれを選んだかは出さない）
    document.getElementById('answered-status').classList.remove('hidden');
    switchTab('tab-hint');
    try {
        await updateDoc(doc(db, "rooms", myRoomId, "players", myProfile.key), {
            answer: key,
            answerTime: Date.now()
        });
    } catch (e) { console.error(e); }
}

// 時間です！ たんていは席にもどる。親機には「結果発表」ボタン
function showTimeup(data) {
    if (timeupShown || resultsShown || openingRunning) return;
    timeupShown = true;
    if (timerIntervalId) { clearInterval(timerIntervalId); timerIntervalId = null; }
    document.getElementById('game-timer').classList.add('hidden');
    document.getElementById('lobby-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('solve-screen').classList.add('hidden');
    document.getElementById('timeup-sub').classList.toggle('hidden', data.timeupReason !== "all");
    document.getElementById('btn-show-result').classList.toggle('hidden', !isHost);
    document.getElementById('timeup-wait').classList.toggle('hidden', isHost);
    document.getElementById('timeup-screen').classList.remove('hidden');
}

// 親機が「結果発表」を押す → 正解者は親機が1回だけ集計して部屋に書く（全員がそれぞれ読み直さない）
document.getElementById('btn-show-result').onclick = async () => {
    const btn = document.getElementById('btn-show-result');
    if (btn.disabled) return;
    btn.disabled = true;
    try {
        const data = lastRoomData || {};
        const snaps = await getDocs(collection(db, "rooms", myRoomId, "players"));
        const winners = [];
        snaps.forEach(s => {
            const p = s.data();
            if (p.answer === data.culpritKey && !winners.some(w => w.name === p.name && w.idNum === p.idNum)) {
                winners.push({ key: p.key || s.id, name: p.name, idNum: p.idNum, answerTime: p.answerTime || 0 });
            }
        });
        winners.sort((a, b) => (a.answerTime || 9999999999999) - (b.answerTime || 9999999999999));
        await updateDoc(doc(db, "rooms", myRoomId), { status: "finished", winners });
    } catch (e) {
        console.error(e); btn.disabled = false; alert("うまくいきませんでした。もう一度おしてね");
    }
};

async function showResults(data) {
    if (resultsShown || openingRunning) return;
    resultsShown = true;
    if (timerIntervalId) { clearInterval(timerIntervalId); timerIntervalId = null; }
    document.getElementById('game-timer').classList.add('hidden');
    const overlay = document.getElementById('event-overlay');
    const typeBox = document.getElementById('event-typewriter');
    const titleDisp = document.getElementById('event-title-display');
    const winners = data.winners || [];
    overlay.classList.remove('hidden');
    titleDisp.classList.remove('stamp-anim');
    titleDisp.innerText = "";
    const winnerIsCulprit = winners.length > 0 && winners[0].key === data.culpritKey;
    let msg;
    if (winnerIsCulprit) {
        // 一番早く言い当てた名探偵自身が真犯人だった場合の特別な演出。
        // 自分が犯人だったことを忘れていて、今それを思い出した……という体で語らせる
        msg = t("msgSelf", { name: winners[0].name });
    } else if (winners.length > 0) {
        msg = t("msgWin", { name: winners[0].name });
    } else {
        msg = t("msgNone");
    }
    await runTypewriter(typeBox, msg, 80);
    await robustWait(2000);
    titleDisp.innerText = `${data.culpritName} さん`;
    titleDisp.classList.add('stamp-anim');
    await robustWait(2000);
    overlay.classList.add('hidden');
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('timeup-screen').classList.add('hidden');
    document.getElementById('solve-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('result-incident-title').innerText = "【" + data.incident + "】";
    document.getElementById('culprit-reveal').innerText = data.culpritName;
    const wList = document.getElementById('winner-list');
    wList.innerHTML = winners.length > 0
        ? winners.map(w => `<span class="winner-tag">🏆 ${escapeHtml(w.name)}</span>`).join("")
        : `<p style='color:#888;'>${escapeHtml(t("noWinner"))}</p>`;
}
document.getElementById('btn-back-to-title').onclick = async () => {
    const btn = document.getElementById('btn-back-to-title');
    if (btn.disabled) return;
    btn.disabled = true; btn.innerText = "もどっています…";
    leavingByButton = true;
    if (isHost && myRoomId) {
        // 通信が遅くても止まらないよう、最長3秒で見切りをつけて必ず戻る
        await Promise.race([closeRoom(myRoomId), new Promise(r => setTimeout(r, 3000))]);
    }
    location.reload();
};
