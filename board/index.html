    <script>
        // iOS: ピンチ拡大の抑止・拡大されたままの自己修復・実際の画面の高さ
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
            document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
        });
        function resetZoomIfNeeded() {
            if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
            const meta = document.querySelector('meta[name="viewport"]');
            if (!meta) return;
            const original = meta.getAttribute('content');
            meta.setAttribute('content', original + ', maximum-scale=1.0');
            requestAnimationFrame(() => meta.setAttribute('content', original));
        }
        function setAppHeight() {
            const el = document.activeElement;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
            const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            if (h > 0) document.documentElement.style.setProperty('--app-h', `${Math.round(h)}px`);
        }
        setAppHeight();
        ['resize', 'pageshow'].forEach(t => window.addEventListener(t, setAppHeight));
        window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 250));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => { setAppHeight(); resetZoomIfNeeded(); });
            window.visualViewport.addEventListener('scroll', resetZoomIfNeeded);
        }
        document.addEventListener('gestureend', () => setTimeout(resetZoomIfNeeded, 50), { passive: true });
    </script>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB4fpt6ffIuTBDJo_9g37kYr6KOWNgIcEY",
        authDomain: "otatoolssite.firebaseapp.com",
        projectId: "otatoolssite",
        storageBucket: "otatoolssite.firebasestorage.app",
        messagingSenderId: "20522292752",
        appId: "1:20522292752:web:22fba7fecb61736593dc95"
    };

    // アプリ固有のID
    const THIS_APP_ID = "2"; 
    
    const PORTAL_APP_ID = "otatoolssite-v1";
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    signInAnonymously(auth).then(async () => {
        const todayStr = new Date().toISOString().split('T')[0];
        const storageKey = `ota_visited_${THIS_APP_ID}`;
        
        if (localStorage.getItem(storageKey) === todayStr) {
            return;
        }
        const docRef = doc(db, 'artifacts', PORTAL_APP_ID, 'public', 'data', 'app_views', THIS_APP_ID);
                try {
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                await updateDoc(docRef, { count: increment(1) });
            } else {
                await setDoc(docRef, { count: 1 }); 
            }
            localStorage.setItem(storageKey, todayStr);
        } catch (e) { 
            console.error("閲覧数のカウントに失敗しました:", e); 
        }
    }).catch((error) => {
        console.error("Firebase認証エラー:", error);
