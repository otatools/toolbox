<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漢字クロスワード</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600;900&family=Noto+Serif+JP:wght@700;900&display=block" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-bg: #f8fafc;
            --ink-black: #1a1a1a;
            --arrow-color: #94a3b8;
            --guide-color: #e2e8f0; 
            scrollbar-gutter: stable;
        }

        body {
            background-color: var(--primary-bg);
            /* フォントが読み込まれるまで非表示にしたい場合は visibility: hidden; を検討 */
            font-family: 'Noto Serif JP', serif;
            color: var(--ink-black);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        @media (max-width: 1023px) {
            .toggle-btn { display: none !important; }
        }

        @media (max-width: 1023px) and (orientation: portrait) {
            #game-screen {
                transform-origin: top center;
                margin-top: 0 !important;
            }
            #main-container {
                gap: 0.25rem !important;
                padding-left: 0.5rem !important;
                padding-right: 0.5rem !important;
            }
            .game-header {
                margin-top: 0.5rem !important;
                margin-bottom: 0.5rem !important;
            }
            #explanation-area { padding: 0.6rem !important; }
            #explanation-area h3 { margin-bottom: 0.3rem !important; font-size: 0.9rem !important; padding-bottom: 0.1rem !important; }
            .explanation-row { margin-bottom: 0.2rem !important; }
        }
        
        #game-screen {
            transform-origin: top center;
        }

        .course-card { 
            position: relative;
            background: white; 
            border: 2px solid #e2e8f0; 
            border-radius: 1.5rem; 
            padding: 1.5rem 1rem;
            cursor: pointer; 
            transition: all 0.2s ease; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }
        @media (min-width: 640px) { .course-card { padding: 2rem; } }
        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            border-color: #cbd5e1;
        }

        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; width: 100%; max-width: 1200px; padding: 20px 0; }
        @media (min-width: 480px) { .menu-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .menu-grid { grid-template-columns: repeat(5, 1fr); } }
        
        .menu-item, .course-card { position: relative; }
        .menu-item { padding: 1.5rem 1rem; background: white; border: 2px solid #e2e8f0; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .cleared { background: #fffcf0 !important; border-color: #fbbf24 !important; }
        .crown-icon { position: absolute; top: -12px; right: -8px; font-size: 2.2rem; transform: rotate(15deg); z-index: 10; }

        /* パズルの高さをキャンバスと揃えてボタンの位置を整える */
        .puzzle-wrapper { 
            position: relative; 
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (min-width: 640px) { 
            .puzzle-wrapper { width: 400px; height: 400px; } 
        }

        .cross-layout {
            display: grid;
            grid-template-columns: 70px 100px 70px;
            grid-template-rows: 70px 100px 70px;
            gap: 20px; align-items: center; justify-items: center;
        }
        @media (min-width: 640px) {
            .cross-layout { grid-template-columns: 100px 140px 100px; grid-template-rows: 100px 140px 100px; gap: 30px; }
        }

        .char-box { width: 70px; height: 70px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; border: 3px solid #334155; transition: all 0.2s; }
        .char-box:hover { opacity: 0.9; }
        @media (min-width: 640px) { .char-box { width: 100px; height: 100px; font-size: 3.5rem; } }

        .center-box { width: 100px; height: 100px; background: white; border: 5px solid #3b82f6; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #3b82f6; font-weight: 900; }
        @media (min-width: 640px) { .center-box { width: 140px; height: 140px; font-size: 4.5rem; } }
        .center-box.correct { color: #e11d48; border-color: #e11d48; background: #fff1f2; }

        .arrow-tip { position: absolute; width: 0; height: 0; border-style: solid; z-index: 20; }
        .a-top { top: -24px; left: 50%; transform: translateX(-50%); border-width: 16px 12px 0 12px; border-color: var(--arrow-color) transparent transparent transparent; }
        .a-left { left: -24px; top: 50%; transform: translateY(-50%); border-width: 12px 0 12px 16px; border-color: transparent transparent transparent var(--arrow-color); }
        .a-right { right: -24px; top: 50%; transform: translateY(-50%); border-width: 12px 0 12px 16px; border-color: transparent transparent transparent var(--arrow-color); }
        .a-bottom { bottom: -24px; left: 50%; transform: translateX(-50%); border-width: 16px 12px 0 12px; border-color: var(--arrow-color) transparent transparent transparent; }

        @media (max-width: 639px) {
            .a-top { top: -16px; }
            .a-left { left: -16px; }
            .a-right { right: -20px; }
            .a-bottom { bottom: -20px; }
        }

        #canvas-container { 
            width: 320px; height: 320px; background: white; border: 5px solid #1e293b; border-radius: 20px; position: relative; touch-action: none; overflow: hidden; 
            background-image: 
                repeating-linear-gradient(to right, var(--guide-color), var(--guide-color) 10px, transparent 10px, transparent 20px),
                repeating-linear-gradient(to bottom, var(--guide-color), var(--guide-color) 10px, transparent 10px, transparent 20px);
            background-position: center center;
            background-size: 100% 2px, 2px 100%; 
            background-repeat: no-repeat;
        }

        @media (min-width: 640px) { #canvas-container { width: 400px; height: 400px; } }
        canvas { position: relative; z-index: 10; width: 100%; height: 100%; background: transparent; touch-action: none; }
        
        #canvas-hint { 
            position: absolute; 
            top: 45%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 350px; 
            color: rgba(0, 0, 0, 0.08); 
            pointer-events: none; 
            z-index: 2; 
            display: none; 
            font-family: 'Klee One', serif; 
            font-weight: 900; 
            line-height: 1;
        }

        #explanation-area { position: absolute; inset: 0; z-index: 50; background: white; padding: 1.2rem; overflow-y: hidden; display: none; }
        #explanation-text { font-size: 1.15rem; line-height: 1.55; opacity: 0; }
        
        /* 熟語と意味の間の距離を最小化 */
        .explanation-row {
            display: grid;
            grid-template-columns: 4.8em 1fr; /* 5.5emから4.8emに縮小して接近 */
            gap: 0.3rem; /* 余白をさらに縮小 */
            margin-bottom: 0.4rem;
            align-items: baseline;
        }
        .explanation-term { font-weight: 900; color: var(--ink-black); white-space: nowrap; }
        .explanation-desc { text-align: justify; }

        ruby { ruby-position: over; }
        rt { font-family: 'Noto Serif JP', serif; font-size: 0.55em; color: #64748b; line-height: 1; vertical-align: top; }

        .candidate-btn { background: white; border: 3px solid #3b82f6; padding: 8px 24px; font-size: 2.5rem; border-radius: 16px; margin: 8px; cursor: pointer; font-family: 'Klee One', serif; }

        .problem-title-box {
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            background: white;
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
            min-width: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @media (min-width: 640px) {
            .problem-title-box { min-width: 180px; padding: 0.5rem 1.5rem; }
        }
        .problem-title-box.cleared {
            background: #fffcf0 !important;
            border-color: #fbbf24 !important;
        }
        .problem-title-box .crown-icon-sm {
            position: absolute;
            top: -15px;
            right: -10px;
            font-size: 1.8rem;
            transform: rotate(15deg);
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            padding: 0 1rem;
        }

        /* 空いたスペースを利用してPCでウィンドウに合わせて大きくする修正部分 */
        @media (min-width: 1024px) {
            .puzzle-wrapper { width: 500px; height: 500px; }
            .cross-layout { grid-template-columns: 125px 170px 125px; grid-template-rows: 125px 170px 125px; gap: 40px; }
            .char-box { width: 125px; height: 125px; font-size: 4rem; }
            .center-box { width: 170px; height: 170px; font-size: 5rem; }
            
            .a-top { top: -30px; border-width: 20px 15px 0 15px; }
            .a-left { left: -30px; border-width: 15px 0 15px 20px; }
            .a-right { right: -30px; border-width: 15px 0 15px 20px; }
            .a-bottom { bottom: -30px; border-width: 20px 15px 0 15px; }

            #canvas-container { width: 500px; height: 500px; }
            #canvas-hint { font-size: 420px; }
        }

        /* 候補エリアの余計なスペースを詰める修正部分 */
        #candidate-area {
            display: none;
            min-height: 120px; 
            height: auto;
            margin-top: 1rem;
        }
        #candidate-area.show {
            display: block;
        }

        /* 左右切替ボタンがヒント表示と重なるときだけずらす修正 */
        .toggle-btn {
            transition: transform 0.3s ease;
        }
        @media (min-width: 1024px) and (max-width: 1300px) {
            body.hint-active .toggle-btn {
                transform: translateX(-130px);
            }
        }

        /* スマホ版ではメイン画面（コース、メニュー）でヒントポイントを隠す */
        @media (max-width: 639px) {
            body:not(.screen-game):not(.screen-minigame) #global-hint-display {
                display: none !important;
            }
        }

        /* ミニゲーム用タイマーのスタイル */
        #minigame-timer-bar {
            transition: width 0.1s linear, background-color 0.3s ease;
        }
    </style>

    <footer class="w-full py-4 text-slate-400 text-[10px] sm:text-xs text-center border-t border-slate-100 bg-white/50">
        漢字クロスワード | Ver 8.9.1 | ota tools
    </footer>

    <script>
        let courseData = null; let currentCourseKey = ""; let questions = []; let currentIdx = 0; let clearedQuestions = [];
        let leftHanded = localStorage.getItem('ota_v21_hand') === 'true';
        let unlockedHints = JSON.parse(localStorage.getItem('ota_unlocked_hints') || '{}');

        // ミニゲーム用変数
        let minigameTimer = null;
        let minigameTimeLeft = 30;
        let minigameCurrentQ = 0;
        let minigameTargetData = null;
        let minigameTargetWord = "";
        let usedMinigameIds = [];

        // URLから表示制限数を取得（/#10 にのみ対応）
        let stepSize = 0;
        const sizeMatch = window.location.href.match(/#(\d+)/);
        if (sizeMatch) {
            stepSize = parseInt(sizeMatch[1], 10);
        }

        // URLから最大問題数を取得（/?20 にのみ対応）
        let maxQuestions = 0;
        const maxMatch = window.location.href.match(/\?(\d+)/);
        if (maxMatch) {
            maxQuestions = parseInt(maxMatch[1], 10);
        }

        // ヒント機能のパラメータとポイント取得
        const hintMode = /hint/i.test(window.location.href);
        let hintPoints = parseInt(localStorage.getItem('ota_hint_points') || '0', 10);

        function updateHintDisplay() {
            if (!hintMode) return;
            const disp = document.getElementById('global-hint-display');
            if (disp) {
                disp.classList.remove('hidden');
                document.getElementById('global-hint-p-val').innerText = hintPoints;
            }
            document.body.classList.add('hint-active');
        }

        function showHintExplanation() {
            showModal("ヒントが欲しい熟語の<br>漢字を押してね！", [{ text: "OK", type: "cancel" }], true);
        }

        // 現在のクリア数に基づいて、利用可能な問題のリストを返す
        function getAvailableQuestions(key, course, saved) {
            let baseQuestions = course.questions;
            if (maxQuestions > 0) {
                baseQuestions = baseQuestions.slice(0, maxQuestions);
            }

            if (stepSize <= 0) return baseQuestions;
            let limit = parseInt(localStorage.getItem(`ota_limit_${key}`), 10);
            if (!limit || limit < stepSize) limit = stepSize;
            while (limit < saved.length) limit += stepSize;
            if (limit > baseQuestions.length) limit = baseQuestions.length;
            return baseQuestions.slice(0, limit);
        }

        // スマホブラウザ対策：確実に一番上までスクロールさせるための関数
        function forceScrollTop() {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            
            requestAnimationFrame(() => {
                window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            });

            const resetScroll = () => {
                window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
                
                const gameScr = document.getElementById('game-screen');
                const menuScr = document.getElementById('menu-screen');
                const courseScr = document.getElementById('course-screen');
                
                if (gameScr && !gameScr.classList.contains('hidden')) {
                    gameScr.scrollTop = 0;
                    gameScr.scrollIntoView({ block: 'start', behavior: 'instant' });
                } else if (menuScr && !menuScr.classList.contains('hidden')) {
                    menuScr.scrollTop = 0;
                    menuScr.scrollIntoView({ block: 'start', behavior: 'instant' });
                } else if (courseScr && !courseScr.classList.contains('hidden')) {
                    courseScr.scrollTop = 0;
                    courseScr.scrollIntoView({ block: 'start', behavior: 'instant' });
                }
            };

            setTimeout(resetScroll, 0);
            setTimeout(resetScroll, 20);
            setTimeout(resetScroll, 60);
            setTimeout(resetScroll, 150);
            setTimeout(resetScroll, 300);
        }

        async function loadCourseData() {
            try {
                const response = await fetch('data.json');
                courseData = await response.json();
                renderCourseList();
            } catch (error) { console.error(error); }
        }

        function showCourseSelect() {
            document.documentElement.classList.remove('screen-game-html');
            document.body.classList.remove('screen-game');
            document.body.classList.remove('screen-minigame');
            document.body.style.overflowY = "auto";
            document.getElementById('course-screen').classList.remove('hidden');
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('minigame-screen').classList.add('hidden');
            renderCourseList();
            forceScrollTop();
        }

        function renderCourseList() {
            const list = document.getElementById('course-list');
            if (!courseData) return;
            list.innerHTML = '';
            Object.keys(courseData).forEach(key => {
                const course = courseData[key];
                const saved = JSON.parse(localStorage.getItem(`ota_save_${key}`)) || [];
                
                const totalQuestions = maxQuestions > 0 ? Math.min(maxQuestions, course.questions.length) : course.questions.length;
                const availableQuestions = getAvailableQuestions(key, course, saved);
                const isAllCleared = saved.length >= course.questions.length && course.questions.length > 0; // 全てのコースをクリアしたか
                
                const card = document.createElement('div');

                card.innerHTML = `
                    ${isAllCleared ? '<div class="crown-icon">👑</div>' : ''}
                    <h3 class="text-xl sm:text-2xl font-black mb-1 sm:mb-2">${course.title}</h3>
                    <p class="text-slate-400 font-bold mb-3 sm:mb-4 text-xs sm:text-sm">全 ${totalQuestions} 問</p>
                    <div class="${isAllCleared ? 'text-amber-600' : 'text-blue-500'} font-bold text-sm sm:text-base">クリア: ${saved.length} / ${availableQuestions.length}</div>
                `;
                card.onclick = (e) => {

        // ミニゲーム関連関数
        function startMinigameConfirm() {
            if (hintMode && hintPoints >= 20) {
                showModal("20ポイント以上もっているので、<br>ここではポイントが増えないけどいいですか？", [

        function startMinigame() {
            document.body.classList.add('screen-minigame');
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('minigame-screen').classList.remove('hidden');
            minigameCurrentQ = 0;
            usedMinigameIds = [];
            loadMinigameQuestion();

        }

        function loadMinigameQuestion() {
            clearInterval(minigameTimer);
            minigameTimeLeft = 30;
            updateMinigameTimerBar();

            document.getElementById('minigame-progress').innerText = `第 ${minigameCurrentQ + 1} 問 / 5`;

            // 正解済み問題から候補を取得（使用済みを除外）
            let pool = courseData[currentCourseKey].questions.filter(q => clearedQuestions.includes(q.id) && !usedMinigameIds.includes(q.id));
            
            // プールが枯渇した場合は使用済み履歴をリセット
            if (pool.length === 0) {
                usedMinigameIds = [];
                pool = courseData[currentCourseKey].questions.filter(q => clearedQuestions.includes(q.id));
            }

            // ランダムに正解（ターゲット）を1つ選ぶ
            const targetIdx = Math.floor(Math.random() * pool.length);
            minigameTargetData = pool[targetIdx];
            usedMinigameIds.push(minigameTargetData.id);

            // 熟語と説明文の抽出（【熟語(ルビ)】を除いた説明部分、熟語はルビ除去）
            const rows = minigameTargetData.description.split('\n').filter(line => line.trim() !== '');
            const validRows = [];
            for (const row of rows) {
                const match = row.match(/【([^】]+)】(.*)/);
                if (match) {
                    const word = match[1].replace(/\([^)]+\)/g, ''); // ルビ除去
                    const desc = match[2];
                    validRows.push({ word, desc });
                }
            }
            
            let targetRow = validRows.length > 0 ? validRows[Math.floor(Math.random() * validRows.length)] : { word: minigameTargetData.answer, desc: "（説明が見つかりません）" };
            minigameTargetWord = targetRow.word;

            // ターゲットと同じ問題からダミーを最大2つ抽出
            const choices = [minigameTargetWord];
            const remainingTargetWords = validRows.map(v => v.word).filter(w => w !== minigameTargetWord);
            
            for(let i = remainingTargetWords.length - 1; i > 0; i--){
                const r = Math.floor(Math.random() * (i + 1));
                [remainingTargetWords[i], remainingTargetWords[r]] = [remainingTargetWords[r], remainingTargetWords[i]];
            }
            
            for(let i = 0; i < 2 && i < remainingTargetWords.length; i++) {
                choices.push(remainingTargetWords[i]);
            }

            // 別の問題（ダミーソース）を1つ選ぶ
            let tempPool = pool.filter(q => q.id !== minigameTargetData.id);
            if (tempPool.length === 0) {
                // 足りなければ使用済みをリセットして再取得（ターゲット以外）
                usedMinigameIds = [minigameTargetData.id];
                tempPool = courseData[currentCourseKey].questions.filter(q => clearedQuestions.includes(q.id) && q.id !== minigameTargetData.id);
            }

            if (tempPool.length > 0) {
                const dummySourceIdx = Math.floor(Math.random() * tempPool.length);
                const dummySourceData = tempPool[dummySourceIdx];
                usedMinigameIds.push(dummySourceData.id);

                const dRows = dummySourceData.description.split('\n').filter(line => line.trim() !== '');
                const dummyWords = [];
                for (const row of dRows) {
                    const match = row.match(/【([^】]+)】(.*)/);
                    if (match) {
                        dummyWords.push(match[1].replace(/\([^)]+\)/g, '')); // ルビ除去
                    }
                }

                for(let i = dummyWords.length - 1; i > 0; i--){
                    const r = Math.floor(Math.random() * (i + 1));
                    [dummyWords[i], dummyWords[r]] = [dummyWords[r], dummyWords[i]];
                }

                for(let i = 0; i < 3 && i < dummyWords.length; i++) {
                    choices.push(dummyWords[i]);
                }
            }

            // 万が一6個に満たない場合
            while(choices.length < 6) {
                choices.push("ダミー" + (choices.length + 1));
            }

            // 選択肢をシャッフル
            for(let i = choices.length - 1; i > 0; i--){
                const r = Math.floor(Math.random() * (i + 1));
                [choices[i], choices[r]] = [choices[r], choices[i]];
            }
            
            let descHtml = targetRow.desc === "（説明が見つかりません）" ? targetRow.desc : parseRuby(targetRow.desc);
            document.getElementById('minigame-desc').innerHTML = descHtml;

            const choicesContainer = document.getElementById('minigame-choices');
            choicesContainer.innerHTML = '';
            choices.forEach(c => {
                const btn = document.createElement('button');
                // スマホでタップした後に色が残る現象を防ぐため lg:hover に変更し、active クラスを追加
                btn.className = "bg-white border-4 border-slate-200 text-2xl sm:text-3xl font-black py-4 rounded-2xl lg:hover:bg-slate-50 lg:hover:border-blue-300 active:bg-slate-50 active:border-blue-300 transition-colors shadow-sm";
                btn.innerText = c;
                btn.onclick = function() { handleMinigameChoice(c, this); };
                choicesContainer.appendChild(btn);
            });

            // タイマー開始
            minigameTimer = setInterval(() => {
                minigameTimeLeft -= 0.1;
                updateMinigameTimerBar();
                if (minigameTimeLeft <= 0) {
                    clearInterval(minigameTimer);
                    handleMinigameTimeout();
                }
            }, 100);
        }

        function updateMinigameTimerBar() {
            const bar = document.getElementById('minigame-timer-bar');
            let pct = (minigameTimeLeft / 30) * 100;
            if (pct < 0) pct = 0;
            bar.style.width = `${pct}%`;
            if (pct < 30) {
                bar.classList.replace('bg-blue-500', 'bg-red-500');
            } else {
                bar.classList.replace('bg-red-500', 'bg-blue-500');
            }
        }

        function handleMinigameChoice(choice, btnElement) {
            clearInterval(minigameTimer);
            const buttons = document.getElementById('minigame-choices').querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.blur(); // フォーカスを外して色が残るのを防ぐ
            });

            if (choice === minigameTargetWord) {
                btnElement.classList.remove('bg-white', 'border-slate-200', 'lg:hover:bg-slate-50', 'lg:hover:border-blue-300', 'active:bg-slate-50', 'active:border-blue-300');
                btnElement.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                minigameCurrentQ++;
                setTimeout(() => {
                    if (minigameCurrentQ >= 5) {
                        handleMinigameClear();
                    } else {
                        loadMinigameQuestion();
                    }
                }, 500);
            } else {
                btnElement.classList.remove('bg-white', 'border-slate-200', 'lg:hover:bg-slate-50', 'lg:hover:border-blue-300', 'active:bg-slate-50', 'active:border-blue-300');
                btnElement.classList.add('bg-red-100', 'border-red-500', 'text-red-700');
                buttons.forEach(b => {
                    if (b.innerText === minigameTargetWord) {
                        b.classList.remove('bg-white', 'border-slate-200', 'lg:hover:bg-slate-50', 'lg:hover:border-blue-300', 'active:bg-slate-50', 'active:border-blue-300');
                        b.classList.add('bg-green-100', 'border-green-500', 'text-green-700');
                    }
                });
                setTimeout(() => {
                    showModal("ざんねん！ちがう熟語だよ。<br>また挑戦してね！", [{ text: "OK", type: "confirm", onClick: exitMinigame }]);
                }, 800);
            }
        }

        function addMoreQuestions() {
            let limit = parseInt(localStorage.getItem(`ota_limit_${currentCourseKey}`), 10) || stepSize;

        function startGame() {
            if (document.activeElement) {
                document.activeElement.blur();
            }
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }

            window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;

            document.documentElement.classList.add('screen-game-html');
            document.body.classList.add('screen-game');

        const canvas = document.getElementById('hw-canvas');
        const ctx = canvas.getContext('2d');
        const hintEl = document.getElementById('canvas-hint');
        let strokes = []; let drawing = false;
        let lastX = 0; let lastY = 0;

        function initCanvas() {
            const size = 400; canvas.width = size; canvas.height = size;
            ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1a1a';
            
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return [
                    (clientX - rect.left) * scaleX,
                    (clientY - rect.top) * scaleY
                ];
            };

            const start = (e) => {
                const display = document.getElementById('center-display');
                if (display && !display.classList.contains('correct')) {
                    document.getElementById('explanation-area').style.display = "none";
                    const msgTxt = document.getElementById('game-msg').innerText;
                    if (msgTxt.includes("ヒントポイント") || msgTxt.includes("ヒントには") || msgTxt.includes("ヒントはない")) {
                        document.getElementById('game-msg').innerText = "";
                    }
                }

                drawing = true;
                const [x, y] = getPos(e);
                [lastX, lastY] = [x, y];
                strokes.push([[x, y, Date.now()]]);
                ctx.beginPath();
                ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2);
                ctx.fill();
            };

            const move = (e) => {
                if (!drawing) return;
                if (e.cancelable) e.preventDefault();
                const [x, y] = getPos(e);
                ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
                [lastX, lastY] = [x, y];
                strokes[strokes.length - 1].push([x, y, Date.now()]);
            };
            const end = () => { drawing = false; };
            canvas.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', end);
        }

        // モーダル表示関数 (isHintでデザインを変える)
        function showModal(message, buttons, isHint = false) {
            const modal = document.getElementById('custom-modal');
            const modalBox = document.getElementById('modal-box');
            
            // ヒント表示用の特別なスタイル
            if (isHint) {
                modalBox.classList.remove('bg-white');
                modalBox.classList.add('bg-[#fffcf0]', 'border-4', 'border-amber-300');
            } else {
                modalBox.classList.add('bg-white');
                modalBox.classList.remove('bg-[#fffcf0]', 'border-4', 'border-amber-300');
            }

            document.getElementById('modal-message').innerHTML = message;
            
            const btnContainer = document.getElementById('modal-buttons');
            btnContainer.innerHTML = '';
            
            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.className = btn.type === 'confirm' 
                    ? "bg-blue-500 text-white px-6 py-2 sm:px-8 sm:py-3 rounded-full font-black shadow-lg text-base sm:text-lg hover:bg-blue-600 transition-colors" 
                    : "bg-slate-200 text-slate-800 px-6 py-2 sm:px-8 sm:py-3 rounded-full font-black shadow-md text-base sm:text-lg hover:bg-slate-300 transition-colors";
                b.innerText = btn.text;
                b.onclick = () => {
                    modal.classList.add('hidden');
                    if (btn.onClick) btn.onClick();
                };

            modal.classList.remove('hidden');
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            unlockedHints = JSON.parse(localStorage.getItem('ota_unlocked_hints') || '{}');
            
            const titleContainer = document.getElementById('problem-title-container');
            const isCleared = clearedQuestions.includes(q.id);
            if (isCleared) {
                titleContainer.classList.add('cleared');
                document.getElementById('problem-title').innerHTML = `<span class="crown-icon-sm">👑</span>問題 ${currentIdx+1}`;
            } else {
                titleContainer.classList.remove('cleared');
                document.getElementById('problem-title').innerText = `問題 ${currentIdx+1}`;
            }

            const showAnswerBtn = document.getElementById('show-answer-btn');
            if (showAnswerBtn) {
                if (isCleared) {
                    showAnswerBtn.classList.remove('hidden');
                } else {
                    showAnswerBtn.classList.add('hidden');
                }
            }

            // ヒント機能のためのクリックイベント設定
            ['top', 'bottom', 'left', 'right'].forEach(dir => {
                const el = document.getElementById(`q-${dir}`);
                el.innerText = q[dir];
                if (hintMode && q[dir]) {
                    el.style.cursor = 'pointer';
                    el.onclick = () => showHint(dir);
                } else {
                    el.style.cursor = 'default';
                    el.onclick = null;
                }
            });

            const display = document.getElementById('center-display');
            display.innerText = "？"; display.classList.remove('correct');
            document.getElementById('game-msg').innerText = ""; 
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('finish-btn').classList.add('hidden');
            
            const skipBtn = document.getElementById('skip-btn');
            if (currentIdx < questions.length - 1) {
                skipBtn.classList.remove('hidden');
            } else {
                skipBtn.classList.add('hidden');
            }

            document.getElementById('explanation-area').style.display = "none";
            document.getElementById('explanation-text').style.opacity = "0";
            hintEl.innerText = ""; hintEl.style.display = "none";
            clearCanvas(); applyHandedness();
            updateHintDisplay();
            autoScaleLayout();
            forceScrollTop();
        }

        function showAnswer() {
            const q = questions[currentIdx];
            const display = document.getElementById('center-display');
            display.innerText = q.answer; 
            display.classList.add('correct');
            document.getElementById('candidate-area').classList.remove('show');
            document.getElementById('skip-btn').classList.add('hidden'); 
            hintEl.style.display = "none";
            
            if (q.description) {
                const rows = q.description.split('\n').filter(line => line.trim() !== '').map(line => {
                    const parsedLine = parseRuby(line);
                    const match = line.match(/(【[^】]+】)(.*)/);
                    if (match) {
                        return `<div class="explanation-row"><span class="explanation-term">${parseRuby(match[1])}</span><span class="explanation-desc">${parseRuby(match[2])}</span></div>`;
                    } else {
                        return `<div class="mb-2 block">${parsedLine}</div>`;
                    }
                }).join('');
                document.getElementById('explanation-text').innerHTML = rows;
                document.getElementById('explanation-area').style.display = "block";
                setTimeout(adjustFontSize, 0);
            }

            if (currentIdx < questions.length - 1) {
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('finish-btn').classList.add('hidden');
            } else {
                document.getElementById('finish-btn').classList.remove('hidden');
                document.getElementById('next-btn').classList.add('hidden');
            }
        }

        function showHint(dir) {
            if (!hintMode) return;
            
            const display = document.getElementById('center-display');
            if (display.classList.contains('correct')) return;

            const q = questions[currentIdx];
            const targetChar = q[dir];
            if (!targetChar) return;

            const hintKey = q.id + '_' + dir;

            const rows = q.description.split('\n').filter(line => line.trim() !== '');
            let targetRow = "";
            
            for (const row of rows) {
                const match = row.match(/【([^】]+)】/);
                if (match) {
                    const word = match[1];
                    const kanjiPart = word.split('(')[0];
                    if (kanjiPart.includes(targetChar)) {
                        targetRow = row;
                        break;
                    }
                }
            }

            if (!targetRow) {
                showModal("この文字のヒントはないみたい...", [{ text: "OK", type: "cancel" }]);
                return;
            }

            const descMatch = targetRow.match(/【[^】]+】(.*)/);
            if (descMatch) {
                const descText = descMatch[1];
                if (descText.includes(q.answer)) {
                    showModal("このヒントには<br>答えの漢字が入っているから<br>見せられないよ", [{ text: "OK", type: "cancel" }]);
                    return;
                }

                // すでにポイントを使って解放済みの場合は確認を出さずに直接表示
                if (unlockedHints[hintKey]) {
                    showModal(
                        `<div class="text-amber-600 font-black mb-4 border-b-2 border-amber-200 pb-2 text-xl">💡 ヒント</div>
                         <div class="text-left text-slate-700">${parseRuby(descText)}</div>`, 
                        [{ text: "とじる", type: "cancel" }], 
                        true
                    );
                    return;
                }
                
                if (hintPoints < 2) {
                    showModal("ヒントポイントが足りないよ！", [{ text: "OK", type: "cancel" }]);
                    return;
                }

                showModal("ヒントポイントを2使って<br>ヒントを表示しますか？", [
                    { text: "いいえ", type: "cancel" },
                    { text: "はい", type: "confirm", onClick: () => {
                        hintPoints -= 2;
                        localStorage.setItem('ota_hint_points', hintPoints);
                        updateHintDisplay();
                        
                        unlockedHints[hintKey] = true; // 解放状態を記憶
                        localStorage.setItem('ota_unlocked_hints', JSON.stringify(unlockedHints));
                        
                        // 熟語を除いた説明文のみをヒント用モーダルで表示
                        showModal(
                            `<div class="text-amber-600 font-black mb-4 border-b-2 border-amber-200 pb-2 text-xl">💡 ヒント</div>
                             <div class="text-left text-slate-700">${parseRuby(descText)}</div>`, 
                            [{ text: "とじる", type: "cancel" }], 
                            true
                        );
                    }}
                ]);
            }
        }

        function clearCanvas() { 
            ctx.clearRect(0,0,400,400); strokes = []; 
            document.getElementById('candidate-area').classList.remove('show'); 
            document.getElementById('game-msg').innerText = "";
            const display = document.getElementById('center-display');
            if (display && !display.classList.contains('correct')) {
                display.innerText = "？";
                document.getElementById('explanation-area').style.display = "none";
            }
        }

        async function recognize() {
            if (strokes.length === 0) return;
            const btn = document.getElementById('recognize-btn');
            btn.disabled = true; btn.innerText = "判定中...";
            const ink = strokes.map(s => [s.map(p => p[0]), s.map(p => p[1]), s.map(p => p[2])]);
            try {
                const res = await fetch('https://www.google.com/inputtools/request?ime=handwriting&app=autodraw&dbg=1&cs=1&oe=UTF-8', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ "input_type": 0, "requests": [{ "language": "ja", "writing_guide": { "width": 400, "height": 400 }, "input_type": 0, "ink": ink }] })
                });
                const data = await res.json();
                if (data && data[1][0][1]) {
                    const candidates = data[1][0][1]; const q = questions[currentIdx];
                    const isStrokeCountValid = (strokes.length === q.strokes || strokes.length === q.strokes - 1);
                    if (candidates[0] === q.answer && isStrokeCountValid) handleCorrect();
                    else if (candidates.includes(q.answer)) {
                        const area = document.getElementById('candidates');
                        area.innerHTML = `<div class="text-blue-500 font-bold w-full text-xs">これかな？</div>`;
                        const b = document.createElement('button');
                        b.className = 'candidate-btn'; b.innerText = q.answer;
                        b.onclick = () => isStrokeCountValid ? handleCorrect() : (hintEl.innerText = q.answer, hintEl.style.display = "block", document.getElementById('game-msg').innerHTML = "<span class='text-orange-600 text-sm'>画数を意識してなぞってね。</span>", clearCanvas());
                        area.appendChild(b);
                        document.getElementById('candidate-area').classList.add('show');
                        setTimeout(() => { b.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 50);
                    } else { 
                        document.getElementById('game-msg').innerHTML = "";
                        if (candidates[0]) {
                            const display = document.getElementById('center-display');
                            display.style.position = 'relative';
                            display.innerHTML = `${candidates[0]}<span style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#ef4444; font-size:1.8em; font-family:sans-serif; font-weight:lighter; opacity:0.4; pointer-events:none;">×</span>`;
                        }
                    }
                }
            } catch(e) { console.error(e); } finally { btn.disabled = false; btn.innerText = "判定する"; }
        }

        function parseRuby(text) {
            if (!text) return "";
            return text.replace(/([一-龠々]+)\(([^)]+)\)/g, '<ruby>$1<rt>$2</rt></ruby>');
        }

        function adjustFontSize() {
            const area = document.getElementById('explanation-area');
            const text = document.getElementById('explanation-text');
            if (!text.innerHTML) return;
            const baseSize = window.innerWidth < 640 ? 0.9 : 1.15;
            let currentSize = baseSize;
            text.style.opacity = "0";
            text.style.fontSize = `${currentSize}rem`;
            while (area.scrollHeight > area.clientHeight && currentSize > 0.5) {
                currentSize -= 0.05;
                text.style.fontSize = `${currentSize}rem`;
            }
            text.style.opacity = "1";
        }

        function handleCorrect() {
            const q = questions[currentIdx];
            const display = document.getElementById('center-display');
            display.innerText = q.answer; display.classList.add('correct');
            document.getElementById('candidate-area').classList.remove('show');
            document.getElementById('skip-btn').classList.add('hidden'); 
            hintEl.style.display = "none";
            
            if (q.description) {
                const rows = q.description.split('\n').filter(line => line.trim() !== '').map(line => {
                    const parsedLine = parseRuby(line);
                    const match = line.match(/(【[^】]+】)(.*)/);
                    if (match) {
                        return `<div class="explanation-row"><span class="explanation-term">${parseRuby(match[1])}</span><span class="explanation-desc">${parseRuby(match[2])}</span></div>`;
                    } else {
                        return `<div class="mb-2 block">${parsedLine}</div>`;
                    }
                }).join('');
                document.getElementById('explanation-text').innerHTML = rows;
                document.getElementById('explanation-area').style.display = "block";
                setTimeout(adjustFontSize, 0);
            }

            const isNewClear = !clearedQuestions.includes(q.id);
            if (isNewClear) {
                if (hintMode) {
                    hintPoints++;
                    localStorage.setItem('ota_hint_points', hintPoints);
                    updateHintDisplay();
                }

                clearedQuestions.push(q.id);
                localStorage.setItem(`ota_save_${currentCourseKey}`, JSON.stringify(clearedQuestions));
                const titleContainer = document.getElementById('problem-title-container');
                titleContainer.classList.add('cleared');
                document.getElementById('problem-title').innerHTML = `<span class="crown-icon-sm">👑</span>問題 ${currentIdx+1}`;
            }
            
            const totalQuestions = courseData[currentCourseKey].questions.length;
            const isCompleteAll = clearedQuestions.length === totalQuestions;
            const isCurrentStepCleared = clearedQuestions.length === questions.length;
            
            if (isCompleteAll) {
                if (isNewClear) {
                    document.getElementById('game-msg').innerHTML = hintMode 
                        ? "<span class='text-amber-600 font-black text-xl sm:text-2xl animate-bounce whitespace-nowrap'>🎊 コース完全制覇！ <span class='text-blue-500'>(ヒントP +1)</span> 🎊</span>"
                        : "<span class='text-amber-600 font-black text-2xl sm:text-3xl animate-bounce whitespace-nowrap'>🎊 コース完全制覇おめでとう！ 🎊</span>";
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#fbbf24', '#3b82f6', '#ef4444', '#10b981'] });
                } else {
                    document.getElementById('game-msg').innerHTML = "<span class='text-red-500 font-black text-3xl animate-bounce'>✨ 正解！ ✨</span>";
                }
                document.getElementById('finish-btn').classList.remove('hidden');
                document.getElementById('next-btn').classList.add('hidden');
            } else if (isCurrentStepCleared) {
                if (isNewClear) {
                    document.getElementById('game-msg').innerHTML = hintMode 
                        ? "<span class='text-amber-600 font-black text-xl sm:text-2xl animate-bounce whitespace-nowrap'>🎊 コースクリア！ <span class='text-blue-500'>(ヒントP +1)</span> 🎊</span>"
                        : "<span class='text-amber-600 font-black text-2xl sm:text-3xl animate-bounce whitespace-nowrap'>🎊 コースクリアおめでとう！ 🎊</span>";
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#fbbf24', '#3b82f6', '#ef4444', '#10b981'] });
                } else {
                    document.getElementById('game-msg').innerHTML = "<span class='text-red-500 font-black text-3xl animate-bounce'>✨ 正解！ ✨</span>";
                }
                document.getElementById('finish-btn').classList.remove('hidden');
                document.getElementById('next-btn').classList.add('hidden');
            } else {
                if (hintMode && isNewClear) {
                    document.getElementById('game-msg').innerHTML = "<span class='text-red-500 font-black text-2xl sm:text-3xl animate-bounce'>✨ 正解！ <span class='text-lg text-blue-500'>(ヒントP +1)</span> ✨</span>";
                } else {
                    document.getElementById('game-msg').innerHTML = "<span class='text-red-500 font-black text-3xl animate-bounce'>✨ 正解！ ✨</span>";
                }
                if (currentIdx === questions.length - 1) {
                    document.getElementById('finish-btn').classList.remove('hidden');
                    document.getElementById('next-btn').classList.add('hidden');
                } else {
                    document.getElementById('next-btn').classList.remove('hidden');
                    document.getElementById('finish-btn').classList.add('hidden');
                }
            }
        }

        function nextQuestion() { 
            currentIdx++; 
            loadQuestion(); 
            forceScrollTop();
        }

        function toggleHandedness() { leftHanded = !leftHanded; localStorage.setItem('ota_v21_hand', leftHanded); applyHandedness(); }
        function applyHandedness() { 
            const container = document.getElementById('main-container');
            if (window.innerWidth >= 1024) {
                container.style.flexDirection = leftHanded ? 'row-reverse' : 'row';
            } else {
                container.style.flexDirection = 'column';
            }
        }

        function autoScaleLayout() {
            const gameScreen = document.getElementById('game-screen');
            if (!gameScreen || gameScreen.classList.contains('hidden')) return;

            const winW = window.innerWidth;
            const winH = window.innerHeight;

            if (winW >= 1024) {
                const baseWidth = 1060;
                const baseHeight = 680;
                const availW = winW - 32;
                const availH = winH - 60;
                
                let scale = Math.min(availW / baseWidth, availH / baseHeight);
                scale = Math.max(0.5, Math.min(scale, 1.4));
                
                gameScreen.style.transform = `scale(${scale})`;
                gameScreen.style.transformOrigin = 'top center';
                
                const currentHeight = gameScreen.offsetHeight;
                if (currentHeight > 0) {
                    const marginNeeded = currentHeight * (scale - 1);
                    gameScreen.style.marginBottom = `${marginNeeded}px`;
                }
            } else if (winW < 1024 && window.matchMedia('(orientation: portrait)').matches) {
                const baseHeight = 800;
                const availH = winH - 40;
                let scale = availH / baseHeight;
                scale = Math.max(0.5, Math.min(scale, 0.85));
                
                gameScreen.style.transform = `scale(${scale})`;
                gameScreen.style.transformOrigin = 'top center';

                const currentHeight = gameScreen.offsetHeight;
                if (currentHeight > 0) {
                    const marginNeeded = currentHeight * (scale - 1);
                    gameScreen.style.marginBottom = `${marginNeeded}px`;
                }
            } else {
                gameScreen.style.transform = 'none';
                gameScreen.style.marginBottom = '0px';
            }
        }

        window.onload = () => { initCanvas(); loadCourseData(); updateHintDisplay(); autoScaleLayout(); };
        window.onresize = () => { 
            applyHandedness(); 
            adjustFontSize(); 
            autoScaleLayout();
        };
    </script>
