<style>
* { box-sizing: border-box; }
body {
    margin: 0; color: #2c2a4a; font-family: 'Zen Maru Gothic', sans-serif; overflow: hidden; height: 100vh; touch-action: none;
    background: radial-gradient(circle at 20% 15%, #fffaf0 0%, #eef6ff 55%, #e3f7f2 100%);
}

/* ロビー画面 */
#lobbyScreen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow-y: auto; z-index: 1; }
.lobby-box {
    background: #ffffff;
    padding: 30px; border-radius: 18px; width: 90%; max-width: 420px; text-align: center; box-sizing: border-box; margin: 20px 0;
    border: 1px solid rgba(60,50,120,0.08); box-shadow: 0 10px 30px rgba(60,50,120,0.12);
}
.lobby-box h2 { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
.room-code-big { font-size: 56px; font-weight: 900; color: #ff8a3d; letter-spacing: 8px; margin: 10px 0; }
.lobby-list { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; text-align: left; background: #f7f8fd; border-radius: 10px; padding: 10px; margin: 15px 0; max-height: 200px; overflow-y: auto; }
.lobby-list .user-chip { padding: 6px 14px; background: #ffffff; border: 2px solid rgba(60,50,120,0.12); border-radius: 20px; font-weight: 600; }
.lobby-list .user-chip.me { box-shadow: 0 0 0 3px rgba(60,50,120,0.18); }
.color-picker { margin: 4px 0 12px 0; }
.color-picker .field-label { text-align: center; margin-bottom: 8px; }
.color-swatch-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.color-swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.15s ease; padding: 0; }
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.selected { border-color: #2c2a4a; box-shadow: 0 0 0 3px rgba(60,50,120,0.18); }
.color-swatch.taken { opacity: 0.25; cursor: not-allowed; }
.color-swatch.taken:hover { transform: none; }
.lobby-host-controls { border-top: 1px solid rgba(60,50,120,0.12); margin-top: 15px; padding-top: 15px; }
select, .lobby-host-controls input {
    width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e4e6f5; font-size: 16px; margin: 6px 0;
    box-sizing: border-box; font-family: 'Zen Maru Gothic', sans-serif; background: #f7f8fd; color: #2c2a4a;
}
.host-controls-grid { display: flex; flex-direction: column; }
.field { text-align: left; }
.field-label { font-size: 14px; margin-top: 6px; }
/* パソコンなど横幅にゆとりがある画面では、項目を2列にならべて縦長になりすぎないようにする */
@media (min-width: 640px) {
    .lobby-box { max-width: 640px; }
    .host-controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
}
/* ウィンドウの高さが低いパソコン画面では、余白と部屋番号の文字を少し小さくして収まりやすくする */
@media (min-width: 640px) and (max-height: 680px) {
    .lobby-box { padding: 18px 30px; }
    .room-code-big { font-size: 40px; margin: 4px 0; }
    .lobby-list { max-height: 110px; margin: 8px 0; }
    .lobby-host-controls { margin-top: 8px; padding-top: 8px; }
    select, .lobby-host-controls input { padding: 8px; margin: 3px 0; }
}
.btn {
    padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 16px;
    width: 100%; box-sizing: border-box; margin-top: 8px; font-family: 'Zen Maru Gothic', sans-serif;
    box-shadow: 0 5px 0 rgba(0,0,0,0.15); transition: transform 0.08s ease, box-shadow 0.08s ease; letter-spacing: 1px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
.btn-orange { background: #ff8a3d; color: #2a1500; }
.btn-danger { background: #ef5f6b; color: #3f0d12; }
.waiting-note { opacity: 0.85; font-size: 14px; margin-top: 10px; color: #6b6f9a; }

/* ゲーム画面 */
#gameStage { display: none; position: fixed; inset: 0; z-index: 1; }
#stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 56px 8px 90px 8px; transition: padding 0.15s ease; }
#canvasBox { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; background: white; box-shadow: 0 4px 24px rgba(60,50,120,0.25); border-radius: 6px; overflow: hidden; }
canvas, #viewer img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
#sharedImg:not([src]), #sharedImg[src=""] { opacity: 0; }
#infoBar {
    position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
    padding: 8px; display: flex; justify-content: space-around; align-items: center; font-size: 14px; z-index: 3000;
    font-weight: 500; border-bottom: 1px solid rgba(60,50,120,0.1); color: #2c2a4a;
}
#drawerDisplay { color: #1a9e8f; font-weight: 700; flex: 1; text-align: left; padding-left: 10px; }
#scoreArea { flex: 1; text-align: right; padding-right: 10px; }
#myScoreDisplay { color: #ff8a3d; font-weight: 700; }
#limitTimer { background: #ef5f6b; color: white; font-size: 22px; font-weight: 700; padding: 2px 15px; border-radius: 10px; min-width: 50px; text-align: center; }
#odaiGhost { position: absolute; top: 10%; width: 100%; text-align: center; font-size: 32px; color: rgba(120, 30, 100, 0.55); pointer-events: none; z-index: 5; font-weight: 700; text-shadow: 2px 2px 2px white; }
#hintDisplay { position: fixed; top: 55px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; z-index: 3000; background: rgba(255,255,255,0.92); padding: 5px 15px; border-radius: 20px; min-height: 30px; box-shadow: 0 4px 16px rgba(60,50,120,0.15); }
#hintLabel { font-weight: 700; font-size: 18px; color: #ff8a3d; margin-right: 5px; }
.hint-dot { width: 18px; height: 18px; border: 2px solid #a9adda; border-radius: 50%; background: rgba(60,50,120,0.06); }
.hint-dot.small { width: 12px; height: 12px; }
#judgeEffect { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: 900; z-index: 10000; pointer-events: none; display: none; text-shadow: 0 0 20px rgba(0,0,0,0.25); font-family: 'Zen Maru Gothic', sans-serif; }
#wrongGuessBubble { position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-6px) scale(0.85); z-index: 3600; background: #ffffff; border: 3px solid #ff5c5c; border-radius: 20px; padding: 8px 20px; font-weight: 800; font-size: 17px; color: #d40000; box-shadow: 0 6px 18px rgba(60,50,120,0.22); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; white-space: nowrap; }
#wrongGuessBubble::after { content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); border-width: 0 10px 12px 10px; border-style: solid; border-color: transparent transparent #ff5c5c transparent; }
#wrongGuessBubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
/* パソコンなど横に余裕がある画面では、まちがえた答えをその人の名前タグから吹き出しで出す */
.player-sidebar { position: fixed; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 14px; z-index: 2500; max-width: 30vw; }
.player-sidebar.left { left: 10px; align-items: flex-start; }
.player-sidebar.right { right: 10px; align-items: flex-end; }
.player-tag { position: relative; background: #ffffff; border: 3px solid #ccc; border-radius: 20px; padding: 6px 14px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 10px rgba(60,50,120,0.15); white-space: nowrap; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
.player-tag.me { box-shadow: 0 0 0 3px rgba(60,50,120,0.22), 0 3px 10px rgba(60,50,120,0.15); }
.tag-bubble { position: absolute; top: 50%; transform: translateY(-50%) scale(0.85); background: #ffffff; border: 3px solid #ff5c5c; border-radius: 16px; padding: 6px 14px; font-weight: 800; font-size: 14px; color: #d40000; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; box-shadow: 0 4px 14px rgba(60,50,120,0.2); }
.player-sidebar.left .tag-bubble { left: calc(100% + 12px); }
.player-sidebar.right .tag-bubble { right: calc(100% + 12px); }
.tag-bubble.show { opacity: 1; transform: translateY(-50%) scale(1); }
.tag-bubble::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%); border-width: 8px; border-style: solid; }
.player-sidebar.left .tag-bubble::after { left: -16px; border-color: transparent #ff5c5c transparent transparent; }
.player-sidebar.right .tag-bubble::after { right: -16px; border-color: transparent transparent transparent #ff5c5c; }
@media (max-width: 900px) { .player-sidebar { display: none; } }
#kbdWrapper { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.97); backdrop-filter: blur(6px); z-index: 5000; display: none; flex-direction: column; padding: 5px 0 env(safe-area-inset-bottom) 0; border-top: 3px solid #3ed6c6; box-shadow: 0 -4px 20px rgba(60,50,120,0.12); }
.input-display { display: flex; width: 95%; margin: 5px auto; gap: 8px; align-items: center; position: relative; }
#answerInput { flex: 1; height: 50px; font-size: 28px; text-align: center; border-radius: 10px; border: 2px solid #3ed6c6; background: white; color: #22204a; font-weight: 700; }
.k-key { background: #eef1fb; color: #2c2a4a; border: none; border-radius: 8px; height: 48px; font-size: 20px; font-weight: 700; box-shadow: 0 3px 0 rgba(60,50,120,0.15); display: flex; align-items: center; justify-content: center; }
.k-key:active { transform: translateY(2px); box-shadow: none; background: #dfe3f7; }
.k-close-x { position: absolute; top: -45px; right: 0; background: #eef1fb; color: #2c2a4a; border: 2px solid #ffffff; box-shadow: 0 2px 10px rgba(60,50,120,0.2); border-radius: 50%; width: 40px; height: 40px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
.k-main-area { display: flex; direction: rtl; padding: 5px; gap: 5px; }
.k-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; flex: 1; }
.k-side { width: 80px; display: flex; flex-direction: column; gap: 4px; }
.k-special { background: #dfe3f7; font-size: 16px; }
.k-bs { background: #ef5f6b; color: white; width: 100px; height: 50px; font-size: 16px; }
.k-decide { background: #3ed6c6; color: #04302b; height: 100%; font-size: 22px; grid-row: span 5; }
#drawTools { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.97); z-index: 4000; display: none; flex-direction: column; padding: 10px 5px env(safe-area-inset-bottom) 5px; gap: 10px; border-top: 2px solid rgba(60,50,120,0.1); box-shadow: 0 -4px 20px rgba(60,50,120,0.12); }
.color-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; justify-items: center; max-width: 500px; margin: 0 auto; }
.color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid rgba(60,50,120,0.15); }
.color-btn.active { transform: scale(1.2); border-color: #ff8a3d; box-shadow: 0 0 10px #ff8a3d; }
.tool-row-bottom { display: flex; align-items: center; justify-content: center; gap: 25px; min-height: 60px; }
.size-dot-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.size-dot { border-radius: 50%; background: black; border: 2px solid transparent; }
.size-dot-wrap.active .size-dot { border-color: #2c2a4a; box-shadow: 0 0 8px rgba(60,50,120,0.4); }
.eraser-btn { background: #eef1fb; color: #2c2a4a; border-radius: 8px; padding: 8px 15px; font-weight: 700; }
.eraser-btn.active { background: #ff8a3d; color: #2a1500; outline: 3px solid #ffffff; box-shadow: 0 0 0 5px rgba(255,138,61,0.3); }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#countdownOverlay { z-index: 15000; background: rgba(255,255,255,0.97); color: #2c2a4a; }
#answerOverlay { background: rgba(255,138,61,0.92); color: #2a1500; }
#finalOverlay { background: rgba(255,255,255,0.97); overflow-y: auto; padding-top: 50px; justify-content: flex-start; z-index: 20000; color: #2c2a4a; }
#finalOverlay h1 { font-weight: 900; letter-spacing: 1px; color: #ff8a3d; }
.final-row { background: #f7f8fd; border-radius: 16px; padding: 20px 30px; margin: 10px; width: 85%; max-width: 500px; display: flex; align-items: center; border: 2px solid rgba(60,50,120,0.08); box-sizing: border-box; color: #2c2a4a; }
.f-rank-1 { background: rgba(255, 138, 61, 0.18); border-color: #ff8a3d; }
.f-rank-2 { background: rgba(62, 214, 198, 0.15); border-color: #3ed6c6; }
.f-rank-3 { background: rgba(124, 107, 255, 0.15); border-color: #7c6bff; }
.f-rank { font-size: 32px; font-weight: 900; color: #ff8a3d; margin-right: 25px; }
.f-name { flex: 1; font-size: 24px; font-weight: 700; text-align: left; }
.f-score { font-size: 22px; font-weight: 700; opacity: 0.85; }
</style>
</head>
<body>

<!-- ロビー画面 -->
<div id="lobbyScreen">
    <div class="lobby-box">
        <h2 style="margin-top:0">部屋番号</h2>
        <div class="room-code-big" id="lobbyRoomCode">----</div>
        <div>この番号をお友だちに伝えてね</div>
        <div class="lobby-list" id="lobbyUserList"></div>

        <div class="color-picker">
            <div class="field-label">じぶんの色（あとで変えられるよ）</div>
            <div class="color-swatch-row" id="colorSwatchRow"></div>
        </div>

        <div id="hostControls" class="lobby-host-controls" style="display:none;">
            <div class="host-controls-grid">
                <div class="field">
                    <div class="field-label">むずかしさ</div>
                    <select id="difficultySel"></select>
                </div>

                <div class="field">
                    <div class="field-label">あそびかた</div>
                    <select id="modeSel">
                        <option value="competitive">対戦（点数をきそう）</option>
                        <option value="coop">協力（部屋の合計点をめざす）</option>
                    </select>
                </div>

                <div class="field">
                    <div class="field-label">終わりかた</div>
                    <select id="endTypeSel" onchange="onEndTypeChange()">
                        <option value="rounds">回数で終了</option>
                        <option value="time">制限時間で終了</option>
                    </select>
                </div>

                <div class="field" id="roundsField">
                    <div class="field-label">ひとり何回描く？</div>
                    <input type="number" id="roundsIn" value="2" min="1" max="10">
                </div>
                <div class="field" id="timeField" style="display:none;">
                    <div class="field-label">何分で終了？</div>
                    <input type="number" id="timeLimitIn" value="5" min="1" max="60">
                </div>
            </div>

            <button class="btn btn-orange" onclick="hostStartGame()">はじめる</button>
        </div>
        <div id="guestWaitingNote" class="waiting-note" style="display:none;">
            ホストが準備するまで待っててね…
            <div id="guestSettingsPreview" style="margin-top:10px; font-size:14px; color:#4d5085; line-height:1.8; white-space:pre-line;"></div>
        </div>
    </div>
</div>

<!-- ゲーム画面 -->
<div id="gameStage">
    <div id="infoBar">
        <div id="drawerDisplay">描いている人: ---</div>
        <div id="limitTimer" style="display:none;"></div>
        <div id="scoreArea"><span id="myScoreDisplay"></span></div>
    </div>
    <div id="hintDisplay" style="display:none;"></div>
    <div id="judgeEffect"></div>
    <div id="wrongGuessBubble"></div>
    <div class="player-sidebar left" id="sidebarLeft"></div>
    <div class="player-sidebar right" id="sidebarRight"></div>
    <div id="stage">
        <div id="canvasBox">
            <div id="odaiGhost"></div>
            <canvas id="canvas"></canvas>
            <div id="viewer" style="display:none;"><img id="sharedImg" src=""></div>
        </div>
    </div>
    <div id="drawTools">
        <div class="color-row" id="colorRow"></div>
        <div class="tool-row-bottom">
            <div class="size-dot-wrap" id="wrap1" onclick="changeSize(4, 'wrap1')"><div class="size-dot" style="width: 6px; height: 6px;"></div></div>
            <div class="size-dot-wrap" id="wrap2" onclick="changeSize(12, 'wrap2')"><div class="size-dot" style="width: 15px; height: 15px;"></div></div>
            <div class="size-dot-wrap" id="wrap3" onclick="changeSize(28, 'wrap3')"><div class="size-dot" style="width: 30px; height: 30px;"></div></div>
            <button class="eraser-btn" id="eraserBtn" onclick="setEraser()">消しゴム</button>
            <button onclick="clearCanvas()" style="background:none; border:none; padding:6px; color:#2c2a4a;" aria-label="ぜんぶ消す">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M5 7h14M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>
    <button id="toggleKbd" onclick="toggleKeyboard()" style="display:none; position: fixed; bottom: 15px; right: 15px; z-index: 4500; padding: 12px 24px; border-radius: 30px; background: #ffcc00; font-weight: bold; border: 2px solid #fff;">答えを入力</button>
    <div id="kbdWrapper">
        <div class="input-display">
            <button class="k-close-x" onclick="toggleKeyboard()">×</button>
            <input type="text" id="answerInput" readonly placeholder="答えを入力...">
            <button class="k-key k-bs" onclick="bs()">1文字消す</button>
        </div>
        <div style="display:flex; gap:10px; justify-content: center; margin-bottom:5px;">
            <button id="btnHira" class="k-key k-special" style="width:120px;" onclick="changeKbdType('hira')">ひらがな</button>
            <button id="btnKana" class="k-key k-special" style="width:120px;" onclick="changeKbdType('kana')">カタカナ</button>
        </div>
        <div class="k-main-area">
            <div class="k-grid" id="kanaGrid"></div>
            <div class="k-side" id="sideGrid"></div>
        </div>
    </div>

    <div id="countdownOverlay" class="overlay">
        <div id="cdName" style="font-size:30px; color:#d98a00; font-weight:700;"></div>
        <div id="cdNumber" style="font-size:150px; font-weight:bold;"></div>
    </div>
    <div id="answerOverlay" class="overlay">
        <div style="font-size:30px; font-weight:bold; color:red;">せいかいは...</div>
        <div id="finalAnswer" style="font-size:70px; font-weight:bold; margin:20px 0;"></div>
        <div id="winnerList" style="font-size:22px;"></div>
    </div>
</div>

<!-- 最終ランキング画面 -->
<div id="finalOverlay" class="overlay">
    <h1>さいしゅう結果</h1>
    <div id="finalRankContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    <button id="closeRoomBtn" class="btn btn-danger" style="max-width:300px; margin-top:20px; display:none;" onclick="hostCloseRoom()">部屋を閉じる</button>
</div>

<script>
const config = {
    apiKey: "AIzaSyCo4uq1uJBRcgU-c7mWemukU25MrX635m0",
    authDomain: "oekaki-quiz-23ab5.firebaseapp.com",
    databaseURL: "https://oekaki-quiz-23ab5-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "oekaki-quiz-23ab5",
    appId: "1:61801325910:web:330fa68a1701dbbc9822f7"
};
firebase.initializeApp(config);
const db = firebase.database();
const PLAYER_COLORS = ["#ff6b6b","#ff9f43","#f2c94c","#8bc34a","#26c6da","#42a5f5","#7e57c2","#ec407a","#8d6e63","#26a69a"];
const authReady = new Promise(resolve => {
    firebase.auth().onAuthStateChanged(user => {
        if (user) resolve(user); else firebase.auth().signInAnonymously();
    });
});

const ROUND_SECONDS = 45;

const myRoom = sessionStorage.getItem('friends_room');
const myUid = sessionStorage.getItem('friends_uid');
const myName = sessionStorage.getItem('friends_name');
const isHost = sessionStorage.getItem('friends_isHost') === "1";
if (!myRoom || !myUid) location.href = 'index.html';

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function toHira(str) { return str.replace(/[ァ-ヶ]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)); }
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function pickWord(difficulty, usedWords) {
    const list = (typeof odaiData !== 'undefined' && odaiData[difficulty]) ? odaiData[difficulty] : [];
    let candidates = list.filter(w => !usedWords || !usedWords[w]);
    if (candidates.length === 0) candidates = list; // 使い切ったら最初からまた選べるようにする
    return candidates[Math.floor(Math.random() * candidates.length)] || "りんご";
}

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

let lastCanvasW = 0, lastCanvasH = 0;
function resize() {

    canvas.width = targetW; canvas.height = targetH;

// 上下のバー（点数表示・色パレット・キーボードなど）の高さぶんキャンバスの表示エリアをへこませて、
// 四角の絵が隠れてしまわないようにする。CSSのaspect-ratioだけに頼ると、はじめの幅が
// 決まらず箱のサイズが0になることがあるため、実測したすき間に収まる4:3の大きさをJSで計算する。
function updateStageLayout() {
    const stage = document.getElementById('stage');
    const box = document.getElementById('canvasBox');
    const infoBar = document.getElementById('infoBar');
    const drawTools = document.getElementById('drawTools');
    const kbdWrapper = document.getElementById('kbdWrapper');
    const toggleKbdBtn = document.getElementById('toggleKbd');

    // ヒントと答え入力キーボードは、イラストの上に重ねて表示する（別スペースを確保しない）。
    // その分イラストを大きく表示できる。
    const topReserve = infoBar.offsetHeight + 12;

    let bottomReserve = 12;
    if (getComputedStyle(drawTools).display !== 'none') bottomReserve += drawTools.offsetHeight;
    if (getComputedStyle(toggleKbdBtn).display !== 'none' && getComputedStyle(kbdWrapper).display === 'none') bottomReserve += toggleKbdBtn.offsetHeight + 20;

    const sidePadding = 16; // #stageの左右のpadding(8px×2)ぶん
    const availW = Math.max(0, stage.clientWidth - sidePadding);
    const availH = Math.max(0, window.innerHeight - topReserve - bottomReserve);

    let boxW = availW, boxH = boxW * 3 / 4;
    if (boxH > availH) { boxH = availH; boxW = boxH * 4 / 3; }
    box.style.width = Math.floor(boxW) + 'px';
    box.style.height = Math.floor(boxH) + 'px';

    stage.style.paddingTop = topReserve + 'px';
    stage.style.paddingBottom = bottomReserve + 'px';
    resize();
}
// #drawTools などの表示/非表示を切り替えた直後は、切り替え1フレーム目だけ
// offsetHeightが正しい値より小さく返ることがある（レイアウトの確定が1テンポ遅れるため）。
// 直後にもう一度、次の描画フレームで計算し直すことで、初回だけキャンバスが
// パレットの下に隠れてしまう不具合を防ぐ。
function scheduleStageLayout() {
    updateStageLayout();
    requestAnimationFrame(updateStageLayout);
}

window.onpointerup = () => { if(drawing){ drawing=false; upload(); } };

async function hostStartGame() {
    const difficulty = document.getElementById('difficultySel').value;
    const gameMode = document.getElementById('modeSel').value; // "competitive" | "coop"
    const endType = document.getElementById('endTypeSel').value; // "rounds" | "time"
    const roundsPerPerson = parseInt(document.getElementById('roundsIn').value) || 1;
    const timeLimitMinutes = parseInt(document.getElementById('timeLimitIn').value) || 5;
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    const uids = Object.keys(data.users || {});
    if (uids.length < 2) { alert('2人以上あつまってからはじめてね'); return; }

    const turnOrder = shuffleArray(uids);
    const totalRounds = (endType === "rounds") ? turnOrder.length * roundsPerPerson : 0;
    const gameEndAt = (endType === "time") ? (Date.now() + timeLimitMinutes * 60000) : 0;
    const firstWord = pickWord(difficulty, {});

    await db.ref(`casual_rooms/${myRoom}`).update({
        settings: { difficulty: difficulty, roundsPerPerson: roundsPerPerson, gameMode: gameMode, endType: endType, timeLimitMinutes: timeLimitMinutes },
        turnOrder: turnOrder,
        usedWords: { [firstWord]: true },
        progress: { roundNumber: 0, totalRounds: totalRounds, gameEndAt: gameEndAt },
        state: {
            phase: "countdown",
            currentDrawer: turnOrder[0],
            drawerName: (data.users[turnOrder[0]] || {}).name || "???",
            correctAnswer: firstWord,
            countdown: 3,
            timeLeft: ROUND_SECONDS,
            correctCount: 0,
            active: false
        }
    });
    hostRunCountdown();
}

function hostRunCountdown() {
    const stateRef = db.ref(`casual_rooms/${myRoom}/state`);
    let cd = 3;
    stateRef.update({ phase: "countdown", countdown: cd, active: false });
    if (hostTimerInterval) clearInterval(hostTimerInterval);
    hostTimerInterval = setInterval(() => {
        cd--;
        if (cd <= 0) {
            clearInterval(hostTimerInterval);
            stateRef.update({ phase: "playing", countdown: 0, active: true });
            hostRunRoundTimer();
        } else {
            stateRef.update({ countdown: cd });
        }
    }, 1000);
}

function hostRunRoundTimer() {
    if (hostTimerInterval) clearInterval(hostTimerInterval);
    hostTimerInterval = setInterval(async () => {
        const snap = await db.ref(`casual_rooms/${myRoom}/state`).once('value');
        const st = snap.val();
        if (!st || st.phase !== "playing") { clearInterval(hostTimerInterval); return; }
        if (st.timeLeft <= 0 || (st.correctCount || 0) >= 1) {
            clearInterval(hostTimerInterval);
            hostFinishRound();
            return;
        }
        db.ref(`casual_rooms/${myRoom}/state/timeLeft`).set(st.timeLeft - 1);
    }, 1000);
}

async function hostFinishRound() {
    await db.ref(`casual_rooms/${myRoom}/state`).update({ phase: "result", active: false });
    setTimeout(() => { hostAdvanceRound(); }, 3000);
}

async function hostAdvanceRound() {
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    if (!data) return; // 部屋がすでに消えている

    const nextRoundNumber = (data.progress && data.progress.roundNumber || 0) + 1;
    const resetUpdates = {};
    Object.keys(data.users || {}).forEach(uid => {
        resetUpdates[`users/${uid}/isCorrect`] = false;
        resetUpdates[`users/${uid}/image`] = "";
    });

    const endType = (data.settings || {}).endType || "rounds";
    const isTimeUp = endType === "time" && data.progress && data.progress.gameEndAt && Date.now() >= data.progress.gameEndAt;
    const isRoundsDone = endType !== "time" && nextRoundNumber >= (data.progress ? data.progress.totalRounds : 0);

    if (isTimeUp || isRoundsDone) {
        resetUpdates['state'] = {
            phase: "final", currentDrawer: "", drawerName: "", correctAnswer: "",
            countdown: 0, timeLeft: 0, correctCount: 0, active: false
        };
        await db.ref(`casual_rooms/${myRoom}`).update(resetUpdates);
        return;
    }

    const turnOrder = data.turnOrder || [];
    const nextDrawer = turnOrder[nextRoundNumber % turnOrder.length];
    const nextWord = pickWord(data.settings.difficulty, data.usedWords || {});
    resetUpdates['progress/roundNumber'] = nextRoundNumber;
    resetUpdates['usedWords/' + nextWord] = true;
    resetUpdates['state'] = {
        phase: "countdown",
        currentDrawer: nextDrawer,
        drawerName: (data.users[nextDrawer] || {}).name || "???",
        correctAnswer: nextWord,
        countdown: 3,
        timeLeft: ROUND_SECONDS,
        correctCount: 0,
        active: false
    };
    await db.ref(`casual_rooms/${myRoom}`).update(resetUpdates);
    hostRunCountdown();
}

async function checkAnswer() {
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    if (!data) return;
    const state = data.state;
    const val = document.getElementById('answerInput').value;
    if (!val || state.phase !== "playing") return;

    if (toHira(val) === toHira(state.correctAnswer)) {
        showJudge("正解！", "#ffcc00");
        db.ref(`casual_rooms/${myRoom}/users/${myUid}`).update({ isCorrect: true });
        db.ref(`casual_rooms/${myRoom}/users/${myUid}/score`).transaction(s => (s || 0) + 10);
        // correctCountの更新をトランザクションにし、結果が1になったクライアントだけが
        // 描いた人へのボーナスを渡す（同時正解時の二重加算を防ぐ）
        db.ref(`casual_rooms/${myRoom}/state/correctCount`).transaction(c => (c || 0) + 1, (error, committed, snapshot) => {
            if (!error && committed && snapshot.val() === 1) {
                db.ref(`casual_rooms/${myRoom}/users/${state.currentDrawer}/score`).transaction(s => (s || 0) + 10);
            }
        });
        document.getElementById('kbdWrapper').style.display = 'none';
    } else {
        showJudge("×", "red");
        db.ref(`casual_rooms/${myRoom}/state/wrongGuess`).set({ text: val, name: myName, uid: myUid, ts: Date.now() });
        document.getElementById('answerInput').value = "";
    }
}

function showJudge(text, color) { const el = document.getElementById('judgeEffect'); el.innerText = text; el.style.color = color; el.style.display = "block"; setTimeout(() => { el.style.display = "none"; }, 1000); }
// だれかが間違った答えを送ったとき、その答えをふきだしで数秒だけ表示する。
// これで「あ、その答えはもう違うんだ」とみんなにわかるようにする。
let lastWrongGuessTs = 0;
let wrongGuessInitialized = false;
let wrongGuessHideTimer = null;
const wideScreenQuery = window.matchMedia('(min-width: 901px)');
function showWrongGuessBubble(uid, name, text) {
    // パソコンなど横に余裕がある画面では、その人の名前タグから吹き出しを出す。
    // 名前タグが見つからない・スマホ表示のときは、これまでどおり画面上部に出す。
    const tagBubble = document.getElementById(`tagBubble-${uid}`);
    if (wideScreenQuery.matches && tagBubble) {
        tagBubble.innerText = `× ${text}`;
        tagBubble.classList.add('show');
        clearTimeout(tagBubble._hideTimer);
        tagBubble._hideTimer = setTimeout(() => { tagBubble.classList.remove('show'); }, 2500);
        return;
    }
    const el = document.getElementById('wrongGuessBubble');
    el.innerText = `${name}： × ${text}`;
    el.classList.add('show');
    clearTimeout(wrongGuessHideTimer);
    wrongGuessHideTimer = setTimeout(() => { el.classList.remove('show'); }, 2500);
}

function changeKbdType(type) { kbdType = type; document.getElementById('btnHira').style.background = type === 'hira' ? '#ffcc00' : '#ccc'; document.getElementById('btnKana').style.background = type === 'kana' ? '#ffcc00' : '#ccc'; initKbd(); }

function initColors() { const colors = ['#ffff00', '#adff2f', '#008000', '#00bfff', '#0000ff', '#800080', '#ff69b4', '#ff0000', '#ff8c00', '#f5deb3', '#8b4513', '#000000', '#777777', '#ffffff']; const row = document.getElementById('colorRow'); row.innerHTML = ""; colors.forEach(c => { const b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c; b.onclick = () => { isEraserMode = false; penColor = c; updateActiveColor(); }; row.appendChild(b); }); updateActiveColor(); }
function updateActiveColor() { document.querySelectorAll('.color-btn').forEach(b => b.classList.toggle('active', b.style.backgroundColor === penColor && !isEraserMode)); document.getElementById('eraserBtn').classList.toggle('active', isEraserMode); }
function changeSize(s, id) { penSize = s; document.querySelectorAll('.size-dot-wrap').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function setEraser() { isEraserMode = true; penSize = 28; document.querySelectorAll('.size-dot-wrap').forEach(b => b.classList.remove('active')); document.getElementById('wrap3').classList.add('active'); updateActiveColor(); }
