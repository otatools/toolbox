<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>お絵かきクイズ フレンズ - 部屋</title>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>

<style>
body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; height: 100vh; touch-action: none; }

/* ロビー画面 */
#lobbyScreen { position: fixed; inset: 0; background: #0047AB; display: flex; align-items: center; justify-content: center; overflow-y: auto; }
.lobby-box { background: rgba(255,255,255,0.15); padding: 30px; border-radius: 20px; width: 90%; max-width: 420px; text-align: center; box-sizing: border-box; margin: 20px 0; }
.room-code-big { font-size: 60px; font-weight: bold; color: #ffcc00; letter-spacing: 8px; margin: 10px 0; }
.lobby-list { text-align: left; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px; margin: 15px 0; max-height: 200px; overflow-y: auto; }
.lobby-list div { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.lobby-host-controls { border-top: 1px solid rgba(255,255,255,0.3); margin-top: 15px; padding-top: 15px; }
select, .lobby-host-controls input { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px; margin: 6px 0; box-sizing: border-box; }
.btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 17px; width: 100%; box-sizing: border-box; margin-top: 8px; }
.btn-gold { background: #ffcc00; color: #333; }
.btn-danger { background: #aa0000; color: white; }
.waiting-note { opacity: 0.8; font-size: 14px; margin-top: 10px; }

/* ゲーム画面（student.htmlから流用） */
#gameStage { display: none; position: fixed; inset: 0; }
#stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
#canvasBox { position: relative; width: 100%; max-width: 100vh; aspect-ratio: 4 / 3; background: white; box-shadow: 0 0 20px black; }
canvas, #viewer img { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
#sharedImg:not([src]), #sharedImg[src=""] { opacity: 0; }
#infoBar { position: fixed; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.6); padding: 5px; display: flex; justify-content: space-around; align-items: center; font-size: 14px; z-index: 3000; }
#drawerDisplay { color: #00f0ff; font-weight: bold; flex: 1; text-align: left; padding-left: 10px; }
#scoreArea { flex: 1; text-align: right; padding-right: 10px; }
#myScoreDisplay { color: #ffcc00; }
#limitTimer { background: #ff3333; color: white; font-size: 24px; font-weight: bold; padding: 2px 15px; border-radius: 10px; min-width: 50px; text-align: center; }
#odaiGhost { position: absolute; top: 10%; width: 100%; text-align: center; font-size: 32px; color: rgba(180, 0, 0, 0.6); pointer-events: none; z-index: 5; font-weight: bold; text-shadow: 2px 2px 2px white; }
#hintDisplay { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; z-index: 3000; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 20px; min-height: 30px; }
#hintLabel { font-weight: bold; font-size: 20px; color: #ffcc00; margin-right: 5px; }
.hint-dot { width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; background: rgba(255,255,255,0.4); }
.hint-dot.small { width: 12px; height: 12px; }
#judgeEffect { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: bold; z-index: 10000; pointer-events: none; display: none; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
#kbdWrapper { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(4px); z-index: 5000; display: none; flex-direction: column; padding: 5px 0 env(safe-area-inset-bottom) 0; border-top: 4px solid #ffcc00; }
.input-display { display: flex; width: 95%; margin: 5px auto; gap: 8px; align-items: center; position: relative; }
#answerInput { flex: 1; height: 50px; font-size: 28px; text-align: center; border-radius: 10px; border: 2px solid #ccc; background: white; color: black; font-weight: bold; }
.k-key { background: #eee; color: #000; border: none; border-radius: 8px; height: 48px; font-size: 20px; font-weight: bold; box-shadow: 0 3px 0 #bbb; display: flex; align-items: center; justify-content: center; }
.k-key:active { transform: translateY(2px); box-shadow: none; background: #ddd; }
.k-close-x { position: absolute; top: -45px; right: 0; background: #666; color: white; border: 2px solid #fff; border-radius: 50%; width: 40px; height: 40px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
.k-main-area { display: flex; direction: rtl; padding: 5px; gap: 5px; }
.k-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; flex: 1; }
.k-side { width: 80px; display: flex; flex-direction: column; gap: 4px; }
.k-special { background: #ccc; font-size: 16px; }
.k-bs { background: #ff6666; color: white; width: 100px; height: 50px; font-size: 16px; }
.k-decide { background: #00cc00; color: white; height: 100%; font-size: 24px; grid-row: span 5; }
#drawTools { position: fixed; bottom: 0; left: 0; width: 100%; background: #333; z-index: 4000; display: none; flex-direction: column; padding: 10px 5px env(safe-area-inset-bottom) 5px; gap: 10px; border-top: 2px solid #555; }
.color-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; justify-items: center; max-width: 500px; margin: 0 auto; }
.color-btn { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #fff; }
.color-btn.active { transform: scale(1.2); border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
.tool-row-bottom { display: flex; align-items: center; justify-content: center; gap: 25px; min-height: 60px; }
.size-dot-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.size-dot { border-radius: 50%; background: black; border: 2px solid transparent; }
.size-dot-wrap.active .size-dot { border-color: white; box-shadow: 0 0 8px white; }
.eraser-btn { background: #eee; color: #333; border-radius: 8px; padding: 8px 15px; font-weight: bold; }
.eraser-btn.active { background: #ffcc00; outline: 3px solid white; }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#countdownOverlay { z-index: 15000; background: rgba(0,0,0,0.95); color: white; }
#answerOverlay { background: rgba(255,204,0,0.85); color: black; }
#finalOverlay { background: rgba(0,0,0,0.95); overflow-y: auto; padding-top: 50px; justify-content: flex-start; z-index: 20000; }
.final-row { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 20px 30px; margin: 10px; width: 85%; max-width: 500px; display: flex; align-items: center; border: 2px solid transparent; box-sizing: border-box; }
.f-rank-1 { background: rgba(255, 215, 0, 0.2); border-color: gold; }
.f-rank-2 { background: rgba(192, 192, 192, 0.2); border-color: silver; }
.f-rank-3 { background: rgba(205, 127, 50, 0.2); border-color: #cd7f32; }
.f-rank { font-size: 36px; font-weight: bold; color: gold; margin-right: 25px; }
.f-name { flex: 1; font-size: 26px; font-weight: bold; text-align: left; }
.f-score { font-size: 24px; font-weight: bold; opacity: 0.85; }
</style>
</head>
<body>

<!-- ロビー画面 -->
<div id="lobbyScreen">
    <div class="lobby-box">
        <h2 style="margin-top:0">部屋番号</h2>
        <div class="room-code-big" id="lobbyRoomCode">----</div>
        <div>この番号をお友だちに伝えてね</div>
        <div class="lobby-list" id="lobbyUserList"></div>

        <div id="hostControls" class="lobby-host-controls" style="display:none;">
            <div>おだいのカテゴリ</div>
            <select id="categorySel"></select>
            <div>ひとり何回描く？</div>
            <input type="number" id="roundsIn" value="1" min="1" max="10">
            <button class="btn btn-gold" onclick="hostStartGame()">はじめる！</button>
        </div>
        <div id="guestWaitingNote" class="waiting-note" style="display:none;">ホストが準備するまで待っててね…</div>
    </div>
</div>

<!-- ゲーム画面 -->
<div id="gameStage">
    <div id="infoBar">
        <div id="drawerDisplay">描いている人: ---</div>
        <div id="limitTimer" style="display:none;"></div>
        <div id="scoreArea"><span id="myScoreDisplay"></span></div>
    </div>
    <div id="hintDisplay"></div>
    <div id="judgeEffect"></div>
    <div id="stage">
        <div id="canvasBox">
            <div id="odaiGhost"></div>
            <canvas id="canvas"></canvas>
            <div id="viewer" style="display:none;"><img id="sharedImg" src=""></div>
        </div>
    </div>
    <div id="drawTools">
        <div class="color-row" id="colorRow"></div>
        <div class="tool-row-bottom">
            <div class="size-dot-wrap" id="wrap1" onclick="changeSize(4, 'wrap1')"><div class="size-dot" style="width: 6px; height: 6px;"></div></div>
            <div class="size-dot-wrap" id="wrap2" onclick="changeSize(12, 'wrap2')"><div class="size-dot" style="width: 15px; height: 15px;"></div></div>
            <div class="size-dot-wrap" id="wrap3" onclick="changeSize(28, 'wrap3')"><div class="size-dot" style="width: 30px; height: 30px;"></div></div>
            <button class="eraser-btn" id="eraserBtn" onclick="setEraser()">消しゴム</button>
            <button onclick="clearCanvas()" style="font-size:24px; background:none; border:none;">🗑️</button>
        </div>
    </div>
    <button id="toggleKbd" onclick="toggleKeyboard()" style="display:none; position: fixed; bottom: 15px; right: 15px; z-index: 4500; padding: 12px 24px; border-radius: 30px; background: #ffcc00; font-weight: bold; border: 2px solid #fff;">答えを入力</button>
    <div id="kbdWrapper">
        <div class="input-display">
            <button class="k-close-x" onclick="toggleKeyboard()">×</button>
            <input type="text" id="answerInput" readonly placeholder="答えを入力...">
            <button class="k-key k-bs" onclick="bs()">1文字消す</button>
        </div>
        <div style="display:flex; gap:10px; justify-content: center; margin-bottom:5px;">
            <button id="btnHira" class="k-key k-special" style="width:120px;" onclick="changeKbdType('hira')">ひらがな</button>
            <button id="btnKana" class="k-key k-special" style="width:120px;" onclick="changeKbdType('kana')">カタカナ</button>
        </div>
        <div class="k-main-area">
            <div class="k-grid" id="kanaGrid"></div>
            <div class="k-side" id="sideGrid"></div>
        </div>
    </div>

    <div id="countdownOverlay" class="overlay">
        <div id="cdName" style="font-size:30px; color:gold;"></div>
        <div id="cdNumber" style="font-size:150px; font-weight:bold;"></div>
    </div>
    <div id="answerOverlay" class="overlay">
        <div style="font-size:30px; font-weight:bold; color:red;">せいかいは...</div>
        <div id="finalAnswer" style="font-size:70px; font-weight:bold; margin:20px 0;"></div>
        <div id="winnerList" style="font-size:22px;"></div>
    </div>
</div>

<!-- 最終ランキング画面 -->
<div id="finalOverlay" class="overlay">
    <h1 style="color:gold;">🏆 さいしゅう結果 🏆</h1>
    <div id="finalRankContainer" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    <button id="closeRoomBtn" class="btn btn-danger" style="max-width:300px; margin-top:20px; display:none;" onclick="hostCloseRoom()">部屋を閉じる</button>
</div>

<script>
const config = {
    apiKey: "AIzaSyCo4uq1uJBRcgU-c7mWemukU25MrX635m0",
    authDomain: "oekaki-quiz-23ab5.firebaseapp.com",
    databaseURL: "https://oekaki-quiz-23ab5-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "oekaki-quiz-23ab5",
    appId: "1:61801325910:web:330fa68a1701dbbc9822f7"
};
firebase.initializeApp(config);
const db = firebase.database();
const authReady = new Promise(resolve => {
    firebase.auth().onAuthStateChanged(user => {
        if (user) resolve(user); else firebase.auth().signInAnonymously();
    });
});

const ROUND_SECONDS = 45;

const myRoom = sessionStorage.getItem('friends_room');
const myUid = sessionStorage.getItem('friends_uid');
const myName = sessionStorage.getItem('friends_name');
const isHost = sessionStorage.getItem('friends_isHost') === "1";
if (!myRoom || !myUid) location.href = 'oekaki-friends-index.html';

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function toHira(str) { return str.replace(/[ァ-ヶ]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)); }
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function pickWord(category, usedWords) {
    const list = (typeof odaiData !== 'undefined' && odaiData[category]) ? odaiData[category] : (odaiData ? odaiData['すべて'] : []);
    let candidates = list.filter(w => !usedWords || !usedWords[w]);
    if (candidates.length === 0) candidates = list; // 使い切ったら最初からまた選べるようにする
    return candidates[Math.floor(Math.random() * candidates.length)] || "りんご";
}

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
let drawing = false, penColor = "black", penSize = 12, isDrawer = false, isEraserMode = false;
let lastX = 0, lastY = 0, kbdType = 'hira', lastStatePhase = "", currentIsPlaying = false;
let hostTimerInterval = null;
let gameStarted = false;

function resize() { const box = document.getElementById('canvasBox'); canvas.width = box.clientWidth * 2; canvas.height = box.clientHeight * 2; ctx.scale(2, 2); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
window.onresize = resize;
canvas.onpointerdown = e => { if(!isDrawer || !currentIsPlaying) return; drawing=true; const r=canvas.getBoundingClientRect(); lastX=e.clientX-r.left; lastY=e.clientY-r.top; ctx.beginPath(); ctx.globalCompositeOperation = isEraserMode ? 'destination-out' : 'source-over'; ctx.fillStyle = isEraserMode ? 'white' : penColor; ctx.arc(lastX, lastY, penSize/2, 0, Math.PI * 2); ctx.fill(); throttleUpload(); };
canvas.onpointermove = e => { if(!drawing || !currentIsPlaying) return; e.preventDefault(); const r=canvas.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top; ctx.beginPath(); ctx.globalCompositeOperation = isEraserMode ? 'destination-out' : 'source-over'; ctx.strokeStyle = isEraserMode ? 'rgba(0,0,0,1)' : penColor; ctx.lineWidth=penSize; ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke(); lastX=x; lastY=y; throttleUpload(); };
window.onpointerup = () => { if(drawing){ drawing=false; upload(); } };
let uploadTimeout = null;
function throttleUpload() { if (!uploadTimeout) { uploadTimeout = setTimeout(() => { upload(); uploadTimeout = null; }, 120); } }
function upload() { const temp = document.createElement('canvas'); temp.width = 800; temp.height = 600; temp.getContext('2d').drawImage(canvas, 0, 0, 800, 600); db.ref(`casual_rooms/${myRoom}/users/${myUid}/image`).set(temp.toDataURL('image/webp', 0.8)); }

/* ===== ホスト用：ゲーム進行エンジン ===== */
async function hostStartGame() {
    const category = document.getElementById('categorySel').value;
    const roundsPerPerson = parseInt(document.getElementById('roundsIn').value) || 1;
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    const uids = Object.keys(data.users || {});
    if (uids.length < 2) { alert('2人以上あつまってからはじめてね'); return; }

    const turnOrder = shuffleArray(uids);
    const totalRounds = turnOrder.length * roundsPerPerson;
    const firstWord = pickWord(category, {});

    await db.ref(`casual_rooms/${myRoom}`).update({
        settings: { category: category, roundsPerPerson: roundsPerPerson },
        turnOrder: turnOrder,
        usedWords: { [firstWord]: true },
        progress: { roundNumber: 0, totalRounds: totalRounds },
        state: {
            phase: "countdown",
            currentDrawer: turnOrder[0],
            drawerName: (data.users[turnOrder[0]] || {}).name || "???",
            correctAnswer: firstWord,
            countdown: 3,
            timeLeft: ROUND_SECONDS,
            correctCount: 0,
            active: false
        }
    });
    hostRunCountdown();
}

function hostRunCountdown() {
    const stateRef = db.ref(`casual_rooms/${myRoom}/state`);
    let cd = 3;
    stateRef.update({ phase: "countdown", countdown: cd, active: false });
    if (hostTimerInterval) clearInterval(hostTimerInterval);
    hostTimerInterval = setInterval(() => {
        cd--;
        if (cd <= 0) {
            clearInterval(hostTimerInterval);
            stateRef.update({ phase: "playing", countdown: 0, active: true });
            hostRunRoundTimer();
        } else {
            stateRef.update({ countdown: cd });
        }
    }, 1000);
}

function hostRunRoundTimer() {
    if (hostTimerInterval) clearInterval(hostTimerInterval);
    hostTimerInterval = setInterval(async () => {
        const snap = await db.ref(`casual_rooms/${myRoom}/state`).once('value');
        const st = snap.val();
        if (!st || st.phase !== "playing") { clearInterval(hostTimerInterval); return; }
        if (st.timeLeft <= 0 || (st.correctCount || 0) >= 1) {
            clearInterval(hostTimerInterval);
            hostFinishRound();
            return;
        }
        db.ref(`casual_rooms/${myRoom}/state/timeLeft`).set(st.timeLeft - 1);
    }, 1000);
}

async function hostFinishRound() {
    await db.ref(`casual_rooms/${myRoom}/state`).update({ phase: "result", active: false });
    setTimeout(() => { hostAdvanceRound(); }, 3000);
}

async function hostAdvanceRound() {
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    if (!data) return; // 部屋がすでに消えている

    const nextRoundNumber = (data.progress && data.progress.roundNumber || 0) + 1;
    const resetUpdates = {};
    Object.keys(data.users || {}).forEach(uid => {
        resetUpdates[`users/${uid}/isCorrect`] = false;
        resetUpdates[`users/${uid}/image`] = "";
    });

    if (nextRoundNumber >= (data.progress ? data.progress.totalRounds : 0)) {
        resetUpdates['state'] = {
            phase: "final", currentDrawer: "", drawerName: "", correctAnswer: "",
            countdown: 0, timeLeft: 0, correctCount: 0, active: false
        };
        await db.ref(`casual_rooms/${myRoom}`).update(resetUpdates);
        return;
    }

    const turnOrder = data.turnOrder || [];
    const nextDrawer = turnOrder[nextRoundNumber % turnOrder.length];
    const nextWord = pickWord(data.settings.category, data.usedWords || {});
    resetUpdates['progress/roundNumber'] = nextRoundNumber;
    resetUpdates['usedWords/' + nextWord] = true;
    resetUpdates['state'] = {
        phase: "countdown",
        currentDrawer: nextDrawer,
        drawerName: (data.users[nextDrawer] || {}).name || "???",
        correctAnswer: nextWord,
        countdown: 3,
        timeLeft: ROUND_SECONDS,
        correctCount: 0,
        active: false
    };
    await db.ref(`casual_rooms/${myRoom}`).update(resetUpdates);
    hostRunCountdown();
}

async function hostCloseRoom() {
    if (!confirm('部屋を閉じますか？')) return;
    await db.ref(`casual_rooms/${myRoom}`).onDisconnect().cancel();
    await db.ref(`casual_rooms/${myRoom}`).remove();
    sessionStorage.removeItem('friends_room');
    location.href = 'oekaki-friends-index.html';
}

/* ===== 画面の更新 ===== */
let usersData = {};

function renderLobby(data) {
    document.getElementById('lobbyRoomCode').innerText = myRoom;
    const list = document.getElementById('lobbyUserList');
    list.innerHTML = '';
    Object.values(data.users || {}).forEach(u => {
        const row = document.createElement('div');
        row.innerText = (u.name === myName ? '★ ' : '') + u.name;
        list.appendChild(row);
    });

    if (isHost) {
        document.getElementById('hostControls').style.display = 'block';
        document.getElementById('guestWaitingNote').style.display = 'none';
    } else {
        document.getElementById('hostControls').style.display = 'none';
        document.getElementById('guestWaitingNote').style.display = 'block';
    }
}

window.onload = () => {
    resize(); initKbd(); initColors(); changeSize(12, 'wrap2');
    if (typeof odaiData !== 'undefined') {
        const catSel = document.getElementById('categorySel');
        Object.keys(odaiData).forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat; opt.innerText = cat; catSel.appendChild(opt);
        });
    }
};

authReady.then(() => {
    if (isHost) {
        // ホストの端末が切断（タブを閉じる／ブラウザ終了など）されたら部屋を自動削除
        db.ref(`casual_rooms/${myRoom}`).onDisconnect().remove();
    }

    db.ref(`casual_rooms/${myRoom}`).on('value', snap => {
        const data = snap.val();
        if (!data) { location.href = 'oekaki-friends-index.html'; return; }

        const state = data.state || {};
        usersData = data.users || {};
        if (!usersData[myUid] && state.phase !== "lobby") {
            // 自分がユーザー一覧から消えている（データ不整合）場合は入口に戻す
        }

        isDrawer = (state.currentDrawer === myUid);
        currentIsPlaying = (state.phase === "playing" && state.active);

        document.getElementById('lobbyScreen').style.display = (state.phase === "lobby") ? "flex" : "none";
        document.getElementById('gameStage').style.display = (state.phase === "lobby" || state.phase === "final") ? "none" : "block";
        document.getElementById('finalOverlay').style.display = (state.phase === "final") ? "flex" : "none";

        if (state.phase === "lobby") {
            renderLobby(data);
            return;
        }
        if (state.phase === "final") {
            renderFinal();
            return;
        }

        // ここから通常のゲーム画面
        const limitTimerEl = document.getElementById('limitTimer');
        if (currentIsPlaying && state.timeLeft !== undefined) {
            limitTimerEl.style.display = "block";
            limitTimerEl.innerText = state.timeLeft;
            limitTimerEl.style.background = state.timeLeft <= 10 ? "#ff0000" : "#ff3333";
        } else { limitTimerEl.style.display = "none"; }

        if (state.phase !== lastStatePhase) {
            if (state.phase !== "playing") {
                document.getElementById('kbdWrapper').style.display = 'none';
                document.getElementById('answerInput').value = "";
            }
            if (state.phase === "countdown") { ctx.clearRect(0, 0, canvas.width, canvas.height); }
            lastStatePhase = state.phase;
        }

        document.getElementById('drawerDisplay').innerText = `描いている人: ${state.drawerName || "---"}`;

        document.getElementById('countdownOverlay').style.display = (state.phase === "countdown") ? 'flex' : 'none';
        if (state.phase === "countdown") {
            document.getElementById('cdName').innerText = `次は ${state.drawerName || '...'} さん`;
            document.getElementById('cdNumber').innerText = state.countdown ?? "";
        }

        document.getElementById('answerOverlay').style.display = (state.phase === "result") ? 'flex' : 'none';
        if (state.phase === "result") {
            document.getElementById('finalAnswer').innerText = state.correctAnswer || "？";
            const winners = Object.values(usersData).filter(u => u.isCorrect).map(u => u.name);
            document.getElementById('winnerList').innerText = "正解者：" + (winners.length > 0 ? winners.join('、 ') : "なし");
        }

        document.getElementById('drawTools').style.display = (isDrawer && currentIsPlaying) ? 'flex' : 'none';
        document.getElementById('toggleKbd').style.display = (currentIsPlaying && !isDrawer && !(usersData[myUid] && usersData[myUid].isCorrect)) ? 'block' : 'none';

        const viewer = document.getElementById('viewer');
        if (!isDrawer && (currentIsPlaying || state.phase === "result")) {
            viewer.style.display = 'block';
            const sImg = document.getElementById('sharedImg'), newSrc = (usersData[state.currentDrawer] && usersData[state.currentDrawer].image) || "";
            if (sImg.src !== newSrc) { if (!newSrc) sImg.removeAttribute('src'); else sImg.src = newSrc; }
        } else { viewer.style.display = 'none'; }

        document.getElementById('myScoreDisplay').innerText = `点数: ${(usersData[myUid] && usersData[myUid].score) || 0}`;
        document.getElementById('odaiGhost').innerText = (isDrawer && currentIsPlaying) ? `お題： 「 ${state.correctAnswer} 」` : "";

        const hintBox = document.getElementById('hintDisplay'); hintBox.innerHTML = "";
        if (!isDrawer && currentIsPlaying && state.timeLeft <= 20 && state.correctAnswer) {
            const label = document.createElement('div'); label.id = "hintLabel"; label.innerText = "ヒント："; hintBox.appendChild(label);
            [...state.correctAnswer].forEach(char => {
                const dot = document.createElement('div');
                dot.className = "hint-dot" + ("ぁぃぅぇぉゃゅょっァィゥェォャュョッ".includes(char) ? " small" : "");
                hintBox.appendChild(dot);
            });
        }
    });
});

function renderFinal() {
    const container = document.getElementById('finalRankContainer');
    container.innerHTML = "";
    const sorted = Object.values(usersData).sort((a, b) => (b.score || 0) - (a.score || 0));
    sorted.forEach((u, i) => {
        const row = document.createElement('div');
        const rank = i + 1;
        row.className = "final-row" + (rank <= 3 ? ` f-rank-${rank}` : "");
        row.innerHTML = `<div class="f-rank">${rank}位</div><div class="f-name">${escapeHtml(u.name)}</div><div class="f-score">${u.score || 0}点</div>`;
        container.appendChild(row);
    });
    document.getElementById('closeRoomBtn').style.display = isHost ? 'block' : 'none';
}

/* ===== 回答チェック ===== */
async function checkAnswer() {
    const snap = await db.ref(`casual_rooms/${myRoom}`).once('value');
    const data = snap.val();
    if (!data) return;
    const state = data.state;
    const val = document.getElementById('answerInput').value;
    if (!val || state.phase !== "playing") return;

    if (toHira(val) === toHira(state.correctAnswer)) {
        showJudge("正解！", "#ffcc00");
        db.ref(`casual_rooms/${myRoom}/users/${myUid}`).update({ isCorrect: true });
        db.ref(`casual_rooms/${myRoom}/users/${myUid}/score`).transaction(s => (s || 0) + 10);
        // correctCountの更新をトランザクションにし、結果が1になったクライアントだけが
        // 描いた人へのボーナスを渡す（同時正解時の二重加算を防ぐ）
        db.ref(`casual_rooms/${myRoom}/state/correctCount`).transaction(c => (c || 0) + 1, (error, committed, snapshot) => {
            if (!error && committed && snapshot.val() === 1) {
                db.ref(`casual_rooms/${myRoom}/users/${state.currentDrawer}/score`).transaction(s => (s || 0) + 10);
            }
        });
        document.getElementById('kbdWrapper').style.display = 'none';
    } else {
        showJudge("×", "red");
        document.getElementById('answerInput').value = "";
    }
}

function showJudge(text, color) { const el = document.getElementById('judgeEffect'); el.innerText = text; el.style.color = color; el.style.display = "block"; setTimeout(() => { el.style.display = "none"; }, 1000); }

/* ===== キーボード（student.htmlと同じ） ===== */
function initKbd() { const hira = "あいうえお かきくけこ さしすせそ たちつてと なにぬねの はひふへほ まみむめも やゆよ　　 らりるれろ わをん　ー".split(" "); const kana = "アイウエオ カキクケコ サシスセソ タチツテト ナニヌネノ ハヒフヘホ マミムメモ ヤユヨ　　 ラリルレロ ワヲン　ー".split(" "); const target = kbdType === 'hira' ? hira : kana; const grid = document.getElementById('kanaGrid'); grid.innerHTML = ""; for(let i=0; i<5; i++) { target.forEach((row, rowIndex) => { if (rowIndex === 0 && i === 0) { const d = document.createElement('button'); d.className = 'k-key k-decide'; d.innerText = "決定"; d.onclick = checkAnswer; grid.appendChild(d); } const c = row[i]; if(!c || c === "　") { grid.appendChild(document.createElement('div')); return; } const b = document.createElement('button'); b.className = 'k-key'; b.innerText = c; b.onclick = () => { document.getElementById('answerInput').value += c; }; grid.appendChild(b); }); } const side = document.getElementById('sideGrid'); side.innerHTML = ""; const henkan = document.createElement('button'); henkan.className = 'k-key k-special'; henkan.style.height = "120px"; henkan.innerHTML = "゛ ゜<br><br>小"; henkan.onclick = () => { let v = document.getElementById('answerInput').value; if(!v) return; let last = v.slice(-1); document.getElementById('answerInput').value = v.slice(0,-1) + convertChar(last); }; side.appendChild(henkan); }
function convertChar(c) { const data = {'あ':'ぁ','ぁ':'あ','い':'ぃ','ぃ':'い','う':'ぅ','ぅ':'う','ゔ':'う','え':'ぇ','ぇ':'え','お':'ぉ','ぉ':'お','か':'ガ','ガ':'カ','き':'ぎ','ぎ':'き','く':'ぐ','ぐ':'く','け':'げ','げ':'け','こ':'ご','ご':'こ','さ':'ざ','ざ':'さ','し':'じ','じ':'し','す':'ず','ず':'す','せ':'ぜ','ぜ':'せ','そ':'ぞ','ぞ':'そ','た':'だ','だ':'た','ち':'ぢ','ぢ':'ち','つ':'っ','っ':'づ','づ':'つ','て':'で','て':'て','と':'ど','ど':'と','は':'ば','ば':'ぱ','ぱ':'は','ひ':'び','び':'ぴ','ぴ':'ひ','ふ':'ぶ','ぶ':'ぷ','ぷ':'ふ','へ':'べ','べ':'ぺ','ぺ':'へ','ほ':'ぼ','ぼ':'ぽ','ぽ':'ほ','や':'ゃ','ゃ':'や','ゆ':'ゅ','ゅ':'ゆ','よ':'ょ','ょ':'よ','ア':'ァ','ァ':'ア','イ':'ィ','ィ':'イ','ウ':'ゥ','ゥ':'ヴ','ヴ':'ウ','エ':'ェ','ェ':'エ','オ':'ォ','ォ':'ア','カ':'ガ','ガ':'カ','キ':'ギ','ギ':'キ','ク':'グ','グ':'ク','ケ':'ゲ','ゲ':'ケ','コ':'ゴ','ゴ':'コ','サ':'ザ','ザ':'サ','シ':'ジ','ジ':'シ','ス':'ズ','ズ':'ス','せ':'ゼ','ゼ':'セ','ソ':'ゾ','ゾ':'ソ','タ':'ダ','ダ':'タ','チ':'ヂ','ヂ':'チ','ツ':'ッ','ッ':'ヅ','ヅ':'ツ','て':'デ','デ':'て','ト':'ド','ド':'ト','ハ':'バ','バ':'パ','パ':'ハ','ヒ':'ビ','ヒ':'ぴ','ピ':'ヒ','フ':'ブ','ブ':'プ','ぷ':'フ','ヘ':'ベ','ベ':'ぺ','ペ':'ヘ','ほ':'ぼ','ぼ':'ぽ','ぽ':'ほ','や':'ャ','ャ':'ヤ','ユ':'ュ','ユ':'ユ','よ':'ョ','ョ':'ヨ'}; return data[c] || c; }
function changeKbdType(type) { kbdType = type; document.getElementById('btnHira').style.background = type === 'hira' ? '#ffcc00' : '#ccc'; document.getElementById('btnKana').style.background = type === 'kana' ? '#ffcc00' : '#ccc'; initKbd(); }
function bs() { const el = document.getElementById('answerInput'); el.value = el.value.slice(0, -1); }
function toggleKeyboard(){ const k=document.getElementById('kbdWrapper'); k.style.display=(k.style.display==='flex')?'none':'flex'; }
function initColors() { const colors = ['#ffff00', '#adff2f', '#008000', '#00bfff', '#0000ff', '#800080', '#ff69b4', '#ff0000', '#ff8c00', '#f5deb3', '#8b4513', '#000000', '#777777', '#ffffff']; const row = document.getElementById('colorRow'); row.innerHTML = ""; colors.forEach(c => { const b = document.createElement('div'); b.className = 'color-btn'; b.style.background = c; b.onclick = () => { isEraserMode = false; penColor = c; updateActiveColor(); }; row.appendChild(b); }); updateActiveColor(); }
function updateActiveColor() { document.querySelectorAll('.color-btn').forEach(b => b.classList.toggle('active', b.style.backgroundColor === penColor && !isEraserMode)); document.getElementById('eraserBtn').classList.toggle('active', isEraserMode); }
function changeSize(s, id) { penSize = s; document.querySelectorAll('.size-dot-wrap').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function setEraser() { isEraserMode = true; penSize = 28; document.querySelectorAll('.size-dot-wrap').forEach(b => b.classList.remove('active')); document.getElementById('wrap3').classList.add('active'); updateActiveColor(); }
function clearCanvas(){ if(confirm('ぜんぶ消す？')){ ctx.clearRect(0,0,canvas.width,canvas.height); upload(); } }
