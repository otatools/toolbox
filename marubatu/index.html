    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* iPad/iPhone Safari のダブルタップ拡大を無効化する。
           スクロールとピンチは残る（specificity 0 なので、
           個別に touch-action: none を指定している要素はそのまま） */
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-yellow: #ffea00;
            --bg-color: #090d16;
            --card-bg: rgba(22, 27, 34, 0.85);
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 234, 0.08) 0%, transparent 50%);
            color: #fff;
            
            /* 画面サイズにピッタリ固定し、スクロールを完全に無効化 */
            height: 100dvh;
            width: 100vw;
            margin: 0;
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;

            /* テキスト選択（テキストカーソル）を無効化 */
            -webkit-user-select: none;
            user-select: none;
        }

        #game-scale-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            /* 画面の中央に固定して置く。ふつうの配置だと、縮小する前の大きさ(580px)が
               スマホの画面幅より広いぶんだけ横にはみ出し、ページ全体が縮小表示されていたため、
               position: fixed にしてページの広さに影響しないようにする */
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            /* 中央を基準に拡大縮小する */
            transform-origin: center center; 
            transition: transform 0.1s ease-out;
            /* 起動直後はアドレスバーの開閉で高さが数百ms揺れるため、
               大きさが確定するまで隠しておく（間違った大きさで一瞬見えるのを防ぐ）。
               中の .digital-font が background-clip:text なので、
               iOS で黒い四角が出ないよう opacity ではなく visibility で切りかえる */
            visibility: hidden;
        }

        #game-scale-wrapper.is-ready {
            visibility: visible;
        }

        .cyber-container {
            /* スケール(拡大縮小)の基準となる不変のキャンバスサイズ */
            width: 580px;
            height: 820px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.25);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.12), inset 0 0 25px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            position: relative;
        }

        /* 横長の画面(パソコン・タブレット横・スマホ横)用の配置。
           左に題名・ルール・手番、右に大きな盤面を並べて、画面いっぱいに盤面を大きく見せる */
        #game-container.is-landscape {
            width: 1040px;
            height: 680px;
            display: grid;
            grid-template-columns: 1fr 576px;
            grid-template-rows: 1fr auto auto auto 1fr;
            column-gap: 40px;
            align-items: center;
        }
        #game-container.is-landscape > .hdr-area { grid-column: 1; grid-row: 2; }
        #game-container.is-landscape > .rule-area { grid-column: 1; grid-row: 3; }
        #game-container.is-landscape > #status-box { grid-column: 1; grid-row: 4; margin-bottom: 0; }
        #game-container.is-landscape > .board-area {
            grid-column: 2; grid-row: 1 / 6;
            max-width: 576px; margin-bottom: 0;
        }
        .land-br { display: none; }
        #game-container.is-landscape .land-br { display: inline; }
        #game-container.is-landscape > .rule-area { font-size: 15px; line-height: 1.8; }
        #game-container.is-landscape > .footer-area {
            left: 32px; width: 364px;
        }

        /* 枠無しの洗練されたサイバータイポグラフィ */
        .cyber-title-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .digital-font {
            font-family: 'Dela Gothic One', 'Noto Sans JP', sans-serif;
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #ffffff 0%, #b3f5ff 50%, #ffc2f8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            /* filter: drop-shadow は background-clip:text と併用すると
               iOS Safari で黒い四角になるため外している */
        }

        /* サイバーアンダーライン */
        .cyber-line-accent {
            height: 2px;
            width: 100%;

            content: '';

            -webkit-text-fill-color: var(--neon-pink);

        /* タイトル内埋め込み用マークSVG */
        .title-icon {
            width: 2.2rem;
            height: 2.2rem;
            display: inline-block;
            vertical-align: middle;

        /* マスのデザインとコーナーアクセント */
        .game-cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

            align-items: center;
            justify-content: center;

        }

        .game-cell::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 6px;
            height: 6px;
            border-top: 1.5px solid rgba(0, 243, 255, 0.5);
            border-left: 1.5px solid rgba(0, 243, 255, 0.5);

        }

        .game-cell::after {
            content: '';
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 6px;
            height: 6px;
            border-bottom: 1.5px solid rgba(255, 0, 234, 0.5);
            border-right: 1.5px solid rgba(255, 0, 234, 0.5);

        }
        
        /* 〇ターンのホバー (青) */
        #board[data-turn="〇"] .game-cell:hover:not(.occupied) {
            background: rgba(0, 243, 255, 0.08);
            border-color: var(--neon-blue);
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        /* ✕ターンのホバー (ピンク) */
        #board[data-turn="✕"] .game-cell:hover:not(.occupied) {
            background: rgba(255, 0, 234, 0.08);
            border-color: var(--neon-pink);
            box-shadow: inset 0 0 15px rgba(255, 0, 234, 0.2);
        }

        /* SVG アニメーション (〇と✕の流れる描画) */
        .svg-icon {
            width: 70%;
            height: 70%;
            filter: drop-shadow(0 0 8px currentColor);
        }

        .draw-circle {
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            animation: draw 0.25s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .draw-cross-1 {
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            animation: draw 0.18s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        .draw-cross-2 {
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            animation: draw 0.18s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        /* 消えるアニメーション */
        @keyframes vanish-out {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0px); }
            50% { transform: scale(1.2) rotate(10deg); opacity: 0.8; filter: blur(2px); }
            100% { transform: scale(0) rotate(-20deg); opacity: 0; filter: blur(8px); }
        }

        .piece-vanish {
            animation: vanish-out 0.25s ease-in forwards !important;
        }

        /* 勝利時のマス目の輝き */
        @keyframes win-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px var(--neon-yellow); border-color: var(--neon-yellow); }
            50% { transform: scale(1.05); box-shadow: 0 0 45px var(--neon-yellow); border-color: #fff; }
        }

        .win-cell {
            background: rgba(255, 234, 0, 0.2) !important;
            animation: win-pulse 1s infinite ease-in-out;
            z-index: 5;
        }

        /* サイバーボタン */
        .cyber-btn {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);

        /* 唯一の修正箇所：サウンドボタンは上下ズレを防止して中央配置を維持 */
        #sound-toggle:hover {

        /* 紙吹雪Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            /* JS 側は innerWidth / innerHeight で描いているので、
               100vw / 100vh（iOS では実寸とずれる）ではなく実寸に合わせる */
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;

        /* 勝利ポップアップモーダル (コンテナ内でスケールさせるために absolute に変更) */
        .victory-modal-overlay {
            background: rgba(0, 0, 0, 0.85);

        .victory-modal {
            background: rgba(9, 13, 22, 0.95);
            border: 3px solid var(--neon-yellow);
            box-shadow: 0 0 50px rgba(255, 234, 0, 0.5);
            animation: pop-modal 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop-modal {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <script>
        // iPad/iPhoneのSafariはピンチによる拡大ジェスチャーをtouch-actionや
        // viewportのmaximum-scale/user-scalableだけでは止めてくれないため、
        // Safari独自のgestureイベントを直接キャンセルする。
        ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
            document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
        });

        // 上の対策でも防ぎきれず拡大されたままになることがあるための保険。
        // 実際の拡大率が1より大きくなっていたら、viewportのmeta指定を
        // 一度上書き→戻すことで強制的に等倍へスナップバックさせる。
        function resetZoomIfNeeded() {
            if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
            const viewportMeta = document.querySelector('meta[name="viewport"]');
            if (!viewportMeta) return;
            const original = viewportMeta.getAttribute('content');
            viewportMeta.setAttribute('content', original + ', maximum-scale=1.0');
            requestAnimationFrame(() => {
                viewportMeta.setAttribute('content', original);
            });
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resetZoomIfNeeded);
            window.visualViewport.addEventListener('scroll', resetZoomIfNeeded);
        }
        // ピンチ操作が終わった直後にも念のため確認する
        document.addEventListener('gestureend', () => {
            setTimeout(resetZoomIfNeeded, 50);
        }, { passive: true });
    </script>

    <!-- 勝者決定時の紙吹雪キャンバス (画面全体) -->
    <canvas id="confetti-canvas"></canvas>

    <!-- このラッパーがJSによって画面サイズに合わせて拡大縮小される -->
    <div id="game-scale-wrapper">
        
        <!-- 基準となる固定サイズのメインコンテナ -->
        <div id="game-container" class="cyber-container rounded-3xl p-8 flex flex-col items-center relative z-10 shadow-[0_0_50px_rgba(0,0,0,0.6)]">
            
            <!-- ヘッダー -->
            <div class="hdr-area w-full relative flex items-center justify-center mb-6 min-h-[60px]">
                <!-- 枠無しサイバータイトル -->

                <!-- サウンドON/OFFボタン -->

            <p class="rule-area text-gray-300 text-sm border-b border-gray-800 pb-3 mb-6 w-full text-center">
                ルール：マークは<span class="text-yellow-400 font-bold">3つまで</span>！<br class="land-br"> 4つ目を置くと<span class="text-yellow-400 font-bold">最初のマークが消える</span>！
            </p>

            <!-- 状態表示 -->
            <div id="status-box" class="text-3xl font-black mb-6 text-center h-10 flex items-center justify-center">

                ３つだけ○× <span class="mx-1 opacity-50">|</span> ver.1.1 <span class="mx-1 opacity-50">|</span> ota tools
            </div>

            <!-- 勝利モーダル (ゲームコンテナの内側に閉じ込める) -->
            <div id="victory-modal" class="absolute inset-0 victory-modal-overlay flex items-center justify-center p-4 hidden">

                        <svg class="w-16 h-16 drop-shadow-[0_0_15px_rgba(255,234,0,0.8)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>

                            <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path>
                        </svg>
                    </div>
                    <h2 id="winner-title" class="text-2xl sm:text-3xl font-black text-white mb-4 whitespace-nowrap flex items-center justify-center gap-1">〇 の完全勝利！</h2>
                    <p class="text-gray-300 mb-6">見事な戦略で勝負を制した！</p>
                    <button id="modal-reset-btn" class="cyber-btn font-black py-4 px-8 rounded-2xl text-xl w-full">
                        もう一度遊ぶ！

        </div>
    </div>

    <script>
        // Web Audio API による効果音生成システム
        const SOUND_STORAGE_KEY = 'marubatuSoundEnabled';

        class SoundFX {
            constructor() {
                this.ctx = null;
                this.unlocked = false;
                // 前回選んだON/OFFを復元する（プライベートブラウズでは例外が出るのでtry/catch）
                let saved = null;
                try { saved = localStorage.getItem(SOUND_STORAGE_KEY); } catch (e) {}
                this.enabled = saved === null ? true : saved === 'true';
            }

            // 復元時にここで音は鳴らさない（開いた瞬間に確認音が鳴らないように）
            saveEnabled() {
                try { localStorage.setItem(SOUND_STORAGE_KEY, this.enabled); } catch (e) {}
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
            }

            unlock() {
                if (this.unlocked) return;
                this.init();
                if (this.ctx) {
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume().then(() => {
                            this.unlocked = true;
                        }).catch(() => {});
                    } else {
                        this.unlocked = true;
                    }
                }
            }

            playPlace(isO) {
                if (!this.enabled) return;
                this.unlock();
                if (!this.ctx) return;
                
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                const freq = isO ? 523.25 : 659.25; // C5(〇) or E5(✕)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.3, now + 0.08);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);

                osc.start(now);
                osc.stop(now + 0.1);
            }

            playVictory() {
                if (!this.enabled) return;
                this.unlock();
                if (!this.ctx) return;
                
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C, E, G, C
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'triangle';
                    const startTime = now + idx * 0.08;
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.25, startTime + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.35);

                    osc.start(startTime);
                    osc.stop(startTime + 0.35);
                });
            }
        }

        const sfx = new SoundFX();
        ['pointerdown', 'touchstart', 'mousedown', 'keydown'].forEach(eventType => {
            window.addEventListener(eventType, () => sfx.unlock(), { passive: true });
        });

        const MAX_MOVES_PER_PLAYER = 3;
        let currentPlayer = '〇'; 
        let boardState = Array(9).fill(null); 
        
        let moveHistory = {
            '〇': [], 
            '✕': []
        };
        
        let isGameOver = false;
        let isAnimating = false;

        // DOM要素
        const boardElement = document.getElementById('board');
        const statusBox = document.getElementById('status-box');
        // const resetBtn = document.getElementById('reset-btn');
        const soundToggle = document.getElementById('sound-toggle');
        const soundIcon = document.getElementById('sound-icon');
        const victoryModal = document.getElementById('victory-modal');
        const winnerTitle = document.getElementById('winner-title');
        const modalResetBtn = document.getElementById('modal-reset-btn');

        // SVGスピーカーアイコン定義
        const speakerOnSVG = `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
        const speakerOffSVG = `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

        function updateSoundIcon() {
            soundIcon.innerHTML = sfx.enabled ? speakerOnSVG : speakerOffSVG;
        }

        const winningLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]             
        ];

        // 〇と✕のSVGグラフィック生成
        function getPieceSVG(type, animate = true) {
            const circleAnim = animate ? 'draw-circle' : '';
            const crossAnim1 = animate ? 'draw-cross-1' : '';
            const crossAnim2 = animate ? 'draw-cross-2' : '';
            
            if (type === '〇') {
                return `
                <svg class="svg-icon text-blue" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="34" 
                            stroke="currentColor" stroke-width="20" fill="none" 
                            stroke-linecap="round" class="${circleAnim}" />
                </svg>`;
            } else {
                return `
                <svg class="svg-icon text-pink" viewBox="0 0 100 100">
                    <line x1="22" y1="22" x2="78" y2="78" 
                          stroke="currentColor" stroke-width="20" stroke-linecap="round" class="${crossAnim1}" />
                    <line x1="78" y1="22" x2="22" y2="78" 
                          stroke="currentColor" stroke-width="20" stroke-linecap="round" class="${crossAnim2}" />
                </svg>`;
            }
        }

        // ステータス表示用の太い統一アイコンSVG
        const inlineCircleSVG = `<svg class="w-8 h-8 inline-block align-middle mx-1 text-blue drop-shadow-[0_0_6px_var(--neon-blue)]" viewBox="0 0 100 100"><circle cx="50" cy="50" r="32" stroke="currentColor" stroke-width="26" fill="none" /></svg>`;
        const inlineCrossSVG = `<svg class="w-8 h-8 inline-block align-middle mx-1 text-pink drop-shadow-[0_0_6px_var(--neon-pink)]" viewBox="0 0 100 100"><line x1="22" y1="22" x2="78" y2="78" stroke="currentColor" stroke-width="26" stroke-linecap="round" /><line x1="78" y1="22" x2="22" y2="78" stroke="currentColor" stroke-width="26" stroke-linecap="round" /></svg>`;

        function initBoardDOM() {
            boardElement.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'game-cell rounded-xl cursor-pointer select-none';
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                boardElement.appendChild(cell);
            }
        }

        function handleCellClick(index) {
            if (isGameOver || isAnimating || boardState[index] !== null) return;

            // 1. マークを配置＆効果音
            const playerJustPlayed = currentPlayer;
            boardState[index] = playerJustPlayed;
            moveHistory[playerJustPlayed].push(index);
            sfx.playPlace(playerJustPlayed === '〇');

            const targetCell = boardElement.children[index];
            targetCell.classList.add('occupied');
            targetCell.innerHTML = getPieceSVG(playerJustPlayed, true);

            // 2. 4手目が打たれたら最古の1手目がパッと消える
            if (moveHistory[playerJustPlayed].length > MAX_MOVES_PER_PLAYER) {
                const oldestIndex = moveHistory[playerJustPlayed].shift(); 
                const cellToRemove = boardElement.children[oldestIndex];
                
                // 即座に内部のボード配列から最古のコマを取り除き、常に最大3コマを維持
                boardState[oldestIndex] = null;

                if (cellToRemove) {
                    isAnimating = true;
                    const svgInside = cellToRemove.querySelector('svg');
                    if (svgInside) svgInside.classList.add('piece-vanish');
                    
                    setTimeout(() => {
                        cellToRemove.classList.remove('occupied');
                        cellToRemove.innerHTML = '';
                        isAnimating = false;
                        checkGameState(playerJustPlayed);
                    }, 220);
                    return;
                }
            }
            
            checkGameState(playerJustPlayed);
        }

        function checkGameState(playerJustPlayed) {
            const winResult = checkWin(playerJustPlayed);
            
            if (winResult) {
                isGameOver = true;
                showWin(playerJustPlayed, winResult);
                return;
            }
            currentPlayer = currentPlayer === '〇' ? '✕' : '〇';
            updateStatusBox();
        }

        function checkWin(player) {
            for (let i = 0; i < winningLines.length; i++) {
                const [a, b, c] = winningLines[i];
                if (boardState[a] === player && boardState[b] === player && boardState[c] === player) {
                    return winningLines[i];
                }
            }
            return null;
        }

        function updateStatusBox() {
            // 現在のターンを盤面の属性にセットしてホバー色を切り替える
            boardElement.setAttribute('data-turn', currentPlayer);

            if (currentPlayer === '〇') {
                statusBox.innerHTML = `プレイヤー ${inlineCircleSVG} のターン`;
            } else {
                statusBox.innerHTML = `プレイヤー ${inlineCrossSVG} のターン`;
            }
        }

        function showWin(player, winLine) {
            sfx.playVictory();

            if (player === '〇') {
                statusBox.innerHTML = `プレイヤー ${inlineCircleSVG} の勝利！`;
                winnerTitle.innerHTML = `プレイヤー ${inlineCircleSVG} の勝利！`;
            } else {
                statusBox.innerHTML = `プレイヤー ${inlineCrossSVG} の勝利！`;
                winnerTitle.innerHTML = `プレイヤー ${inlineCrossSVG} の勝利！`;
            }
            
            winLine.forEach(index => {
                const cell = boardElement.children[index];
                if (cell) cell.classList.add('win-cell');
            });

            launchConfetti();

            setTimeout(() => {
                victoryModal.classList.remove('hidden');
            }, 800);
        }

        function resetGame() {
            boardState = Array(9).fill(null);
            moveHistory = { '〇': [], '✕': [] };
            currentPlayer = '〇';
            isGameOver = false;
            isAnimating = false;

            initBoardDOM();
            updateStatusBox();
            victoryModal.classList.add('hidden');

            if (confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
                confettiAnimationId = null;
            }
            const canvas = document.getElementById('confetti-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        let confettiAnimationId = null;
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            // 紙吹雪は画面全体(フルスクリーン)に描画する
            syncConfettiCanvasSize();

            const particles = [];
            const colors = ['#00f3ff', '#ff00ea', '#ffea00', '#ffffff'];

            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 100,
                    y: canvas.height / 2 + (Math.random() - 0.5) * 100,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.8) * 15,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10,
                    opacity: 1
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2; // 重力効果
                    p.rotation += p.rSpeed;
                    p.opacity -= 0.01;

                    if (p.opacity > 0) {
                        alive = true;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.opacity);
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                });

                if (alive) {
                    confettiAnimationId = requestAnimationFrame(animateConfetti);
                }
            }

            if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
            animateConfetti();
        }

        // resetBtn.addEventListener('click', resetGame);
        modalResetBtn.addEventListener('click', resetGame);
        soundToggle.addEventListener('click', () => {
            sfx.enabled = !sfx.enabled;
            sfx.saveEnabled();
            updateSoundIcon();
        });

        // 実際に使える表示領域を実測する。
        // innerWidth / innerHeight は iOS でツールバー分ずれるので visualViewport を優先する
        function getViewportSize() {
            const vv = window.visualViewport;
            return {
                w: Math.round(vv ? vv.width : window.innerWidth),
                h: Math.round(vv ? vv.height : window.innerHeight)
            };
        }

        function adjustGameScale() {
            const wrapper = document.getElementById('game-scale-wrapper');
            const container = document.getElementById('game-container');
            if (!wrapper || !container) return;
            const padding = 16; // 画面端のマージン

            const { w, h } = getViewportSize();

            // 縦長の配置(580x820、盤面516px)と横長の配置(1040x680、盤面576px)の両方で
            // 収まる倍率を計算し、盤面が大きく見えるほうを使う
            const scalePortrait = Math.min((w - padding) / 580, (h - padding) / 820);
            const scaleLandscape = Math.min((w - padding) / 1040, (h - padding) / 680);
            const useLandscape = 576 * scaleLandscape > 516 * scalePortrait;
            container.classList.toggle('is-landscape', useLandscape);

            // はみ出さないよう最小のスケールを適用
            const scale = useLandscape ? scaleLandscape : scalePortrait;
            wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        // 紙吹雪キャンバスは、CSSの表示サイズと描画バッファのサイズを必ず一致させる
        // （canvas.width への代入は中身を消すので、変わっていないときは何もしない）
        function syncConfettiCanvasSize() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const { w, h } = getViewportSize();
            if (canvas.width === w && canvas.height === h) return;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            canvas.width = w;
            canvas.height = h;
        }

        function handleViewportChange() {
            adjustGameScale();
            syncConfettiCanvasSize();
        }

        // ウィンドウのリサイズ時にもスケーリングと紙吹雪キャンバスのサイズを合わせる
        window.addEventListener('resize', handleViewportChange);
        window.addEventListener('pageshow', handleViewportChange);
        window.addEventListener('orientationchange', () => setTimeout(handleViewportChange, 250));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', handleViewportChange);
            window.visualViewport.addEventListener('scroll', handleViewportChange);
        }

        // 初期化実行
        handleViewportChange();
        initBoardDOM();
        updateStatusBox();
        updateSoundIcon();

        // アドレスバーの表示/非表示アニメーションが終わって高さが確定してから、
        // もう一度計算し直したうえで画面を出す
        setTimeout(() => {
            handleViewportChange();
            const wrapper = document.getElementById('game-scale-wrapper');
            if (wrapper) wrapper.classList.add('is-ready');
        }, 300);
    </script>
