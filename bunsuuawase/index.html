* { touch-action: manipulation; -webkit-touch-callout: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --app-h: 100vh; --bg: #e9eff6; --ink: #22314a; --main: #2866c7; --mainD: #1b4a96; --line: #c2cfdf; --pz: #f8b62d; --pzD: #de8a12; }
@supports (height: 100dvh) { :root { --app-h: 100dvh; } }
html { background: var(--bg); }
html.home { background: #2459b8; }
html, body { margin: 0; padding: 0; }
body { position: fixed; inset: 0; height: var(--app-h); overflow: hidden; overscroll-behavior-y: none;
    font-family: "KukuNum", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
    font-weight: 700; color: var(--ink); user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
button:focus { outline: none; }
button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; border: none; margin: 0; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: absolute; left: 50%; top: 50%; width: 1000px; height: 620px; transform: translate(-50%, -50%) scale(1);
    transform-origin: center center; visibility: hidden; }
#app.is-portrait { width: 420px; height: 740px; }
#app.is-ready { visibility: visible; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }

/* ボタン */
.btn { background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 0 24px; height: 56px; font-size: 22px; font-weight: 700;
    box-shadow: 0 4px 0 var(--line); line-height: 1; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.go { background: var(--main); border-color: var(--mainD); color: #fff; box-shadow: 0 4px 0 var(--mainD); }
.btn.go:active { box-shadow: 0 1px 0 var(--mainD); }
.pill { position: relative; height: 40px; padding: 0 16px; border-radius: 20px; background: #fff; border: 2px solid var(--line); font-size: 16px; font-weight: 700; line-height: 1; white-space: nowrap; }
.pill::after { content: ""; position: absolute; inset: -7px -8px; }
.back { position: absolute; left: 14px; top: 8px; padding: 0 16px 0 30px; font-size: 17px; }
.back::before { content: ""; position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; border-left: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink); transform: translateY(-50%) rotate(45deg); }

/* 分数・帯分数・小数の 書き方（カードの おもて、うらの 小さい 字、ホームの 見本で 同じ ものを つかう） */
.fr { display: inline-flex; flex-direction: column; align-items: stretch; text-align: center; font-size: .74em; line-height: 1; vertical-align: middle; }
.fr i { font-style: normal; display: block; padding: .07em .14em .03em; }
.fr i:first-child { border-bottom: .085em solid currentColor; padding-bottom: .08em; }
.fr i:last-child { padding-top: .1em; }
.mx { display: inline-flex; align-items: center; gap: .06em; line-height: 1; }
/* 数字の 大きさは、分数・小数・整数・帯分数で 全部 同じ（.74em） */
.mx > b { font-weight: inherit; font-size: .74em; }
.nb { display: inline-block; line-height: 1; font-size: .74em; }
.dp { display: inline-block; width: .15em; height: .15em; border-radius: 50%; background: currentColor; margin: 0 .05em 0 .04em; vertical-align: baseline; }

/* ホーム：青い 舞台の まん中で、2枚の カードが めくれて そろう ようすを くり返し 見せる */
#s-home { align-items: center; padding: 16px 30px 10px; color: #fff; background: radial-gradient(ellipse closest-side at 50% 46%, #4a93ee 0%, #2f6fd3 55%, #2459b8 100%); }
#s-home::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-conic-gradient(from 5deg at 50% 46%, rgba(255,255,255,.085) 0 10deg, rgba(255,255,255,0) 10deg 20deg); }
#s-home::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse closest-side at 50% 46%, rgba(36,89,184,0) 45%, #2459b8 100%); }
#s-home > * { position: relative; z-index: 1; }
#s-home > .coin { position: absolute; z-index: 60; }
#s-home > .deco { position: absolute; z-index: 1; opacity: .2; pointer-events: none; }
.deco svg { display: block; width: 100%; height: 100%; }
#sndBtn { position: absolute !important; right: 20px; top: 16px; min-width: 96px; color: var(--ink); border-color: #fff; }
.logo { margin: auto 0 0; font-size: 84px; font-weight: 900; line-height: 1; letter-spacing: 6px; color: #fff; white-space: nowrap;
    text-shadow: 0 6px 0 #17377a, 0 12px 18px rgba(12,30,74,.35); animation: logoIn .55s cubic-bezier(.3,1.5,.5,1) both; }
.logo b { color: #ffd53d; font-weight: 900; }
.logoSub { font-size: 20px; margin: 16px 0 14px; white-space: nowrap; min-width: 470px; text-align: center; background: #17377a; border-radius: 18px; padding: 7px 22px 8px; line-height: 1; }
.stage { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 20px; }
.dc { width: 190px; height: 170px; flex: 0 0 auto; }
.dc.gone { animation: gone .32s ease-in forwards; }
#dOk { position: relative; width: 96px; height: 96px; border-radius: 24px; font-size: 34px; }
/* 見本で「ここを おした」と 分かる 黄色い 輪 */
.tap { position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 8px solid #ffd53d; background: rgba(255,213,61,.35); pointer-events: none; z-index: 5; animation: tapR .6s ease-out forwards; }
@keyframes tapR { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
@keyframes gone { to { transform: scale(.3); opacity: 0; } }
.dc .pb svg { height: 80px; }
.dc .pf, .dc .pb { box-shadow: 0 6px 0 #17377a, 0 14px 20px rgba(12,30,74,.35); }
.lvs { display: flex; gap: 18px; }
.lv { width: 292px; height: 112px; border-radius: 24px; background: var(--c); color: #fff; border: 4px solid #fff; box-shadow: 0 7px 0 var(--d), 0 14px 18px rgba(12,30,74,.3); padding: 0 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px; line-height: 1; white-space: nowrap; animation: pop .35s both; }
.lv:nth-child(1) { animation-delay: .15s; } .lv:nth-child(2) { animation-delay: .25s; } .lv:nth-child(3) { animation-delay: .35s; }
.lv:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--d); }
.lv .ln { font-size: 31px; font-weight: 900; letter-spacing: 1px; }
.lv .ld { font-size: 17px; font-weight: 700; }
.lv .lb { font-size: 14px; font-weight: 700; background: #fff; color: var(--ink); border-radius: 11px; padding: 3px 12px 4px; margin-top: 2px; }
.lv .lb b { font-size: 1.25em; font-weight: 900; color: var(--d); }
.lv .lb .ll { margin-left: 10px; padding-left: 10px; border-left: 2px solid var(--line); }
.lv .lb .ll b { margin-left: 3px; }
.hs { display: inline-block; background: #fff; border: 2px solid var(--line); border-radius: 15px; padding: 5px 16px; margin-top: 16px; font-size: 17px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.hs b { font-size: 1.3em; font-weight: 900; color: var(--main); margin: 0 2px 0 6px; }
.pts { display: flex; gap: 30px; margin-top: 22px; font-size: 16px; font-weight: 700; white-space: nowrap; }
.pts span { display: flex; align-items: center; gap: 6px; }
.pts i { width: 32px; height: 32px; background: center / contain no-repeat; display: block; }
.pts b { font-weight: 900; font-size: 1.15em; color: #ffd53d; }
.foot { margin-top: auto; padding-top: 10px; font-size: 14px; font-weight: 500; opacity: .85; white-space: nowrap; }
@keyframes logoIn { 0% { transform: translateY(-40px) scale(.7); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
.is-portrait #s-home { padding: 54px 12px 8px; }
.is-portrait .logo { font-size: 64px; letter-spacing: 3px; }
.is-portrait .logoSub { min-width: 384px; font-size: 16px; margin: 16px 0 18px; }
.is-portrait .stage { gap: 10px; margin-bottom: 24px; }
.is-portrait .dc { width: 124px; height: 144px; }
.is-portrait .dc .pb svg { height: 64px; }
.is-portrait .stage { gap: 8px; margin-bottom: 18px; }
.is-portrait .dc { width: 104px; height: 128px; }
.is-portrait .dc .pf, .is-portrait .dc .pb { font-size: 48px; }
.is-portrait .dc .pb svg { height: 58px; }
.is-portrait .dc .pb small { font-size: 23px; height: 42px; }
.is-portrait #dOk { width: 60px; height: 60px; border-radius: 16px; font-size: 21px; letter-spacing: 0; border-width: 3px; box-shadow: 0 5px 0 #a9b6c8; }
.is-portrait #dOk.on { box-shadow: 0 5px 0 #1c7a4a, 0 0 0 4px rgba(47,174,110,.25); }
.is-portrait .tap { width: 70px; height: 70px; margin: -35px 0 0 -35px; border-width: 6px; }
.is-portrait .lvs { flex-direction: column; gap: 14px; }
.is-portrait .lv { width: 384px; height: 70px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-content: center; justify-items: start; align-items: center; gap: 6px 10px; padding: 0 14px 0 18px; border-radius: 20px; border-width: 3px; box-shadow: 0 6px 0 var(--d), 0 12px 14px rgba(12,30,74,.28); }
.is-portrait .lv .ln { font-size: 25px; }
.is-portrait .lv .ld { font-size: 15px; grid-row: 2; grid-column: 1; }
.is-portrait .lv .lb { grid-row: 1 / span 2; grid-column: 2; align-self: center; justify-self: end; margin: 0; font-size: 12px; padding: 4px 9px 5px; text-align: center; line-height: 1.15; }
.is-portrait .lv .lb .ll { display: block; margin: 2px 0 0; padding: 0; border: none; }
.is-portrait .pts { gap: 22px; margin-top: 22px; font-size: 15px; }

/* あそぶ 画面の 上の 帯 */
.top { position: relative; width: 100%; height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: flex-start; gap: 18px; padding: 0 22px 0 132px; }
.pTimeBox { position: relative; flex: 1 1 0; display: flex; align-items: center; gap: 10px; font-size: 16px; white-space: nowrap; }
.pTimeBox b { font-size: 32px; font-weight: 900; line-height: 1; min-width: 42px; text-align: right; }
/* ふえた・へった 秒数（＋5秒、−2秒 など）。時間の 数字の 下に 出て、上へ うかんで きえる */
.tPop { position: absolute; top: 42px; z-index: 65; pointer-events: none; font-style: normal; font-size: 22px; font-weight: 900; line-height: 1; white-space: nowrap; color: #1c7a4a;
    background: #fff; border: 2px solid #9fd8b9; border-radius: 12px; padding: 4px 9px 5px; transform: translateX(-50%); animation: tPop 1s ease-out forwards; }
.tPop.minus { color: #c7343f; border-color: #f3a8ae; }
@keyframes tPop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 70% { opacity: 1; transform: translate(-50%, -4px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -12px) scale(1); } }
#pBarW { flex: 1 1 0; height: 20px; border-radius: 10px; background: #cfdae8; overflow: hidden; }
#pBar { height: 100%; width: 100%; border-radius: 10px; background: #2f9e6a; }
#pBar.low { background: #e0454f; }
.pBest { flex: 0 0 auto; background: #fff; border: 2px solid var(--line); border-radius: 13px; padding: 3px 12px; font-size: 15px; white-space: nowrap; }
.pBest b { font-size: 20px; font-weight: 900; display: inline-block; min-width: 24px; text-align: right; }
.pScoreBox { position: relative; flex: 0 0 auto; display: flex; align-items: baseline; gap: 4px; font-size: 18px; }
.pScoreBox b { font-size: 38px; font-weight: 900; line-height: 1; min-width: 46px; text-align: right; display: inline-block; }
.pScoreBox::before, .pScoreBox::after { content: ""; position: absolute; right: -8px; top: -14px; width: 32px; height: 32px; background: #ffc400; pointer-events: none; opacity: 0;
    -webkit-clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
.pScoreBox::after { right: auto; left: -6px; top: auto; bottom: -6px; width: 18px; height: 18px; }
.pScoreBox.shine::before { animation: kira .65s ease-out; }
.pScoreBox.shine::after { animation: kira .65s ease-out .12s; }
.pScoreBox.shine b { animation: kiraB .65s ease-out; }
@keyframes kira { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 35% { transform: scale(1.25) rotate(0deg); opacity: 1; } 100% { transform: scale(0) rotate(20deg); opacity: 0; } }
@keyframes kiraB { 0% { transform: scale(1); } 30% { transform: scale(1.35); color: #d98a00; text-shadow: 0 0 10px #ffe36e, 0 0 3px #fff; } 100% { transform: scale(1); } }
#pTime, #pScore, #pBest { font-variant-numeric: tabular-nums; }
.coin { position: absolute; left: 0; top: 0; width: 96px; height: 96px; margin: -48px 0 0 -48px; z-index: 60; pointer-events: none; opacity: 0;
    background: center / contain no-repeat; }

/* カード：紙の あつみ・うちがわの わく・少しの かたむき。めくると うらの 円の 図が 出る */
.body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 8px 24px 16px; }
.board { flex: 1 1 0; align-self: stretch; display: grid; justify-content: center; align-content: center; gap: 18px 20px; }
/* 手もとの 帯：左に レベル（あと 何回で 上がるか）、まん中に 大きな OK、右に 最高点。
   （.ok-side は 右がわに たてに ならべる 形。今は つかって いない） */
.ctl { flex: 0 0 76px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
.lvBox { justify-self: start; display: flex; align-items: center; gap: 14px; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 9px 16px 10px; line-height: 1; white-space: nowrap; }
.lvT { font-size: 17px; font-weight: 700; }
.lvT b { font-size: 26px; font-weight: 900; color: var(--main); margin-left: 6px; }
/* まるの 数＝この レベルで そろえる 回数。そろえるたびに 青く なる。全部 青で レベルアップ */
.lvP { display: flex; gap: 6px; }
.lvP:empty { display: none; }
.lvP i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #9fb2cc; background: #fff; display: block; flex: 0 0 auto; }
.lvP i.on { background: var(--main); border-color: var(--mainD); }
.lvP i.hit { animation: pipHit .4s cubic-bezier(.3,1.8,.5,1); }
.lvP i.new { animation: pipIn .3s cubic-bezier(.3,1.8,.5,1) both; }
@keyframes pipHit { 0% { transform: scale(.4); } 60% { transform: scale(1.5); } 100% { transform: scale(1); } }
@keyframes pipIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.ctl .pBest { justify-self: end; }
#okBtn { width: 340px; height: 68px; border-radius: 22px; font-size: 38px; }
.ok-side .body { flex-direction: row; gap: 18px; padding: 10px 24px 18px; }
.ok-side .ctl { flex: 0 0 132px; grid-template-columns: auto; grid-template-rows: 1fr auto 1fr; justify-items: center; gap: 14px; }
.ok-side .lvBox { justify-self: center; align-self: start; flex-direction: column; gap: 8px; }
.ok-side .ctl .pBest { justify-self: center; align-self: end; }
.ok-side #okBtn { width: 130px; height: 156px; border-radius: 30px; font-size: 44px; }
.okBtn { width: 124px; height: 124px; border-radius: 30px; background: #c9d3e0; color: #fff; border: 4px solid #fff; box-shadow: 0 7px 0 #a9b6c8; font-family: "Zen Maru Gothic", sans-serif; font-size: 44px; font-weight: 900;
    letter-spacing: 2px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; }
.okBtn.on { background: #2fae6e; box-shadow: 0 7px 0 #1c7a4a, 0 0 0 6px rgba(47,174,110,.25); animation: okPop .3s cubic-bezier(.3,1.8,.5,1); }
.okBtn.on:active { transform: translateY(5px); box-shadow: 0 2px 0 #1c7a4a; }
@keyframes okPop { 0% { transform: scale(.85); } 100% { transform: scale(1); } }
/* レベルアップの 知らせ：カードの 上に うすい まくを かけて、まん中に 大きく 出す。出て いる あいだは 時間が 止まる */
#lvUp { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; display: none; align-items: center; justify-content: center; background: rgba(233,239,246,.8); z-index: 40; }
#lvUp.show { display: flex; }
.luBox { padding: 22px 56px 26px; border-radius: 34px; background: var(--main); color: #fff; border: 6px solid #fff; box-shadow: 0 12px 30px rgba(34,49,74,.4); text-align: center; white-space: nowrap; line-height: 1;
    animation: luPop .45s cubic-bezier(.3,1.6,.5,1) both; }
.lu1 { font-size: 34px; font-weight: 900; letter-spacing: 3px; color: #ffe37a; }
.lu2 { font-size: 62px; font-weight: 900; letter-spacing: 2px; margin-top: 14px; }
.lu2 b { font-size: 1.5em; font-weight: 900; margin-left: 14px; }
.lu3 { display: inline-block; font-size: 30px; font-weight: 900; margin-top: 18px; background: #fff; color: #1c7a4a; border-radius: 20px; padding: 7px 22px 9px; opacity: 0; }
.lu3.on { animation: luTime .5s cubic-bezier(.3,1.8,.5,1) both; }
/* 「+10秒」が 上の 時間の バーへ とんで いく */
.luFly { position: absolute; left: 0; top: 0; z-index: 70; pointer-events: none; font-size: 30px; font-weight: 900; line-height: 1; white-space: nowrap; background: #fff; color: #1c7a4a; border: 3px solid #f5b400; border-radius: 20px; padding: 7px 22px 9px; box-shadow: 0 6px 14px rgba(34,49,74,.3); }
@keyframes luPop { 0% { opacity: 0; transform: scale(.5); } 100% { opacity: 1; transform: scale(1); } }
@keyframes luTime { 0% { opacity: 0; transform: scale(.4); } 100% { opacity: 1; transform: scale(1); } }
/* ふえた 時間が「にゅーん」と のびる */
#pBar.gain { transition: width .9s cubic-bezier(.2,1.5,.4,1); background: #f5b400; box-shadow: 0 0 0 3px rgba(245,180,0,.35); }

.pc { position: relative; background: none; padding: 0; perspective: 900px; min-width: 0; min-height: 0; }
.pin { position: absolute; inset: 0; display: block; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .38s cubic-bezier(.4,.1,.3,1);
    transform: rotate(var(--tilt, 0deg)); }
.pc.rev .pin { transform: rotate(var(--tilt, 0deg)) rotateY(180deg); }
.pc.back .pin { transition-duration: .9s; transition-timing-function: ease-in-out; }   /* もどす ときは ゆっくり */
.pf, .pb { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #fff; box-shadow: 0 5px 0 #b3c1d4, 0 10px 14px rgba(34,49,74,.18);
    font-size: 76px; font-weight: 500; line-height: 1; white-space: nowrap; color: var(--ink); }
.pf::before, .pb::before { content: ""; position: absolute; inset: 9px; border: 2.5px solid #dde5ef; border-radius: 11px; }

#pBoard .pf, #pBoard .pb { font-size: var(--fs, 76px); }

/* そろって いる カード（OKを おすか、3枚目を さがす） */
.pc.hit .pb { box-shadow: 0 5px 0 #2fae6e, 0 10px 14px rgba(34,49,74,.18); }

.pc.ng .pb::before { border-color: #f3a8ae; }

.pc.empty { visibility: hidden; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

<body>
<div id="app">

<!-- ホーム -->

    <button id="sndBtn" class="pill">音 あり</button>
    <h1 class="logo"><b>分数</b>あわせ<span class="sr-only"> 分数・小数の大きさをくらべる算数の学習アプリ</span></h1>

        <button class="lv" data-lv="2" style="--c:#f28c1e;--d:#b85f06"><span class="ln">ステージ2</span><span class="ld">分数、小数</span><span class="lb">最高 <b class="bs">0</b>点<span class="ll">レベル<b class="bl">1</b></span></span></button>
        <button class="lv" data-lv="3" style="--c:#e04a86;--d:#a82a5e"><span class="ln">ステージ3</span><span class="ld">分数、小数、1より大きい数</span><span class="lb">最高 <b class="bs">0</b>点<span class="ll">レベル<b class="bl">1</b></span></span></button>
    </div>

</section>

<div id="dlg"><div id="dlgBox"><h3 id="dlgT"></h3><div id="dlgB"></div><div id="dlgN"></div></div></div>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const gcd = (a, b) => b ? gcd(b, a % b) : a;

/* ===== ほぞん ===== */
let S = { sound: true, bestL: [0, 0, 0], bestLv: [0, 0, 0], w: {}, rec: [] };   // bestL＝ステージごとの 最高点、bestLv＝その ときの レベル（7＝MAX）
try { S = Object.assign(S, JSON.parse(localStorage.getItem('bunsuuawase.v1') || '{}') || {}); } catch (e) {}
if (!S.w || typeof S.w !== 'object') S.w = {};
if (!Array.isArray(S.rec)) S.rec = [];
['bestL', 'bestLv'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; for (let i = 0; i < 3; i++) S[k][i] = +S[k][i] || 0; });
function save() { try { localStorage.setItem('bunsuuawase.v1', JSON.stringify(S)); } catch (e) {} }
// にがてな カードの きろく。カードごとに -4（にがて）〜 +5（とくい）
function wAdj(k, d) { S.w[k] = Math.max(-4, Math.min(5, (S.w[k] || 0) + d)); save(); }

/* ===== カードに する 数 =====
   kind：f＝分数（真分数・仮分数）、m＝帯分数、d＝小数、w＝整数
   v：大きさ（約分した 形の 文字）。v が 同じ カードどうしが そろう
   lvl：ステージ1で 何レベルから 出るか（1〜7）。分母が 小さい ものから
   lv2：ステージ2・3（小数が まざる）で 何レベルから 出るか。小数と くらべやすい ものから 出す：
        ① 小数と 分母10の 分数（0.5 と 5/10）→ ② 約分した 2分の・5分の（0.5 と 1/2、0.2 と 1/5）→ ③ ほかの 分母8まで → 分母12 → 16 → 20
        1より 大きい 数は ① 分母4までの 仮分数と 帯分数 → ③ 小数と 分母10（1.3 と 13/10）→ ④ 分母5・6 → ⑤ 分母8 */
const REPS = [], BYV = {};
(function () {
    const D_BIG = [2, 3, 4, 5, 6, 8, 10];   // 1以上の 数に つかう 分母
    const LB = d => d <= 4 ? 1 : d === 10 ? 3 : d <= 6 ? 4 : 5;   // 1より 大きい 数：分母4まで→10→5・6→8 の じゅんに 出る
    // ステージ1：① 分子が 1の 分数（2分の1〜6分の1）と 同じ 大きさ（分母12まで）。3種類だけだと、新しく 出た カードどうしが かならず そろって しまうので 5種類に する
    //            → ② 3分の2・4分の3 なども（分母8まで）→ ③ 分母10 → ④ 分母12 → ⑥ 16 → ⑦ 20
    const L1 = (n, d) => { const g = gcd(n, d); return n / g === 1 && d / g <= 6 && d <= 12 ? 1 : d <= 8 ? 2 : d <= 10 ? 3 : d <= 12 ? 4 : d <= 16 ? 6 : 7; };
    const L2 = (n, d) => d === 10 ? 1 : gcd(n, d) === 1 && (d === 2 || d === 5) ? 2 : d <= 8 ? 3 : d <= 12 ? 4 : d <= 16 ? 6 : 7;
    const add = (kind, p, q, o) => { const g = gcd(p, q); REPS.push(Object.assign({ kind, v: (p / g) + '/' + (q / g), big: p > q }, o)); };
    for (let d = 2; d <= 20; d++) for (let n = 1; n < d; n++)
        add('f', n, d, { k: 'f' + n + '_' + d, n, d, say: d + '分の' + n, lvl: L1(n, d), lv2: L2(n, d) });
    D_BIG.forEach(d => {
        add('f', d, d, { k: 'f' + d + '_' + d, n: d, d, say: d + '分の' + d, lvl: 3 });
        for (let n = d + 1; n <= 2 * d; n++) add('f', n, d, { k: 'f' + n + '_' + d, n, d, say: d + '分の' + n, lvl: n === 2 * d ? Math.max(3, LB(d)) : LB(d) });
        for (let n = 1; n < d; n++) add('m', d + n, d, { k: 'm1_' + n + '_' + d, w: 1, n, d, say: '1と' + d + '分の' + n, lvl: LB(d) });
    });
    for (let t = 1; t <= 19; t++) if (t !== 10) add('d', t, 10, { k: 'd' + t, t, say: Math.floor(t / 10) + '.' + (t % 10), lvl: t < 10 ? 1 : 3 });
    add('w', 1, 1, { k: 'w1', w: 1, say: '1', lvl: 3 });
    add('w', 2, 1, { k: 'w2', w: 2, say: '2', lvl: 3 });
    REPS.forEach(r => (BYV[r.v] = BYV[r.v] || []).push(r));
    // 同じ 大きさの カードが ほかに ない 数（11分の1 など）は つかわない
    for (let i = REPS.length - 1; i >= 0; i--) if (BYV[REPS[i].v].length < 2) { delete BYV[REPS[i].v]; REPS.splice(i, 1); }
})();

/* ===== 数の 書き方と、うらの 円の 図 ===== */
const frH = (n, d) => '<span class="fr"><i>' + n + '</i><i>' + d + '</i></span>';
function repHTML(r) {
    if (r.kind === 'd') return '<span class="nb">' + Math.floor(r.t / 10) + '<em class="dp"></em>' + (r.t % 10) + '</span>';
    if (r.kind === 'w') return '<span class="nb">' + r.w + '</span>';
    if (r.kind === 'm') return '<span class="mx"><b>' + r.w + '</b>' + frH(r.n, r.d) + '</span>';
    return frH(r.n, r.d);
}
// 円 1つ分： [ぬる 数, 切る 数]。切る 数が 0 なら、切らない まるごと 1つ
function pies(r) {
    if (r.kind === 'w') return Array(r.w).fill([1, 0]);
    if (r.kind === 'd') return r.t >= 10 ? [[1, 0], [r.t - 10, 10]] : [[r.t, 10]];
    if (r.kind === 'm') return [[1, 0], [r.n, r.d]];
    const a = []; let n = r.n; while (n > 0) { a.push([Math.min(n, r.d), r.d]); n -= r.d; } return a;
}
const PR = 45;
function pt(cx, a, rr) { const t = (a - .25) * 2 * Math.PI; return (cx + rr * Math.cos(t)).toFixed(2) + ' ' + (50 + rr * Math.sin(t)).toFixed(2); }
function sector(cx, f, rr, col) {   // 真上から 右まわりに f（0〜1）だけ ぬる
    if (f >= 1) return '<circle cx="' + cx + '" cy="50" r="' + rr + '" fill="' + col + '"/>';
    return '<path d="M' + cx + ' 50L' + pt(cx, 0, rr) + 'A' + rr + ' ' + rr + ' 0 ' + (f > .5 ? 1 : 0) + ' 1 ' + pt(cx, f, rr) + 'Z" fill="' + col + '"/>';
}
function pieSVG(cx, n, d) {
    const f = d ? n / d : 1; let s = '<circle cx="' + cx + '" cy="50" r="' + PR + '" fill="#fff"/>';
    if (f > 0) s += sector(cx, f, PR, '#de8a12') + sector(cx, f, PR - 5, '#f8b62d');
    if (d > 1) for (let i = 0; i < d; i++) s += '<path d="M' + cx + ' 50L' + pt(cx, i / d, PR) + '" stroke="#22314a" stroke-width="' + (d > 12 ? 1.4 : d > 8 ? 1.8 : 2.2) + '" stroke-linecap="round"/>';
    return s + '<circle cx="' + cx + '" cy="50" r="' + PR + '" fill="none" stroke="#22314a" stroke-width="3"/>';
}
// two＝円 2つ分の はばで かく（くらべる 2枚の 円が 同じ 大きさに なるように）
function pizzaSVG(r, two) {
    const ps = pies(r), W = two ? 204 : 100;
    const xs = ps.length === 2 ? [50, 154] : [W / 2];
    return '<svg viewBox="0 0 ' + W + ' 100" aria-hidden="true">' + ps.map((p, i) => pieSVG(xs[i], p[0], p[1])).join('') + '</svg>';
}

/* ===== 音 ===== */
let AC = null;
function unlockAudio() {
    try {
        if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C();
            const b = AC.createBuffer(1, 1, AC.sampleRate), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0); }
        if (AC.state !== 'running') AC.resume();
    } catch (e) {}
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, unlockAudio, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC) { try { AC.resume(); } catch (e) {} } });
function tone(f, dur, type, vol, at) {
    if (!S.sound || !AC || AC.state !== 'running') return;
    try { const t = AC.currentTime + (at || 0), o = AC.createOscillator(), g = AC.createGain();
        o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
        o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .02); } catch (e) {}
}
const snd = {
    flip() { tone(520, .07, 'triangle', .12); },
    key() { tone(660, .04, 'triangle', .08); },
    ok() { tone(880, .1, 'sine', .15); tone(1320, .16, 'sine', .15, .09); },
    ng() { tone(180, .22, 'square', .07); },
    fin() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, 'triangle', .15, i * .12)); }
};

/* ===== 画面の 切りかえ ===== */
let timers = [], ivs = [], cur = 'home';
const T = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
const IV = (fn, ms) => { const id = setInterval(fn, ms); ivs.push(id); return id; };
function cancelAll() { timers.forEach(clearTimeout); ivs.forEach(clearInterval); timers = []; ivs = []; }
function go(name) {
    cancelAll(); hideDlg(); P.run = false; okOn(false); $('lvUp').classList.remove('show'); $('pBar').classList.remove('gain'); $('pTime').classList.remove('gain'); document.querySelectorAll('.luFly, .tPop').forEach(e => e.remove()); document.querySelectorAll('.coin').forEach(c => c.remove());
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + name));
    cur = name;
    document.documentElement.classList.toggle('home', name === 'home');
    if (name === 'home') { homeRefresh(); demoStart(); }
}
function showDlg(title, html, btns) {
    $('dlgT').textContent = title; $('dlgB').innerHTML = html; const n = $('dlgN'); n.innerHTML = '';
    btns.forEach(b => { const e = document.createElement('button'); e.className = 'btn' + (b.go ? ' go' : ''); e.textContent = b.t; e.onclick = b.fn; n.appendChild(e); });
    $('dlg').classList.add('on');
}
function hideDlg() { $('dlg').classList.remove('on'); }
function anim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    el._an = el._an || {}; clearTimeout(el._an[cls]); el._an[cls] = setTimeout(() => el.classList.remove(cls), 1000); }
function homeRefresh() {
    document.querySelectorAll('.lv').forEach((b, i) => { const lb = b.querySelector('.lb'), v = S.bestLv[i]; lb.querySelector('.bs').textContent = S.bestL[i]; lb.style.visibility = S.bestL[i] ? 'visible' : 'hidden';
        lb.querySelector('.bl').textContent = v >= P_TOP ? 'MAX' : v; lb.querySelector('.ll').hidden = !v; });
    $('sndBtn').textContent = S.sound ? '音 あり' : '音 なし';
}
$('sndBtn').onclick = () => { S.sound = !S.sound; save(); homeRefresh(); if (S.sound) { unlockAudio(); snd.ok(); } };
document.querySelectorAll('.lv').forEach(b => b.onclick = () => { go('pair'); pairStart(+b.dataset.lv); });
$('backBtn').onclick = () => go('home');
// ホームの 見本：これを 見るだけで 遊び方が 分かるように、本物と 同じ 流れを ゆっくり くり返す（ホームを はなれたら 止まる）
//  ① 3枚の うち 2枚だけ そろう → ぎんの コイン。そろわなかった 1枚は のこる

}
function pairHud() {

}
function pairDraw(news) {

        b.className = 'pc' + (c ? '' : ' empty');
        b.innerHTML = c ? '<span class="pin"><span class="pf">' + repHTML(c) + '</span><span class="pb"></span></span>' : '';

// コイン（1＝ぎん、3＝きん）が カードの 上で 回りながら はねて、きえる
function coinFly(host, card, pts, delay, done) {

    const fin = () => { if (!c.parentNode) return; c.remove(); done(); };

    const o = c.offsetParent.getBoundingClientRect(), s = o.width / c.offsetParent.offsetWidth || 1;
    const r = card.getBoundingClientRect(), x = (r.left + r.width / 2 - o.left) / s, y = (r.top + r.height / 2 - o.top) / s;
    const H = pts === 3 ? Math.min(165, r.height / s * 1.1) : Math.min(82, r.height / s * .55), N = 48, kf = [], spin = pts === 3 ? 9 : 6;
    for (let k = 0; k <= N; k++) { const t = k / N;
        kf.push({ transform: 'translate(' + x + 'px,' + (y - H * 4 * t * (1 - t)).toFixed(1) + 'px) scaleX(' + Math.max(.07, Math.abs(Math.cos(Math.PI * spin * t))).toFixed(3) + ')', opacity: t < .06 ? t / .06 : t > .9 ? (1 - t) / .1 : 1, offset: t }); }

// あたった とき：2枚目の カードの 上で コインが 回る。きえた とき 点が ふえて キラリと 光る
function pCoin(card, pts, delay) {
    coinFly($('s-pair'), card, pts, delay, () => { if (cur !== 'pair') return;
        P.pend = Math.max(0, (P.pend || 0) - pts); pairHud(); anim($('pScore').parentNode, 'shine'); tone(pts === 3 ? 2093 : 1568, .09, 'triangle', .1, 0); });
}
const pShow = (b, c, two) => { const pb = b.querySelector('.pb'); pb.classList.toggle('two', two); pb.innerHTML = pizzaSVG(c, two) + '<small>' + repHTML(c) + '</small>'; };
// そろえた 回数が たまったら レベルを 上げて、カードの 場所を ふやす
function pGrow() {
    const por = $('app').classList.contains('is-portrait'), n0 = P.cards.length, c0 = P_COLS(por);
    let up = false; while (P.level < P_TOP && P.hits >= P_UP[P.level]) { P.level++; up = true; }
    while (P.cards.length < P_N[P.level - 1]) P.cards.push(null);
    P.re = P.cards.length !== n0 || P_COLS(por) !== c0;   // 枚数か ならべ方が かわったか
    return up;
}
// あいた 場所に カードを 出す。レベルアップで 枚数や ならび方が かわる ときは、同じ 大きさが となりに ならないよう 全部 ならべ直す
function pDeal(up) {
    const news = pFill(); if (!up || !P.re) return news;
    let best = P.cards.slice(), bn = pAdjCount();
    for (let t = 0; t < 400 && bn > 0; t++) { shuffle(P.cards); const n = pAdjCount(); if (n < bn) { bn = n; best = P.cards.slice(); } }
    P.cards = best; return P.cards.map((c, i) => i);
}
// そろった カード（2枚＝1点、3枚＝3点）を とって、新しい カードを 出す。そろえた 回数で レベルが 上がる
function pAward(ids, pts, delay) {
    const bs = $('pBoard').children; P.open = []; okOn(false); P.lock = true;
    P.tok = (P.tok || 0) + 1; P.w3 = false; if (P.hold) { P.hold = false; P.last = performance.now(); }
    ids.forEach(k => pMark(P.cards[k], true)); P.hits++;
    const gain = pGain(pts); P.score += pts; P.time = Math.min(P_MAX, P.time + gain); tPop(gain); snd.ok(); if (pts === 3) tone(1760, .2, 'sine', .13, .2);
    P.pend += pts; pairHud(); pCoin(bs[ids[ids.length - 1]], pts, delay);
    T(() => {
        ids.forEach(k => P.cards[k] = null); P.lock = false; if (!P.run) return;
        const up = pGrow();
        if (up) { pLayout(); P.pipHold = true; }   // 手もとの まるは、知らせが きえてから 新しい レベルの ものに かえる
        pairDraw(pDeal(up));
        if (up) pLevelUp();

}
// レベルアップの 知らせ：「レベルアップ！ レベル〇」を 大きく 出し、その あいだは 時間を 止めて カードも おせない。
// とちゅうで、ごほうびの 時間が 上の バーに「にゅーん」と のびて 入る
function pLevelUp() {

    P.hold = true; P.lock = true;
    $('luN').textContent = pLvName(); lt.textContent = '+' + P_LVUP + '秒'; lt.classList.remove('on'); lt.style.visibility = '';
    lu.classList.remove('show'); void lu.offsetWidth; lu.classList.add('show');
    [784, 988, 1175, 1568].forEach((f, i) => tone(f, .16, 'triangle', .13, i * .08));
    T(() => lt.classList.add('on'), 600);
    // 「+10秒」が バーの 先へ とんで いき、ついたら バーが のびる
    const gain = () => { bar.classList.add('gain'); tm.classList.add('gain'); P.time = Math.min(P_MAX, P.time + P_LVUP); pairHud(); tone(1319, .5, 'sine', .12, 0); tone(1760, .45, 'sine', .1, .12); };
    T(() => {
        const f = document.createElement('div'); f.className = 'luFly'; f.textContent = lt.textContent; host.appendChild(f);
        if (!f.animate) { f.remove(); gain(); return; }
        const o = host.getBoundingClientRect(), s = o.width / host.offsetWidth || 1, a = lt.getBoundingClientRect(), b = bar.getBoundingClientRect();
        const x0 = (a.left + a.width / 2 - o.left) / s, y0 = (a.top + a.height / 2 - o.top) / s, x1 = (b.right - o.left) / s, y1 = (b.top + b.height / 2 - o.top) / s;
        const at = (x, y, k) => 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,-50%) scale(' + k + ')';
        lt.style.visibility = 'hidden'; tone(1047, .12, 'triangle', .09, 0);
        f.animate([{ transform: at(x0, y0, 1) }, { transform: at((x0 + x1) / 2, (y0 + y1) / 2 - 30, 1.15), offset: .45 }, { transform: at(x1, y1, .5) }], { duration: 600, easing: 'ease-in', fill: 'forwards' });
        T(() => { f.remove(); gain(); }, 610);
    }, 1300);
    T(() => { lu.classList.remove('show'); bar.classList.remove('gain'); tm.classList.remove('gain'); lt.style.visibility = '';
        P.hold = false; P.lock = false; P.last = performance.now(); P.pipHold = false; pPips(true); }, 3100);
}
// OK：2枚 そろって いる とき。3枚目を まちがえて 赤く なって いる あいだも おせる
$('okBtn').onclick = () => { if (P.run && (!P.lock || P.w3) && P.open.length === 2) pAward(P.open, 1, 0); };
function pairTap(i) {
    if (!P.run || P.lock || !P.cards[i]) return;
    const bs = $('pBoard').children, c = P.cards[i];
    // めくった カードを もう一度 おすと、もどせる（やめたい とき）。2枚 そろって いる ときに 1枚 もどすと、OKは おせなく なる
    if (P.open.includes(i)) {
        if (performance.now() - (c.ft || 0) < 450) return;   // めくって すぐの 2回目（うっかり 2回 おした）は もどさない
        // もどす ときは ゆっくり うらがえり、その あいだ（1秒）は ほかの カードを おせない。時間は 進むので、図だけ 見て まわると そんに なる
        P.open = P.open.filter(k => k !== i); bs[i].classList.add('back'); bs[i].classList.remove('rev', 'hit'); P.open.forEach(k => bs[k].classList.remove('hit')); okOn(false); snd.key();
        P.lock = true; const tk = P.tok; T(() => { bs[i].classList.remove('back'); if (P.tok === tk) P.lock = false; }, P_BACK); return;
    }
    // おした カードは すぐ めくれて、うらの 円の 図が 見える
    // くらべやすいように、めくれて いる カードの 円は いつも 同じ 大きさで かく（大きさが かわる ときは かき直す）
    const two = P.open.concat(i).some(k => pies(P.cards[k]).length === 2);
    if (P.open.length && two !== P.two) P.open.forEach(k => pShow(bs[k], P.cards[k], two));
    P.two = two; pShow(bs[i], c, two); bs[i].className = 'pc rev'; c.ft = performance.now(); snd.flip();

        if (P.open.length === 2) { okOn(true); tone(990, .08, 'triangle', .1, .12); } else pAward(P.open, 3, 350);

    // ちがう カード：2枚目なら 2枚とも、3枚目なら その 3枚目だけが 赤く なって もどる（そろって いる 2枚は そのまま。OKを おせば 1点）

    ids.forEach(k => { bs[k].classList.remove('hit'); bs[k].classList.add('ng'); });
    pairHud();
    const tok = P.tok = (P.tok || 0) + 1;   // 赤い あいだに OKを おされたら、下の「もどす」は 見た目だけに する
    // 赤い あいだに OKで 次の カードが 出て、その カードを もう めくって いる ときは、うらがえさない
    T(() => { ids.forEach(k => { bs[k].classList.remove('ng'); if (!P.open.includes(k)) bs[k].classList.remove('rev'); }); if (P.tok !== tok) return;
        P.lock = false; P.w3 = false; if (P.time <= 0) pairEnd(); }, 1900);
}
document.addEventListener('keydown', e => { if (cur === 'pair' && (e.key === 'Enter' || e.key === ' ') && !$('okBtn').disabled) { e.preventDefault(); $('okBtn').click(); } });
function pairEnd() {
    if (!P.run) return;
    if (P.open.length === 2 && !$('okBtn').disabled) P.score += 1;   // 2枚 そろえて OKを おす前に 時間ぎれ：その 1点は 入れる
    okOn(false);
    P.run = false; P.pend = 0; document.querySelectorAll('.coin').forEach(c => c.remove()); pairHud(); const L = P.lv - 1, rec = P.score > S.bestL[L];

    snd.fin();
    showDlg(rec ? '新記録！' : '終わり！', '<b>' + P.score + '<u>点</u></b><span class="hs">ステージ' + P.lv + '　レベル' + pLvName() + '　最高<b>' + S.bestL[L] + '</b>点</span>', [
        { t: 'もう一度', go: 1, fn: () => pairStart() }, { t: '終わる', fn: () => go('home') }]);

/* ===== 画面の 大きさに 合わせる・かってな 拡大を ふせぐ ===== */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
function resetZoomIfNeeded() {

}
function safeInsets() {
    let p = $('safeProbe');

        p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
            'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
        document.body.appendChild(p); }

}
function fit() {

}
['resize', 'pageshow', 'load'].forEach(t => window.addEventListener(t, fit));
window.addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) {

}
