    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        :root {
            --bg: #fdf3e1;
            --paper: #fffdf8;
            --ink: #3d3346;
            --sub: #7a6f7f;
            --red: #e04a3a;
            --red-dark: #b8382b;
            --blue: #2f6fd6;
            --green: #23a26a;
            --yellow: #ffd257;
            --line: #efe2cc;
            --app-h: 100vh; --vh: 1vh; --vw: 1vw; --b: 1; --bq: 1;
        }
        @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
        [hidden] { display: none !important; }
        .nw { white-space: nowrap; }
        html {
            background: var(--bg);
            -webkit-text-size-adjust: 100%;
        }
        body {
            margin: 0;
            min-height: var(--app-h);
            background:
                radial-gradient(circle at 12% 8%, #ffe9c2 0 90px, transparent 91px),
                radial-gradient(circle at 92% 30%, #ffe2d6 0 70px, transparent 71px),
                var(--bg);
            color: var(--ink);
            font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
            font-weight: 500;
            line-height: 1.7;
            overscroll-behavior-y: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #app {
            visibility: hidden;
            max-width: 560px;
            margin: 0 auto;
            padding: max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
        }
        html.fonts-ready #app { visibility: visible; }

        .app-title {
            margin: 4px 0 12px;
            text-align: center;
            font-size: clamp(22px, 6.4vw, 30px);
            font-weight: 900;
            letter-spacing: .06em;
            color: var(--red);
            line-height: 1.3;
        }
        .app-title small {
            display: block;
            font-size: clamp(11px, 3vw, 13px);
            font-weight: 700;
            letter-spacing: .1em;
            color: var(--sub);
        }

        /* ===== 日めくり ===== */
        .calpage-wrap { position: relative; padding-top: 12px; }
        .rings {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: center; gap: 46%;
            z-index: 2; pointer-events: none;
        }
        .rings span {
            width: 14px; height: 30px; border-radius: 8px;
            background: linear-gradient(#6b6070, #3f3645);
            box-shadow: 0 2px 0 rgba(0,0,0,.15);
        }
        .calpage {
            position: relative;
            display: block;
            width: 100%;
            margin: 0;
            padding: 0 0 14px;
            border: 0;
            border-radius: 22px;
            background: var(--paper);
            box-shadow: 0 6px 0 #ead8bb, 0 10px 24px rgba(120, 80, 30, .12);
            overflow: hidden;
            text-align: center;
            font: inherit;
            color: inherit;
            cursor: pointer;
            -webkit-appearance: none; appearance: none;
            touch-action: pan-y;
        }
        .cp-head {
            display: flex; justify-content: center; align-items: baseline; gap: .5em;
            padding: 22px 12px 8px;
            background: var(--red);
            color: #fff;
            font-weight: 900;
            font-size: clamp(17px, 4.8vw, 22px);
            letter-spacing: .08em;
            line-height: 1.2;
        }
        .cp-head .cp-month { font-size: 1.35em; }
        /* ===== 数字（PDFのフォントをトレースしたSVG） ===== */
        .cp-head .tn { --sw: 10; }
        .tn { --u: calc(.78em / 111); display: inline-block; white-space: nowrap; line-height: 1; }
        .tg { display: inline-block; height: calc(111 * var(--u)); vertical-align: calc(-4 * var(--u)); fill: currentColor; stroke: currentColor; stroke-width: var(--sw, 9); stroke-linejoin: round; stroke-linecap: round; overflow: visible; }
        .tg.colon { transition: opacity .12s; }
        .tg.colon.off { opacity: .16; }
        .cp-head .cp-kyu { font-size: .95em; font-weight: 900; letter-spacing: .04em; }
        .cp-head .cp-kyu ruby { ruby-position: over; }
        .cp-head .cp-kyu rt { font-size: .7em; font-weight: 700; letter-spacing: .02em; line-height: 1.1; }
        .cp-head { flex-wrap: wrap; row-gap: 0; }
        .cp-yomi { font-size: clamp(15px, 4.4vw, 22px); font-weight: 700; letter-spacing: .08em; color: var(--sub); line-height: 1.2; }
        .cp-yomi { margin-bottom: calc(var(--dfs) * -.1); position: relative; z-index: 1; }
        .cp-num { display: inline-flex; align-items: flex-end; justify-content: center; }
        .cp-nichi { font-size: .27em; font-weight: 900; margin-left: .08em; padding-bottom: .1em; }
        .calpage.sun .cp-yomi { color: var(--red-dark); }
        .calpage.sat .cp-yomi { color: #1f56b0; }
        .clock {
            margin: 4px 0 0; padding: 0 4px;
            background: none; box-shadow: none; color: var(--ink);
            text-align: center; display: flex; flex-direction: column; justify-content: center;
        }
        .clock-time {
            font-family: "Zen Maru Gothic", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-weight: 900; font-size: clamp(60px, 21vw, 96px); line-height: 1.1; color: var(--ink);
            font-variant-numeric: tabular-nums; letter-spacing: .04em;
        }
                .clock-sub { display: none; }
        .cp-day {
            --dfs: clamp(92px, 30vw, 150px);
            font-size: var(--dfs);
            display: flex; flex-direction: column; align-items: center;
            font-weight: 900;
            line-height: 1;
            margin-top: 10px;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }
        .cp-week {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 18px;
            border-radius: 999px;
            background: #f1ebf3;
            font-weight: 700;
            font-size: clamp(15px, 4.2vw, 18px);
        }
        .calpage.sun .cp-day { color: var(--red); }
        .cp-week .en { font-size: .86em; font-weight: 700; letter-spacing: .04em; margin-left: .25em; opacity: .85; }
        .calpage.sun .cp-week { background: #fde3df; color: var(--red-dark); }
        .calpage.sat .cp-day { color: var(--blue); }
        .calpage.sat .cp-week { background: #dfe9fb; color: #1f56b0; }
        .cp-badge {
            position: absolute; top: 66px; right: 12px;
            padding: 3px 10px;
            border-radius: 10px;
            background: var(--yellow);
            color: #6a4b00;
            font-weight: 900;
            font-size: 13px;
            line-height: 1.4;
            transform: rotate(8deg);
        }
        .cp-hint {
            margin-top: 6px;
            font-size: 12px;
            color: var(--sub);
        }

        /* ===== ナビ ===== */
        .nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 8px;
            margin: 14px 0 6px;
        }
        .btn {
            -webkit-appearance: none; appearance: none;
            margin: 0;
            min-height: 48px;
            padding: 8px 10px;
            border: 0;
            border-radius: 14px;
            font: inherit;
            font-weight: 700;
            font-size: clamp(14px, 4vw, 16px);
            line-height: 1.2;
            cursor: pointer;
            white-space: nowrap;
            transition: transform .08s;
        }
        .btn:active { transform: translateY(2px); }
        .btn-nav { background: #fff; color: var(--ink); box-shadow: 0 3px 0 #e2d2b6; }
        .btn-today { background: var(--red); color: #fff; box-shadow: 0 3px 0 var(--red-dark); padding: 8px 16px; }
        .btn-today:disabled { background: #d9cfc3; box-shadow: 0 3px 0 #bfb3a5; color: #fff; cursor: default; transform: none; }

        /* ===== カード ===== */
        .card.anniv { container-type: inline-size; }
        .card {
            position: relative;
            margin-top: 18px;
            padding: 18px 18px 20px;
            border-radius: 22px;
            background: var(--paper);
            box-shadow: 0 5px 0 #ead8bb, 0 8px 18px rgba(120, 80, 30, .08);
        }
        .card-label {
            display: inline-block;
            margin: 0 0 8px;
            padding: 3px 14px;
            border-radius: 999px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: .05em;
            line-height: 1.5;
        }
        .anniv .card-label { background: #fde3df; color: var(--red-dark); }
        .quiz .card-label { background: #dff3ea; color: #13774b; }
        .ann-name .yomi { font-size: .5em; font-weight: 700; color: var(--sub); }
        .ann-name ruby { ruby-position: over; ruby-align: center; }
        .ann-name rt { font-size: .3em; font-weight: 700; color: var(--sub); letter-spacing: .04em; line-height: 1; padding-bottom: .25em; }
        #memCard .ann-name rt { font-size: .48em; }
        .ann-name .nm { display: inline-block; }
        .ann-name {
            margin: 0;
            font-size: clamp(22px, min(calc(80cqw / var(--n, 8)), 52px), 52px);
            white-space: nowrap;
            text-align: center;
            padding: 10px 0 4px;
            font-weight: 900;
            line-height: 1.3;
            color: var(--ink);
            word-break: auto-phrase;
            text-wrap: balance;
            overflow-wrap: anywhere;
        }
        .mame {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 16px;
            background: #fff6dc;
            border: 2px dashed #f2d27e;
        }
        .mame-tag { font-weight: 900; font-size: 13px; color: #9a6b00; }
        .mame p { margin: 4px 0 0; font-size: clamp(15px, 4.2vw, 17px); }

        .others { margin-top: 14px; }
        .others-title { font-weight: 900; font-size: 13px; color: var(--sub); }
        .others-list { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px 8px; }
        .others-list a {
            display: inline-flex; align-items: center; min-height: 36px; padding: 4px 12px;
            border-radius: 999px; background: #fff6e0; border: 1.5px solid #f1dca8;
            color: #6b4a00; font-size: clamp(13px, 3.6vw, 15px); font-weight: 700; line-height: 1.3;
            text-decoration: none;
        }
        .others-list a:active { background: #ffedc2; }
        .more { margin-top: 12px; display: flex; flex-wrap: nowrap; min-width: 0; align-items: center; gap: 6px 8px; }
        .more-title { font-weight: 700; font-size: 13px; color: var(--sub); margin-right: 2px; white-space: nowrap; flex: 0 0 auto; }
        .more-btn {
            display: inline-flex; align-items: center;
            min-height: 36px; padding: 4px 12px;
            background: transparent; color: #1d5fa8; box-shadow: none;
            border: 1.5px solid #c9dcf0; border-radius: 999px;
            text-decoration: none; white-space: nowrap; text-overflow: ellipsis;
            line-height: 1.3; font-size: 13px; font-weight: 700;
            white-space: nowrap; min-width: 0; flex: 0 1 auto; overflow: hidden;
        }
        @media (max-width: 339px) { .more-title .mt { display: none; } }
        #moreDate, #moreDate2 { flex-shrink: 0; }
        .more-btn:active { transform: none; background: #eef5fc; }
        .more-note { flex-basis: 100%; margin: 2px 0 0; font-size: 11px; line-height: 1.6; color: var(--sub); }

        .q {
            margin: 0 0 12px;
            font-weight: 700;
            font-size: clamp(16px, 4.6vw, 19px);
            line-height: 1.6;
        }
        .q .yr { color: var(--red); font-weight: 900; font-size: 1.15em; }
        .choices { display: flex; flex-direction: column; gap: 10px; }
        .choice {
            -webkit-appearance: none; appearance: none;
            display: flex; align-items: flex-start; gap: 10px;
            width: 100%;
            margin: 0;
            padding: 12px 14px;
            border: 3px solid #e7dccb;
            border-radius: 16px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: clamp(15px, 4.2vw, 17px);
            line-height: 1.55;
            text-align: left;
            cursor: pointer;
            transition: transform .08s, border-color .15s, background-color .15s;
        }
        .choice:active { transform: scale(.985); }
        .choice .mark {
            flex: 0 0 auto;
            display: inline-flex; align-items: center; justify-content: center;
            width: 30px; height: 30px;
            margin-top: -1px;
            border-radius: 50%;
            background: #f1ebf3;
            font-weight: 900;
            font-size: 15px;
            line-height: 1;
        }
        .choice .txt { flex: 1 1 auto; min-width: 0; }
        .choices.done .choice { cursor: default; transform: none; }
        .choice.correct { border-color: var(--green); background: #e5f7ee; }
        .choice.correct .mark { background: var(--green); color: #fff; }
        .choice.wrong { border-color: #e7836f; background: #fdecea; }
        .choice.wrong .mark { background: #e7836f; color: #fff; }
        .choices.done .choice.dim { opacity: .8; }
        .choice .note { display: block; margin-top: 3px; font-size: .78em; font-weight: 700; color: #b0472f; }

        .answer {
            margin-top: 14px;
            padding: 14px;
            border-radius: 16px;
            background: #eef6ff;
            border: 2px solid #cfe0f7;
        }
        .answer .result { font-weight: 900; font-size: clamp(19px, 5.4vw, 23px); line-height: 1.3; }
        .answer .result.ok { color: var(--green); }
        .answer .result.ng { color: var(--red); }
        .answer .when { margin-top: 8px; font-weight: 900; color: #1f56b0; }
        .answer .what { margin: 2px 0 0; font-size: clamp(15px, 4.2vw, 17px); }
        .answer .ago {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 12px;
            border-radius: 999px;
            background: #fff;
            font-weight: 700;
            font-size: 14px;
        }

        .mem { background: #f4f6f9; box-shadow: 0 5px 0 #dde3ec, 0 8px 18px rgba(60, 80, 110, .08); }
        .mem .card-label { background: #e3e9f1; color: #43536b; }
        .mem-body p { margin: 10px 0 0; font-size: clamp(15px, 4.2vw, 17px); line-height: 1.85; color: #3d4654; }
        .q-next { margin-top: 14px; width: 100%; }
        .q-next .cnt { margin-left: 8px; font-size: 13px; color: var(--sub); font-weight: 700; }
        .answer .talk { margin: 10px 0 0; font-size: 13px; color: var(--sub); }
        .q .evq { display: block; margin-top: 6px; font-weight: 900; }

        .footer {
            margin-top: 26px;
            text-align: center;
            font-size: 11px;
            color: #a3988f;
            letter-spacing: .05em;
        }

        /* ===== カレンダー（日にちをえらぶ） ===== */
        .modal {
            position: fixed; inset: 0;
            z-index: 50;
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
            background: rgba(50, 35, 30, .45);
        }
        .sheet {
            width: 100%;
            max-width: 400px;
            max-height: calc(var(--app-h) - 32px);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 14px 14px;
            border-radius: 22px;
            background: var(--paper);
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }
        .pk-head {
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            align-items: center;
            margin-bottom: 8px;
        }
        .pk-title { text-align: center; font-weight: 900; font-size: 19px; }
        .icon-btn {
            position: relative;
            width: 44px; height: 44px;
            margin: 0; padding: 0;
            border: 0; border-radius: 12px;
            -webkit-appearance: none; appearance: none;
            background: #f4ece0;
            color: var(--ink);
            line-height: 0;
            cursor: pointer;
        }
        .icon-btn svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .pk-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .pk-wd { text-align: center; font-size: 12px; font-weight: 700; color: var(--sub); padding: 2px 0; }
        .pk-wd.sun { color: var(--red); } .pk-wd.sat { color: var(--blue); }
        .pk-day {
            -webkit-appearance: none; appearance: none;
            aspect-ratio: 1 / 1;
            width: 100%;
            margin: 0; padding: 0;
            border: 0; border-radius: 12px;
            background: #fff;
            color: var(--ink);
            font: inherit; font-weight: 700; font-size: 16px; line-height: 1;
            cursor: pointer;
        }
        .pk-blank { aspect-ratio: 1 / 1; }
        .pk-day.sun { color: var(--red); } .pk-day.sat { color: var(--blue); }
        .pk-day.today { box-shadow: inset 0 0 0 2px var(--red); }
        .pk-day.sel { background: var(--red); color: #fff; }
        .pk-foot { display: flex; gap: 8px; margin-top: 12px; }
        .pk-foot .btn { flex: 1 1 0; }
        .btn-plain { background: #f4ece0; color: var(--ink); box-shadow: 0 3px 0 #e2d2b6; }

        .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }


        /* ===== パソコン：1画面におさめる3カラム ===== */
        @media (max-width: 899px) {
            .clock { margin: 18px 0 0; }
            /* いちばん下まで一気にスクロールできるように：ゴムのような はねかえりを止め、
               下のツールバーに ver の行が かくれないよう 下に余白をとる */
            html, body { overscroll-behavior-y: none; }
            #app { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 56px); }
        }
        @media (min-width: 900px) {
            html, body { height: var(--app-h); overflow: hidden; }
            body { min-height: 0; display: flex; align-items: center; justify-content: center; }
            #app {
                width: min(var(--iw, 100%), 3200px); max-width: none; flex: 0 0 auto; height: min(var(--app-hz, var(--app-h)), 880px); transform: scale(var(--k, 1)); box-sizing: border-box;
                padding: 16px 28px 10px;
                display: grid;
                grid-template-columns: minmax(280px, 0.8fr) 1fr 1fr;
                grid-template-rows: auto auto auto minmax(0,1fr) auto;
                grid-template-areas:
                    "title ann quiz"
                    "cal   ann quiz"
                    "nav   ann quiz"
                    "clock ann quiz"
                    "foot  foot foot";
                column-gap: 22px; row-gap: 0;
            }
            .app-title { grid-area: title; margin: 0 0 10px; font-size: clamp(24px, calc(4.4 * var(--vh)), 38px); }
            .calpage-wrap { grid-area: cal; }
            .clock { grid-area: clock; margin: 0; }
            .clock-time { font-size: min(calc(15 * var(--vh)), calc(8.4 * var(--vw)), 120px); }
            .clock { padding: 0; }
            .nav { grid-area: nav; margin: 14px 0 0; }
            #annCard { grid-area: ann; display: flex; flex-direction: column; padding: 22px 24px; }
            #quizCard { grid-area: quiz; display: flex; flex-direction: column; }
            #memCard { grid-area: quiz; display: flex; flex-direction: column; padding: 26px 40px; }
            #memCard:not([hidden]) { display: flex; }
            #memCard .ann-name { font-size: calc(clamp(22px, calc(3.6 * var(--vh)), 36px) * var(--f, 1)); line-height: 1.35; white-space: normal; text-align: left; margin: 14px 0 10px; display: block; }
            #memCard .ann-name small.yomi { display: block; font-size: .5em; font-weight: 700; opacity: .75; }
            #memCard .mem-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
            #memCard .mem-body p { font-size: calc(clamp(16px, calc(2.3 * var(--vh)), 22px) * var(--b) * var(--f, 1)); line-height: 1.75; }
            #annCard, #quizCard, #memCard {
                margin: 0; min-height: 0; overflow-y: auto; align-self: stretch;
                max-height: calc(min(var(--app-hz), 880px) - 56px);
            }
            #annCard .card-label, #quizCard .card-label, #memCard .card-label { align-self: flex-start; }
            #annCard .ann-name { font-size: calc(clamp(22px, min(calc(88cqw / var(--n, 8)), calc(11 * var(--vh) * var(--bq) * var(--f, 1)), 130px), 130px) * var(--nf, 1)); margin: auto 0 0; flex: 0 0 auto; transform: translateY(var(--lift, 0px)); display: flex; align-items: center; justify-content: center; padding: clamp(16px, calc(4 * var(--vh)), 44px) 0 clamp(16px, calc(3.4 * var(--vh)), 36px); white-space: nowrap; }
            #annCard .mame { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; padding: clamp(14px, calc(2.4 * var(--vh)), 26px) clamp(18px, calc(2 * var(--vw)), 28px); margin-top: 0; }
            #annCard .mame-tag { font-size: calc(clamp(13px, calc(1.9 * var(--vh)), 16px) * var(--b) * var(--f, 1)); }
            #annCard .mame p { font-size: calc(clamp(17px, calc(3.05 * var(--vh)), 30px) * var(--bq) * var(--f, 1)); line-height: 1.65; margin-top: 8px; }
            #annCard .others { margin-top: 16px; }
            #annCard .others:not([hidden]) { margin-bottom: auto; }
            #annCard .mame { margin-bottom: 0; }
            #annCard .others-title { font-size: calc(clamp(14px, calc(2.1 * var(--vh)), 18px) * var(--b) * var(--f, 1)); }
            #annCard .others-list a { font-size: calc(clamp(15px, calc(2.5 * var(--vh)), 22px) * var(--b) * var(--f, 1)); }
            #annCard .more { margin-top: auto; padding-top: 16px; margin-bottom: 0; }
            #annCard .others[hidden] + .more { margin-top: auto; }
            #quizCard .choices { flex: 1 1 auto; }
            #quizCard .choice { flex: 1 1 auto; align-items: center; }
            .footer { grid-area: foot; margin: 8px 0 0; }
            .cp-head { padding: 28px 12px 6px; }
            .cp-day { --dfs: clamp(80px, calc(19 * var(--vh)), 150px); margin-top: 6px; }
            .cp-yomi { font-size: clamp(14px, calc(2.6 * var(--vh)), 22px); }
            .cp-badge { top: 66px; }
            .btn { min-height: 44px; }
            #quizCard { padding: 14px 20px; }
            #quizCard .q { font-size: calc(clamp(18px, calc(2.6 * var(--vh)), 26px) * var(--bq) * var(--f, 1)); line-height: 1.55; margin: 8px 0 12px; }
            #quizCard .choices { gap: clamp(7px, calc(1.2 * var(--vh)), 12px); }
            #quizCard .choice { padding: clamp(5px, calc(0.7 * var(--vh)), 10px) 16px; font-size: calc(clamp(17px, calc(2.3 * var(--vh)), 23px) * var(--bq) * var(--f, 1)); line-height: 1.5; }
            #quizCard .answer { margin-top: 8px; padding: 8px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; }
            #quizCard .answer .what { display: none; }
            #quizCard .answer .when, #quizCard .answer .ago { margin-top: 0; font-size: calc(clamp(13px, calc(2 * var(--vh)), 17px) * var(--bq) * var(--f, 1)); }
            #quizCard .answer p, #quizCard .answer .what { margin-top: 4px; font-size: calc(clamp(13px, calc(2 * var(--vh)), 16px) * var(--bq) * var(--f, 1)); line-height: 1.55; }
            #quizCard .q-next { margin: 8px 0 0; min-height: 40px; }
            #quizCard .answer .talk { margin-top: 6px; }
        }
        @media (min-width: 900px) {
            .app-title small { font-size: clamp(13px, calc(1.9 * var(--vh)), 17px); }
            .cp-hint { font-size: clamp(13px, calc(1.9 * var(--vh)), 17px); }
            .cp-week { font-size: clamp(18px, calc(3.2 * var(--vh)), 30px); }
            .nav button, .nav .btn { font-size: clamp(16px, calc(2.3 * var(--vh)), 21px); }
            .card-label { font-size: clamp(14px, calc(2.1 * var(--vh)), 18px); }
            .more-title, .more-btn, .q-next { font-size: clamp(14px, calc(2.1 * var(--vh)), 19px); }
            .q-next .cnt { font-size: clamp(14px, calc(2 * var(--vh)), 18px); }
            .footer { font-size: clamp(12px, calc(1.7 * var(--vh)), 15px); }
            #annCard .mame-tag { font-size: calc(clamp(14px, calc(2.1 * var(--vh)), 18px) * var(--b) * var(--f, 1)); }
        }
        @media (min-width: 700px) and (max-width: 899px) {
            #app { padding-top: 28px; }
        }
    </style>

function setAppHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    if (h > 0) {
        const st = document.documentElement.style, w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        // スマホ（たてに スクロールする画面）では、スクロール中に ツールバーが出たり消えたりして 高さだけ変わる。
        // そのたびに 画面を計算しなおすと スクロールが 途中で止まるので、はばが変わったときだけ 計算する
        if (w < 900 && setAppHeight.lastW === w) return;
        setAppHeight.lastW = w;
        st.setProperty('--app-h', `${Math.round(h)}px`);
        const desk = w >= 900;
        const a = w / h, H = Math.max(window.__HMIN || 640, 800 - Math.max(0, a - 1.75) * (window.__HSL || 600));
        const k = desk ? Math.min(w / 1400, h / H) : 1;
        st.setProperty('--k', k.toFixed(4));
        st.setProperty('--iw', desk ? `${(w / k).toFixed(1)}px` : '100%');
        st.setProperty('--app-hz', `${(h / k).toFixed(1)}px`);
        { const iw = Math.min(w / k, 3200), ih = Math.min(h / k, 880); const bb = desk ? Math.min(1.25, Math.max(1, 1 + (iw / ih - 1.75) * 0.25)) : 1; st.setProperty('--b', bb.toFixed(3)); st.setProperty('--bq', (1 + (bb - 1) * 0.4).toFixed(3)); }
        st.setProperty('--vw', desk ? `${(Math.min(w / k, 3200) / 100).toFixed(3)}px` : '1vw');
        st.setProperty('--vh', desk ? `${(Math.min(h / k, 880) / 100).toFixed(3)}px` : '1vh');
    }
}

/* ---------- クイズのえらびかた（日付ごとにいつも同じになるように） ---------- */
function rng(seed) {
    let a = seed >>> 0;
    return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
function shuffle(arr, rand) {   // Fisher-Yates

const isKana = (c) => /[぀-ヿ・ー]/.test(c);
function rubyPair(base, yomi) {
    // かなの部分は そのまま、漢字の部分にだけ 読みをのせる（書き初め → 書[か]き初[ぞ]め）
    const runs = [];
    for (const c of base) {
        const k = isKana(c);
        if (runs.length && runs[runs.length - 1].k === k) runs[runs.length - 1].t += c; else runs.push({ k, t: c });
    }
    const re = new RegExp('^' + runs.map(r => r.k ? r.t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : '(.+?)').join('') + '$');
    const m = yomi.match(re);
    if (!m) return null;

    return runs.map(r => r.k ? esc(r.t) : `<ruby>${esc(r.t)}<rt>${esc(m[i++])}</rt></ruby>`).join('');

function withRuby(name) {
    let html = '';

    parts.forEach((part, idx) => {
        const mm = part.match(/^（([^）]*)）$/);
        const nextIsParen = (parts[idx + 1] || '').startsWith('（');
        if (!mm) { if (!nextIsParen) html += esc(part); return; }
        const prev = parts[idx - 1] || '', yomi = mm[1];
        if (!/^[぀-ヿ・ー]+$/.test(yomi)) { html += esc(prev) + `<small class="yomi">（${esc(yomi)}）</small>`; return; }
        const skip = RUBY_SKIP[prev] || 0;
        let head = prev.slice(0, skip), base = prev.slice(skip), r = null;
        // 読みが うしろの一部にだけ かかるとき（くず餅 → 餅）は、まえから1文字ずつ はずして さがす
        for (let j = 0; j < base.length && !r; j++) { r = rubyPair(base.slice(j), yomi); if (r) head += base.slice(0, j); }
        html += esc(head) + (r || `<ruby>${esc(base)}<rt>${esc(yomi)}</rt></ruby>`);

}

        const mShort = mem.title.replace(/（[^）]*）/g, '');
        $('moreDate2').href = gq(`${m}月${dd}日 なんの日`);
        $('moreDate2').textContent = `${m}/${dd} なんの日`;
        $('moreName2').href = gq(`${mShort} 小学生`);
        $('moreName2').textContent = mShort;
        $('memLabel').textContent = (word === 'この日') ? `${m}月${dd}日` : word;
        $('memTitle').innerHTML = withRuby(mem.title);
        $('memBody').innerHTML = mem.lines.map(t => `<p>${esc(t)}</p>`).join('');
    } else {
        $('quizLabel').textContent = (word === 'この日') ? `${m}月${dd}日` : word;
        curQuizzes = buildQuizzes(key, word, cur.getFullYear());
        renderQuiz();
    }
    fitCards();
}

let curQuizzes = [];
const qIndex = {};   // 'YYYYMMDD' -> いま出しているクイズの番号
function renderQuiz() {
    const key = keyOf(cur);
    const full = cur.getFullYear() + key;
    const n = curQuizzes.length;
    const qi = (qIndex[full] || 0) % n;
    const quiz = curQuizzes[qi];
    $('qText').innerHTML = quiz.q;
    const box = $('choices');
    box.innerHTML = '';
    box.classList.remove('done');
    const marks = ['ア', 'イ', 'ウ'];
    quiz.opts.forEach((o, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'choice';
        b.innerHTML = `<span class="mark">${marks[i]}</span><span class="txt">${esc(o.text)}</span>`;
        b.addEventListener('click', () => answer(i));
        box.appendChild(b);
    });
    $('answer').hidden = true;
    $('qNext').hidden = n < 2;
    $('qCnt').textContent = `${qi + 1} / ${n}`;
    const aKey = full + '#' + qi;
    if (answered[aKey] !== undefined) showAnswer(answered[aKey], false);
    fitCards();
}

function answer(i) {
    if ($('choices').classList.contains('done')) return;
    const full = cur.getFullYear() + keyOf(cur);
    const qi = (qIndex[full] || 0) % curQuizzes.length;
    answered[full + '#' + qi] = i;
    showAnswer(i, true);
}

function showAnswer(i, animate) {
    const full = cur.getFullYear() + keyOf(cur);
    const quiz = curQuizzes[(qIndex[full] || 0) % curQuizzes.length];
    const opts = quiz.opts;
    const box = $('choices');
    box.classList.add('done');
    [...box.children].forEach((b, j) => {
        b.disabled = true;
        if (opts[j].ok) b.classList.add('correct');
        else if (j === i) b.classList.add('wrong');
        else b.classList.add('dim');
        if (!opts[j].ok && opts[j].note && !b.querySelector('.note')) {
            const n = document.createElement('span'); n.className = 'note'; n.textContent = opts[j].note;
            b.querySelector('.txt').appendChild(n);
        }
        if (opts[j].ok) b.querySelector('.mark').textContent = '◯';
        else if (j === i) b.querySelector('.mark').textContent = '×';
    });
    const ok = opts[i].ok;
    const res = $('resText');
    res.className = 'result ' + (ok ? 'ok' : 'ng');
    res.textContent = ok ? 'せいかい！' : 'ざんねん！ せいかいは ◯ だよ';
    $('resWhen').textContent = quiz.when;
    $('resWhat').textContent = quiz.what;
    const ago = quiz.year ? todayDate().getFullYear() - quiz.year : null;   // 「いまから」は ほんとうの今年から数える
    $('resAgo').hidden = !(ago > 0);
    $('resAgo').textContent = ago > 0 ? `いまから ${ago.toLocaleString()}年まえ のできごとだよ` : '';
    const ans = $('answer');
    ans.hidden = false;
    if (animate && ans.animate) {
        ans.animate([{ opacity: 0 }, { opacity: 1 }],   // 下へずらすと一瞬はみ出すので、うすく出すだけ
            { duration: 260, easing: 'ease-out' });
    }
}

$('qNext').addEventListener('click', () => {
    const full = cur.getFullYear() + keyOf(cur);
    qIndex[full] = ((qIndex[full] || 0) + 1) % curQuizzes.length;
    renderQuiz();
});

/* ---------- 日をうごかす ---------- */
function go(newDate, dir) {
    cur = newDate;
    render();
    if (!dir) return;
    const dx = dir > 0 ? 40 : -40;
    ['calpage', 'memCard', 'annCard', 'quizCard'].forEach((id, n) => {
        const el = $(id);
        if (!el.animate) return;
        el.animate([
            { opacity: 0, transform: `translateX(${dx}px)` },
            { opacity: 1, transform: 'translateX(0)' }
        ], { duration: 260, delay: n * 40, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });
    });
}
$('prevBtn').addEventListener('click', () => go(addDays(cur, -1), -1));
$('nextBtn').addEventListener('click', () => go(addDays(cur, 1), 1));
$('todayBtn').addEventListener('click', () => {
    const t = todayDate();
    go(t, t > cur ? 1 : -1);
});

/* はらう（スワイプ）で前後の日へ */
(function () {
    const area = $('calpage');
    let s = null, swiped = false;
    area.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        s = { x: e.clientX, y: e.clientY, id: e.pointerId };
        swiped = false;
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onCancel);
    });
    function cleanup() {
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onCancel);
        s = null;
    }
    function onCancel() { cleanup(); }
    function onUp(e) {
        if (!s || e.pointerId !== s.id) return;
        const dx = e.clientX - s.x, dy = e.clientY - s.y;
        cleanup();
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            swiped = true;
            if (dx < 0) go(addDays(cur, 1), 1); else go(addDays(cur, -1), -1);
        }
    }
    // スワイプしたときはタップ（カレンダーを開く）をしない
    area.addEventListener('click', (e) => {
        if (swiped) { swiped = false; e.preventDefault(); return; }
        openPicker();
    });
})();

/* ---------- カレンダーで日にちをえらぶ ---------- */
let pkY = 0, pkM = 0;
function openPicker() {
    pkY = cur.getFullYear(); pkM = cur.getMonth();
    drawPicker();
    $('picker').hidden = false;
}
function closePicker() { $('picker').hidden = true; }
function drawPicker() {
    $('pkTitle').textContent = `${pkY}年 ${pkM + 1}月`;
    const g = $('pkGrid');
    g.innerHTML = '';
    ['日', '月', '火', '水', '木', '金', '土'].forEach((w, i) => {
        const c = document.createElement('div');
        c.className = 'pk-wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
        c.textContent = w;
        g.appendChild(c);
    });
    const first = new Date(pkY, pkM, 1, 12).getDay();
    const days = new Date(pkY, pkM + 1, 0, 12).getDate();
    const blank = () => { const e = document.createElement('div'); e.className = 'pk-blank'; return e; };
    for (let i = 0; i < first; i++) g.appendChild(blank());
    const t = todayDate();
    for (let day = 1; day <= days; day++) {
        const dt = new Date(pkY, pkM, day, 12);
        const b = document.createElement('button');
        b.type = 'button';
        const w = dt.getDay();
        b.className = 'pk-day' + ((w === 0 || holidayOn(dt)) ? ' sun' : w === 6 ? ' sat' : '') +
            (sameDay(dt, t) ? ' today' : '') + (sameDay(dt, cur) ? ' sel' : '');
        b.textContent = day;
        b.addEventListener('click', () => {
            const dir = dt > cur ? 1 : dt < cur ? -1 : 0;
            closePicker();
            go(dt, dir);
        });
        g.appendChild(b);
    }
    // どの月も6行ぶんの高さにそろえる（月をかえても カレンダーの大きさが かわらないように）
    for (let i = first + days; i < 42; i++) g.appendChild(blank());
}
$('pkPrev').addEventListener('click', () => { pkM--; if (pkM < 0) { pkM = 11; pkY--; } drawPicker(); });
$('pkNext').addEventListener('click', () => { pkM++; if (pkM > 11) { pkM = 0; pkY++; } drawPicker(); });
$('pkToday').addEventListener('click', () => { const t = todayDate(); closePicker(); go(t, t > cur ? 1 : t < cur ? -1 : 0); });
$('pkClose').addEventListener('click', closePicker);
$('picker').addEventListener('click', (e) => { if (e.target === $('picker')) closePicker(); });
document.addEventListener('keydown', (e) => {
    if (!$('picker').hidden) { if (e.key === 'Escape') closePicker(); return; }
    if (e.key === 'ArrowLeft') go(addDays(cur, -1), -1);
    if (e.key === 'ArrowRight') go(addDays(cur, 1), 1);
});

/* ---------- 開いたまま日付がかわったら、新しい「今日」へ ---------- */
function checkDayChange() {
    const t = todayDate();
    if (sameDay(t, lastToday)) return;
    const wasOnToday = sameDay(cur, lastToday);
    lastToday = t;
    if (wasOnToday) go(t, 1); else render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayChange(); });
window.addEventListener('focus', checkDayChange);
window.addEventListener('pageshow', checkDayChange);
setInterval(() => { if (!document.hidden) checkDayChange(); }, 60000);

render();
</script>
