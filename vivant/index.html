<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おしゃべりボード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1+Code:wght@400;600&display=swap">
<style>
/* Layout: one phone column styled as a device screen — glowing display on top, terminal-like input, phrase keys and settings panels below */
:root{
  --bg:#07090c; --surface:#0f1419; --fg:#d8f6ff; --muted:#6f8a96;
  --accent:#36d6ff; --accent-fg:#001018; --line:#1e2a33; --bubble:#03161d;
  --display:"DotGothic16","M PLUS 1 Code",monospace;
  --body:"M PLUS 1 Code","Hiragino Sans","Yu Gothic",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 40px;
  background-image:radial-gradient(circle at 50% -10%,rgba(54,214,255,.10),transparent 55%)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;letter-spacing:.08em;color:var(--accent);text-shadow:0 0 12px rgba(54,214,255,.45)}
.sub{color:var(--muted);font-size:.8rem;margin:0;letter-spacing:.06em}
.bubble{position:relative;background:var(--bubble);border:1px solid var(--line);border-radius:6px;padding:28px 20px 22px;min-height:140px;
  font-family:var(--display);font-size:clamp(1.5rem,6.5vw,2.3rem);line-height:1.35;word-break:break-word;display:flex;align-items:center;
  color:var(--fg);text-shadow:0 0 10px rgba(54,214,255,.55);overflow:hidden}
.bubble::before{content:"VOICE OUTPUT";position:absolute;top:8px;left:12px;font-family:var(--body);font-size:.62rem;letter-spacing:.2em;color:var(--muted);text-shadow:none}
.bubble::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.bubble.talking{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 24px rgba(54,214,255,.25)}
.wave{display:inline-flex;gap:3px;margin-left:12px;align-items:center;height:1em;visibility:hidden}
.talking .wave{visibility:visible}
.wave i{width:4px;height:30%;background:var(--accent);box-shadow:0 0 6px var(--accent);animation:w .7s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}
@keyframes w{50%{height:100%}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none;height:70%}}
.input{display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:1.05rem;padding:14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);caret-color:var(--accent)}
textarea:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;letter-spacing:.04em}
button:hover{border-color:var(--accent);color:var(--accent)}
.speak{display:inline-flex;align-items:center;justify-content:center;gap:12px;flex:1 1 200px;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-family:var(--display);font-size:1.3rem;padding:14px 20px;letter-spacing:.15em;box-shadow:0 0 18px rgba(54,214,255,.35)}
.speak:hover{color:var(--accent-fg);filter:brightness(1.1)}
.speak:active{transform:translateY(1px)}
h2{font-family:var(--body);font-weight:600;font-size:.78rem;margin:0 0 10px;letter-spacing:.14em;color:var(--muted)}
h2::before{content:"> ";color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;font-size:.92rem}
.chip .x{border:none;background:transparent;padding:0 6px;color:var(--muted);font-size:1.1rem;line-height:1}
.chip .x[hidden]{display:none}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:14px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
select{font:inherit;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.val{font-variant-numeric:tabular-nums;color:var(--accent)}
.note{font-size:.78rem;color:var(--muted);margin:0}
.readlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.readlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);word-break:break-word}
.mini{padding:4px 12px;font-size:.8rem}
.warn{background:var(--surface);border:1px dashed var(--accent);border-radius:6px;padding:12px;font-size:.88rem}
input[type=text]{border-radius:6px!important;border-width:1px!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>おしゃべりボード</h1>
    <p class="sub">TEXT → VOICE</p>
  </header>

  <div class="bubble" id="bubble" aria-live="polite"><span id="shown">こんにちは。よろしくおねがいします。</span><span class="wave" aria-hidden="true"><i></i><i></i><i></i></span></div>

  <div class="input">
    <textarea id="text" placeholder="ここに しゃべらせたい ことばを 入力">こんにちは。よろしくおねがいします。</textarea>
    <div class="row">
      <button class="speak" id="speak" aria-label="読み上げる"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>SPEAK</span></button>
      <button id="stop" aria-label="止める">■ STOP</button>
      <button id="save" aria-label="フレーズに登録">＋ SAVE</button>
    </div>
  </div>

  <div id="unsupported" class="warn" hidden>このブラウザは読み上げに対応していません。iPhoneはSafari、AndroidはChromeで開いてみてください。</div>

  <section>
    <h2>PRESET（タップで入力）</h2>
    <label for="name" style="margin-bottom:12px">話しかける相手の名前（「野崎さん」の部分が変わります）
      <input id="name" type="text" placeholder="空欄なら 野崎" style="font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)">
    </label>
    <div class="chips" id="chips"></div>
    <div class="row" style="margin-top:10px">
      <button id="edit">編集</button>
      <button id="reset">はじめのフレーズにもどす</button>
    </div>
  </section>

  <section class="settings">
    <h2 style="margin:0">声の設定</h2>
    <label for="voice">声の種類
      <select id="voice"></select>
    </label>
    <label for="pitch">声の高さ <span class="val" id="pitchV"></span>
      <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1.6">
    </label>
    <label for="rate">話す速さ <span class="val" id="rateV"></span>
      <input type="range" id="rate" min="0.5" max="1.8" step="0.1" value="1.0">
    </label>
    <p class="note">使える声は端末によってちがいます。高さを上げると、かわいらしい声になります。速さを上げすぎると、イントネーションがくずれやすくなります。</p>
  </section>

  <section class="settings">
    <h2 style="margin:0">読み方・イントネーションの修正</h2>
    <p class="note">読み方やイントネーションがおかしい言葉は、ひらがな・カタカナや「、」を使った書き方を登録すると直せます。例：今日 → きょう、仕事 → しごと</p>
    <div class="row">
      <input id="readFrom" type="text" placeholder="画面の言葉" style="flex:1 1 120px;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)">
      <input id="readTo" type="text" placeholder="読み方" style="flex:1 1 120px;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)">
    </div>
    <div class="row">
      <button id="testRead">ためしに聞く</button>
      <button id="addRead">登録</button>
    </div>
    <ul id="readList" class="readlist"></ul>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
const DEFAULTS=["私はドラムです。よろしくね！","超危険、超危険","ダメよ。ダメダメ。","薫さん、好き","超可愛い超可愛い","超嬉しい超嬉しい","超びっくり超びっくり","世間の目が怖いよ","100キロ走ったらおしまいね！","約束通り日本に来ました","警察犬いっぱい","あの人たちスマホ持ってないよ","了解したよ。{name}さん。","チンギス、バルカ警察で一番優秀ね。","これでよろしいですか？{name}さん。","チャンス、チャンス。","どうかしました？{name}さん","さすがね♡","めっちゃすごいね！","お願いね","仕事って大変ね！","何かあったの？","そーいうことね","ごめんね…","仕事！仕事！","チャンスよ！チャンス！","あれ？違うよ？","あなた１番優秀ね","おめでと","付き合ってたんでしょ？","不潔！不潔！不潔よ！","僕は{name}さんを信じてるよ。","僕を信じて"];
const nameOf=()=>($("name").value.trim()||"野崎");
const fill=p=>p.split("{name}").join(nameOf());
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let phrases=store.get("phrases_v4",DEFAULTS.slice());
let editing=false;
let voices=[];

if(!synth||!window.SpeechSynthesisUtterance){$("unsupported").hidden=false}

function loadVoices(){
  if(!synth)return;
  const all=synth.getVoices();
  if(!all.length)return;
  const ja=all.filter(v=>/^ja/i.test(v.lang));
  voices=ja.length?ja:all;
  const saved=store.get("voice","");
  $("voice").innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name}${ja.length?"":" ("+v.lang+")"}</option>`).join("");
  const idx=voices.findIndex(v=>v.name===saved);
  if(idx>=0)$("voice").value=idx;
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;}

function speak(text){
  text=(text||"").trim();
  if(!text||!synth)return;
  $("shown").textContent=text;
  if(!firstDone){
    /* 1回目は音声エンジンの起動待ちで出だしが欠けやすいので、長めに待つ */
    firstDone=true;
    warm();
    setTimeout(()=>{synth.cancel();setTimeout(()=>say(text,true),150)},600);
    return;
  }
  const busy=synth.speaking||synth.pending;
  if(busy)synth.cancel();
  setTimeout(()=>say(text,false),busy?250:60);
}
/* 読みまちがえやすい言葉は、読み上げるときだけひらがなに置きかえる（画面の表示はそのまま） */
const READINGS={"警察犬":"けいさつけん","♡":"","そーいう":"そういう","薫":"かおる","約束通り":"やくそくどおり","１番":"いちばん","1番":"いちばん","一番":"いちばん","…":"。","超":"ちょう"};
let userReadings=store.get("readings",[]);
function toReading(t){
  userReadings.forEach(r=>{if(r.from)t=t.split(r.from).join(r.to)});
  for(const k in READINGS)t=t.split(k).join(READINGS[k]);
  /* 「超可愛い超可愛い」のようなくり返しは、間に「、」を入れて一語ずつ区切る */
  t=t.replace(/([^、。！？!?\s]{2,8})(?=\1)/g,"$1、");
  /* 「！」の連続は区切りが不自然になりやすいので「、」でつなぐ */
  t=t.replace(/！(?=\S)/g,"、");
  return t;
}
function renderReadings(){
  const ul=$("readList");ul.innerHTML="";
  userReadings.forEach((r,i)=>{
    const li=document.createElement("li");
    const s=document.createElement("span");s.textContent=r.from+" → "+r.to;li.appendChild(s);
    const b=document.createElement("button");b.textContent="削除";b.className="mini";
    b.onclick=()=>{userReadings.splice(i,1);store.set("readings",userReadings);renderReadings()};
    li.appendChild(b);ul.appendChild(li);
  });
}
let warmed=false,firstDone=false;
function warm(){
  if(warmed||!synth)return;
  warmed=true;
  try{const w=new SpeechSynthesisUtterance("、");w.volume=0;w.lang="ja-JP";synth.speak(w);}catch(e){}
}
/* 画面に最初に触れた時点でエンジンを起こしておく */
["pointerdown","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,()=>{warm();if(!voices.length)loadVoices()},{once:true,passive:true}));
function say(text,first){
  /* 先頭の「、」は短い間になり、出だしの音が切れるのを防ぐ */
  const u=new SpeechSynthesisUtterance((first?"、、":"、")+toReading(text));
  u.lang="ja-JP";
  const v=voices[+$("voice").value];
  if(v)u.voice=v;
  u.pitch=+$("pitch").value;
  u.rate=+$("rate").value;
  u.onstart=()=>$("bubble").classList.add("talking");
  u.onend=u.onerror=()=>$("bubble").classList.remove("talking");
  synth.speak(u);
}

function renderChips(){
  $("chips").innerHTML="";
  phrases.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="chip";
    const t=document.createElement("span");t.textContent=fill(p);b.appendChild(t);
    const x=document.createElement("span");x.className="x";x.textContent="×";x.hidden=!editing;x.setAttribute("aria-label","削除");b.appendChild(x);
    b.onclick=()=>{
      if(editing){phrases.splice(i,1);store.set("phrases_v4",phrases);renderChips();}
      else{const s=fill(p);$("text").value=s;$("shown").textContent=s;}
    };
    $("chips").appendChild(b);
  });
  $("edit").textContent=editing?"編集おわり":"編集";
}

function showVals(){$("pitchV").textContent=(+$("pitch").value).toFixed(1);$("rateV").textContent=(+$("rate").value).toFixed(1)}

$("pitch").value=store.get("pitch_v2",1.6);
$("rate").value=store.get("rate_v2",1.0);
showVals();
$("pitch").oninput=()=>{showVals();store.set("pitch_v2",$("pitch").value)};
$("rate").oninput=()=>{showVals();store.set("rate_v2",$("rate").value)};
$("name").value=store.get("name","");
$("name").oninput=()=>{store.set("name",$("name").value);renderChips()};
$("reset").onclick=()=>{phrases=DEFAULTS.slice();store.set("phrases_v4",phrases);renderChips()};
$("voice").onchange=()=>{const v=voices[+$("voice").value];if(v)store.set("voice",v.name)};

$("speak").onclick=()=>speak($("text").value);
$("stop").onclick=()=>{if(synth)synth.cancel();$("bubble").classList.remove("talking")};
$("save").onclick=()=>{
  const t=$("text").value.trim();
  if(t&&!phrases.includes(t)){phrases.push(t);store.set("phrases_v4",phrases);renderChips();}
};
$("edit").onclick=()=>{editing=!editing;renderChips()};
$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();speak($("text").value)}});

$("addRead").onclick=()=>{
  const from=$("readFrom").value.trim(),to=$("readTo").value.trim();
  if(!from||!to)return;
  userReadings=userReadings.filter(r=>r.from!==from);
  userReadings.unshift({from,to});
  store.set("readings",userReadings);
  $("readFrom").value="";$("readTo").value="";
  renderReadings();
};
$("testRead").onclick=()=>{const t=$("readTo").value.trim()||$("readFrom").value.trim();if(t)speak(t)};
renderReadings();
renderChips();
</script>

</body>
</html>
