* { touch-action: manipulation; -webkit-touch-callout: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --app-h: 100vh; --bg: #fff3dc; --ink: #4a3423; --main: #f08a24; --line: #e6cfa6; }
@supports (height: 100dvh) { :root { --app-h: 100dvh; } }
html { background: var(--bg); }
html, body { margin: 0; padding: 0; }
body { position: fixed; inset: 0; height: var(--app-h); overflow: hidden; overscroll-behavior-y: none;
    font-family: "KukuNum", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Noto Sans CJK JP", sans-serif;
    font-weight: 700; color: var(--ink); user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
/* 大きく 見せる すうじと しきは、なぞった ままの ふとさで */
.fx, .fn, #tF, #mQ, #kQ, .pf, .pb, .gc { font-weight: 500 !important; }
/* 大きく 見せる すうじと しきは、なぞった ままの ふとさで */

button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; border: none; margin: 0; cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: absolute; left: 50%; top: 50%; width: 1000px; height: 620px; transform: translate(-50%, -50%) scale(1);
    transform-origin: center center; visibility: hidden; }
#app.is-portrait { width: 420px; height: 740px; }
#app.is-ready { visibility: visible; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }

/* ボタン */
.btn { background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 0 22px; height: 56px; font-size: 22px; font-weight: 700;
    box-shadow: 0 4px 0 var(--line); line-height: 1; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.go { background: var(--main); border-color: #c96a0c; color: #fff; box-shadow: 0 4px 0 #c96a0c; }
.btn.go:active { box-shadow: 0 1px 0 #c96a0c; }
.btn.sm { height: 44px; font-size: 18px; padding: 0 16px; border-radius: 12px; }
.btn.big { height: 72px; font-size: 30px; border-radius: 20px; }
.btn:disabled { opacity: .4; }

/* 上の帯 */
.top { position: relative; width: 100%; height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: center; }
.top h2 { margin: 0; font-size: 26px; font-weight: 900; }
.back { position: absolute; left: 14px; top: 8px; height: 40px; padding: 0 16px 0 30px; border-radius: 20px; background: #fff;
    border: 2px solid var(--line); font-size: 17px; font-weight: 700; line-height: 1; }
.back::before { content: ""; position: absolute; left: 14px; top: 50%; width: 9px; height: 9px; border-left: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink); transform: translateY(-50%) rotate(45deg); }
.back::after { content: ""; position: absolute; inset: -6px -8px; }
.back.fsb { position: relative; left: 0; top: 0; padding: 0 16px; }
.back.fsb::before { display: none; }
.is-portrait #fsBtn { display: none; }
.topR { position: absolute; right: 16px; top: 8px; height: 40px; display: flex; align-items: center; gap: 10px; font-size: 20px; }
#app:not(.is-portrait) .nt .top { position: absolute; left: calc(60px + var(--csL, 52px) * 10 + 27px); top: 10px; width: auto; height: 40px; flex: none; z-index: 2; }
#app:not(.is-portrait) .nt .top h2 { display: none; }
#app:not(.is-portrait) .nt .back { position: relative; left: 0; top: 0; }
#app:not(.is-portrait) .nt .body { padding-top: 10px; }
#app:not(.is-portrait) .nt .side { padding-top: 50px; }
.body { flex: 1 1 0; min-height: 0; display: flex; gap: 20px; padding: 4px 20px 12px; }
.is-portrait .top h2 { font-size: 21px; margin-left: 70px; }
.is-portrait .body { flex-direction: column; gap: 8px; padding: 2px 6px 8px; align-items: center; }

/* ホーム */
#s-home { align-items: center; padding: 18px 30px 8px; }
.logo { margin: auto 0 0; font-size: 76px; font-weight: 900; line-height: 1; letter-spacing: 4px; color: var(--main);
    text-shadow: 0 4px 0 #fff, 0 7px 0 var(--line); }
.logo b:nth-child(1) { color: #e8505b; } .logo b:nth-child(2) { color: #3b82d6; }
.logoSub { font-size: 20px; margin: 12px 0 14px; }
.secLab { align-self: flex-start; font-size: 19px; margin: 0 0 6px 6px; display: flex; align-items: center; gap: 8px; }
.secLab::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--main); }
.mode { position: relative; background: #fff; border: 4px solid var(--c, var(--line)); border-radius: 22px; box-shadow: 0 6px 0 var(--c, var(--line));
    display: flex; align-items: center; text-align: left; padding: 0; }
.mode:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c); }
.mode svg { flex: 0 0 auto; }
.mode .nm { font-size: 30px; font-weight: 900; line-height: 1.15; display: block; }
.mode .ds { font-size: 16px; font-weight: 500; line-height: 1.3; display: block; margin-top: 4px; }
.hs, .rec { display: inline-block; background: #fff3a8; border: 2px solid #f0b400; border-radius: 13px; padding: 3px 12px; margin-top: 7px; font-size: 15px; font-weight: 700; line-height: 1.2; white-space: nowrap; color: var(--ink); }
.rec { font-size: 1em; padding: 4px 18px; margin-top: 10px; white-space: normal; line-height: 1.5; }
.rec b { font-size: 1.25em !important; }
.is-portrait .hs { font-size: 13px; padding: 2px 8px; margin-top: 5px; }
#mFlash { width: 100%; height: 118px; padding: 0 30px; gap: 26px; --c: #f08a24; margin-bottom: 16px; }
#mFlash svg { width: 92px; height: 92px; }
.tg { display: inline-block; font-style: normal; font-size: .45em; font-weight: 700; background: var(--main); color: #fff; border-radius: 12px; padding: 5px 12px; margin-left: 14px; vertical-align: middle; line-height: 1; }
#mFlash .nm { font-size: 40px; }
#mFlash .ds { font-size: 20px; }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: 100%; }
.modes .mode { height: 196px; flex-direction: column; justify-content: center; text-align: center; padding: 8px 10px; }
.modes .mode svg { width: 70px; height: 70px; margin-bottom: 4px; }
.modes .mode .nm { font-size: 25px; white-space: nowrap; }
.foot { margin-top: auto; font-size: 14px; font-weight: 500; opacity: .75; }
#sndBtn { position: absolute; right: 20px; top: 16px; height: 40px; padding: 0 16px; border-radius: 20px; background: #fff; border: 2px solid var(--line);
    font-size: 16px; font-weight: 700; line-height: 1; }
.is-portrait #s-home { padding: 56px 12px 8px; }
.is-portrait .logo { font-size: 62px; }
.is-portrait .logoSub { font-size: 16px; margin: 10px 0 14px; }
.is-portrait #mFlash { width: 396px; height: 112px; padding: 0 14px; gap: 14px; }
.is-portrait #mFlash svg { width: 74px; height: 74px; }
.is-portrait #mFlash .nm { font-size: 32px; }
.is-portrait #mFlash .ds { font-size: 15px; }
.is-portrait .modes { grid-template-columns: repeat(2, 191px); gap: 14px; width: auto; }
.is-portrait .modes .mode { height: 168px; }
.is-portrait .modes .mode svg { width: 52px; height: 52px; }
.is-portrait .modes .mode .nm { font-size: 21px; }
.is-portrait .modes .mode .ds { font-size: 14px; }

/* めくり九九：せってい */
.fset .col { flex: 1 1 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lab { font-size: 20px; }
.dans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.dans button { height: 96px; border-radius: 18px; background: #fff; border: 4px solid var(--c); color: var(--c); font-size: 30px; font-weight: 900;
    line-height: 1; opacity: .55; }
.dans button.on { background: var(--c); color: #fff; opacity: 1; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.row2 { display: flex; gap: 10px; }
.row2 .btn { flex: 1 1 0; min-width: 0; padding: 0 6px; font-size: 20px; }
.opt { display: flex; align-items: center; gap: 10px; height: 62px; }
.opt > span { flex: 0 0 128px; font-size: 20px; white-space: nowrap; }
.seg { flex: 1; display: flex; background: #f3e3c3; border-radius: 16px; padding: 4px; gap: 4px; height: 56px; }
.seg button { flex: 1; border-radius: 12px; background: transparent; font-size: 20px; font-weight: 700; line-height: 1; padding: 0; white-space: nowrap; }
/* スマホでも おしやすいように、見た目は そのままで おせる はんいだけ 広げる */
.seg button, .btn.sm { position: relative; }
.seg button::after, .btn.sm::after { content: ""; position: absolute; inset: -7px 0; }
.seg button.on { background: #fff; color: #c25e00; box-shadow: 0 2px 0 var(--line); }
.spd { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 16px; }
.spd em { font-style: normal; white-space: nowrap; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 40px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px;
    background: repeating-linear-gradient(90deg, #d9b97c 0 4px, #f3e3c3 4px 25%); }
input[type=range]::-moz-range-track { height: 12px; border-radius: 6px; background: #f3e3c3; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; margin-top: -12px; border-radius: 50%; background: var(--main);
    border: 4px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: var(--main); border: 4px solid #fff; }
.off { opacity: .35; pointer-events: none; }
#fStart { margin-top: auto; }
.is-portrait .fset { align-items: stretch; padding: 0 12px 10px; gap: 6px; }
.is-portrait .fset .col { gap: 6px; flex: 0 0 auto; }
.is-portrait .fset .col:last-child { flex: 1 1 0; }
.is-portrait .lab { font-size: 17px; }
.is-portrait .dans { gap: 7px; }
.is-portrait .dans button { height: 56px; font-size: 22px; border-radius: 14px; border-width: 3px; }
.is-portrait .opt { height: 52px; gap: 6px; }
.is-portrait .opt > span { flex-basis: 98px; font-size: 15px; }
.is-portrait .seg { height: 46px; }
.is-portrait .seg button { font-size: 17px; }
.is-portrait .spd { font-size: 13px; gap: 6px; }
.is-portrait #fStart { height: 60px; }

/* めくり九九：カード */
#s-flash { align-items: center; }
#fDan { padding: 4px 16px; border-radius: 16px; color: #fff; font-size: 20px; line-height: 1.2; }
#fProg { font-size: 22px; font-weight: 900; min-width: 90px; text-align: right; }
.stage { flex: 1 1 0; min-height: 0; width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; perspective: 1800px; }
#fBeat { display: flex; gap: 22px; flex: 0 0 auto; }
#fBeat i { width: 28px; height: 28px; border-radius: 50%; background: #cfe6c8; }
#fBeat i.r { background: #f6cdd0; }
#fBeat i.on { background: #49a942; transform: scale(1.18); }
#fBeat i.r.on { background: #e8505b; }
#fBeat.hide { visibility: hidden; }
.is-portrait #fBeat { gap: 18px; }
.is-portrait #fBeat i { width: 24px; height: 24px; }
#card { position: relative; width: calc(var(--bw, 1000px) - 220px); height: calc(var(--bh, 620px) - 216px); transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.4,.1,.3,1); cursor: pointer; }
#card.noanim { transition: none; }
.face { position: absolute; inset: 0; border-radius: 34px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 0 rgba(0,0,0,.12);
    border: 10px solid var(--c); background: #fff; overflow: hidden; }
.face.b { transform: rotateY(180deg); }
.face.ans { background: var(--c); color: #fff; }
.fx, .fn, .ft { height: calc(var(--bh, 620px) - 378px); display: flex; align-items: center; justify-content: center; }
.fx { font-size: calc((var(--bh, 620px) - 216px) * .5); font-weight: 900; line-height: 1; white-space: nowrap; }
.fx i { font-style: normal; font-size: .8em; margin: 0 .12em; }
.fy { font-size: 54px; line-height: 1.3; color: var(--c); white-space: nowrap; }
.face.ans .fy { color: #fff; }
.fy s { text-decoration: none; opacity: .75; }
.ft { font-size: 170px; font-weight: 900; line-height: 1; white-space: nowrap; }
.fn { font-size: calc((var(--bh, 620px) - 216px) * .62); font-weight: 900; line-height: 1; }
.fctl { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 8px 20px 14px; width: 100%; }
#fNext { width: 250px; }
.autoBox { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--line); border-radius: 20px; padding: 6px 12px; height: 72px; width: 420px; }
#fAuto { white-space: nowrap; padding: 0; flex: 0 0 150px; height: 52px; border-radius: 14px; background: #f3e3c3; font-size: 18px; font-weight: 700; line-height: 1.1; }
#fAuto.on { background: #3b82d6; color: #fff; }
.is-portrait #card { width: 400px; height: 330px; }
.is-portrait .face { border-width: 8px; border-radius: 26px; }
.is-portrait .fx, .is-portrait .fn, .is-portrait .ft { height: 186px; }
.is-portrait .ft { font-size: 88px; }
.is-portrait .fx { font-size: 118px; }
.is-portrait .fy { font-size: 34px; }
.is-portrait .fn { font-size: 180px; }
.is-portrait .fctl { flex-wrap: wrap; gap: 10px; padding: 6px 10px 12px; }
.is-portrait #fPrev { width: 120px; padding: 0; }
.is-portrait #fNext { width: 266px; }
.is-portrait .autoBox { width: 396px; height: 66px; }
.is-portrait #fAuto { flex-basis: 132px; font-size: 15px; }

/* 九九の ひょう（共通） */
.grid { --cs: var(--csL, 52px); display: grid; grid-template-columns: repeat(10, var(--cs)); grid-auto-rows: var(--cs); gap: 3px; flex: 0 0 auto; align-self: center; }
.is-portrait .grid { --cs: 38px; }
.gh, .gc { display: flex; align-items: center; justify-content: center; border-radius: 9px; line-height: 1; }
.gh { background: #8a6a4c; color: #fff; font-size: 26px; font-weight: 900; }
.gh.corner { background: transparent; color: var(--ink); }
.gh.hl { outline: 4px solid #ffd23c; outline-offset: -1px; }
.gc { background: #fff; border: 2px solid var(--line); font-size: 25px; font-weight: 900; cursor: pointer; }
.gc.open { border-color: currentColor; }
.gc.cur { background: #fff3a8; border: 3px solid #f0a800; }
.gc.sel { background: #fff3a8; }
.gc.done { color: #2f7d32; background: #eef8e6; border-color: #b9dba5; }
.is-portrait .gh { font-size: 20px; border-radius: 7px; }
.is-portrait .gc { font-size: 18px; border-radius: 7px; }
.side { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.is-portrait .side { width: 100%; flex: 1 1 0; gap: 6px; }
.panel { background: #fff; border: 3px solid var(--line); border-radius: 20px; padding: 10px; text-align: center; }
#tInfo { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
#tF { font-size: 52px; font-weight: 900; line-height: 1; white-space: nowrap; }
#tY { font-size: 30px; line-height: 1.2; min-height: 36px; }
#tHint { font-size: 18px; font-weight: 500; }
.is-portrait #tF { font-size: 50px; }
.is-portrait #tY { font-size: 24px; min-height: 29px; }
.is-portrait #tInfo { gap: 6px; }
.is-portrait #tHint { font-size: 15px; }

/* 数字ボタン */
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button { height: 62px; border-radius: 14px; background: #fff; border: 3px solid var(--line); box-shadow: 0 4px 0 var(--line); font-size: 32px; font-weight: 900;
    line-height: 1; padding: 0; }
.pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); background: #fff3a8; }
.pad .zero { grid-column: 1 / span 2; }
.pad .del { font-size: 20px; background: #f3e3c3; }
.is-portrait .pad { gap: 6px; }
.is-portrait .pad button { height: 54px; font-size: 28px; }
.is-portrait .pad .del { font-size: 16px; }
.is-portrait .side.np { display: grid; grid-template-columns: minmax(0, 1fr) 222px; grid-template-rows: auto 1fr; gap: 6px; }
.is-portrait .side.np .stat { grid-column: 1; grid-row: 1; flex-direction: column; gap: 4px; }
.is-portrait .side.np #mQ { grid-column: 1; grid-row: 2; }
.is-portrait .side.np .pad { grid-column: 2; grid-row: 1 / span 2; align-self: start; }
.stat { display: flex; gap: 10px; }
.stat .panel { flex: 1; font-size: 17px; padding: 6px; line-height: 1.2; }
.stat b { display: block; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
#fProg, #pTime, #pScore { font-variant-numeric: tabular-nums; }
#mQ { font-size: 46px; font-weight: 900; line-height: 1; flex: 1 1 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; white-space: nowrap; min-height: 70px; }
#mQ { overflow: hidden; }
#mQ small, #kHint { font-size: 26px; font-weight: 700; color: #c25e00; line-height: 1; min-height: 26px; }
#mQ u, #kQ u { text-decoration: none; display: inline-block; min-width: 1.5em; margin-left: .15em; padding: 2px 6px; border-bottom: 6px solid var(--main); color: #c25e00; text-align: center; }
.is-portrait .stat .panel { font-size: 13px; padding: 3px; }
.is-portrait .stat b { font-size: 22px; display: inline; margin-left: 6px; }
.is-portrait #mQ { font-size: 28px; min-height: 0; padding: 4px; gap: 8px; }
.is-portrait #mQ small, .is-portrait #kHint { font-size: 18px; min-height: 18px; }
.is-portrait #mQ u, .is-portrait #kQ u { border-bottom-width: 4px; }

/* 九九あわせ */
.ptop { justify-content: flex-start; gap: 18px; padding: 0 22px 0 132px; }
.pTimeBox { flex: 0 0 300px; display: flex; align-items: center; gap: 10px; font-size: 16px; }
.pTimeBox b { font-size: 32px; font-weight: 900; line-height: 1; min-width: 42px; text-align: right; }
#pBarW { flex: 1 1 0; height: 20px; border-radius: 10px; background: #f3e3c3; overflow: hidden; }
#pBar { height: 100%; width: 100%; border-radius: 10px; background: #49a942; }
#pBar.low { background: #e8505b; }
#pMsg { flex: 1 1 0; min-width: 0; text-align: center; font-size: 19px; white-space: nowrap; overflow: hidden; }
.pBest { flex: 0 0 auto; background: #fff3a8; border: 2px solid #f0b400; border-radius: 13px; padding: 3px 12px; font-size: 15px; white-space: nowrap; }
.pBest b { font-size: 20px; font-weight: 900; display: inline-block; min-width: 24px; text-align: right; }
.pScoreBox { flex: 0 0 auto; display: flex; align-items: baseline; gap: 4px; font-size: 18px; }
.pScoreBox b { font-size: 38px; font-weight: 900; line-height: 1; min-width: 46px; text-align: right; display: inline-block; }
#s-pair .body { padding: 10px 24px 18px; }
.board { flex: 1 1 0; align-self: stretch; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 18px 20px; }
/* カード：紙の あつみ・うちがわの わく・少しの かたむき。めくると うらの 青い 面が 出る */
.pc { position: relative; background: none; padding: 0; perspective: 900px; }
.pin { position: absolute; inset: 0; display: block; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .38s cubic-bezier(.4,.1,.3,1);
    transform: rotate(var(--tilt, 0deg)); }
.pc.rev .pin { transform: rotate(var(--tilt, 0deg)) rotateY(180deg); }
.pf, .pb { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #fffdf7; box-shadow: 0 5px 0 #d9c39a, 0 10px 14px rgba(74,52,35,.2);
    font-size: 60px; font-weight: 900; line-height: 1; white-space: nowrap; color: var(--ink); }
.pf::before, .pb::before { content: ""; position: absolute; inset: 9px; border: 2.5px solid #ecd9b4; border-radius: 11px; }
.pb { transform: rotateY(180deg); background: #e3eefc; color: #2f66b3; font-size: 84px; box-shadow: 0 5px 0 #9cbfee, 0 10px 14px rgba(74,52,35,.2); }
.pb::before { border-color: #b9d2f3; }
.pb small { font-size: 24px; margin-top: 6px; color: #5f84ba; }
.pc.sel .pf { background: #fff3a8; box-shadow: 0 5px 0 #f0a800, 0 10px 14px rgba(74,52,35,.2); }
.pc.sel .pf::before { border-color: #f0c94a; }
.pc.ng { animation: shake .35s .4s; }
.pc.ng .pb { background: #fde1e1; color: #cf3b45; box-shadow: 0 5px 0 #e8505b, 0 10px 14px rgba(74,52,35,.2); }
.pc.ng .pb::before { border-color: #f3a8ae; }
.pc.ng .pb small { color: #d9737a; }
.pc.pop { animation: pop .3s; }
.pc.empty { visibility: hidden; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.shake { animation: shake .35s; }
.is-portrait .ptop { height: auto; flex: 0 0 auto; flex-wrap: wrap; gap: 0 10px; padding: 8px 12px 0 112px; }
.is-portrait .pTimeBox { flex: 1 1 0; height: 40px; gap: 6px; font-size: 13px; }
.is-portrait .pTimeBox b { font-size: 26px; min-width: 34px; }
.is-portrait .pTimeBox span { display: none; }
.is-portrait .pBest { font-size: 11px; padding: 2px 6px; }
.is-portrait .pBest b { font-size: 15px; min-width: 16px; }
.is-portrait .pScoreBox { height: 40px; font-size: 14px; }
.is-portrait .pScoreBox b { font-size: 30px; min-width: 36px; }
.is-portrait #pMsg { order: 3; flex: 0 0 auto; margin-left: -100px; width: calc(100% + 100px); height: 30px; line-height: 30px; font-size: 15px; }
.is-portrait #s-pair .body { padding: 4px 10px 12px; }
.is-portrait .board { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px 10px; }
.is-portrait .pf { font-size: 34px; border-radius: 14px; }
.is-portrait .pb { font-size: 62px; border-radius: 14px; }
.is-portrait .pb small { font-size: 18px; }
.is-portrait .pf::before, .is-portrait .pb::before { inset: 6px; border-radius: 9px; }

/* 九九けんてい */
.ken { width: 76%; display: grid; grid-template-columns: 150px repeat(3, minmax(0, 1fr)); grid-auto-rows: calc((var(--bh, 620px) - 130px) / 10); gap: 6px; margin: 0 auto; align-self: center; }
.ken .kh { display: flex; align-items: center; justify-content: center; font-size: 20px; }
.ken .kd { display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #fff; font-size: 22px; font-weight: 900; background: var(--c); }
.ken button { position: relative; background: #fff; border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 3px 0 var(--line); display: flex; align-items: center;
    justify-content: flex-start; gap: 0; font-size: 17px; line-height: 1; padding: 0 12px 0 22px; }
.ken button svg { width: 32px; height: 32px; fill: #e4dccd; flex: 0 0 auto; }
.ken button span { flex: 1 1 0; text-align: center; font-variant-numeric: tabular-nums; }
.ken button.got { border-color: #f0b400; background: #fffbe6; box-shadow: 0 3px 0 #f0b400; }
.ken button.got svg { fill: #f7b500; }
.is-portrait .ken { width: auto; grid-template-columns: 96px repeat(3, 98px); grid-auto-rows: 60px; gap: 6px; }
.is-portrait .ken .kd { font-size: 18px; }
.is-portrait .ken .kh { font-size: 16px; }
.is-portrait .ken button { flex-direction: column; justify-content: center; gap: 2px; font-size: 13px; padding: 0; }
.is-portrait .ken button span { flex: 0 0 auto; }
.is-portrait .ken button svg { width: 28px; height: 28px; }
#kStars { font-size: 18px; }
.is-portrait #kStars { font-size: 14px; right: 8px; }
#kCard { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; border: 8px solid var(--c, var(--line)); }
#kQ { font-size: 90px; font-weight: 900; line-height: 1; white-space: nowrap; }
#kDots { display: flex; gap: 10px; }
#kDots i { width: 28px; height: 28px; border-radius: 50%; background: #efe3cb; }
#kDots i.ok { background: #49a942; } #kDots i.ng { background: #e8505b; } #kDots i.now { outline: 4px solid #f0a800; }
.kside { flex: 0 0 340px; }
.kL { flex: 1 1 0; min-width: 0; display: flex; }
.is-portrait .kL { width: 100%; flex: 1 1 0; }
.is-portrait #kQ { font-size: 58px; }
.is-portrait #kDots i { width: 22px; height: 22px; }
.is-portrait #kCard { gap: 14px; }
.is-portrait .kside { flex: 0 0 auto; }

/* ダイアログ */
#dlg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50; }
#dlg.on { display: flex; }
#dlg::before { content: ""; position: absolute; inset: -6000px; background: rgba(74,52,35,.45); }
#dlgBox { position: relative; background: #fff; border-radius: 28px; border: 5px solid var(--main); padding: 24px 30px; width: 560px; max-width: 94%; text-align: center; }
#dlgT { font-size: 36px; font-weight: 900; margin: 0 0 10px; line-height: 1.2; }
#dlgB { font-size: 21px; font-weight: 500; line-height: 1.6; margin-bottom: 18px; }
#dlgB b { font-weight: 900; font-size: 1.5em; color: #c25e00; }
#dlgB svg { width: 90px; height: 90px; fill: #f7b500; display: block; margin: 0 auto; }
#dlgN { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.is-portrait #dlgBox { padding: 18px 14px; }
.is-portrait #dlgT { font-size: 30px; }
.is-portrait #dlgB { font-size: 18px; }
.is-portrait #dlgN .btn { font-size: 19px; padding: 0 16px; }
</style>
</head>
<body>
<div id="app">

<!-- ホーム -->
<section id="s-home" class="screen on">
    <button id="sndBtn">音：あり</button>
    <h1 class="logo"><b>九</b><b>九</b>めくり<span class="sr-only"> 小学2年生の九九の学習アプリ</span></h1>
    <div class="logoSub">九九を こえに 出して、たのしく おぼえよう</div>
    <div class="secLab">こえに 出して</div>
    <button class="mode" id="mFlash">
        <svg viewBox="0 0 96 96"><rect x="26" y="14" width="58" height="42" rx="8" fill="#ffd9a8" stroke="#f08a24" stroke-width="4" transform="rotate(8 55 35)"/><rect x="10" y="30" width="62" height="46" rx="8" fill="#fff" stroke="#f08a24" stroke-width="5"/><path d="M27 43l14 20M41 43L27 63" stroke="#f08a24" stroke-width="6" stroke-linecap="round"/><path d="M50 49h12M50 59h12" stroke="#4a3423" stroke-width="5" stroke-linecap="round"/></svg>
        <span><span class="nm">めくり九九</span><span class="ds">こえに 出して いおう</span></span>
    </button>
    <div class="secLab">れんしゅう・ゲーム</div>
    <div class="modes">
        <button class="mode" id="mTable" style="--c:#49a942">
            <svg viewBox="0 0 80 80"><g fill="#d9efd0" stroke="#49a942" stroke-width="3"><rect x="8" y="8" width="18" height="18" rx="4"/><rect x="31" y="8" width="18" height="18" rx="4"/><rect x="54" y="8" width="18" height="18" rx="4"/><rect x="8" y="31" width="18" height="18" rx="4"/><rect x="31" y="31" width="18" height="18" rx="4" fill="#49a942"/><rect x="54" y="31" width="18" height="18" rx="4"/><rect x="8" y="54" width="18" height="18" rx="4"/><rect x="31" y="54" width="18" height="18" rx="4"/><rect x="54" y="54" width="18" height="18" rx="4"/></g></svg>
            <span class="nm">九九ひょう</span><span class="ds">こたえを しらべる</span><span class="hs" style="visibility:hidden">&nbsp;</span>
        </button>
        <button class="mode" id="mMasu" style="--c:#3b82d6">
            <svg viewBox="0 0 80 80"><circle cx="40" cy="45" r="27" fill="#dbe9fb" stroke="#3b82d6" stroke-width="5"/><rect x="34" y="6" width="12" height="9" rx="3" fill="#3b82d6"/><path d="M40 45V28M40 45l12 8" stroke="#3b82d6" stroke-width="5" stroke-linecap="round"/></svg>
            <span class="nm">81マスけいさん</span><span class="ds">はやさに ちょうせん</span><span class="hs" id="hsMasu" style="visibility:hidden">&nbsp;</span>
        </button>
        <button class="mode" id="mPair" style="--c:#e0559a">
            <svg viewBox="0 0 80 80"><rect x="6" y="18" width="32" height="44" rx="7" fill="#fbe0ee" stroke="#e0559a" stroke-width="4"/><rect x="42" y="18" width="32" height="44" rx="7" fill="#fbe0ee" stroke="#e0559a" stroke-width="4"/><path d="M15 36h14M15 46h14M51 36h14M51 46h14" stroke="#e0559a" stroke-width="5" stroke-linecap="round"/></svg>
            <span class="nm">九九あわせ</span><span class="ds">おなじ こたえを さがす</span><span class="hs" id="hsPair" style="visibility:hidden">&nbsp;</span>
        </button>
        <button class="mode" id="mKen" style="--c:#f0b400">
            <svg viewBox="0 0 24 24"><path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z" fill="#f7b500"/></svg>
            <span class="nm">九九けんてい</span><span class="ds">スターを あつめる</span><span class="hs" id="kenCnt"></span>
        </button>
    </div>
    <div class="foot">九九めくり ｜ ver.1.0 ｜ ota tools</div>
</section>

<!-- めくり九九 せってい -->
<section id="s-fset" class="screen">
    <div class="top"><button class="back" data-go="home">もどる</button><h2>めくり九九</h2><div class="topR"><button class="back fsb" id="fsBtn" hidden>大きく うつす</button></div></div>
    <div class="body fset">
        <div class="col">
            <div class="lab">だんを えらぼう</div>
            <div id="danSel" class="dans"></div>
            <div class="row2"><button class="btn sm" id="danAll">ぜんぶ えらぶ</button><button class="btn sm" id="danNone">ぜんぶ はずす</button></div>
        </div>
        <div class="col">
            <div class="opt"><span>じゅんばん</span><div class="seg" data-k="order"><button data-v="up">上がり</button><button data-v="down">下がり</button><button data-v="rand">ばらばら</button></div></div>
            <div class="opt"><span>こたえ</span><div class="seg" data-k="ans"><button data-v="on">出す</button><button data-v="off">出さない</button></div></div>
            <div class="opt"><span>よみかた</span><div class="seg" data-k="yomi"><button data-v="on">出す</button><button data-v="off">出さない</button></div></div>
            <div class="opt"><span>めくりかた</span><div class="seg" data-k="auto"><button data-v="off">ボタンで</button><button data-v="on">じどうで</button></div></div>
            <div class="opt" id="spdOpt"><span>はやさ</span><div class="spd"><em>ゆっくり</em><input type="range" id="spd" min="1" max="5" step="1" value="3" aria-label="はやさ"><em>はやい</em></div></div>
            <button class="btn big go" id="fStart">スタート</button>
        </div>
    </div>
</section>

<!-- めくり九九 カード -->
<section id="s-flash" class="screen">
    <div class="top"><button class="back" data-go="fset">やめる</button><span id="fDan"></span><div class="topR"><span id="fProg"></span></div></div>

$('mTable').onclick = tableOpen;
$('mMasu').onclick = masuOpen;
$('mPair').onclick = pairOpen;

/* ===== めくり九九 ===== */
const BEAT = [1100, 850, 650, 480, 340];   // 1はくの 長さ（ミリびょう）。ゆっくり→はやい。カード1まいは 4はく

(function () {
    const box = $('danSel');
    N9.forEach(d => { const b = document.createElement('button'); b.textContent = d + 'のだん'; b.style.setProperty('--c', DAN[d]); b.dataset.d = d;
        b.onclick = () => { const i = S.f.dans.indexOf(d); if (i >= 0) S.f.dans.splice(i, 1); else S.f.dans.push(d); save(); fsetRefresh(); }; box.appendChild(b); });

    $('danAll').onclick = () => { S.f.dans = N9.slice(); save(); fsetRefresh(); };

/* ===== 九九あわせ ===== */
const PROD = {};

let P = { run: false, cards: [] };
(function () { const bd = $('pBoard'); for (let i = 0; i < 12; i++) { const b = document.createElement('button'); b.className = 'pc empty'; b.style.setProperty('--tilt', P_TILT[i] + 'deg'); b.onclick = () => pairTap(i); bd.appendChild(b); } })();
const pKey = c => c.a ? c.a + 'x' + c.b : 'n' + c.v;
const pHas = k => P.cards.some(c => c && pKey(c) === k);
const pOkF = e => !pHas(e[0] + 'x' + e[1]) && !pHas(e[1] + 'x' + e[0]);
// しきの 出やすさ。にがてな ほど 大きい。×1 は はじめだけ 少し、とちゅうから 出さない
function pW(a, b) { return wOf(a, b) * (a === 1 || b === 1 ? (P.score < 6 ? 2 : P.score < 12 ? .6 : 0) : 1); }

    for (const useRec of [true, false]) {
        const list = [];
        N9.forEach(a => N9.forEach(b => { const w = pW(a, b); if (w > 0 && pOkF([a, b]) && !(ex && ex.has(a * b)) && !(useRec && S.rec.includes(wKey(a, b)))) list.push([a, b, w]); }));
        if (list.length) { const e = pRoulette(list); return { a: e[0], b: e[1], v: e[0] * e[1] }; }
    }
    for (;;) { const a = 2 + rnd(8), b = 2 + rnd(8); if (!(ex && ex.has(a * b))) return { a, b, v: a * b }; }
}
function pPartnerOf(c, anyOk) {   // c と こたえが おなじ カード（かずか、べつの しき）
    let fs = PROD[c.v].filter(e => pOkF(e) && pW(e[0], e[1]) > 0).map(e => [e[0], e[1], pW(e[0], e[1])]);
    const numOk = c.a && !pHas('n' + c.v), fresh = fs.filter(e => !S.rec.includes(wKey(e[0], e[1])));
    if (!anyOk || fresh.length || numOk) fs = fresh;   // さいきん 出た しきは あいてにも しない（まちがえた しきの あいてだけは べつ）
    if (numOk && (Math.random() < .3 || !fs.length)) return { v: c.v };
    if (fs.length) { const e = pRoulette(fs); return { a: e[0], b: e[1], v: c.v }; }

}
const pFF = () => { const m = {}; let n = 0; P.cards.forEach(c => { if (c && c.a) m[c.v] = (m[c.v] || 0) + 1; }); for (const k in m) if (m[k] >= 2) n++; return n; };
function pPartnerF(ex) {   // 今 ある しきと、べつの しきで こたえが おなじに なる カード（2×8 に 4×4 など）
    const late = S.rec.slice(-12);   // ついさっき 出た しきだけは さける
    for (const c of shuffle(P.cards.filter(c => c && c.a && !(ex && ex.has(c.v))))) {
        const fs = PROD[c.v].filter(e => pOkF(e) && pW(e[0], e[1]) > 0 && !late.includes(wKey(e[0], e[1]))).map(e => [e[0], e[1], pW(e[0], e[1])]);

}
function pPartner(ex) { for (const c of shuffle(P.cards.filter(c => c && !(ex && ex.has(c.v))))) { const p = pPartnerOf(c); if (p) return p; } return null; }
function pPairs() { const m = {}; let n = 0; P.cards.forEach(c => { if (c) m[c.v] = (m[c.v] || 0) + 1; }); for (const k in m) n += Math.floor(m[k] / 2); return n; }

function pNear(i, j) {

function pFill() {
    const empty = [], news = []; P.cards.forEach((c, i) => { if (!c) empty.push(i); }); P.turn++;
    const first = empty.length === 12;   // さいしょに くばる とき
    // とちゅうで 新しく 出す カードどうしは、こたえを かならず ちがう ものに する（出た とたんに そろわないように）。
    // 新しい カードの あいては、前から ある カード。あいてが いない カードが あっても よい

            const qi = P.q.findIndex(q => q.due <= P.turn && pOkF([q.a, q.b]) && !vals.has(q.a * q.b));

const KT = [['up', '上がり'], ['down', '下がり'], ['rand', 'ばらばら']];
let K = { run: false };
function kenList() {
    const got = Object.keys(S.ken).length; $('kStars').textContent = got >= 27 ? 'ぜんぶ ごうかく！' : 'スター ' + got + ' / 27';
    const el = $('kList'); el.innerHTML = '<div class="kh"></div>' + KT.map(t => '<div class="kh">' + t[1] + '</div>').join('');
    N9.forEach(d => {
        const h = document.createElement('div'); h.className = 'kd'; h.style.setProperty('--c', DAN[d]); h.textContent = d + 'のだん'; el.appendChild(h);
        KT.forEach(t => { const k = d + '-' + t[0], b = document.createElement('button'), got = S.ken[k];
            b.className = got ? 'got' : ''; b.innerHTML = STAR + '<span>' + (got ? (got / 1000).toFixed(1) + 'びょう' : 'ちょうせん') + '</span>'; b.onclick = () => kenStart(d, t[0]); el.appendChild(b); });
    });
}
function kenStart(d, type) {
    go('test');
    const ns = N9.slice(); if (type === 'down') ns.reverse(); if (type === 'rand') shuffle(ns);
    K = { run: true, d, type, ns, i: 0, miss: 0, typed: '', res: [], t0: 0 };   // じかんは さいしょの すうじを おした ときから
    $('kTitle').textContent = d + 'のだん・' + KT.find(t => t[0] === type)[1];
    $('kCard').style.setProperty('--c', DAN[d]);
    $('kTime').textContent = '0';
    IV(() => { if (K.run && K.t0) { const s = String(Math.floor((performance.now() - K.t0) / 1000)); if ($('kTime').textContent !== s) $('kTime').textContent = s; } }, 200);
    kenDraw();
}
function kenDraw() {
    $('kQ').innerHTML = K.d + ' × ' + K.ns[Math.min(K.i, 8)] + ' ＝<u>' + (K.typed || '&nbsp;') + '</u>';
    $('kHint').textContent = K.run && K.res[K.i] === 'ng' ? yomi(K.d, K.ns[K.i])[0] : (K.t0 || !K.run ? '' : '');
    $('kDots').innerHTML = K.ns.map((n, i) => '<i class="' + (K.res[i] || '') + (i === K.i ? ' now' : '') + '"></i>').join('');
    $('kMiss').textContent = K.miss;
}
function kenKey(k) {
    if (!K.run || dlgOn()) return;
    if (k === 'del') { K.typed = ''; kenDraw(); return; }
    if (!K.t0) K.t0 = performance.now();
    K.typed += k;
    const res = judge(K.typed, K.d * K.ns[K.i]);
    if (res === 'wait') { snd.key(); kenDraw(); return; }
    if (res === 'ng') { wAdj(K.d, K.ns[K.i], -2); K.miss++; K.typed = ''; K.res[K.i] = 'ng'; snd.ng(); kenDraw(); anim($('kQ'), 'shake'); return; }
    if (K.res[K.i] !== 'ng') wAdj(K.d, K.ns[K.i], 1);
    K.res[K.i] = K.res[K.i] || 'ok'; K.typed = ''; K.i++;
    if (K.i < 9) { snd.key(); kenDraw(); return; }
    K.run = false; const ms = performance.now() - K.t0, d = K.d, type = K.type, key = d + '-' + type;
    kenDraw(); $('kTime').textContent = Math.floor(ms / 1000);
    if (K.miss === 0) {
        const old = S.ken[key]; if (!old || ms < old) { S.ken[key] = Math.round(ms); save(); }
        snd.fin();
        showDlg('ごうかく！', STAR + '<b>' + fmt(ms) + '</b><br><span class="rec">さいこう <b>' + fmt(old && old < ms ? old : ms) + '</b></span>', [
            { t: 'いちらんへ', go: 1, fn: () => go('ken') }, { t: 'もういちど', fn: () => kenStart(d, type) }]);
    } else {
        showDlg('おしい！', 'まちがい ' + K.miss + 'かい<br>0かいで スター！', [
            { t: 'もういちど', go: 1, fn: () => kenStart(d, type) }, { t: 'いちらんへ', fn: () => go('ken') }]);
    }
}

/* ===== キーボード（パソコン） ===== */
document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (cur === 'flash') {
        if ([' ', 'Enter', 'ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); if (!e.repeat) flashNext(true); }
        else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); flashPrev(); }
        return;
    }
    const f = cur === 'masu' ? masuKey : cur === 'test' ? kenKey : null;
    if (!f) return;
    // 日本語入力が オンだと e.key が 'Process' に なるので、キーの 場所（e.code）からも 数字を 読む
    const m = /^(?:Digit|Numpad)([0-9])$/.exec(e.code || ''), d = /^[0-9]$/.test(e.key) ? e.key : (m ? m[1] : '');
    if (d) { e.preventDefault(); f(d); } else if (['Backspace', 'Delete', 'NumpadDecimal', 'Escape'].includes(e.key) || e.code === 'NumpadDecimal') { e.preventDefault(); f('del'); }
});

/* ===== 画面の 大きさに 合わせる・かってな 拡大を ふせぐ ===== */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
function resetZoomIfNeeded() {
    if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
    const meta = document.querySelector('meta[name="viewport"]'); if (!meta) return;
    const original = meta.getAttribute('content');
    meta.setAttribute('content', original + ', maximum-scale=1.0');
    requestAnimationFrame(() => meta.setAttribute('content', original));
}
function safeInsets() {
    let p = $('safeProbe');
    if (!p) { p = document.createElement('div'); p.id = 'safeProbe';
        p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
            'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
        document.body.appendChild(p); }
    const cs = getComputedStyle(p);
    return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function fit() {
    const vv = window.visualViewport, vw = vv ? vv.width : window.innerWidth, vh = vv ? vv.height : window.innerHeight;
    if (!(vw > 0 && vh > 0)) return;
    document.documentElement.style.setProperty('--app-h', Math.round(vh) + 'px');
    const s = safeInsets(), w = vw - s.l - s.r, h = vh - s.t - s.b, por = w / h < 1, app = $('app');
    app.classList.toggle('is-portrait', por);
    // よこ画面：画面の 形に 合わせて デザインの 大きさを かえる（たて長めなら 高さを、よこ長なら はばを のばす）
    const r = (w - 8) / (h - 8);
    const bw = por ? 420 : Math.max(1000, Math.min(1400, Math.round(620 * r)));
    const bh = por ? 740 : Math.max(620, Math.min(750, Math.round(1000 / r)));
    const sc = Math.min((w - 8) / bw, (h - 8) / bh);
    app.style.width = por ? '' : bw + 'px'; app.style.height = por ? '' : bh + 'px';
    app.style.setProperty('--bw', bw + 'px'); app.style.setProperty('--bh', bh + 'px');
    app.style.setProperty('--csL', Math.min(62, Math.floor((bh - 22) / 10 - 3)) + 'px');
    app.style.left = (s.l + w / 2) + 'px'; app.style.top = (s.t + h / 2) + 'px';
    app.style.transform = 'translate(-50%, -50%) scale(' + sc + ')';
}
['resize', 'pageshow', 'load'].forEach(t => window.addEventListener(t, fit));
window.addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => { fit(); resetZoomIfNeeded(); });
    visualViewport.addEventListener('scroll', () => { fit(); resetZoomIfNeeded(); });
}
document.addEventListener('gestureend', () => setTimeout(resetZoomIfNeeded, 50), { passive: true });
homeRefresh(); fsetRefresh(); fit();
setTimeout(() => { fit(); $('app').classList.add('is-ready'); }, 300);
</script>
