    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        * { touch-action: manipulation; -webkit-touch-callout: none; box-sizing: border-box; }
        [hidden] { display: none !important; }

        :root {
            --app-h: 100vh;
            --paper: #f6efe0;
            --card: #fffdf7;
            --ink: #2b3a35;
            --ink-soft: #6b7a74;
            --line: #e4d9c2;
            --green: #1f8a63;
            --green-dark: #166a4b;
            --green-pale: #e3f3ea;
            --gold: #f2b632;
            --gold-dark: #c98a12;
            --red: #d9534f;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
        }
        @supports (height: 100dvh) { :root { --app-h: 100dvh; } }

        html { background: var(--paper); }
        html, body { margin: 0; }
        body {
            height: var(--app-h);
            overflow: hidden;
            overscroll-behavior-y: none;
            padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
            color: var(--ink);
            font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif;
            font-weight: 500;
            /* 画面の大きさに合わせて、全体の文字の大きさを連続的に変える */
            font-size: clamp(13px, 1.5vmin + 8.2px, 22px);
            line-height: 1.5;
            -webkit-user-select: none; user-select: none;
            -webkit-text-size-adjust: 100%;
        }
        input, textarea { -webkit-user-select: text; user-select: text; font-family: inherit; }
        button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; border: 0; background: none; padding: 0; cursor: pointer; }
        h1, h2, p { margin: 0; }
        .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ---------- 全体のならび ---------- */
        #app {
            visibility: hidden;
            height: 100%;
            max-width: 46em;
            margin: 0 auto;
            padding: .7em .9em .6em;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: auto auto minmax(0, 1fr) auto;
            grid-template-areas: "top" "bank" "shelf" "cta";
            gap: .6em;
        }
        html.ready #app { visibility: visible; }

        @media (orientation: landscape) and (min-width: 600px) {
            #app {
                max-width: 74em;
                grid-template-columns: minmax(17em, 23em) minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr) auto;
                grid-template-areas: "top shelf" "bank shelf" "cta shelf";
                column-gap: 1em;
            }
            .bank { align-self: start; }
        }

        /* ---------- 上の帯 ---------- */
        .top { grid-area: top; display: flex; align-items: center; justify-content: space-between; min-width: 0; }
        .logo { display: flex; align-items: center; gap: .4em; min-width: 0; font-size: clamp(1em, 4.4vw, 1.25em); font-weight: 900; letter-spacing: .04em; color: var(--green-dark); white-space: nowrap; }
        .logo svg { width: 1.5em; height: 1.5em; display: block; flex: none; }
        .icon-btn {
            position: relative; width: 2.6em; height: 2.6em; min-width: 40px; min-height: 40px; flex: none;
            border-radius: 50%; background: var(--card); border: 2px solid var(--line); line-height: 0;
        }
        .icon-btn svg { position: absolute; left: 50%; top: 50%; width: 55%; height: 55%; transform: translate(-50%, -50%); }
        .icon-btn.off { opacity: .55; }

        .top-right { display: flex; align-items: center; gap: .5em; flex: none; }
        .grade-btn { min-height: 2.6em; min-width: 40px; padding: 0 .8em; border-radius: 1.3em; background: var(--card); border: 2px solid var(--line); font-weight: 900; color: var(--green-dark); white-space: nowrap; }

        /* ---------- ちょきんのカード ---------- */
        .bank {
            grid-area: bank; min-width: 0;
            background: var(--green); color: #fff;
            border-radius: 1.1em; padding: .7em .9em .8em;
            box-shadow: 0 .25em 0 var(--green-dark);
        }
        .month-nav { display: flex; align-items: center; justify-content: space-between; }
        .month-nav .m { font-weight: 900; font-size: 1.15em; letter-spacing: .05em; }
        .nav-btn { position: relative; width: 2.5em; height: 2.5em; min-width: 40px; min-height: 40px; border-radius: 50%; background: rgba(255,255,255,.18); line-height: 0; }
        .nav-btn svg { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); }
        .nav-btn:disabled { opacity: .25; cursor: default; }
        .bank-label { margin-top: .25em; text-align: center; font-weight: 700; font-size: .95em; opacity: .92; }
        .amount { text-align: center; font-weight: 900; line-height: 1.15; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .amount .num { font-size: 3.1em; letter-spacing: .01em; }
        .amount .yen { font-size: 1.3em; margin-left: .15em; }
        .amount-sub { text-align: center; font-size: .78em; font-weight: 700; opacity: .8; margin-top: -.1em; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; margin-top: .45em; }
        .stat { background: rgba(255,255,255,.16); border-radius: .7em; padding: .3em .5em; text-align: center; min-width: 0; }
        .stat .k { font-size: .78em; font-weight: 700; opacity: .9; white-space: nowrap; }
        .stat .v { font-weight: 900; font-size: 1.1em; white-space: nowrap; font-variant-numeric: tabular-nums; }

        .chart { display: grid; grid-template-columns: repeat(6, 1fr); gap: .35em; margin-top: .6em; height: 4.6em; }
        .bar-btn { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; min-width: 0; color: #fff; }
        .bar-area { flex: 1 1 0; min-height: 0; display: flex; align-items: flex-end; }
        .bar { width: 100%; min-height: 3px; border-radius: .3em .3em 0 0; background: rgba(255,255,255,.38); }
        .bar-btn.sel .bar { background: var(--gold); }
        .bar-lab { font-size: .72em; font-weight: 700; text-align: center; white-space: nowrap; opacity: .85; }
        .bar-btn.sel .bar-lab { opacity: 1; font-weight: 900; }
        @media (max-height: 470px) { .chart { display: none; } .amount .num { font-size: 2.5em; } }
        @media (orientation: portrait) and (max-height: 700px) { .chart { display: none; } }

        /* ---------- 本のリスト ---------- */
        .shelf { grid-area: shelf; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 2px solid var(--line); border-radius: 1.1em; overflow: hidden; }
        .group-h { padding: .5em .9em; font-size: 1em; font-weight: 900; color: var(--green-dark); border-bottom: 2px dashed var(--line); }
        .group-h.now { background: var(--green-pale); border-bottom: 2px solid #cfe6da; }
        .item.reading { background: #f6fbf8; }
        /* 月の 本が 多い ときに 出る「さがす・ならべかえ」 */
        .tools { flex: none; display: flex; align-items: center; gap: .5em; padding: .45em .7em; border-bottom: 2px dashed var(--line); }
        .tools .inp { flex: 1 1 0; min-width: 0; min-height: 2.5em; padding: .2em .7em; }
        .tool-btn { flex: none; min-height: max(2.5em, 40px); padding: .2em .8em; border-radius: 1.2em; background: #fff; border: 2px solid var(--line); font-weight: 700; font-size: .85em; white-space: nowrap; }
        /* 1年の まとめ・記録の 保存 */
        .year-nav { display: flex; align-items: center; justify-content: space-between; gap: .5em; }
        .year-nav .y { font-weight: 900; font-size: 1.15em; text-align: center; line-height: 1.25; }
        .year-nav .y small { display: block; font-size: .7em; font-weight: 700; color: var(--ink-soft); }
        .year-nav .nav-btn { background: var(--green-pale); }
        .year-sum { text-align: center; margin-top: .4em; }
        .year-sum .k { font-weight: 700; font-size: .9em; color: var(--ink-soft); }
        .year-sum .v { font-weight: 900; font-size: 2.4em; line-height: 1.2; color: var(--green-dark); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .year-sum .v small { font-size: .45em; margin-left: .15em; }
        .year-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; margin-top: .4em; }
        .year-stats div { background: var(--green-pale); border-radius: .7em; padding: .3em .5em; text-align: center; font-weight: 900; white-space: nowrap; }
        .year-stats small { display: block; font-size: .75em; font-weight: 700; color: var(--ink-soft); }
        .ychart { display: grid; grid-template-columns: repeat(12, 1fr); gap: .25em; height: 6em; margin-top: .6em; }
        .ychart .bar-btn { color: var(--ink); }
        .ychart .bar { background: #bfe0cf; }
        .ychart .bar-btn.sel .bar { background: var(--gold); }
        .ychart .bar-lab { font-size: .68em; opacity: 1; color: var(--ink-soft); }
        .ychart .bar-btn.sel .bar-lab { color: var(--ink); }
        .sec-title { margin-top: .8em; padding-top: .6em; border-top: 2px dashed var(--line); font-weight: 900; color: var(--green-dark); }
        .y-col { min-width: 0; }
        .chart-mode { display: flex; justify-content: center; gap: .4em; margin-top: .6em; }
        .mode-btn { min-height: max(2.2em, 36px); padding: .1em 1em; border-radius: 1.2em; background: #fff; border: 2px solid var(--line); font-weight: 700; font-size: .85em; }
        .mode-btn.on { background: var(--green); border-color: var(--green-dark); color: #fff; }
        .ychart .bar-btn { position: relative; }
        .bar-val { position: absolute; left: 0; right: 0; top: -.1em; text-align: center; font-size: .68em; font-weight: 900; color: var(--green-dark); }
        .owner-field { margin-top: .5em; }
        .owner-name { margin-top: .4em; font-weight: 900; }
        .name-row { display: flex; gap: .5em; margin-top: .2em; }
        .name-row .inp { flex: 1 1 0; min-width: 0; }
        .more-btn { display: block; width: 100%; margin-top: .4em; }
        .cands { display: flex; flex-direction: column; gap: .4em; margin-top: .3em; max-height: calc(var(--app-h) * .4); overflow-y: auto; overflow-x: hidden; }
        .cand { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: .6em; text-align: left; padding: .45em .7em; border-radius: .8em; background: #fff; border: 2px solid var(--line); }
        .cand .c-t { grid-column: 1; font-weight: 900; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 1.35; }
        .cand .c-s { grid-column: 1; font-size: .78em; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cand .c-p { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-weight: 900; color: var(--green-dark); white-space: nowrap; }
        @media (orientation: landscape) and (max-height: 800px) {   /* 横長で 高さが 少ない とき：まとめを 左、保存を 右に */
            #yearOv .sheet { max-width: 52em; }
            .year-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); column-gap: 1.4em; align-items: start; }
            .year-body .sec-title { margin-top: 0; padding-top: 0; border-top: 0; }
        }
        .backup-btns { display: grid; grid-template-columns: 1fr; gap: .5em; margin-top: .5em; }
        .backup-btns .sub-btn { width: 100%; text-align: center; word-break: keep-all; }
        /* 感想が くわしく ない 本：赤くなって、お金に ならない */
        .item.weak { background: #fdf1f0; }
        .item.weak .it-price { color: var(--red); }
        .it-weak { font-size: .8em; font-weight: 700; color: var(--red); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .it-since { font-size: .8em; color: var(--ink-soft); white-space: nowrap; }
        .badge { display: inline-block; padding: .35em .8em; border-radius: 1.2em; font-weight: 900; font-size: .82em; white-space: nowrap; }
        .badge.go { background: var(--gold); color: #4a3200; box-shadow: 0 .15em 0 var(--gold-dark); }
        .badge.wait { background: #eee7d6; color: var(--ink-soft); }
        .empty.small { height: auto; padding: 1.6em 1.4em; }
        .list { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1em 1.4em; color: var(--ink-soft); font-weight: 700; gap: .6em; }
        .empty svg { width: 4.2em; height: 4.2em; opacity: .8; }

        .item {
            display: grid; grid-template-columns: 2.9em minmax(0, 1fr) auto; column-gap: .7em; align-items: center;
            width: 100%; text-align: left; padding: .55em .9em; border-bottom: 1px solid var(--line);
        }
        .item:active { background: #f7f1e2; }
        .cover {
            position: relative; width: 2.9em; height: 3.8em; border-radius: .25em .45em .45em .25em;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            color: #fff; font-weight: 900; font-size: 1em; box-shadow: .12em .12em 0 rgba(0,0,0,.12);
        }
        .cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .42em; background: rgba(0,0,0,.18); }
        .cover span { font-size: 1.5em; line-height: 1; padding-left: .25em; }
        .it-main { min-width: 0; }
        .it-title { font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .it-author { font-size: .8em; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.5em; }
        .it-line { display: flex; align-items: center; gap: .5em; min-width: 0; }
        .stars { display: flex; flex: none; gap: .05em; }
        .stars svg { width: .95em; height: .95em; display: block; }
        .it-comment { font-size: .85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .it-right { text-align: right; white-space: nowrap; min-width: 5.4em; }
        .it-price { font-weight: 900; color: var(--green-dark); font-size: 1.1em; font-variant-numeric: tabular-nums; }
        .it-date { font-size: .78em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

        /* ---------- 下のボタン ---------- */
        .cta { grid-area: cta; min-width: 0; }
        .primary {
            display: flex; align-items: center; justify-content: center; gap: .5em;
            width: 100%; min-height: 3.1em; padding: .5em 1em; border-radius: 1em;
            background: var(--gold); color: #4a3200; font-weight: 900; font-size: 1.15em; letter-spacing: .04em;
            box-shadow: 0 .22em 0 var(--gold-dark);
        }
        .primary:active { transform: translateY(.12em); box-shadow: 0 .1em 0 var(--gold-dark); }
        .primary:disabled { background: #e2dccb; color: #9a927d; box-shadow: 0 .22em 0 #cfc7b2; cursor: default; }
        .primary svg { width: 1.3em; height: 1.3em; flex: none; }
        .foot { overflow: hidden; text-overflow: ellipsis; margin-top: .5em; text-align: center; font-size: .68em; color: var(--ink-soft); white-space: nowrap; }

        /* ---------- かさねて出す画面 ---------- */
        .ov {
            position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h); z-index: 10;
            padding: calc(.7em + var(--safe-t)) calc(.7em + var(--safe-r)) calc(.7em + var(--safe-b)) calc(.7em + var(--safe-l));
            background: rgba(38, 52, 46, .55);
            display: flex; align-items: center; justify-content: center;
        }
        .sheet {
            width: 100%; max-width: 30em; max-height: 100%;
            background: var(--card); border-radius: 1.2em; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: .5em; padding: .6em .7em .6em 1em; background: var(--green-pale); }
        .sheet-head h2 { font-size: 1.1em; font-weight: 900; color: var(--green-dark); }
        .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: .8em 1em 1em; }
        .close-btn { position: relative; width: 2.4em; height: 2.4em; min-width: 40px; min-height: 40px; flex: none; border-radius: 50%; background: #fff; border: 2px solid var(--line); line-height: 0; }
        .close-btn svg { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); }

        .sub-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.7em; padding: .4em 1em; border-radius: .9em; background: #fff; border: 2px solid var(--line); font-weight: 700; }
        .sub-btn.danger { color: var(--red); border-color: #efc7c5; }
        .row { display: flex; gap: .6em; }
        .row > * { flex: 1 1 0; min-width: 0; }

        /* 読みとり */
        .scan-box { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: calc(var(--app-h) * .42); margin: 0 auto; background: #20262a; border-radius: .9em; overflow: hidden; }
        .scan-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .guide { position: absolute; left: 7%; right: 7%; top: 16%; bottom: 16%; border: 3px solid rgba(255,255,255,.9); border-radius: .7em; box-shadow: 0 0 0 100vmax rgba(0,0,0,.28); pointer-events: none; }
        .guide.text { left: 4%; right: 4%; top: 30%; bottom: 30%; }   /* ISBNの 数字の 行を 読む とき：よこ長 */
        .cam-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1em; color: #fff; font-weight: 700; }
        .pills { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; margin-top: .6em; }
        .pill { display: flex; align-items: center; gap: .45em; padding: .4em .6em; border-radius: .8em; background: #f1ead9; font-weight: 700; font-size: .9em; min-width: 0; }
        .pill .dot { flex: none; width: 1.15em; height: 1.15em; border-radius: 50%; border: 3px solid #cbbf9f; background: #fff; }
        .pill.on { background: var(--green-pale); color: var(--green-dark); }
        .pill.on .dot { border-color: var(--green); background: var(--green); }
        .pill span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hint { margin-top: .55em; min-height: 3em; text-align: center; font-weight: 700; }
        .hint.warn { color: var(--red); }
        .scan-actions { display: flex; flex-wrap: wrap; gap: .5em; justify-content: center; margin-top: .4em; }
        .scan-side { min-width: 0; }
        /* 横長で 高さが 少ない 画面では、カメラを 左、せつめいと ボタンを 右に ならべる */
        @media (orientation: landscape) and (max-height: 560px) {
            #scanOv .sheet { max-width: 50em; }
            .scan-body:not(.num) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 1em; align-items: center; }
            .scan-body .scan-box { max-height: calc(var(--app-h) - 7em); }
            .scan-body .pills { margin-top: 0; }
        }

        /* 入力 */
        .field { margin-top: .7em; }
        .field label, .field .lab { display: block; font-weight: 900; font-size: .9em; color: var(--green-dark); margin-bottom: .2em; }
        .inp { width: 100%; min-height: 2.8em; padding: .4em .7em; border-radius: .7em; border: 2px solid var(--line); background: #fff; color: var(--ink); font-size: max(16px, 1em); font-weight: 700; }
        .inp:focus { outline: none; border-color: var(--green); }
        .inp::placeholder { color: #b3ab97; font-weight: 500; }
        .note { font-size: .8em; color: var(--ink-soft); margin-top: .2em; min-height: 1.5em; }
        .note.warn { color: var(--red); font-weight: 700; }
        .book-head { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: .8em; align-items: center; }
        .book-head .cover { width: 3.6em; height: 4.8em; }
        .book-head .field { margin-top: 0; }
        .price-fixed { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .5em; row-gap: 0; min-height: 2.8em; padding: .25em .7em; border-radius: .7em; background: var(--green-pale); }
        .price-fixed b { white-space: nowrap; font-size: 1.5em; font-weight: 900; color: var(--green-dark); font-variant-numeric: tabular-nums; }
        .price-fixed small { white-space: nowrap; font-size: .78em; color: var(--ink-soft); }
        .price-wrap { display: flex; align-items: center; gap: .4em; }
        .price-wrap .inp { flex: 1 1 0; min-width: 0; }
        .price-wrap span { font-weight: 900; }
        .star-in { display: flex; gap: .2em; }
        .star-btn { position: relative; width: 2.9em; height: 2.9em; min-width: 44px; min-height: 44px; line-height: 0; }
        .star-btn svg { position: absolute; left: 50%; top: 50%; width: 78%; height: 78%; transform: translate(-50%, -50%); }
        .chips { display: flex; flex-wrap: wrap; gap: .4em; margin-bottom: .4em; }
        .chip { min-height: 2.3em; padding: .2em .8em; border-radius: 1.2em; background: var(--green-pale); color: var(--green-dark); font-weight: 700; font-size: .85em; }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: .7em; }
        .f-col { min-width: 0; }
        @media (orientation: landscape) and (max-height: 800px) {
            #formOv .sheet { max-width: 54em; }
            .form-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 1.4em; align-items: start; }
            .form-body .f-col:last-child .field:first-child { margin-top: 0; }
        }
        .foot-btns { display: flex; flex-direction: column; gap: .5em; }
        @media (orientation: landscape) and (max-height: 800px) {
            .foot-btns { flex-direction: row; align-items: stretch; }
            .foot-btns .row { flex: 0 0 auto; }
            .foot-btns .primary { flex: 1 1 0; width: auto; }
        }
        @media (orientation: landscape) and (max-height: 560px) { #fWarn { min-height: 0; } .sheet-foot { padding-top: .4em; padding-bottom: .6em; } }
        .sheet-foot { flex: none; padding: .6em 1em .9em; border-top: 2px dashed var(--line); }

        /* しらべ中のくるくる */
        .spin { display: inline-block; width: 1em; height: 1em; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; vertical-align: -.15em; margin-right: .3em; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* たしかめ・できた */
        .dialog { width: 100%; max-width: 22em; background: var(--card); border-radius: 1.2em; padding: 1.2em 1.1em 1.1em; text-align: center; }
        .dialog p { font-weight: 900; font-size: 1.1em; margin-bottom: .9em; white-space: pre-line; }
        /* 分かち書きの 文は、ことばの とちゅうで 行を かえない */
        .dialog p, .hint, .empty p, .note, .cam-msg { word-break: keep-all; overflow-wrap: anywhere; }
        .grade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6em; }
        .grade-grid button { min-height: 3.4em; border-radius: 1em; background: var(--green-pale); border: 2px solid #cfe6da; font-weight: 900; font-size: 1.25em; color: var(--green-dark); }
        .grade-grid button.sel { background: var(--green); color: #fff; border-color: var(--green-dark); }
        .done { position: relative; width: 100%; max-width: 24em; background: var(--card); border-radius: 1.4em; padding: 1.3em 1.1em 1.1em; text-align: center; overflow: hidden; }
        .done .ttl { font-weight: 900; font-size: 1.2em; color: var(--green-dark); }
        .done .book { font-weight: 700; margin-top: .2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .done .plus { font-weight: 900; font-size: 3em; line-height: 1.2; color: var(--gold-dark); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .done .sum { font-weight: 700; margin: .1em 0 .9em; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .done .sum b { font-weight: 900; font-size: 1.3em; color: var(--green-dark); }
        .coins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .coin { position: absolute; top: -2.4em; width: 1.9em; height: 1.9em; border-radius: 50%; background: var(--gold); border: .2em solid var(--gold-dark); opacity: 0; }
        .coin::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: .12em solid rgba(255,255,255,.75); }
        .done > *:not(.coins) { position: relative; }
    </style>
</head>
<body>
    <div id="app">
        <header class="top">
            <h1 class="logo">
                <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#1f8a63"/><circle cx="24" cy="14.5" r="7.5" fill="#f2b632" stroke="#c98a12" stroke-width="2"/><path d="M6 25c6-2.6 12-2.6 18 1.2 6-3.8 12-3.8 18-1.2v14c-6-2.6-12-2.6-18 1.2-6-3.8-12-3.8-18-1.2z" fill="#fffdf7"/><path d="M24 26.2v14" stroke="#1f8a63" stroke-width="2"/></svg>
                <span data-k="[読:どく][書:しょ]ちょきん">読書ちょきん</span>
            </h1>
            <div class="top-right">
            <button class="icon-btn" id="menuBtn" type="button" aria-label="1年の まとめ と 記録の 保存">
                <svg viewBox="0 0 24 24" fill="#2b3a35"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="6" width="4" height="15" rx="1"/><rect x="17" y="2.5" width="4" height="18.5" rx="1"/></svg>
            </button>
            <button class="grade-btn" id="gradeBtn" type="button" aria-label="学年を えらぶ"></button>
            <button class="icon-btn" id="soundBtn" type="button" aria-label="音を 出す・消す">
                <svg viewBox="0 0 24 24" fill="none" stroke="#2b3a35" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="#2b3a35"/><path id="soundWave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path id="soundX" d="M16 9.5l5 5M21 9.5l-5 5" hidden/></svg>
            </button>
            </div>
        </header>

        <section class="bank" aria-label="ちょきん">
            <div class="month-nav">
                <button class="nav-btn" id="prevBtn" type="button" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
                <div class="m" id="monthLabel"></div>
                <button class="nav-btn" id="nextBtn" type="button" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>
            </div>
            <p class="bank-label" id="bankLabel"></p>
            <div class="amount"><span class="num" id="amountNum">0</span><span class="yen">円</span></div>
            <p class="amount-sub" data-k="[読:よ]んだ[本:ほん]の [値:ね][段:だん]の [合:ごう][計:けい]">読んだ本の ねだんの 合計</p>
            <div class="stats">
                <div class="stat"><div class="k" data-k="[読:よ]んだ[本:ほん]">読んだ本</div><div class="v" id="countV">0さつ</div></div>
                <div class="stat"><div class="k" data-k="これまでの [合:ごう][計:けい]">これまでの 合計</div><div class="v" id="totalV">0円</div></div>
            </div>
            <div class="chart" id="chart"></div>
        </section>

        <section class="shelf">
            <h2 class="sr-only">読んだ本の きろく</h2>
            <div class="tools" id="tools" hidden>
                <input class="inp" id="searchInp" type="text" autocomplete="off" maxlength="30" placeholder="本の 名前で さがす" data-k-ph="[本:ほん]の [名:な][前:まえ]で [探:さが]す">
                <button class="tool-btn" id="sortBtn" type="button"></button>
            </div>
            <div class="list" id="list"></div>
        </section>

        <div class="cta">
            <button class="primary" id="addBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="#4a3200" stroke-width="2.4" stroke-linecap="round"><path d="M3 6v12M7 6v12M10.5 6v12M14 6v12M17.5 6v12M21 6v12"/></svg>
                <span data-k="[本:ほん]を [登:とう][録:ろく]する">本を とうろくする</span>
            </button>
            <p class="foot"><span id="ownerFoot"></span>読書ちょきん ｜ ver.1.10 ｜ ota tools</p>
        </div>
    </div>

    <!-- バーコードの読みとり -->
    <div class="ov" id="scanOv" hidden>
        <div class="sheet">
            <div class="sheet-head">
                <h2 id="scanTitle">バーコードを 読みとる</h2>
                <button class="close-btn" type="button" data-close="scan" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="#2b3a35" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
            </div>
            <div class="sheet-body scan-body" id="scanBody">
                <div class="scan-box" id="camBox">
                    <video id="video" playsinline muted autoplay></video>
                    <div class="guide" id="guide"></div>
                    <div class="cam-msg" id="camMsg" hidden></div>
                </div>
                <div class="scan-side">
                    <div id="camInfo">
                        <div class="pills">
                            <div class="pill" id="pillIsbn"><i class="dot"></i><span id="pillIsbnText">上の バーコード</span></div>
                            <div class="pill" id="pillPrice"><i class="dot"></i><span data-k="[下:した]の バーコード">下の バーコード</span></div>
                        </div>
                        <p class="hint" id="scanHint"></p>
                    </div>
                    <div id="numPane" hidden>
                        <div class="field">
                            <label for="isbnInp" data-k="バーコードの [下:した]の [数:すう][字:じ]（978 から [始:はじ]まる 13けた）">バーコードの 下の数字</label>
                            <input class="inp" id="isbnInp" type="text" inputmode="numeric" autocomplete="off" maxlength="17" placeholder="978…">
                            <p class="note" id="isbnNote"></p>
                        </div>
                        <button class="primary" id="isbnGo" type="button" data-k="[調:しら]べる">しらべる</button>
                    </div>
                    <div id="namePane" hidden>
                        <div class="name-row">
                            <input class="inp" id="nameInp" type="search" autocomplete="off" maxlength="40" placeholder="本の 名前を 打ってね" data-k-ph="[本:ほん]の [名:な][前:まえ]を [打:う]ってね">
                        </div>
                        <p class="note" id="nameNote"></p>
                        <div class="cands" id="cands"></div>
                        <button class="sub-btn more-btn" id="nameGo" type="button" hidden data-k="ないときは、もっと [広:ひろ]く [調:しら]べる">ないときは、もっと 広く 調べる</button>
                    </div>
                    <div class="scan-actions">
                        <button class="sub-btn" id="camSwitch" type="button" hidden data-k="カメラを [切:き]りかえる">カメラを 切りかえる</button>

<script>
(function () {

    /* ============ 小さな道具 ============ */
    function $(id) { return document.getElementById(id); }

    /* 今の 時刻：インターネットに つながって いれば、このページの サーバーの 時刻を 使う。
       端末の 日付を すすめても「1日に ちょきん できる 数」は ふえない。つながらない ときは 端末の 時刻
       （ただし、これまでに 見た いちばん 新しい 時刻より 前には もどらない） */
    var clockOffset = 0;
    function nowMs() {
        var t = Date.now() + clockOffset, mx = (window.__chokinData && window.__chokinData.opts.maxT) || 0;

    function syncClock() {
        if (!/^https?:$/.test(location.protocol)) return Promise.resolve();

            var d = Date.parse(r.headers.get('Date') || '');

    function ymOf(dateStr) { return dateStr.slice(0, 7); }

    function toHalf(s) { return String(s).replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }

    var COVER_COLORS = ['#3d85c6', '#8e6bbf', '#2a9d8f', '#d98c1f', '#5b8c3a', '#6b7fd1', '#b0803a', '#3fa0b5'];   // 赤は「まだ お金に ならない本」だけに 使う
    var WEAK_RED = '#d9534f';

        var h = 0, s = String(key || '');
        for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;

    }
    function firstChar(title) { var t = String(title || '').trim(); return t ? Array.from(t)[0] : '本'; }

        el.querySelector('span').textContent = firstChar(book.title);
    }
    var STAR_PATH = 'M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z';

        var t = Date.now() + clockOffset; if (!data.opts.maxT || t > data.opts.maxT) data.opts.maxT = t;

    }

    /* ============ 学年と ことば ============
       画面の 文は「[漢字:よみ]」の 形で 書いておき、えらんだ 学年までに 習う 漢字だけを 漢字で 出す。
       習っていない 漢字は 読みの ひらがなに する（例：[貯:ちょ][金:きん] → 1〜4年「ちょ金」、5・6年「貯金」）。
       学年は 学年別漢字配当表（2020年度から）。ここに ない 漢字は、どの学年でも ひらがなに なる。 */
    var KANJI_GRADE = {};
    ['一円音下学金月見字出上人生中日入年白文本名力先',          // 1年
     '何画記計言後行合今自書心数星切前知直読分新多高少番理同広', // 2年
     '感始使写取終消想調度登面号由定短打',                          // 3年
     '録選残好初最順席以',                                      // 4年

     '段値冊裏閉存探誌'].forEach(function (list, i) {             // 6年
        Array.from(list).forEach(function (ch) { KANJI_GRADE[ch] = i + 1; });
    });
    function Kg(str, grade) {
        return String(str).replace(/\[([^:\]]+):([^\]]+)\]/g, function (_, kanji, yomi) {
            var need = 0;
            Array.from(kanji).forEach(function (ch) { var g = KANJI_GRADE[ch] || 9; if (g > need) need = g; });
            return need <= grade ? kanji : yomi;
        });
    }
    function K(str) { return Kg(str, data.opts.grade || 0); }
    function lo() { return data.opts.grade >= 1 && data.opts.grade <= 2; }      // 1・2年生（感想の 長さなどを やさしくする）
    function applyLang() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (el) { el.textContent = K(el.dataset.k); });
        Array.prototype.forEach.call(document.querySelectorAll('[data-k-ph]'), function (el) { el.placeholder = K(el.dataset.kPh); });
        $('gradeBtn').textContent = data.opts.grade ? data.opts.grade + '年' : '年';
        var sb = $('sortBtn'), keep = sb.textContent, wide = 0;       // ならび順の ボタン：いちばん 長い 文に はばを 合わせて、おしても ずれない ように
        sb.style.minWidth = ''; $('tools').hidden = false;
        SORTS.forEach(function (t) { sb.textContent = K(t); wide = Math.max(wide, sb.getBoundingClientRect().width); });
        sb.textContent = keep; if (wide) sb.style.minWidth = Math.ceil(wide) + 'px';
    }
    function dateAdd(dateStr, n) {

    }
    function dayOfAt(at) { var d = new Date(at || 0); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

    /* 本の しゅるい（下の バーコードの 4けた）と ねだんから、先生に 見てほしい 本に しるしを つける。
       子どもの 画面には 出さない。 1けた目：0一般 1教養 2実用 3専門 5女性 7高校の学習参考書 8児童 ／ 2けた目：5辞典 6図鑑 7絵本 9コミック */
    function susOf(ccode, price, grade) {
        var out = [], target = ccode ? ccode[0] : '', shape = ccode ? ccode[1] : '';
        if (target === '3') out.push('senmon');
        if (target === '7') out.push('koukou');
        if (grade <= 2 && '0125'.indexOf(target) >= 0 && target !== '') out.push('ippan');
        if (price >= 3000 && shape !== '6' && shape !== '5') out.push('takai');
        return out;
    }

    /* ============ 音 ============ */
    var actx = null;
    function audio() {

            var b = actx.createBuffer(1, 1, actx.sampleRate), s = actx.createBufferSource();

        if (actx.state !== 'running') actx.resume();
        return actx;
    }
    ['pointerdown', 'touchend', 'keydown'].forEach(function (t) {
        window.addEventListener(t, function () { if (data.opts.sound) audio(); }, { passive: true });
    });

    function tone(freq, start, len, vol, type) {

        o.type = type || 'triangle'; o.frequency.value = freq;

    /* ============ メインの画面 ============ */
    var nowYm = ymOf(todayStr());

    function shownBooks(all) {
        var q = toHira(toHalf(listView.q).toLowerCase()).replace(/[\s　]/g, '');

    function cleanBook(b) {                                         // ファイルの 中身を そのまま 信じない

            sus: Array.isArray(b.sus) ? b.sus.filter(function (x) { return typeof x === 'string'; }).slice(0, 5) : [], weak: !!b.weak };

    /* ---- 保存ファイルの 中身を 読めなく する・書きかえを 見つける ----
       ファイルは「しるし.たね.けんさの 文字.中身」の 形。中身は 記録を かきまぜて 文字に したもので、
       メモ帳などで 開いても 読めない。1文字でも 書きかえると、けんさの 文字と 合わなくなり、もどせない。
       （アプリの 中の しくみを 読みとける 人には 破れる。気軽な 書きかえを ふせぐ ための もの） */
    var FILE_MARK = 'DCHK1';
    var FILE_KEY = [111, 116, 97, 45, 116, 111, 111, 108, 115, 47, 98, 111, 111, 107, 47, 99, 104, 111, 107, 105, 110, 35, 55, 51, 49].map(function (c) { return String.fromCharCode(c); }).join('');

        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

        for (i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i] ^ ks());

    function unpackFile(text) {

    }
    function importText(text) {

    /* ============ 本を しらべる（openBD → 国立国会図書館サーチ） ============ */
    function fetchText(url, ms) {

        }, function (e) { clearTimeout(timer); throw e; });
    }
    function cleanName(s) {
        return toHalf(String(s || ''))
            .replace(/[／\/].*$/, function (m) { return /^[／\/]\s*(著|作|文|絵|訳|編|監修|原作|イラスト|写真|さく|え|ぶん|やく)/.test(m) ? '' : m.replace(/[／\/]/, ''); })
            .replace(/,?\s*\d{4}-\d{0,4}\s*$/, '')
            .replace(/[,，]\s*/g, '')
            .replace(/[\s　]+(著|作|文|絵|訳|編|監修|原作|さく|え|ぶん|やく)$/, '')
            .replace(/[\s　]+/g, '')

        return out.slice(0, 3).join('、');

    function lookupOpenBD(isbn) {
        return fetchText('https://api.openbd.jp/v1/get?isbn=' + isbn, 7000).then(function (r) {
            var j = JSON.parse(r.text), x = j && j[0];
            if (!x) return null;
            var s = x.summary || {}, title = String(s.title || '').trim();
            if (title && s.volume) title += ' ' + String(s.volume).trim();
            var names = [];
            try {
                asArray(x.onix.DescriptiveDetail.Contributor).forEach(function (c) {
                    if (c && c.PersonName && c.PersonName.content) names.push(c.PersonName.content);
                });
            } catch (e) {}
            if (!names.length && s.author) names = String(s.author).split(/[／\/][^\s　]*[\s　]*/).filter(Boolean);
            var price = 0;
            try {
                asArray(x.onix.ProductSupply.SupplyDetail.Price).forEach(function (p) {
                    var n = parseInt(p && p.PriceAmount, 10); if (!price && n > 0) price = n;

        });

    function parseNdl(text) {
        var doc = new DOMParser().parseFromString(text, 'text/xml');
        var items = Array.prototype.slice.call(doc.getElementsByTagName('item'));
        if (!items.length) return null;
        function vals(it, tag) { return Array.prototype.map.call(it.getElementsByTagName(tag), function (e) { return e.textContent; }); }
        var pick = items.filter(function (it) { return vals(it, 'dcndl:price').length; })[0] || items[0];
        var title = (vals(pick, 'dc:title')[0] || vals(pick, 'title')[0] || '').trim();
        var vol = (vals(pick, 'dcndl:volume')[0] || '').trim();
        if (title && vol) title += ' ' + vol;
        var price = 0, m = /(\d[\d,]*)\s*円/.exec(toHalf(vals(pick, 'dcndl:price')[0] || ''));
        if (m) price = parseInt(m[1].replace(/,/g, ''), 10) || 0;
        return { title: toHalf(title), author: joinNames(vals(pick, 'dc:creator')), price: price };

    function tick(engine, gen) {
        if (gen !== scan.gen || !scan.open) return;
        var textMode = scan.mode === 'text';
        var next = function () { scan.timer = setTimeout(function () { tick(engine, gen); }, textMode ? 250 : 110); };

    /* 文字として 読んだ けっか。ISBN は 同じ数字を 2回 読めたら 本物と みなす（けんさ数字も 合っている ものだけ） */
    function handleText(res) {
        if (!res || Date.now() < scan.dupUntil) return;

                scan.isbn = res.isbn; sndRead(); paintPills();
                scan.pending = lookup(res.isbn);
                scan.deadline = Date.now() + 400;
                setHint(K('[読:よ]めた！'));
            }
        }

    }

    function handleCodes(codes) {
        if (Date.now() < scan.dupUntil) return;                          // 「もう してあるよ」を 見せている 間は 待つ

            if (!eanOk(c)) return;
            scan.seen[c] = (scan.seen[c] || 0) + 1;
            if (scan.seen[c] < 2) return;
            if (isIsbnCode(c) && !scan.isbn) {
                if (findByIsbn(c)) { setHint(K('この[本:ほん]は もう [登:とう][録:ろく] してあるよ。'), true); scan.seen = {}; scan.price = 0; scan.ccode = ''; scan.dupUntil = Date.now() + 2500; paintPills(); return; }
                scan.isbn = c; sndRead(); paintPills();
                scan.pending = lookup(c);
                scan.deadline = Date.now() + 3500;
                if (!scan.price) setHint(K('[読:よ]めた！ [下:した]の バーコードも [写:うつ]してね。'));

    /* ---- 本の 名前の 一覧（bookdata/titles.txt。約8.8万冊）から、打った ことばを ふくむ 本を さがす ----

    var titlesPromise = null, titleList = null;
    function normT(t) {

    /* 本の 名前で 国立国会図書館サーチを しらべて、こうほを 出す。えらぶと 名前・書いた人・ねだんが 入る */
    var nameGen = 0;
    function searchByName() {
        var q = $('nameInp').value.trim(), note = $('nameNote'), box = $('cands'), gen = ++nameGen;
        box.textContent = ''; note.classList.remove('warn');
        if (Array.from(q).length < 2) { note.classList.add('warn'); note.textContent = K('[本:ほん]の [名:な][前:まえ]を 2[文:も][字:じ][以:い][上:じょう] [入:い]れてね。'); return; }
        note.innerHTML = '<i class="spin"></i>' + K('[調:しら]べています…');
        var url = 'https://ndlsearch.ndl.go.jp/api/opensearch?dpid=iss-ndl-opac&cnt=40&title=' + encodeURIComponent(q);
        fetchText(url, 9000).then(function (r) {
            if (r.status === 429) return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return fetchText(url, 9000); });
            return r;
        }).then(function (r) {
            if (gen !== nameGen) return;
            if (r.status !== 200) throw new Error('status ' + r.status);
            var list = parseNdlList(r.text);
            showCands(list.slice(0, 15), K('[見:み]つかりませんでした。[名:な][前:まえ]を [短:みじか]く して [調:しら]べてみてね。'));

    function parseNdlList(text) {
        var doc = new DOMParser().parseFromString(text, 'text/xml'), out = [], seen = {};

        Array.prototype.forEach.call(doc.getElementsByTagName('item'), function (it) {
            var isbn = '';
            Array.prototype.forEach.call(it.getElementsByTagName('dc:identifier'), function (e) {
                if (isbn || !/ISBN/.test(e.getAttribute('xsi:type') || '')) return;
                var d = toHalf(e.textContent).replace(/[^0-9Xx]/g, '');
                if (d.length === 10) d = isbn10to13(d);
                if (d.length === 13 && eanOk(d)) isbn = d;
            });
            var title = toHalf((vals(it, 'dc:title')[0] || vals(it, 'title')[0] || '').trim()), vol = (vals(it, 'dcndl:volume')[0] || '').trim();
            if (!title) return;

                year: ((vals(it, 'dcterms:issued')[0] || vals(it, 'dc:date')[0] || '').match(/\d{4}/) || [''])[0], price: price });
        });

    var form = { mode: 'new', edit: null, reading: null, isbn: '', ccode: '', stars: 0, lockedPrice: 0, priceSrc: '', gen: 0, touched: {} };

    /* 感想の チェック。よければ ''、だめなら 子どもに 見せる 文を 返す。
       ・でたらめな 打ち方（同じ字の くり返し、あいうえお順、ローマ字の ままなど）は 通さない
       ・「おもしろかった」「たのしかった」のような、どの本にも 言える ことばだけ では 通さない */
    function normC(s) { return toHalf(String(s || '')).replace(/[\s　、。，．,.!！?？…・「」『』（）()〜~]/g, ''); }
    function toHira(s) { return s.replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
    var GOJUON = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん';
    var GOJUON_COL = 'あかさたなはまやらわ';
    function isGibberish(c) {
        var chars = Array.from(c), uniq = {}, i;
        chars.forEach(function (ch) { uniq[ch] = 1; });
        if (/(.)\1{3,}/.test(c)) return true;                                     // ああああ
        if (/(.{2,4})\1{2,}/.test(c)) return true;                                // あいあいあい
        if (chars.length >= 5 && Object.keys(uniq).length <= 2) return true;
        if (!/[ぁ-んァ-ヶ一-龠々]/.test(c)) return true;                           // 数字や 記号だけ
        var lat = c.replace(/[ａ-ｚＡ-Ｚ]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); });
        if (/[;:@#$%&*=+_|\\^`<>{}\[\]；：＠＃＄％＆＊＝＋＿｜＼＾｀＜＞｛｝［］]/.test(c)) return true;   // キーボードを たたいた ときの 記号
        var stray = [], re = /[a-zA-Z]+/g, mm;                                    // 1〜2文字だけの 小文字が ひらがなに くっついて いる ところ
        while ((mm = re.exec(lat))) {
            var w = mm[0], prev = lat.charAt(mm.index - 1), next = lat.charAt(mm.index + w.length);
            if (w.length <= 2 && w === w.toLowerCase() && (/[ぁ-ん]/.test(prev) || /[ぁ-ん]/.test(next))) stray.push(w);
        }
        if (stray.length >= 2) return true;                                       // ひらがなの あいだに 小文字が まざる（ｊんわ…）
        if (stray.some(function (x) { return !/[aeiouy]/.test(x); })) return true;  // 母音の ない 小文字が ひらがなに くっつく（ふじこlp）
        var runs = lat.match(/[a-zA-Z]{3,}/g) || [];
        for (i = 0; i < runs.length; i++) {                                       // 母音の ほとんど ない 英字（asdfgh…）
            var vow = (runs[i].match(/[aeiouyAEIOUY]/g) || []).length;
            if (runs[i].length >= 4 && vow / runs[i].length < 0.15) return true;
        }
        var h = toHira(c);
        for (i = 0; i + 4 <= h.length; i++) {                                     // あいうえ…、あかさた… の 順
            var part = h.substr(i, 4);
            if (GOJUON.indexOf(part) >= 0 || GOJUON_COL.indexOf(part) >= 0) return true;
        }
        var kana = h.match(/[ぁ-んー]/g) || [], adan = 0;                          // キーを ただ たたいた とき（あかさたな…ばかり）
        kana.forEach(function (ch) { if (GOJUON_COL.indexOf(ch) >= 0) adan++; });
        if (kana.length >= 6 && adan / kana.length >= 0.85) return true;

        return ks.n >= 5 && ks.score < (ks.n < KANA_SHORT ? KANA_LIMIT_SHORT : KANA_LIMIT);
    }

    /* ---- ひらがなの「つながりやすさ」 ----
       本物の 日本語の 文（ブログ・ニュース・小説・童話を ひらがなに したもの 約600万字）から、
       「この2文字の 次に この字が 来やすいか」を 数えた 表を、ファイルの いちばん下に 入れてある。
       文の 中の つながりが 平均して どのくらい 自然かを 点数に して、低すぎる ものを でたらめと みなす。
       点数は 0 に 近いほど 自然。本物の 文は -4〜-5 くらい、でたらめは -8 より 下が 多い。
       まちがって 本物の 文を でたらめと しない ことを 優先して、線は ゆるめに 引いてある。

    var KANA_LIMIT = -7.0, KANA_LIMIT_SHORT = -7.8, KANA_SHORT = 10, KANA_BACKOFF = 4, kanaTables = null;
    function kanaLoad() {
        if (kanaTables) return kanaTables;
        var QCH = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz', SYM = QCH + '!#$%()*+,-./:;=?@[]^_{';
        var qi = {}, si = {}, i;
        for (i = 0; i < QCH.length; i++) qi[QCH[i]] = i;
        for (i = 0; i < SYM.length; i++) si[SYM[i]] = i;
        var s2 = $('kanaQ2').textContent.trim(), q2 = new Uint8Array(84 * 84);
        for (i = 0; i < q2.length; i++) q2[i] = qi[s2[i]];
        var t3 = new Int8Array(84 * 84 * 84).fill(-1);
        $('kanaQ3').textContent.trim().split(' ').forEach(function (rec) {
            var base = (si[rec[0]] * 84 + si[rec[1]]) * 84;

        'と思いました', 'とおもいました', 'と思った', 'とおもった', '思いました', 'おもいました', 'でした', 'ました', 'です', 'ます', 'だった', 'だよ', 'だね',

    function judgeComment(raw, low, self) {

    }
    var WEAK_TEXT = {

    }
    function commentState() { return judgeComment($('fComment').value, lo(), form.edit); }
    function isWeak(cs) { return !!cs && cs !== 'empty'; }
    function checkForm() {
        var miss = '', soft = '';
        if (!$('fTitle').value.trim()) miss = K('[本:ほん]の [名:な][前:まえ]を [入:い]れてね。');

        else if (form.mode === 'new' && !form.isbn && sameTitleExists($('fTitle').value)) miss = K('この[本:ほん]は もう [登:とう][録:ろく] してあるよ。');

    }

    function openForm(o) {

        form.edit = o.edit || null; form.reading = o.finish || null;

        form.stars = o.edit ? o.edit.stars : 0; form.touched = {};

        $('formTitle').textContent = m === 'edit' ? K('[記:き][録:ろく]を [直:なお]す') : m === 'start' ? '読みはじめる 本'
            : m === 'finish' ? K('[読:よ]み[終:お]わった [本:ほん]') : K('[読:よ]んだ[本:ほん]を [登:とう][録:ろく]');
        $('fSave').textContent = m === 'edit' ? K('[直:なお]して [保:ほ][存:ぞん]する') : m === 'start' ? '読みはじめる' : K('[貯:ちょ][金:きん]する');

    function closeForm() { form.gen++; $('formOv').hidden = true; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); setTimeout(setAppHeight, 50); }

    $('fTitle').addEventListener('input', function () { form.touched.title = true; paintFormCover(); checkForm(); });
