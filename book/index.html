    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        * { touch-action: manipulation; -webkit-touch-callout: none; box-sizing: border-box; }
        [hidden] { display: none !important; }

        :root {
            --app-h: 100vh;
            --paper: #f6efe0;
            --card: #fffdf7;
            --ink: #2b3a35;
            --ink-soft: #6b7a74;
            --line: #e4d9c2;
            --green: #1f8a63;
            --green-dark: #166a4b;
            --green-pale: #e3f3ea;
            --gold: #f2b632;
            --gold-dark: #c98a12;
            --red: #d9534f;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
        }
        @supports (height: 100dvh) { :root { --app-h: 100dvh; } }

        html { background: var(--paper); }
        html, body { margin: 0; }
        body {
            height: var(--app-h);
            overflow: hidden;
            overscroll-behavior-y: none;
            padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
            color: var(--ink);
            font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif;
            font-weight: 500;
            /* 画面の大きさに合わせて、全体の文字の大きさを連続的に変える */
            font-size: clamp(13px, 1.5vmin + 8.2px, 22px);
            line-height: 1.5;
            -webkit-user-select: none; user-select: none;
            -webkit-text-size-adjust: 100%;
        }
        input, textarea { -webkit-user-select: text; user-select: text; font-family: inherit; }
        button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; border: 0; background: none; padding: 0; cursor: pointer; }
        h1, h2, p { margin: 0; }
        .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

        /* ---------- 全体のならび ---------- */
        #app {
            visibility: hidden;
            height: 100%;
            max-width: 46em;
            margin: 0 auto;
            padding: .7em .9em .6em;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: auto auto minmax(0, 1fr) auto;
            grid-template-areas: "top" "bank" "shelf" "cta";
            gap: .6em;
        }
        html.ready #app { visibility: visible; }

        @media (orientation: landscape) and (min-width: 600px) {
            #app {
                max-width: 74em;
                grid-template-columns: minmax(17em, 23em) minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr) auto;
                grid-template-areas: "top shelf" "bank shelf" "cta shelf";
                column-gap: 1em;
            }
            .bank { align-self: start; }
        }

        /* ---------- 上の帯 ---------- */
        .top { grid-area: top; display: flex; align-items: center; justify-content: space-between; min-width: 0; }
        .logo { display: flex; align-items: center; gap: .4em; font-size: 1.25em; font-weight: 900; letter-spacing: .04em; color: var(--green-dark); white-space: nowrap; }
        .logo svg { width: 1.5em; height: 1.5em; display: block; flex: none; }
        .icon-btn {
            position: relative; width: 2.6em; height: 2.6em; min-width: 40px; min-height: 40px; flex: none;
            border-radius: 50%; background: var(--card); border: 2px solid var(--line); line-height: 0;
        }
        .icon-btn svg { position: absolute; left: 50%; top: 50%; width: 55%; height: 55%; transform: translate(-50%, -50%); }
        .icon-btn.off { opacity: .55; }

        /* ---------- ちょきんのカード ---------- */
        .bank {
            grid-area: bank; min-width: 0;
            background: var(--green); color: #fff;
            border-radius: 1.1em; padding: .7em .9em .8em;
            box-shadow: 0 .25em 0 var(--green-dark);
        }
        .month-nav { display: flex; align-items: center; justify-content: space-between; }
        .month-nav .m { font-weight: 900; font-size: 1.15em; letter-spacing: .05em; }
        .nav-btn { position: relative; width: 2.5em; height: 2.5em; min-width: 40px; min-height: 40px; border-radius: 50%; background: rgba(255,255,255,.18); line-height: 0; }
        .nav-btn svg { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); }
        .nav-btn:disabled { opacity: .25; cursor: default; }
        .bank-label { margin-top: .25em; text-align: center; font-weight: 700; font-size: .95em; opacity: .92; }
        .amount { text-align: center; font-weight: 900; line-height: 1.15; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .amount .num { font-size: 3.1em; letter-spacing: .01em; }
        .amount .yen { font-size: 1.3em; margin-left: .15em; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; margin-top: .45em; }
        .stat { background: rgba(255,255,255,.16); border-radius: .7em; padding: .3em .5em; text-align: center; min-width: 0; }
        .stat .k { font-size: .78em; font-weight: 700; opacity: .9; white-space: nowrap; }
        .stat .v { font-weight: 900; font-size: 1.1em; white-space: nowrap; font-variant-numeric: tabular-nums; }

        .chart { display: grid; grid-template-columns: repeat(6, 1fr); gap: .35em; margin-top: .6em; height: 4.6em; }
        .bar-btn { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; min-width: 0; color: #fff; }
        .bar-area { flex: 1 1 0; min-height: 0; display: flex; align-items: flex-end; }
        .bar { width: 100%; min-height: 3px; border-radius: .3em .3em 0 0; background: rgba(255,255,255,.38); }
        .bar-btn.sel .bar { background: var(--gold); }
        .bar-lab { font-size: .72em; font-weight: 700; text-align: center; white-space: nowrap; opacity: .85; }
        .bar-btn.sel .bar-lab { opacity: 1; font-weight: 900; }
        @media (max-height: 470px) { .chart { display: none; } .amount .num { font-size: 2.5em; } }
        @media (orientation: portrait) and (max-height: 700px) { .chart { display: none; } }

        /* ---------- 本のリスト ---------- */
        .shelf { grid-area: shelf; min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 2px solid var(--line); border-radius: 1.1em; overflow: hidden; }
        .shelf-title { padding: .5em .9em; font-size: 1em; font-weight: 900; color: var(--green-dark); border-bottom: 2px dashed var(--line); }
        .list { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1em 1.4em; color: var(--ink-soft); font-weight: 700; gap: .6em; }
        .empty svg { width: 4.2em; height: 4.2em; opacity: .8; }

        .item {
            display: grid; grid-template-columns: 2.9em minmax(0, 1fr) auto; column-gap: .7em; align-items: center;
            width: 100%; text-align: left; padding: .55em .9em; border-bottom: 1px solid var(--line);
        }
        .item:active { background: #f7f1e2; }
        .cover {
            position: relative; width: 2.9em; height: 3.8em; border-radius: .25em .45em .45em .25em;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            color: #fff; font-weight: 900; font-size: 1em; box-shadow: .12em .12em 0 rgba(0,0,0,.12);
        }
        .cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .42em; background: rgba(0,0,0,.18); }
        .cover span { font-size: 1.5em; line-height: 1; padding-left: .25em; }
        .it-main { min-width: 0; }
        .it-title { font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .it-author { font-size: .8em; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.5em; }
        .it-line { display: flex; align-items: center; gap: .5em; min-width: 0; }
        .stars { display: flex; flex: none; gap: .05em; }
        .stars svg { width: .95em; height: .95em; display: block; }
        .it-comment { font-size: .85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .it-right { text-align: right; white-space: nowrap; }
        .it-price { font-weight: 900; color: var(--green-dark); font-size: 1.1em; font-variant-numeric: tabular-nums; }
        .it-date { font-size: .78em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

        /* ---------- 下のボタン ---------- */
        .cta { grid-area: cta; min-width: 0; }
        .primary {
            display: flex; align-items: center; justify-content: center; gap: .5em;
            width: 100%; min-height: 3.1em; padding: .5em 1em; border-radius: 1em;
            background: var(--gold); color: #4a3200; font-weight: 900; font-size: 1.15em; letter-spacing: .04em;
            box-shadow: 0 .22em 0 var(--gold-dark);
        }
        .primary:active { transform: translateY(.12em); box-shadow: 0 .1em 0 var(--gold-dark); }
        .primary:disabled { background: #e2dccb; color: #9a927d; box-shadow: 0 .22em 0 #cfc7b2; cursor: default; }
        .primary svg { width: 1.3em; height: 1.3em; flex: none; }
        .foot { margin-top: .5em; text-align: center; font-size: .68em; color: var(--ink-soft); white-space: nowrap; }

        /* ---------- かさねて出す画面 ---------- */
        .ov {
            position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h); z-index: 10;
            padding: calc(.7em + var(--safe-t)) calc(.7em + var(--safe-r)) calc(.7em + var(--safe-b)) calc(.7em + var(--safe-l));
            background: rgba(38, 52, 46, .55);
            display: flex; align-items: center; justify-content: center;
        }
        .sheet {
            width: 100%; max-width: 30em; max-height: 100%;
            background: var(--card); border-radius: 1.2em; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: .5em; padding: .6em .7em .6em 1em; background: var(--green-pale); }
        .sheet-head h2 { font-size: 1.1em; font-weight: 900; color: var(--green-dark); }
        .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: .8em 1em 1em; }
        .close-btn { position: relative; width: 2.4em; height: 2.4em; min-width: 40px; min-height: 40px; flex: none; border-radius: 50%; background: #fff; border: 2px solid var(--line); line-height: 0; }
        .close-btn svg { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); }

        .sub-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 2.7em; padding: .4em 1em; border-radius: .9em; background: #fff; border: 2px solid var(--line); font-weight: 700; }
        .sub-btn.danger { color: var(--red); border-color: #efc7c5; }
        .row { display: flex; gap: .6em; }
        .row > * { flex: 1 1 0; min-width: 0; }

        /* 読みとり */
        .scan-box { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: calc(var(--app-h) * .42); margin: 0 auto; background: #20262a; border-radius: .9em; overflow: hidden; }
        .scan-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .guide { position: absolute; left: 7%; right: 7%; top: 16%; bottom: 16%; border: 3px solid rgba(255,255,255,.9); border-radius: .7em; box-shadow: 0 0 0 100vmax rgba(0,0,0,.28); pointer-events: none; }
        .cam-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1em; color: #fff; font-weight: 700; }
        .pills { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; margin-top: .6em; }
        .pill { display: flex; align-items: center; gap: .45em; padding: .4em .6em; border-radius: .8em; background: #f1ead9; font-weight: 700; font-size: .9em; min-width: 0; }
        .pill .dot { flex: none; width: 1.15em; height: 1.15em; border-radius: 50%; border: 3px solid #cbbf9f; background: #fff; }
        .pill.on { background: var(--green-pale); color: var(--green-dark); }
        .pill.on .dot { border-color: var(--green); background: var(--green); }
        .pill span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hint { margin-top: .55em; min-height: 3em; text-align: center; font-weight: 700; }
        .hint.warn { color: var(--red); }
        .scan-actions { display: flex; flex-wrap: wrap; gap: .5em; justify-content: center; margin-top: .4em; }
        .scan-side { min-width: 0; }
        /* 横長で 高さが 少ない 画面では、カメラを 左、せつめいと ボタンを 右に ならべる */
        @media (orientation: landscape) and (max-height: 560px) {
            #scanOv .sheet { max-width: 50em; }
            .scan-body:not(.num) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 1em; align-items: center; }
            .scan-body .scan-box { max-height: calc(var(--app-h) - 7em); }
            .scan-body .pills { margin-top: 0; }
        }

        /* 入力 */
        .field { margin-top: .7em; }
        .field label, .field .lab { display: block; font-weight: 900; font-size: .9em; color: var(--green-dark); margin-bottom: .2em; }
        .inp { width: 100%; min-height: 2.8em; padding: .4em .7em; border-radius: .7em; border: 2px solid var(--line); background: #fff; color: var(--ink); font-size: max(16px, 1em); font-weight: 700; }
        .inp:focus { outline: none; border-color: var(--green); }
        .inp::placeholder { color: #b3ab97; font-weight: 500; }
        .note { font-size: .8em; color: var(--ink-soft); margin-top: .2em; min-height: 1.5em; }
        .note.warn { color: var(--red); font-weight: 700; }
        .book-head { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: .8em; align-items: center; }
        .book-head .cover { width: 3.6em; height: 4.8em; }
        .book-head .field { margin-top: 0; }
        .price-fixed { display: flex; align-items: baseline; gap: .5em; min-height: 2.8em; padding: .25em .7em; border-radius: .7em; background: var(--green-pale); }
        .price-fixed b { font-size: 1.5em; font-weight: 900; color: var(--green-dark); font-variant-numeric: tabular-nums; }
        .price-fixed small { font-size: .78em; color: var(--ink-soft); }
        .price-wrap { display: flex; align-items: center; gap: .4em; }
        .price-wrap .inp { flex: 1 1 0; min-width: 0; }
        .price-wrap span { font-weight: 900; }
        .star-in { display: flex; gap: .2em; }
        .star-btn { position: relative; width: 2.9em; height: 2.9em; min-width: 44px; min-height: 44px; line-height: 0; }
        .star-btn svg { position: absolute; left: 50%; top: 50%; width: 78%; height: 78%; transform: translate(-50%, -50%); }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: .7em; }
        .f-col { min-width: 0; }
        @media (orientation: landscape) and (max-height: 800px) {
            #formOv .sheet { max-width: 54em; }
            .form-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 1.4em; align-items: start; }
            .form-body .f-col:last-child .field:first-child { margin-top: 0; }
        }
        .foot-btns { display: flex; flex-direction: column; gap: .5em; }
        @media (orientation: landscape) and (max-height: 800px) {
            .foot-btns { flex-direction: row; align-items: stretch; }
            .foot-btns .row { flex: 0 0 auto; }
            .foot-btns .primary { flex: 1 1 0; width: auto; }
        }
        @media (orientation: landscape) and (max-height: 560px) { #fWarn { min-height: 0; } .sheet-foot { padding-top: .4em; padding-bottom: .6em; } }
        .sheet-foot { flex: none; padding: .6em 1em .9em; border-top: 2px dashed var(--line); }

        /* しらべ中のくるくる */
        .spin { display: inline-block; width: 1em; height: 1em; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; vertical-align: -.15em; margin-right: .3em; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* たしかめ・できた */
        .dialog { width: 100%; max-width: 22em; background: var(--card); border-radius: 1.2em; padding: 1.2em 1.1em 1.1em; text-align: center; }
        .dialog p { font-weight: 900; font-size: 1.1em; margin-bottom: .9em; }
        .done { position: relative; width: 100%; max-width: 24em; background: var(--card); border-radius: 1.4em; padding: 1.3em 1.1em 1.1em; text-align: center; overflow: hidden; }
        .done .ttl { font-weight: 900; font-size: 1.2em; color: var(--green-dark); }
        .done .book { font-weight: 700; margin-top: .2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .done .plus { font-weight: 900; font-size: 3em; line-height: 1.2; color: var(--gold-dark); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .done .sum { font-weight: 700; margin: .1em 0 .9em; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .done .sum b { font-weight: 900; font-size: 1.3em; color: var(--green-dark); }
        .coins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .coin { position: absolute; top: -2.4em; width: 1.9em; height: 1.9em; border-radius: 50%; background: var(--gold); border: .2em solid var(--gold-dark); opacity: 0; }
        .coin::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; border: .12em solid rgba(255,255,255,.75); }
        .done > *:not(.coins) { position: relative; }
    </style>
</head>
<body>

            </div>

                <div class="scan-side">
                    <div id="camInfo">
                        <div class="pills">
                            <div class="pill" id="pillIsbn"><i class="dot"></i><span>上の バーコード</span></div>
                            <div class="pill" id="pillPrice"><i class="dot"></i><span>下の バーコード</span></div>

    <!-- 本のとうろく -->

        <div class="sheet">

                <h2 id="formTitle">読んだ本を とうろく</h2>
                <button class="close-btn" type="button" data-close="form" aria-label="とじる"><svg viewBox="0 0 24 24" fill="none" stroke="#2b3a35" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
            </div>

                <div class="f-col">

                    <div class="cover" id="fCover"><span></span></div>

                </div>

                </div>

<script>
(function () {
    'use strict';

    /* ============ 画面まわりの お決まり ============ */
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
    });
    function resetZoomIfNeeded() {
        if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var original = meta.getAttribute('content');
        meta.setAttribute('content', original + ', maximum-scale=1.0');
        requestAnimationFrame(function () { meta.setAttribute('content', original); });
    }
    function setAppHeight() {
        var el = document.activeElement;
        if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;   // キーボード中は ちぢめない
        var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        if (h > 0) document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    }
    setAppHeight();
    ['resize', 'pageshow'].forEach(function (t) { window.addEventListener(t, setAppHeight); });
    window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 250); });
    if (window.visualViewport) {
        visualViewport.addEventListener('resize', function () { setAppHeight(); resetZoomIfNeeded(); });
        visualViewport.addEventListener('scroll', function () { setAppHeight(); resetZoomIfNeeded(); });
    }
    document.addEventListener('gestureend', function () { setTimeout(resetZoomIfNeeded, 50); }, { passive: true });

    var revealed = false;
    function reveal() {
        if (revealed) return; revealed = true;
        setAppHeight();
        document.documentElement.classList.add('ready');
    }
    setTimeout(reveal, 1500);
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { setTimeout(reveal, 60); }, reveal);

    /* ============ 小さな道具 ============ */
    function $(id) { return document.getElementById(id); }
    function yen(n) { return Number(n || 0).toLocaleString('ja-JP'); }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function ymOf(dateStr) { return dateStr.slice(0, 7); }
    function ymAdd(ym, n) {
        var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + n;
        y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
        return y + '-' + pad2(m + 1);
    }
    function toHalf(s) { return String(s).replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }

    var COVER_COLORS = ['#e07a5f', '#3d85c6', '#8e6bbf', '#2a9d8f', '#d98c1f', '#c8553d', '#5b8c3a', '#d1618f'];
    function coverColor(key) {
        var h = 0, s = String(key || '');
        for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
        return COVER_COLORS[h % COVER_COLORS.length];
    }
    function firstChar(title) { var t = String(title || '').trim(); return t ? Array.from(t)[0] : '本'; }
    function paintCover(el, book) {
        el.style.background = coverColor(book.isbn || book.title);
        el.querySelector('span').textContent = firstChar(book.title);
    }
    var STAR_PATH = 'M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z';
    function starSvg(on) {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR_PATH + '" fill="' + (on ? '#f2b632' : '#fff') +
            '" stroke="' + (on ? '#c98a12' : '#cfc6b0') + '" stroke-width="1.8" stroke-linejoin="round"/></svg>';
    }
    function starsHtml(n) { var s = ''; for (var i = 1; i <= 5; i++) s += starSvg(i <= n); return s; }

    /* ============ きろくの 保存 ============ */
    var STORE_KEY = 'dokusho-chokin.v1';
    var data = { books: [], opts: { sound: true }, cache: {} };
    try {
        var raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
        if (raw && Array.isArray(raw.books)) {
            data.books = raw.books;
            if (raw.opts) data.opts = Object.assign(data.opts, raw.opts);
        }
    } catch (e) {}
    function save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify({ books: data.books, opts: data.opts })); } catch (e) {}
    }

    /* ============ 音 ============ */
    var actx = null;
    function audio() {
        if (!actx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            actx = new AC();
            var b = actx.createBuffer(1, 1, actx.sampleRate), s = actx.createBufferSource();
            s.buffer = b; s.connect(actx.destination); s.start(0);
        }
        if (actx.state !== 'running') actx.resume();
        return actx;
    }
    ['pointerdown', 'touchend', 'keydown'].forEach(function (t) {
        window.addEventListener(t, function () { if (data.opts.sound) audio(); }, { passive: true });
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden && actx) actx.resume(); });
    function tone(freq, start, len, vol, type) {
        if (!data.opts.sound) return;
        var c = audio(); if (!c) return;
        var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
        o.type = type || 'triangle'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + len + 0.02);
    }
    function sndRead() { tone(1046, 0, 0.12, 0.12); }
    function sndCoin() { tone(1318, 0, 0.18, 0.14); tone(1976, 0.08, 0.42, 0.14); }
    function paintSound() {
        $('soundBtn').classList.toggle('off', !data.opts.sound);
        $('soundWave').toggleAttribute('hidden', !data.opts.sound);
        $('soundX').toggleAttribute('hidden', data.opts.sound);
    }
    $('soundBtn').addEventListener('click', function () {
        data.opts.sound = !data.opts.sound; save(); paintSound();
        if (data.opts.sound) sndRead();
    });

    /* ============ メインの画面 ============ */
    var nowYm = ymOf(todayStr());
    var viewYm = nowYm;
    var countGen = 0;

    function monthBooks(ym) {
        return data.books.filter(function (b) { return ymOf(b.date) === ym; })

        return m;

    function render(animateFrom) {

        $('monthLabel').textContent = viewYm.slice(0, 4) + '年 ' + monthName(viewYm);
        $('bankLabel').textContent = (viewYm === nowYm ? '今月' : monthName(viewYm) + 'に') + ' かせいだ お金';
        $('countV').textContent = list.length + 'さつ';

        $('shelfTitle').textContent = monthName(viewYm) + 'に 読んだ本';

        if (typeof animateFrom === 'number' && animateFrom !== total) {
            var t0 = performance.now(), dur = 900;
            (function step(t) {

                var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);

        } else {

        renderList(list);

    $('prevBtn').addEventListener('click', function () { if (viewYm > firstYm()) { viewYm = ymAdd(viewYm, -1); render(); } });

    /* ============ 本を しらべる（openBD → 国立国会図書館サーチ） ============ */
    function fetchText(url, ms) {
        var ac = ('AbortController' in window) ? new AbortController() : null;
        var timer = setTimeout(function () { if (ac) ac.abort(); }, ms);
        return fetch(url, ac ? { signal: ac.signal } : {}).then(function (r) {
            return r.text().then(function (t) { clearTimeout(timer); return { status: r.status, text: t }; });
        }, function (e) { clearTimeout(timer); throw e; });
    }
    function cleanName(s) {
        return toHalf(String(s || ''))
            .replace(/[／\/].*$/, function (m) { return /^[／\/]\s*(著|作|文|絵|訳|編|監修|原作|イラスト|写真|さく|え|ぶん|やく)/.test(m) ? '' : m.replace(/[／\/]/, ''); })
            .replace(/,?\s*\d{4}-\d{0,4}\s*$/, '')
            .replace(/[,，]\s*/g, '')
            .replace(/[\s　]+(著|作|文|絵|訳|編|監修|原作|さく|え|ぶん|やく)$/, '')
            .replace(/[\s　]+/g, '')
            .trim();
    }
    function joinNames(arr) {
        var out = [];
        arr.forEach(function (n) { n = cleanName(n); if (n && out.indexOf(n) < 0) out.push(n); });
        return out.slice(0, 3).join('、');
    }
    function asArray(v) { return v == null ? [] : (Array.isArray(v) ? v : [v]); }

    function lookupOpenBD(isbn) {
        return fetchText('https://api.openbd.jp/v1/get?isbn=' + isbn, 7000).then(function (r) {
            var j = JSON.parse(r.text), x = j && j[0];
            if (!x) return null;
            var s = x.summary || {}, title = String(s.title || '').trim();
            if (title && s.volume) title += ' ' + String(s.volume).trim();
            var names = [];
            try {
                asArray(x.onix.DescriptiveDetail.Contributor).forEach(function (c) {
                    if (c && c.PersonName && c.PersonName.content) names.push(c.PersonName.content);
                });
            } catch (e) {}
            if (!names.length && s.author) names = String(s.author).split(/[／\/][^\s　]*[\s　]*/).filter(Boolean);
            var price = 0;
            try {
                asArray(x.onix.ProductSupply.SupplyDetail.Price).forEach(function (p) {
                    var n = parseInt(p && p.PriceAmount, 10); if (!price && n > 0) price = n;

            } catch (e) {}

    function parseNdl(text) {
        var doc = new DOMParser().parseFromString(text, 'text/xml');
        var items = Array.prototype.slice.call(doc.getElementsByTagName('item'));
        if (!items.length) return null;
        function vals(it, tag) { return Array.prototype.map.call(it.getElementsByTagName(tag), function (e) { return e.textContent; }); }
        var pick = items.filter(function (it) { return vals(it, 'dcndl:price').length; })[0] || items[0];
        var title = (vals(pick, 'dc:title')[0] || vals(pick, 'title')[0] || '').trim();
        var vol = (vals(pick, 'dcndl:volume')[0] || '').trim();
        if (title && vol) title += ' ' + vol;
        var price = 0, m = /(\d[\d,]*)\s*円/.exec(toHalf(vals(pick, 'dcndl:price')[0] || ''));
        if (m) price = parseInt(m[1].replace(/,/g, ''), 10) || 0;
        return { title: toHalf(title), author: joinNames(vals(pick, 'dc:creator')), price: price };
    }
    function lookupNdl(isbn) {
        var base = 'https://ndlsearch.ndl.go.jp/api/opensearch?cnt=5&isbn=' + isbn;
        function once(url) { return fetchText(url, 9000); }
        function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
        return once(base + '&dpid=iss-ndl-opac').then(function (r) {
            if (r.status === 429) return wait(1500).then(function () { return once(base + '&dpid=iss-ndl-opac'); });
            return r;
        }).then(function (r) {
            var hit = r.status === 200 ? parseNdl(r.text) : null;
            if (hit && hit.title) return hit;
            if (r.status === 429) return null;
            return once(base).then(function (r2) { return r2.status === 200 ? parseNdl(r2.text) : null; });
        });
    }
    /* しらべた けっかは { title, author, price, found }。どちらにも なければ found:false */
    function lookup(isbn) {
        if (data.cache[isbn]) return Promise.resolve(data.cache[isbn]);
        var res = { title: '', author: '', price: 0, found: false };
        function merge(h) {
            if (!h) return;
            if (!res.title && h.title) res.title = h.title;
            if (!res.author && h.author) res.author = h.author;
            if (!res.price && h.price) res.price = h.price;
        }
        return lookupOpenBD(isbn).catch(function () { return null; }).then(function (a) {
            merge(a);
            if (res.title && res.author) return;
            return lookupNdl(isbn).catch(function () { return null; }).then(merge);
        }).then(function () {
            res.found = !!res.title;
            if (res.found) data.cache[isbn] = res;
            return res;
        });
    }

    /* ============ バーコード ============ */
    function eanOk(s) {
        if (!/^\d{13}$/.test(s)) return false;

        for (var i = 0; i < 12; i++) sum += Number(s[i]) * (i % 2 ? 3 : 1);
        return (10 - sum % 10) % 10 === Number(s[12]);

    function isbn10to13(s) {
        if (!/^\d{9}[\dXx]$/.test(s)) return '';
        var sum = 0;
        for (var i = 0; i < 9; i++) sum += Number(s[i]) * (10 - i);
        var cd = (11 - sum % 11) % 11, last = s[9].toUpperCase();
        if ((cd === 10 ? 'X' : String(cd)) !== last) return '';
        var b = '978' + s.slice(0, 9), t = 0;
        for (var k = 0; k < 12; k++) t += Number(b[k]) * (k % 2 ? 3 : 1);
        return b + ((10 - t % 10) % 10);
    }
    function isIsbnCode(s) { return /^97[89]/.test(s); }
    function isPriceCode(s) { return /^19[12]/.test(s); }           // 日本の本の 2だん目（分類と ねだん）
    function priceFromCode(s) { return parseInt(s.slice(7, 12), 10) || 0; }

    /* 読みとりの しくみ：ブラウザに そなわって いれば それを、なければ 下の 自前の 読みとりを 使う */
    var enginePromise = null;
    function getEngine() {
        if (enginePromise) return enginePromise;
        enginePromise = (function () {
            if ('BarcodeDetector' in window) {
                return window.BarcodeDetector.getSupportedFormats().then(function (f) {
                    if (f.indexOf('ean_13') < 0) return ownEngine();
                    var det = new window.BarcodeDetector({ formats: ['ean_13'] });
                    return {
                        name: 'native',
                        detect: function (src) {
                            return det.detect(src).then(function (list) { return list.map(function (c) { return c.rawValue; }); });
                        }
                    };
                }).catch(function () { return ownEngine(); });
            }
            return Promise.resolve(ownEngine());
        })();
        return enginePromise;
    }

    /* ---- 自前の EAN-13（本のバーコード）読みとり ----
       画像を 1本の線ごとに 見て、白黒の はばの ならびから 13けたを 読む。
       よこ向き・たて向き・さかさまの どれでも 読めるよう、行と 列の 両方を 調べる。 */
    var EAN_W = [[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
    var EAN_FIRST = { LLLLLL: 0, LLGLGG: 1, LLGGLG: 2, LLGGGL: 3, LGLLGG: 4, LGGLLG: 5, LGGGLL: 6, LGLGLG: 7, LGLGGL: 8, LGGLGL: 9 };
    var edgeBuf = new Float32Array(4096), revBuf = new Float32Array(4096), thrBuf = new Float32Array(4096);

    /* 1本の線（明るさの ならび）から、白→黒・黒→白の さかい目を さがす。もどり値は さかい目の 数。
       山（白）と 谷（黒）を 順に 見つけ、その まん中の 明るさを 横切る 所を さかい目に する。
       ぼけて 細い線が うすく なっても 読めるように、まわりの 明るさの 差に 合わせて 山・谷を 決める。 */
    function crossing(line, xa, xb, mid) {
        var prev = line[xa] - mid;
        for (var x = xa + 1; x <= xb; x++) {
            var d = line[x] - mid;
            if ((prev < 0) !== (d < 0) || d === 0) return (x - 1) + (prev === d ? 0.5 : prev / (prev - d));
            prev = d;
        }
        return (xa + xb) / 2;
    }
    function findEdges(line, n, E) {
        var B = Math.max(8, Math.round(n / 80)), nb = Math.ceil(n / B), i, x;
        if (thrBuf.length < nb) thrBuf = new Float32Array(nb);
        for (i = 0; i < nb; i++) {
            var mn = 255, mx = 0, end = Math.min(n, (i + 1) * B);
            for (x = i * B; x < end; x++) { var v0 = line[x]; if (v0 < mn) mn = v0; if (v0 > mx) mx = v0; }
            thrBuf[i] = mx - mn;
        }
        var cnt = 0, up = true, ext = line[0], extX = 0, have = false, pX = 0, pV = 0;
        for (x = 1; x < n; x++) {
            var v = line[x], bi = (x / B) | 0, c = thrBuf[bi];
            if (bi > 0 && thrBuf[bi - 1] > c) c = thrBuf[bi - 1];
            if (bi < nb - 1 && thrBuf[bi + 1] > c) c = thrBuf[bi + 1];
            var H = c * 0.16; if (H < 14) H = 14;
            if (up) {
                if (v > ext) { ext = v; extX = x; }
                else if (ext - v > H) {                                  // 山が 決まった（ここまでが 白）
                    if (have && cnt > 0 && cnt < E.length) E[cnt++] = crossing(line, pX, extX, (pV + ext) / 2);   // 黒→白
                    pX = extX; pV = ext; have = true; up = false; ext = v; extX = x;
                }
            } else {
                if (v < ext) { ext = v; extX = x; }
                else if (v - ext > H) {                                  // 谷が 決まった（ここまでが 黒）
                    if (have && cnt < E.length) E[cnt++] = crossing(line, pX, extX, (pV + ext) / 2);              // 白→黒
                    pX = extX; pV = ext; have = true; up = true; ext = v; extX = x;
                }
            }
        }
        if (cnt % 2) cnt--;                                              // 黒→白で 終わるように そろえる
        return cnt;
    }
    /* さかい目の ならび E（cnt こ）の 中から EAN-13 を さがす */
    function decodeEdges(E, cnt, found) {
        var runs = cnt - 1;
        for (var i = 0; i + 59 <= runs; i += 2) {
            var total = E[i + 59] - E[i], m = total / 95;
            if (m < 1.2) continue;
            var g0 = E[i + 1] - E[i];
            if (g0 < m * 0.35 || g0 > m * 2.2) continue;
            if (i > 0 && E[i] - E[i - 1] < m * 3) continue;                       // 左の 白い あき
            if (i + 60 < cnt && E[i + 60] - E[i + 59] < m * 3) continue;          // 右の 白い あき
            function run(k) { return E[i + k + 1] - E[i + k]; }
            var dk = (run(0) + run(2) + run(28) + run(30) + run(56) + run(58)) / 6;
            var lt = (run(1) + run(27) + run(29) + run(31) + run(57)) / 5;
            var h = (dk - lt) / 2;                                               // 黒が ふとって 見える分を 直す
            if (Math.abs(h) > m * 0.7) continue;
            var mm = (dk + lt) / 2;
            if (mm < m * 0.6 || mm > m * 1.5) continue;
            var ok = true, digits = '', parity = '';
            for (var g = 0; g < 12 && ok; g++) {

                var c0 = run(base) + (firstDark ? -h : h), c1 = run(base + 1) + (firstDark ? h : -h);
                var c2 = run(base + 2) + (firstDark ? -h : h), c3 = run(base + 3) + (firstDark ? h : -h);
                var sum = c0 + c1 + c2 + c3;

                var u = sum / 7, best = 9, bd = -1, bp = 'L';
                c0 /= u; c1 /= u; c2 /= u; c3 /= u;
                for (var d = 0; d < 10; d++) {
                    var w = EAN_W[d];
                    var e1 = Math.abs(c0 - w[0]) + Math.abs(c1 - w[1]) + Math.abs(c2 - w[2]) + Math.abs(c3 - w[3]);
                    if (e1 < best) { best = e1; bd = d; bp = 'L'; }
                    if (g < 6) {
                        var e2 = Math.abs(c0 - w[3]) + Math.abs(c1 - w[2]) + Math.abs(c2 - w[1]) + Math.abs(c3 - w[0]);
                        if (e2 < best) { best = e2; bd = d; bp = 'G'; }

            var first = EAN_FIRST[parity];
            if (first === undefined) continue;
            var code = first + digits;
            if (eanOk(code)) { found[code] = (found[code] || 0) + 1; i += 58; }
        }
    }
    function scanLine(line, n, found) {
        if (edgeBuf.length < n) { edgeBuf = new Float32Array(n); revBuf = new Float32Array(n); }
        var cnt = findEdges(line, n, edgeBuf);
        if (cnt < 60) return;
        decodeEdges(edgeBuf, cnt, found);
        for (var i = 0; i < cnt; i++) revBuf[i] = -edgeBuf[cnt - 1 - i];        // さかさまに 持っている とき

    /* 明るさの 画像（gray, w×h）から 読めた 13けたを 返す。同じ画像の 2本以上の 線で 読めた ものだけ */
    function scanGray(gray, w, h) {

    function ownEngine() {

    /* ============ 読みとりの 画面 ============ */
    var video = $('video');
    var scan = { open: false, stream: null, timer: 0, gen: 0, isbn: '', price: 0, seen: {}, deadline: 0, devices: [], pending: null, dupUntil: 0 };

    function setHint(text, warn) { var h = $('scanHint'); h.textContent = text; h.classList.toggle('warn', !!warn); }
    function paintPills() {
        $('pillIsbn').classList.toggle('on', !!scan.isbn);
        $('pillPrice').classList.toggle('on', !!scan.price);
    }
    function openScan() {
        scan.open = true; scan.dupUntil = 0; scan.isbn = ''; scan.price = 0; scan.seen = {}; scan.deadline = 0; scan.pending = null;
        paintPills();
        $('scanOv').hidden = false;
        showCamPane(true);
    }
    function closeScan() {
        scan.open = false; scan.gen++;
        stopCamera();
        $('scanOv').hidden = true;
    }
    function showCamPane(cam) {
        $('camBox').hidden = !cam; $('camInfo').hidden = !cam; $('numPane').hidden = cam; $('scanBody').classList.toggle('num', !cam);
        $('toNum').hidden = !cam; $('toCam').hidden = cam;
        if (cam) { startCamera(); }
        else {
            stopCamera(); $('camSwitch').hidden = true;
            $('isbnInp').value = ''; $('isbnNote').textContent = ''; $('isbnNote').classList.remove('warn');
        }
    }
    function stopCamera() {
        clearTimeout(scan.timer);
        if (scan.stream) { scan.stream.getTracks().forEach(function (t) { t.stop(); }); scan.stream = null; }
        try { video.srcObject = null; } catch (e) {}
    }
    function camMessage(text) { var m = $('camMsg'); m.hidden = !text; m.textContent = text || ''; }

    function startCamera(deviceId) {
        var gen = ++scan.gen;
        stopCamera();
        setHint('本の うらに ある 2つの バーコードを、わくの 中に うつしてね。');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            camMessage('この 画面では カメラが 使えません。');
            setHint('「数字で 入力する」を えらんでね。', true);
            return;
        }
        camMessage('カメラを じゅんび しています…');
        var v = { width: { ideal: 1920 }, height: { ideal: 1080 } };
        if (deviceId) v.deviceId = { exact: deviceId }; else v.facingMode = { ideal: 'environment' };
        navigator.mediaDevices.getUserMedia({ video: v, audio: false }).then(function (stream) {
            if (gen !== scan.gen || !scan.open) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
            scan.stream = stream;
            video.srcObject = stream;
            var p = video.play(); if (p && p.catch) p.catch(function () {});
            camMessage('');
            navigator.mediaDevices.enumerateDevices().then(function (list) {
                scan.devices = list.filter(function (d) { return d.kind === 'videoinput'; });
                $('camSwitch').hidden = scan.devices.length < 2 || $('camBox').hidden;
            }).catch(function () {});
            return getEngine().then(function (engine) { if (gen === scan.gen) tick(engine, gen); });
        }).catch(function (e) {
            if (gen !== scan.gen) return;
            var denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
            camMessage(denied ? 'カメラを 使う ゆるしが 出ていません。' : 'カメラが 見つかりません。');
            setHint('「数字で 入力する」を えらんでね。', true);
        });
    }
    $('camSwitch').addEventListener('click', function () {
        if (scan.devices.length < 2) return;
        var cur = scan.stream && scan.stream.getVideoTracks()[0] && scan.stream.getVideoTracks()[0].getSettings().deviceId;
        var i = scan.devices.findIndex(function (d) { return d.deviceId === cur; });
        startCamera(scan.devices[(i + 1) % scan.devices.length].deviceId);
    });

    function tick(engine, gen) {
        if (gen !== scan.gen || !scan.open) return;
        var next = function () { scan.timer = setTimeout(function () { tick(engine, gen); }, 110); };
        if (scan.deadline && Date.now() > scan.deadline) { finishScan(); return; }
        var sw = video.videoWidth, sh = video.videoHeight;
        if (!sw || !sh || video.readyState < 2) { next(); return; }
        engine.detect(video, sw, sh).then(function (codes) {
            if (gen !== scan.gen) return;
            handleCodes(codes);
            if (scan.isbn && scan.price) { finishScan(); return; }
            next();
        }, next);
    }
    /* 同じ数字を 2回 読めたら 本物と みなす（読みまちがいを ふせぐ） */
    function handleCodes(codes) {
        if (Date.now() < scan.dupUntil) return;                          // 「もう してあるよ」を 見せている 間は 待つ
        codes.forEach(function (c) {
            if (!eanOk(c)) return;
            scan.seen[c] = (scan.seen[c] || 0) + 1;
            if (scan.seen[c] < 2) return;
            if (isIsbnCode(c) && !scan.isbn) {
                if (findByIsbn(c)) { setHint('この本は もう ちょきん してあるよ。', true); scan.seen = {}; scan.price = 0; scan.dupUntil = Date.now() + 2500; paintPills(); return; }
                scan.isbn = c; sndRead(); paintPills();
                scan.pending = lookup(c);
                scan.deadline = Date.now() + 3500;
                if (!scan.price) setHint('読めた！ 下の バーコードも うつしてね。');
            } else if (isPriceCode(c) && !scan.price) {
                var p = priceFromCode(c);
                if (p > 0) { scan.price = p; sndRead(); paintPills(); if (!scan.isbn) setHint('ねだんが 読めた！ 上の バーコードも うつしてね。'); }
            } else if (!isIsbnCode(c) && !isPriceCode(c) && !scan.isbn) {
                setHint('これは 本の バーコードでは ないみたい。', true);
            }
        });
    }
    function finishScan() {
        var isbn = scan.isbn, price = scan.price, pending = scan.pending;
        closeScan();
        openForm({ isbn: isbn, price: price, pending: pending });
    }

    $('toNum').addEventListener('click', function () { showCamPane(false); });
    $('toCam').addEventListener('click', function () { showCamPane(true); });
    $('noCode').addEventListener('click', function () { closeScan(); openForm({}); });
    $('isbnGo').addEventListener('click', function () {
        var s = toHalf($('isbnInp').value).replace(/[^0-9Xx]/g, ''), note = $('isbnNote');
        if (s.length === 10) s = isbn10to13(s);
        note.classList.add('warn');
        if (!eanOk(s) || !isIsbnCode(s)) { note.textContent = '数字が ちがうみたい。もう一度 たしかめてね。'; return; }
        if (findByIsbn(s)) { note.textContent = 'この本は もう ちょきん してあるよ。'; return; }
        closeScan();
        openForm({ isbn: s, price: 0, pending: lookup(s) });
    });
    $('isbnInp').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('isbnGo').click(); });
    document.addEventListener('visibilitychange', function () {
        if (!scan.open || $('camBox').hidden) return;
        if (document.hidden) { scan.gen++; stopCamera(); } else startCamera();
    });

    function findByIsbn(isbn) { return data.books.filter(function (b) { return b.isbn && b.isbn === isbn; })[0] || null; }

    /* ============ とうろく・なおす 画面 ============ */
    var form = { edit: null, isbn: '', stars: 0, lockedPrice: 0, priceSrc: '', gen: 0, touched: {} };

    function paintStarsInput() {
        var box = $('fStars'); box.textContent = '';
        for (var i = 1; i <= 5; i++) (function (n) {
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'star-btn'; b.setAttribute('aria-label', '星 ' + n + 'こ');
            b.innerHTML = starSvg(n <= form.stars);
            b.addEventListener('click', function () { form.stars = n; paintStarsInput(); checkForm(); });
            box.appendChild(b);
        })(i);
    }
    function setPrice(price, src) {
        form.lockedPrice = price > 0 ? price : 0; form.priceSrc = src || '';
        $('fPriceFixed').hidden = !form.lockedPrice;
        $('fPriceWrap').hidden = !!form.lockedPrice;
        if (form.lockedPrice) {
            $('fPriceText').textContent = yen(form.lockedPrice) + '円';
            $('fPriceSrc').textContent = src === 'code' ? 'バーコードから' : src === 'db' ? '本の データから' : '';
        }
    }
    function formPrice() {
        if (form.lockedPrice) return form.lockedPrice;
        var n = parseInt(toHalf($('fPrice').value).replace(/[^0-9]/g, ''), 10) || 0;
        return Math.min(n, 20000);
    }
    function paintFormCover() { paintCover($('fCover'), { isbn: form.isbn, title: $('fTitle').value }); }
    function checkForm() {
        var miss = '';
        if (!$('fTitle').value.trim()) miss = '本の 名前を 入れてね。';
        else if (!formPrice()) miss = 'ねだんを 入れてね。';
        else if (!form.stars) miss = 'おもしろさの 星を えらんでね。';
        else if (!$('fComment').value.trim()) miss = 'ひとこと 感想を 書いてね。';
        $('fWarn').textContent = miss;
        $('fSave').disabled = !!miss;
        return !miss;
    }

    function openForm(o) {
        var gen = ++form.gen, b = o.edit || null;
        form.edit = b; form.isbn = b ? (b.isbn || '') : (o.isbn || ''); form.stars = b ? b.stars : 0; form.touched = {};
        $('formTitle').textContent = b ? 'きろくを なおす' : '読んだ本を とうろく';
        $('fSave').textContent = b ? 'なおして 保存する' : 'ちょきんする';
        $('fEditRow').hidden = !b;
        $('fTitle').value = b ? b.title : '';
        $('fAuthor').value = b ? (b.author || '') : '';
        $('fComment').value = b ? (b.comment || '') : '';
        $('fDate').value = b ? b.date : todayStr();
        $('fDate').max = todayStr();
        $('fPrice').value = '';
        $('fLookNote').textContent = ''; $('fLookNote').classList.remove('warn');
        if (b) {
            if (b.manual) { setPrice(0); $('fPrice').value = String(b.price); } else setPrice(b.price, b.priceSrc || 'code');
        } else setPrice(o.price || 0, 'code');
        paintStarsInput(); paintFormCover(); checkForm();
        $('formOv').hidden = false;
        document.querySelector('#formOv .sheet-body').scrollTop = 0;

        if (!b && o.pending) {
            $('fLookNote').innerHTML = '<i class="spin"></i>本を しらべています…';
            o.pending.then(function (r) {
                if (gen !== form.gen) return;
                var note = $('fLookNote'); note.textContent = '';
                if (!r.found) { note.classList.add('warn'); note.textContent = '見つかりませんでした。自分で 入力してね。'; }
                if (r.title && !form.touched.title) $('fTitle').value = r.title;
                if (r.author && !form.touched.author) $('fAuthor').value = r.author;
                if (!form.lockedPrice && r.price && !form.touched.price) setPrice(r.price, 'db');
                paintFormCover(); checkForm();
            });
        }
    }
    function closeForm() { form.gen++; $('formOv').hidden = true; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); setTimeout(setAppHeight, 50); }

    $('fTitle').addEventListener('input', function () { form.touched.title = true; paintFormCover(); checkForm(); });
    $('fAuthor').addEventListener('input', function () { form.touched.author = true; });
    $('fPrice').addEventListener('input', function () {
        form.touched.price = true;
        var v = toHalf(this.value).replace(/[^0-9]/g, '').slice(0, 5);
        if (v !== this.value) this.value = v;
        checkForm();
    });
    $('fComment').addEventListener('input', checkForm);

    $('fSave').addEventListener('click', function () {
        if (!checkForm()) return;
        var date = $('fDate').value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > todayStr()) date = todayStr();
        var rec = {
            title: $('fTitle').value.trim(), author: $('fAuthor').value.trim(),
            price: formPrice(), stars: form.stars, comment: $('fComment').value.trim(), date: date
        };
        var before = sumOf(monthBooks(ymOf(date)));
        if (form.edit) {
            Object.assign(form.edit, rec);
            save(); closeForm(); viewYm = ymOf(date); render();
            return;
        }
        rec.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        rec.isbn = form.isbn; rec.at = Date.now();
        rec.manual = !form.lockedPrice; rec.priceSrc = form.lockedPrice ? form.priceSrc : 'hand';
        data.books.push(rec);
        save(); closeForm();
        viewYm = ymOf(date);
        showDone(rec, before);
    });
    $('fDelete').addEventListener('click', function () {
        var b = form.edit; if (!b) return;
        askConfirm('この きろくを 消しますか？', function () {
            data.books = data.books.filter(function (x) { return x !== b; });
            save(); closeForm(); render();
        });
    });

    /* ============ たしかめ・できた ============ */
    var confirmYes = null;
    function askConfirm(msg, yes) { $('confirmMsg').textContent = msg; confirmYes = yes; $('confirmOv').hidden = false; }
    $('confirmNo').addEventListener('click', function () { $('confirmOv').hidden = true; confirmYes = null; });
    $('confirmYes').addEventListener('click', function () { $('confirmOv').hidden = true; var f = confirmYes; confirmYes = null; if (f) f(); });

    var doneGen = 0, doneBefore = 0;
    function showDone(rec, before) {
        var gen = ++doneGen; doneBefore = before;
        var after = before + rec.price;
        $('doneBook').textContent = '「' + rec.title + '」';
        $('donePlus').textContent = '+' + yen(rec.price) + '円';
        $('doneSumLabel').textContent = (ymOf(rec.date) === nowYm ? '今月' : monthName(ymOf(rec.date))) + 'の 合計';
        $('doneSum').textContent = yen(before) + '円';
        render();                                   // うしろの 画面も 新しくしておく
        $('amountNum').textContent = yen(before);
        $('doneOv').hidden = false;
        sndCoin();

        var box = $('coins'); box.textContent = '';
        var bh = box.clientHeight || 300;
        for (var i = 0; i < 9; i++) {
            var c = document.createElement('i'); c.className = 'coin';
            c.style.left = (6 + Math.random() * 82) + '%';
            box.appendChild(c);
            if (c.animate) c.animate(
                [{ transform: 'translateY(0) rotate(0deg)', opacity: 1 }, { transform: 'translateY(' + (bh + 80) + 'px) rotate(' + (Math.random() * 240 - 120) + 'deg)', opacity: 1 }],
                { duration: 900 + Math.random() * 500, delay: i * 70, easing: 'cubic-bezier(.4,0,.9,.6)', fill: 'backwards' });
        }
        var plus = $('donePlus');
        if (plus.animate) plus.animate([{ transform: 'scale(.4)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'ease-out' });
        var t0 = performance.now() + 500, sumEl = $('doneSum');
        (function step(t) {
            if (gen !== doneGen) return;
            var p = Math.max(0, Math.min(1, (t - t0) / 800)), e = 1 - Math.pow(1 - p, 3);
            sumEl.textContent = yen(Math.round(before + (after - before) * e)) + '円';
            if (p < 1) requestAnimationFrame(step);
        })(performance.now());
    }
    $('doneOk').addEventListener('click', function () {
        doneGen++; $('doneOv').hidden = true; $('coins').textContent = '';
        render(doneBefore);
    });

    /* ============ ボタン ============ */
    $('addBtn').addEventListener('click', openScan);
    Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
        b.addEventListener('click', function () { if (b.dataset.close === 'scan') closeScan(); else closeForm(); });
    });

    paintSound();
    render();

    /* 確認用（画面からは 使わない） */
    window.__chokin = { scanGray: scanGray, handleCodes: handleCodes, getEngine: getEngine, scan: scan, lookup: lookup, openForm: openForm, render: render, data: data };
})();
</script>
</body>
</html>
