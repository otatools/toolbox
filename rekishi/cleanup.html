<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ランキング クリーンアップ（歴史ならべ）</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f4efe4;color:#3a2e1f;padding:16px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:1.25rem;margin:4px 0 4px}
.note{font-size:.85rem;color:#7a6a4f;margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:2px solid #b8860b;background:#fffaf0;border-radius:999px;padding:8px 14px;font-size:.95rem;cursor:pointer}
.tabs button.on{background:#b8860b;color:#fff}
.custom{display:flex;gap:6px;margin-bottom:10px}
.custom input{flex:1;padding:8px;border:1px solid #d8c9a3;border-radius:8px;font-size:.95rem}
.custom button,.act{border:0;border-radius:8px;padding:8px 14px;font-size:.95rem;cursor:pointer;background:#2d6a4f;color:#fff}
.card{background:#fffaf0;border:1px solid #d8c9a3;border-radius:12px;padding:10px 12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:.9rem;color:#7a6a4f}
.row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid #eadfc2}
.row:first-of-type{border-top:0}
.no{width:2.2em;text-align:right;font-weight:bold;color:#b8860b}
.nm{flex:1;font-size:1.05rem;word-break:break-all}
.pf{font-size:.8rem;color:#7a6a4f}
.sc{font-weight:bold;width:4em;text-align:right}
.del{border:0;border-radius:8px;padding:6px 12px;background:#c0392b;color:#fff;cursor:pointer;font-size:.9rem}
.del:disabled,.act:disabled{opacity:.5}
.danger{background:#7a1f16}
.msg{margin:10px 0;font-size:.9rem;min-height:1.3em}
.msg.ng{color:#c0392b}.msg.ok{color:#2d6a4f}
.empty{padding:16px;text-align:center;color:#7a6a4f}
</style>
</head>
<body>
<div class="wrap">
  <h1>ランキング クリーンアップ</h1>
  <p class="note">ふさわしくない名前を見つけたら、その行の「消す」を押してください。このページは管理用です。リンクは人に教えないでください。</p>
  <div class="tabs" id="tabs"></div>
  <div class="custom">
    <input id="key" placeholder="ほかの期間（例: w-2026-09-28 / m-2026-09 / all）" autocomplete="off">
    <button id="load">よみこむ</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="card">
    <div class="head"><span id="title">-</span><button class="act danger" id="clear" disabled>このランキングを全部消す</button></div>
    <div id="list"><div class="empty">読みこみ中…</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDpMGoRCso-5jTiYoI73INvByOmf6boXyM",
  authDomain: "rekishi-narabe.firebaseapp.com",
  projectId: "rekishi-narabe",
  storageBucket: "rekishi-narabe.firebasestorage.app",
  messagingSenderId: "663031284527",
  appId: "1:663031284527:web:d7929deef5d88520b2d7da"
};
firebase.initializeApp(FIREBASE_CONFIG);
var db = firebase.firestore();
var COLL = 'rankings';

function pad(n){ return (n < 10 ? '0' : '') + n; }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function mondayOf(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)); }   // 月曜はじまり（ゲーム本体と同じ）
var now = new Date();
var thisMon = mondayOf(now);
var lastMon = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() - 7);
var lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
var BOARDS = [
  { key: 'w-' + ymd(thisMon), label: '今週' },
  { key: 'w-' + ymd(lastMon), label: '先週' },
  { key: 'm-' + now.getFullYear() + '-' + pad(now.getMonth() + 1), label: '今月' },
  { key: 'm-' + lastMonth.getFullYear() + '-' + pad(lastMonth.getMonth() + 1), label: '先月' },
  { key: 'all', label: '通算' }
];
var cur = null, curEntries = [];

function msg(t, cls){ var m = document.getElementById('msg'); m.textContent = t || ''; m.className = 'msg ' + (cls || ''); }
function cmp(a, b){ return (b.s - a.s) || (a.t - b.t); }
function sameEntry(a, b){ return a.n === b.n && a.s === b.s && a.t === b.t && (a.d || '') === (b.d || ''); }

function paintTabs(){
  var box = document.getElementById('tabs');
  box.innerHTML = '';
  BOARDS.forEach(function(b){
    var el = document.createElement('button');
    el.textContent = b.label;
    if(b.key === cur) el.className = 'on';
    el.onclick = function(){ load(b.key); };
    box.appendChild(el);
  });
}

function paint(){
  document.getElementById('title').textContent = cur + '（' + curEntries.length + '件）';
  document.getElementById('clear').disabled = !curEntries.length;
  var box = document.getElementById('list');
  box.innerHTML = '';
  if(!curEntries.length){ box.innerHTML = '<div class="empty">記録はありません</div>'; return; }
  curEntries.forEach(function(e, i){
    var row = document.createElement('div'); row.className = 'row';
    var no = document.createElement('span'); no.className = 'no'; no.textContent = (i + 1);
    var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.n;
    var pf = document.createElement('span'); pf.className = 'pf'; pf.textContent = e.p || '';
    var sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = e.s + '点';
    var bt = document.createElement('button'); bt.className = 'del'; bt.textContent = '消す';
    bt.onclick = function(){ removeOne(e, bt); };
    nm.appendChild(pf);
    row.appendChild(no); row.appendChild(nm); row.appendChild(sc); row.appendChild(bt);
    box.appendChild(row);
  });
}

function load(key){
  key = (key || '').trim();
  if(!/^(all|w-\d{4}-\d{2}-\d{2}|m-\d{4}-\d{2})$/.test(key)){ msg('期間の書き方がちがいます（例: w-2026-09-28 / m-2026-09 / all）', 'ng'); return; }
  cur = key; paintTabs(); msg('読みこみ中…');
  db.collection(COLL).doc(key).get().then(function(sn){
    curEntries = (sn.exists && Array.isArray(sn.data().entries) ? sn.data().entries : []).slice().sort(cmp);
    msg(''); paint();
  }).catch(function(e){ msg('読みこめませんでした: ' + (e.code || e.message), 'ng'); });
}

/* 消す：読みなおしてから、その1件だけを取りのぞいて書きもどす（他の人の新しい登録を巻きこまない） */
function removeOne(entry, btn){
  if(!confirm('「' + entry.n + '」（' + entry.s + '点）を消しますか？')) return;
  btn.disabled = true;
  var ref = db.collection(COLL).doc(cur);
  db.runTransaction(function(tx){
    return tx.get(ref).then(function(sn){
      var es = (sn.exists && Array.isArray(sn.data().entries)) ? sn.data().entries : [];
      var removed = false;
      var next = es.filter(function(e){ if(!removed && sameEntry(e, entry)){ removed = true; return false; } return true; });
      tx.set(ref, { entries: next });
      return next;
    });
  }).then(function(next){
    curEntries = next.slice().sort(cmp); msg('消しました', 'ok'); paint();
  }).catch(function(e){ btn.disabled = false; msg('消せませんでした: ' + (e.code || e.message), 'ng'); });
}

document.getElementById('clear').onclick = function(){
  if(!confirm(cur + ' の記録を全部消します。よろしいですか？')) return;
  if(!confirm('本当に全部消しますか？（元にもどせません）')) return;
  db.collection(COLL).doc(cur).set({ entries: [] }).then(function(){
    curEntries = []; msg('全部消しました', 'ok'); paint();
  }).catch(function(e){ msg('消せませんでした: ' + (e.code || e.message), 'ng'); });
};
document.getElementById('load').onclick = function(){ load(document.getElementById('key').value); };
document.getElementById('key').addEventListener('keydown', function(e){ if(e.key === 'Enter') load(this.value); });

load(BOARDS[0].key);
</script>
</body>
</html>
