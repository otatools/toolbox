<body class="text-slate-700">

    <div class="max-w-3xl mx-auto p-4 md:p-8">
        <!-- ヘッダー -->
        <header class="text-center mb-8 bg-white p-6 rounded-3xl shadow-lg border-b-4 border-sky-400">
            <h1 class="text-2xl md:text-3xl font-extrabold text-sky-600 mb-2">
                <svg class="ico mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14.5" cy="4" r="2.2" fill="currentColor" stroke="none"/><path d="M8 9.5l4-2 3 2.5 2.5 2.5H20"/><path d="M12 7.5l-2 6 4 2.5-1 5.5"/><path d="M10 13.5L7 17H3.5"/></svg>走り高跳び 目標計算機
            </h1>
            <p class="text-slate-500 font-bold">身長と50m走の記録から、あなたの目標高さを計算しよう！</p>
        </header>

        <!-- 入力フォーム -->
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-lg mb-8 border-2 border-sky-100" data-html2canvas-ignore>
            <div class="grid md:grid-cols-2 gap-6">
                <!-- 身長入力 -->
                <div>
                    <label for="height" class="block text-lg font-bold text-sky-700 mb-2">
                        <svg class="ico mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="1.5"/><path d="M7 7h4M7 11h3M7 15h4M7 19h3"/></svg> 身長 (cm)
                    </label>
                    <input type="number" id="height" placeholder="例: 145" 
                        class="w-full text-2xl p-4 border-2 border-slate-200 rounded-2xl focus:border-sky-400 focus:outline-none focus:ring-4 focus:ring-sky-100 transition text-center font-bold text-sky-600"
                        inputmode="decimal">
                </div>

                <!-- 50m走入力 -->
                <div>
                    <label for="time" class="block text-lg font-bold text-sky-700 mb-2">
                        <svg class="ico mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 2.5h4M12 2.5V6M18.5 6.5l1.5-1.5"/></svg> 50m走のタイム (秒)
                    </label>
                    <input type="number" id="time" placeholder="例: 8.5" step="0.01"
                        class="w-full text-2xl p-4 border-2 border-slate-200 rounded-2xl focus:border-sky-400 focus:outline-none focus:ring-4 focus:ring-sky-100 transition text-center font-bold text-sky-600"
                        inputmode="decimal">
                    <p class="text-xs text-slate-400 mt-1 pl-1">※ 秒数を入力してね（例：8.75）</p>
                </div>
            </div>

            <!-- 計算ボタン -->
            <button onclick="calculate()" 
                class="w-full mt-6 bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 text-white font-extrabold text-xl py-4 rounded-2xl shadow-md transform active:scale-95 transition-all">
                計算する！
            </button>
            
            <!-- エラーメッセージ -->
            <div id="error-container" class="hidden mt-4 bg-red-50 border-2 border-red-200 rounded-xl p-4 text-center">
                 <p id="error-msg" class="text-red-500 font-bold">
                    <svg class="ico mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6"/><circle cx="12" cy="16.8" r="0.6" fill="currentColor"/></svg> 数字を正しく入力してください。
                </p>
            </div>
        </div>

        <!-- 結果表示エリア -->
        <div id="result-area" class="hidden">
            
            <!-- 保存対象エリア（ここから下を画像にします） -->
            <div id="capture-target" class="p-4 bg-white rounded-3xl">
                <!-- 基本の高さの表示 -->
                <div class="bg-gradient-to-r from-yellow-50 to-orange-50 p-6 rounded-3xl shadow-lg mb-8 border-l-8 border-orange-400">
                    <h2 class="text-xl font-bold text-orange-600 mb-2">あなたの基準（きじゅん）の高さ</h2>
                    <div class="flex items-end gap-2">
                        <span id="base-height-display" class="text-5xl font-extrabold text-slate-800">100</span>
                        <span class="text-2xl font-bold text-slate-600 mb-2">cm</span>
                    </div>
                    <p class="text-sm text-slate-500 mt-2 font-bold">
                        ※ 計算式: ( 身長 × 0.5 ) + <span id="formula-constant">110</span> - ( 50mタイム × 10 )
                    </p>
                </div>

                <!-- 得点表 -->
                <div class="bg-white rounded-3xl shadow-lg overflow-hidden border-2 border-slate-100">
                    <div class="p-4 bg-sky-50 border-b border-sky-100 flex justify-between items-center gap-2">
                        <h3 class="text-lg font-bold text-sky-800">
                            <svg class="ico mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 4.5l1.5-.8V8.5M3.5 14.2c.4-.9 2.7-1 2.7.5 0 1-2.7 2-2.7 3.3h2.8" stroke-width="1.6"/></svg> 得点・目標高さ一覧表

                            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.8l1.7-2.5h6l1.7 2.5h2.8A1.5 1.5 0 0 1 21 8.5v10A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5z"/><circle cx="12" cy="13.3" r="3.6"/></svg> 画像で保存
                        </button>
                    </div>

            </div>
        </div>

        <footer class="mt-12 mb-4 text-center text-xs text-slate-400 font-light" data-html2canvas-ignore>
            走り高跳び 目標計算機 | ver.2.4 | ota tools
        </footer>
    </div>

    <script>
        // iOS Safari のピンチ拡大を止める＋拡大されたままになったときの保険
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
            document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
        });
        function resetZoomIfNeeded() {
            if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
            const meta = document.querySelector('meta[name="viewport"]');
            if (!meta) return;
            const original = meta.getAttribute('content');
            meta.setAttribute('content', original + ', maximum-scale=1.0');
            requestAnimationFrame(() => meta.setAttribute('content', original));
        }
        window.visualViewport && window.visualViewport.addEventListener('resize', resetZoomIfNeeded);
        window.visualViewport && window.visualViewport.addEventListener('scroll', resetZoomIfNeeded);
        document.addEventListener('gestureend', () => setTimeout(resetZoomIfNeeded, 50), { passive: true });

        // デフォルトの定数
        let configConstant = 110;

        // ページ読み込み時にURLを確認する
        window.addEventListener('DOMContentLoaded', () => {
            // 1. クエリパラメータの確認 (?val=120 など)
            const urlParams = new URLSearchParams(window.location.search);
            const valParam = urlParams.get('val');
            
            if (valParam && !isNaN(parseInt(valParam, 10))) {
                configConstant = parseInt(valParam, 10);
            } else {
                // 2. パスの確認 (/120 など)
                const path = window.location.pathname;
                const match = path.match(/\/(\d+)$/);
                if (match && match[1]) {
                    configConstant = parseInt(match[1], 10);
                }
            }
            
            // 画面上の計算式テキストを更新
            document.getElementById('formula-constant').textContent = configConstant;
        });

        function calculate() {
            // 入力の取得
            const heightInput = document.getElementById('height');
            const timeInput = document.getElementById('time');
            const errorContainer = document.getElementById('error-container');
            const errorMsg = document.getElementById('error-msg');
            const resultArea = document.getElementById('result-area');

            const height = parseFloat(heightInput.value);
            const time = parseFloat(timeInput.value);

            // バリデーション
            if (isNaN(height) || isNaN(time) || height <= 0 || time <= 0) {
                showError("身長と50m走のタイムを正しく入力してください。");
                return;
            }

            if (time > 25) {
                showError(`50m走のタイムが ${time}秒 になっています。<br>ここには「8.5」のように<strong>秒数</strong>を入力してください。`);
                return;
            }

            errorContainer.classList.add('hidden');

            // 計算 (動的な定数を使用)
            let baseHeight = (height * 0.5) + configConstant - (time * 10);
            // 基準の高さを四捨五入
            baseHeight = Math.round(baseHeight);

            // 表示更新
            document.getElementById('base-height-display').textContent = baseHeight;

            // テーブル生成
            generateTable(baseHeight);

            // 表示
            resultArea.classList.remove('hidden');

            setTimeout(() => {
                document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            const errorMsg = document.getElementById('error-msg');
            const resultArea = document.getElementById('result-area');
            
            errorMsg.innerHTML = '<svg class="ico mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6"/><circle cx="12" cy="16.8" r="0.6" fill="currentColor"/></svg> ' + message;
            errorContainer.classList.remove('hidden');
            resultArea.classList.add('hidden');
        }

        function formatVal(val) {
            const rounded = Math.round(val * 100) / 100;
            return Number.isInteger(rounded) ? rounded : rounded;
        }

        function generateTable(base) {
            const tbody = document.getElementById('score-table-body');
            tbody.innerHTML = ''; 

            const scores = [
                { score: 10, minOffset: 20, maxOffset: null, type: 'over', color: 'text-red-500' },
                { score: 9, minOffset: 15, maxOffset: 19, type: 'range', color: 'text-orange-500' },
                { score: 8, minOffset: 10, maxOffset: 14, type: 'range', color: 'text-orange-500' },
                { score: 7, minOffset: 5, maxOffset: 9, type: 'range', color: 'text-orange-400' },
                { score: 6, minOffset: 0, maxOffset: 4, type: 'range', color: 'text-blue-600', isBase: true },
                { score: 5, minOffset: -5, maxOffset: -1, type: 'range', color: 'text-slate-600' },
                { score: 4, minOffset: -10, maxOffset: -6, type: 'range', color: 'text-slate-600' },
                { score: 3, minOffset: -15, maxOffset: -11, type: 'range', color: 'text-slate-600' },
                { score: 2, minOffset: -20, maxOffset: -16, type: 'range', color: 'text-slate-600' },
                { score: 1, minOffset: null, maxOffset: -21, type: 'under', color: 'text-slate-400' },
            ];

            scores.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100 hover:bg-sky-50 transition";
                
                if (row.isBase) {
                    tr.className += " bg-blue-50 border-l-4 border-blue-500";
                }

                let targetText = "";
                if (row.type === 'over') {
                    targetText = `${formatVal(base + row.minOffset)}cm 以上`;
                } else if (row.type === 'under') {
                    targetText = `${formatVal(base + row.maxOffset)}cm 以下`;
                } else {
                    const val1 = formatVal(base + row.minOffset);
                    const val2 = formatVal(base + row.maxOffset);
                    targetText = `${val1}cm 〜 ${val2}cm`;
                }

                tr.innerHTML = `
                    <td class="p-4 text-2xl ${row.color}">${row.score}</td>
                    <td class="p-4 text-xl md:text-2xl text-slate-800 bg-yellow-50/50">
                        ${targetText}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 画像保存機能
        function saveAsImage() {
            const element = document.getElementById('capture-target');
            const btn = document.getElementById('save-btn');
            const originalHTML = btn.innerHTML;

            btn.innerHTML = '<svg class="ico ico-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" /></svg> 作成中...';
            btn.disabled = true;

            html2canvas(element, {
                scale: 2,
                backgroundColor: "#ffffff",
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `高跳び目標計算結果_定数${configConstant}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
                
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }).catch(err => {
                console.error(err);
                alert('画像の保存に失敗しました。');
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            });
        }
    </script>

</script>
