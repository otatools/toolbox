        function showElem(elem) {
            if (!elem) return;
            elem.classList.remove('invisible', 'opacity-0', 'pointer-events-none');
            elem.classList.add('opacity-100', 'pointer-events-auto');
        }

        function hideElem(elem) {
            if (!elem) return;
            elem.classList.add('invisible', 'opacity-0', 'pointer-events-none');
            elem.classList.remove('opacity-100', 'pointer-events-auto');
        }

        function applyPlayerTheme(playerNum) {
            activePlayer = playerNum;
            const isP1 = playerNum === 1;

            if (!UI.actionPanel) initUI();

            UI.actionPanel.classList.remove('theme-p1-glow', 'theme-p2-glow', 'border-gray-800');
            UI.actionPanel.classList.add(isP1 ? 'theme-p1-glow' : 'theme-p2-glow');

            for (let i = 0; i < 4; i++) {
                const mark = document.getElementById(`pitcher-mark-${i}`);
                if (mark) {
                    mark.classList.remove('border-blue-400', 'border-red-500');
                    mark.classList.add(isP1 ? 'border-blue-400' : 'border-red-500');
                }
            }

            if (isP1) {
                UI.pitchBtn.className = "absolute inset-0 w-full h-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xl rounded-2xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition transform hover:scale-[1.02] active:scale-95 invisible opacity-0 pointer-events-none";
            } else {
                UI.pitchBtn.className = "absolute inset-0 w-full h-full bg-red-600 hover:bg-red-500 text-white font-extrabold text-xl rounded-2xl shadow-[0_0_20px_rgba(239,68,68,0.4)] transition transform hover:scale-[1.02] active:scale-95 invisible opacity-0 pointer-events-none";
            }

            UI.turnOverlay.classList.remove('border-blue-500/80', 'border-red-500/80', 'shadow-[0_0_30px_rgba(59,130,246,0.3)]', 'shadow-[0_0_30px_rgba(239,68,68,0.3)]');
            UI.overlayBadge.classList.remove('bg-blue-500/20', 'text-blue-300', 'border-blue-500/40', 'bg-red-500/20', 'text-red-300', 'border-red-500/40');
            UI.overlayTitle.classList.remove('from-blue-300', 'via-cyan-400', 'to-blue-500', 'from-red-300', 'via-rose-400', 'to-red-500');
            UI.overlayStartBtn.classList.remove('from-blue-600', 'to-cyan-600', 'hover:from-blue-500', 'hover:to-cyan-500', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]', 'from-red-600', 'to-rose-600', 'hover:from-red-500', 'hover:to-rose-500', 'shadow-[0_0_15px_rgba(239,68,68,0.4)]');

            if (isP1) {
                UI.turnOverlay.classList.add('border-blue-500/80', 'shadow-[0_0_30px_rgba(59,130,246,0.3)]');
                UI.overlayBadge.classList.add('bg-blue-500/20', 'text-blue-300', 'border-blue-500/40');
                UI.overlayTitle.classList.add('from-blue-300', 'via-cyan-400', 'to-blue-500');
                UI.overlayStartBtn.classList.add('from-blue-600', 'to-cyan-600', 'hover:from-blue-500', 'hover:to-cyan-500', 'text-white', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]');
            } else {
                UI.turnOverlay.classList.add('border-red-500/80', 'shadow-[0_0_30px_rgba(239,68,68,0.3)]');
                UI.overlayBadge.classList.add('bg-red-500/20', 'text-red-300', 'border-red-500/40');
                UI.overlayTitle.classList.add('from-red-300', 'via-rose-400', 'to-red-500');
                UI.overlayStartBtn.classList.add('from-red-600', 'to-rose-600', 'hover:from-red-500', 'hover:to-rose-500', 'text-white', 'shadow-[0_0_15px_rgba(239,68,68,0.4)]');
            }
        }

        function startGame() {
            initUI();
            const p1Input = document.getElementById('input-p1-name').value.trim();
            const p2Input = document.getElementById('input-p2-name').value.trim();
            player1Name = p1Input || "Player 1";
            player2Name = p2Input || "Player 2";

            document.getElementById('name-team1').innerText = player1Name;
            document.getElementById('name-team2').innerText = player2Name;

            currentInning = 1;
            isTop = true;
            score = { team1: 0, team2: 0 };
            totalInnings = baseInnings;
            extraInningUsed = false;
            gameEnded = false;
            inningScores = { team1: Array(baseInnings).fill(''), team2: Array(baseInnings).fill('') };
            isSayonara = false;
            hitsBy = { team1: 0, team2: 0 };
            maxDeficit = { team1: 0, team2: 0 };
            pitchHistory = [];
            renderPitchHistory();

            initInningState();
            setupScoreboard();
            updateScoreDisplay();
            
            UI.titleScreen.classList.add('hidden');
            UI.gameoverScreen.classList.add('hidden');
            UI.gameoverScreen.classList.remove('flex');
            UI.gameScreen.classList.remove('hidden');

            // 前の試合の結果発表オーバーレイが透明なまま押せる状態で残らないよう、念のため確実に隠す
            const decisionOverlay = document.getElementById('decision-announce');
            if (decisionOverlay) {
                decisionOverlay.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                decisionOverlay.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            }
            const backBtn = document.getElementById('back-to-result-btn');
            if (backBtn) backBtn.classList.add('hidden');

            startPitchingPhase();
            fitToWindow();
        }

        function initInningState() {
            outs = 0;
            bases = [false, false, false];
            updateBSO();
            updateBasesUI();
            resetCards();
            // 新しいイニング(半イニング)の開始なので、ランナー表示もリセットする
            ['base-runner-1', 'base-runner-2', 'base-runner-3', 'move-runner-0', 'move-runner-1', 'move-runner-2', 'move-runner-3'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('opacity-0');
            });
        }

        function setupScoreboard() {
            const header = document.getElementById('score-header-innings');
            const cells1 = document.getElementById('score-cells-team1');
            const cells2 = document.getElementById('score-cells-team2');

            // 延長戦に入った時だけスコアボードを詰めて表示し、
            // それ以外（通常時）はできるだけ大きく表示する
            const row = document.getElementById('scoreboard-inning-row');
            if (row) row.classList.toggle('extra-mode', totalInnings > baseInnings);

            let headerHTML = '';
            let cellsHTML = '';

            for(let i = 1; i <= totalInnings; i++) {
                // 延長戦の回は数字ではなく「延」と表示する
                const inningLabel = i > baseInnings ? '延' : i;
                headerHTML += `<div class="inning-col">${inningLabel}</div>`;
                cellsHTML += `<div class="inning-col" id="score-${i}">-</div>`;
            }

            header.innerHTML = `<div class="flex inning-col-row">${headerHTML}</div>`;
            cells1.innerHTML = `<div class="flex inning-col-row" id="team1-inning-cells">${cellsHTML}</div>`;
            cells2.innerHTML = `<div class="flex inning-col-row" id="team2-inning-cells">${cellsHTML.replace(/score-/g, 'score-t2-')}</div>`;
        }

        function updateHitsDisplay() {
            const h1 = document.getElementById('hits-team1');
            const h2 = document.getElementById('hits-team2');
            if (h1) h1.innerText = hitsBy.team1;
            if (h2) h2.innerText = hitsBy.team2;
        }

        function updateScoreDisplay() {
            document.getElementById('total-team1').innerText = score.team1;
            document.getElementById('total-team2').innerText = score.team2;
            updateHitsDisplay();

            const t1Cells = document.getElementById('team1-inning-cells').children;
            const t2Cells = document.getElementById('team2-inning-cells').children;
            
            for(let i = 0; i < totalInnings; i++) {
                // 先攻のスコア表示
                t1Cells[i].innerText = inningScores.team1[i] !== '' ? inningScores.team1[i] : '-';

                // 後攻のスコア表示（サヨナラの判定を含む）
                let t2ScoreText = inningScores.team2[i] !== '' ? inningScores.team2[i] : '-';
                // 最終回以降でサヨナラ勝ちが決まったイニングなら「x」を付ける
                if (isSayonara && i === currentInning - 1) {
                    if (t2ScoreText === '-') {
                         t2ScoreText = 'x';
                    } else {
                         t2ScoreText += 'x';
                    }
                }

                // xのフォントを変えるためにspanで囲む処理を追加（サヨナラのxが見やすいように）
                if (typeof t2ScoreText === 'string' && t2ScoreText.includes('x')) {
                    t2Cells[i].innerHTML = t2ScoreText.replace('x', '<span style="font-family: sans-serif; font-size: 0.8em; margin-left:1px;">x</span>');
                } else {
                    t2Cells[i].innerText = t2ScoreText;
                }

                // 試合終了後は「選択中」のハイライトを出さず、全イニングを同じ見た目にする
                if(!gameEnded && i + 1 === currentInning && isTop) {
                    t1Cells[i].classList.add('text-white', 'bg-gray-700');
                } else {
                    t1Cells[i].classList.remove('text-white', 'bg-gray-700');
                }

                if(!gameEnded && i + 1 === currentInning && !isTop) {
                    t2Cells[i].classList.add('text-white', 'bg-gray-700');
                } else {
                    t2Cells[i].classList.remove('text-white', 'bg-gray-700');
                }
            }

            document.getElementById('current-inning-display').innerText = `${currentInning}回 ${isTop ? '表' : '裏'}`;
        }

        function updateBSO() {
            const out1 = document.getElementById('out-1');
            const out2 = document.getElementById('out-2');
            
            if(outs >= 1) {
                out1.classList.replace('bg-gray-800', 'bg-red-500');
                out1.classList.add('shadow-[0_0_8px_#ef4444]');
            } else {
                out1.classList.replace('bg-red-500', 'bg-gray-800');
                out1.classList.remove('shadow-[0_0_8px_#ef4444]');
            }

            if(outs >= 2) {
                out2.classList.replace('bg-gray-800', 'bg-red-500');
                out2.classList.add('shadow-[0_0_8px_#ef4444]');
            } else {
                out2.classList.replace('bg-red-500', 'bg-gray-800');
                out2.classList.remove('shadow-[0_0_8px_#ef4444]');
            }
        }

        function updateBasesUI() {
            if (!UI.bases) return;
            for (let i = 0; i < 3; i++) {
                if (bases[i]) {
                    UI.bases[i].classList.add('occupied');
                } else {
                    UI.bases[i].classList.remove('occupied');
                }
            }
        }

        function getRoleName(role) {
            if (role === 'pitcher') {
                return isTop ? player2Name : player1Name;
            } else {
                return isTop ? player1Name : player2Name;
            }
        }

        function getPitcherPlayerNum() {
            return isTop ? 2 : 1;
        }

        function getBatterPlayerNum() {
            return isTop ? 1 : 2;
        }

        // ランナーのシルエットの色を、攻撃側（走者を出している側）のプレイヤーカラーに合わせる
        function getBatterColor() {
            // 目立ちすぎず、暗すぎない中間くらいのトーン
            return getBatterPlayerNum() === 1 ? '#3672d7' : '#d94442';
        }

        function startPitchingPhase() {
            currentPhase = 'pitching';
            hitPosition = -1;
            batPosition = -1;
            resetCards();
            clearTrajectory();
            hideElem(UI.nextPitchBtn);
            hideElem(UI.pitchBtn);
            renderPitchHistory();

            const pPlayerNum = getPitcherPlayerNum();
            applyPlayerTheme(pPlayerNum);

            const pName = getRoleName('pitcher');
            const pColorClass = pPlayerNum === 1 ? 'text-blue-400' : 'text-red-400';
            const borderClass = pPlayerNum === 1 ? 'border-blue-500' : 'border-red-500';

            UI.pitchBtn.innerText = '決定';
            
            UI.statusMessage.innerHTML = `<span class="text-xs sm:text-sm font-bold ${pColorClass}">ピッチャー：${pName}</span><span class="text-white mt-0.5 text-sm sm:text-base">どのパネルをヒットにする？</span>`;
            UI.statusMessage.className = `text-base sm:text-lg font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-2 ${borderClass} w-full shadow-lg shrink-0`;

            document.getElementById('overlay-role-badge').innerText = `PITCHING TURN (${pPlayerNum === 1 ? 'P1' : 'P2'})`;
            showOverlay(`⚾ ピッチャー ⚾`, `<span class="text-2xl font-black ${pColorClass} block mb-2">${pName}</span>打者に見えないように、<br>ヒットのパネルを決めてください`);
        }

        function startBattingPhase() {
            currentPhase = 'batting';
            batPosition = -1;
            hideElem(UI.pitchBtn);
            
            for(let i=0; i<4; i++) {
                document.getElementById(`pitcher-mark-${i}`).classList.add('hidden');
            }

            const bPlayerNum = getBatterPlayerNum();
            applyPlayerTheme(bPlayerNum);

            const bName = getRoleName('batter');
            const bColorClass = bPlayerNum === 1 ? 'text-blue-400' : 'text-red-400';
            const borderClass = bPlayerNum === 1 ? 'border-blue-500' : 'border-red-500';

            UI.statusMessage.innerHTML = `<span class="text-xs sm:text-sm font-bold ${bColorClass}">バッター：${bName}</span><span class="text-white mt-0.5 text-sm sm:text-base">ヒットはどこだ？</span>`;
            UI.statusMessage.className = `text-base sm:text-lg font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-2 ${borderClass} w-full shadow-lg shrink-0`;
            
            hideOverlay();
        }

        function handleCardClick(index) {
            if (currentPhase === 'pitching') {
                hitPosition = index;
                for(let i=0; i<4; i++) {
                    document.getElementById(`pitcher-mark-${i}`).classList.add('hidden');
                }
                document.getElementById(`pitcher-mark-${index}`).classList.remove('hidden');
                
                UI.pitchBtn.innerText = '決定';
                showElem(UI.pitchBtn);
            } 
            else if (currentPhase === 'batting') {
                const card = document.getElementById(`card-${index}`);
                if (card.classList.contains('is-flipped')) return;

                // 誤タップ対策：同じパネルをもう一度押したら選択解除できるようにする
                if (batPosition === index) {
                    batPosition = -1;
                    document.getElementById(`pitcher-mark-${index}`).classList.add('hidden');
                    hideElem(UI.pitchBtn);
                    return;
                }

                batPosition = index;
                for(let i=0; i<4; i++) {
                    document.getElementById(`pitcher-mark-${i}`).classList.add('hidden');
                }
                document.getElementById(`pitcher-mark-${index}`).classList.remove('hidden');

                UI.pitchBtn.innerText = '決定';
                showElem(UI.pitchBtn);
            }
        }

        function handleConfirmBtn() {
            if (currentPhase === 'pitching') {
                confirmPitch();
            } else if (currentPhase === 'batting') {
                confirmBat();
            }
        }

        function confirmPitch() {
            if (hitPosition !== -1) {
                startBattingPhase();
            }
        }

        function confirmBat() {
            if (batPosition !== -1) {
                hideElem(UI.pitchBtn);
                revealCard(batPosition);
            }
        }

        function revealCard(index) {
            currentPhase = 'result';
            const card = document.getElementById(`card-${index}`);
            const backFace = document.getElementById(`card-back-${index}`);
            const resultIcon = document.getElementById(`card-result-icon-${index}`);
            const resultText = document.getElementById(`card-result-text-${index}`);
            
            if (index === hitPosition) {
                const hitType = HIT_TYPES[index];
                resultIcon.innerHTML = hitIconSVG();
                resultText.className = 'outline-text absolute bottom-0.5 sm:bottom-1 left-0 right-0 text-center text-xl sm:text-3xl font-black whitespace-nowrap px-1';
                resultText.innerText = hitType.name;
                resultText.style.color = hitType.color;
                backFace.style.borderColor = hitType.color;
                backFace.style.backgroundColor = '#fffbeb';
            } else {
                // アウトはイラストなし。中央に「アウト」の文字だけを表示する
                resultIcon.innerHTML = '';
                resultText.className = 'text-2xl sm:text-4xl font-black tracking-widest';
                resultText.innerText = 'アウト';
                resultText.style.color = '#ef4444';
                backFace.style.borderColor = '#f87171';
                backFace.style.backgroundColor = '#fef2f2';
            }
            
            card.classList.add('is-flipped');

            // 投球履歴には、実際にヒットのカードが表向きになった瞬間
            // （＝打者が当てて表になった時）だけ記録する。外れた時の
            // パネルでは本当の仕込み位置はまだ明かされていないので記録しない。
            if (index === hitPosition) {
                pitchHistory.push({ position: hitPosition, pitcherKey: isTop ? 'team2' : 'team1' });
                renderPitchHistory();
            }

            setTimeout(() => {
                if (index === hitPosition) {
                    handleHit(index);
                } else {
                    handleOut();
                }
            }, 800);
        }

        function handleOut() {
            outs++;
            updateBSO();

            if (outs >= 3) {
                revealHiddenHitPosition(); // チェンジのタイミングでヒットの隠し場所を明かす

                UI.statusMessage.innerHTML = `<span class="text-red-400 text-xl font-black tracking-widest">3アウト！ チェンジ！</span>`;
                UI.statusMessage.className = "text-base font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-4 border-red-500 w-full shadow-lg shrink-0";

                setTimeout(() => {
                    changeInning();
                }, 2000);
            } else {
                UI.statusMessage.innerHTML = `<span class="text-white">アウト！</span><span class="text-red-400 text-lg font-bold mt-0.5">${outs}アウト</span>`;
                currentPhase = 'batting';
            }
        }

        // チェンジ（3アウト）のタイミングで、ピッチャーが本当はどこにヒットを隠していたかを公開する
        function revealHiddenHitPosition() {
            if (hitPosition === -1) return;
            const card = document.getElementById(`card-${hitPosition}`);
            if (!card || card.classList.contains('is-flipped')) return; // すでにヒットしていた場合は公開済み

            const hitType = HIT_TYPES[hitPosition];
            const backFace = document.getElementById(`card-back-${hitPosition}`);
            const resultIcon = document.getElementById(`card-result-icon-${hitPosition}`);
            const resultText = document.getElementById(`card-result-text-${hitPosition}`);

            resultIcon.innerHTML = hitIconSVG();
            resultText.className = 'outline-text absolute bottom-0.5 sm:bottom-1 left-0 right-0 text-center text-lg sm:text-2xl font-black whitespace-nowrap px-1';
            resultText.innerText = hitType.name;
            resultText.style.color = hitType.color;
            backFace.style.borderColor = hitType.color;
            backFace.style.backgroundColor = '#fffbeb';

            card.classList.add('is-flipped');

            // ここで初めてヒットの位置が明かされるので、投球履歴に記録する
            pitchHistory.push({ position: hitPosition, pitcherKey: isTop ? 'team2' : 'team1' });
            renderPitchHistory();
        }

        function handleHit(typeIndex) {
            const hitInfo = HIT_TYPES[typeIndex];
            UI.statusMessage.innerHTML = `<span class="text-green-400 text-2xl font-black">${hitInfo.name}！！</span>`;
            UI.statusMessage.className = "text-base font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-4 border-green-500 w-full shadow-lg shrink-0";

            // 完全試合判定用に、打っているチームの安打数を記録する
            hitsBy[isTop ? 'team1' : 'team2']++;
            updateHitsDisplay();

            animateTrajectory(typeIndex);

            let runsScored = 0;
            let newBases = [false, false, false];
            const advanceBases = hitInfo.bases;
            const oldBases = bases.slice();

            for (let i = 2; i >= 0; i--) {
                if (bases[i]) {
                    let nextBase = (i + 1) + advanceBases;
                    if (nextBase > 3) {
                        runsScored++;
                    } else {
                        newBases[nextBase - 1] = true;
                    }
                }
            }

            if (advanceBases === 4) {
                runsScored++;
            } else {
                newBases[advanceBases - 1] = true;
            }

            bases = newBases;
            updateBasesUI();

            // ランナーは演出として走らせるが、得点自体はランナーの帰塁を待たずに即時反映する
            animateAllRunners(advanceBases, oldBases);

            if (runsScored > 0) {
                addScore(runsScored);
            }
            checkGameEndCondition();

            // ランナーが帰ってきていなくても、サヨナラ勝ちでなければすぐ「次の投球へ」を押せるようにする
            if (!isSayonara) {
                showElem(UI.nextPitchBtn);
            }
        }

        // 複数の走者が短い間隔で連続生還する場合、加点とテロップ演出（表示→数字加算→非表示）が
        // 重ならないように1人分ずつ順番に処理するためのキュー。
        // 得点の反映（addScore）自体もこのキューの中で行うので、実際に画面の得点が
        // 増えるタイミングと、テロップのアニメーションが常に一致する。
        let scoreBannerQueue = [];
        let isScoreBannerPlaying = false;

        function queueRunScore(runs) {
            scoreBannerQueue.push(runs);
            processScoreBannerQueue();
        }

        function processScoreBannerQueue() {
            if (isScoreBannerPlaying) return;
            const runs = scoreBannerQueue.shift();
            if (runs === undefined) return;
            isScoreBannerPlaying = true;

            const prevScore1 = score.team1;
            const prevScore2 = score.team2;
            addScore(runs);

            playScoreBanner(prevScore1, prevScore2, runs, () => {
                isScoreBannerPlaying = false;
                processScoreBannerQueue();
            });
        }

        function showExtraInningsBanner() {
            const banner = document.getElementById('extra-innings-banner');
            if (!banner) return;
            banner.classList.remove('opacity-0', 'scale-90');
            banner.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                banner.classList.remove('opacity-100', 'scale-100');
                banner.classList.add('opacity-0', 'scale-90');
            }, 2200);
        }

        function playScoreBanner(prev1, prev2, runs, onDone) {
            const banner = document.getElementById('tv-score-banner');
            const score1Elem = document.getElementById('tv-team1-score');
            const score2Elem = document.getElementById('tv-team2-score');
            const runsElem = document.getElementById('tv-score-runs');
            const glowElem = document.getElementById('tv-score-glow');

            document.getElementById('tv-team1-name').innerText = player1Name;
            document.getElementById('tv-team2-name').innerText = player2Name;
            runsElem.innerText = `+${runs}点`;

            score1Elem.innerText = prev1;
            score2Elem.innerText = prev2;

            const targetScoreElem = isTop ? score1Elem : score2Elem;
            const otherScoreElem = isTop ? score2Elem : score1Elem;
            const boardTotalElem = isTop ? document.getElementById('total-team1') : document.getElementById('total-team2');
            const initialScore = isTop ? prev1 : prev2;

            // 得点が入る方だけ「白→黄色」のくるん演出にする。動かない方は
            // ずっと通常の黄色のままにして、止まったときに色がちぐはぐに
            // ならないようにする。
            targetScoreElem.classList.remove('animate-kurun', 'text-yellow-400');
            targetScoreElem.classList.add('text-white');
            otherScoreElem.classList.remove('animate-kurun', 'text-white');
            otherScoreElem.classList.add('text-yellow-400');

            banner.classList.remove('opacity-0', 'scale-90');
            banner.classList.add('opacity-100', 'scale-100');

            if (boardTotalElem) {
                boardTotalElem.innerText = initialScore;
            }

            let currentStep = 0;

            setTimeout(() => {
                glowElem.classList.remove('opacity-0');
                
                function addNextRun() {
                    if (currentStep < runs) {
                        currentStep++;
                        const currentDisplayVal = initialScore + currentStep;

                        targetScoreElem.classList.remove('animate-kurun');
                        if (boardTotalElem) boardTotalElem.classList.remove('animate-kurun');

                        void targetScoreElem.offsetWidth;

                        targetScoreElem.classList.add('animate-kurun');
                        if (boardTotalElem) boardTotalElem.classList.add('animate-kurun');

                        setTimeout(() => {
                            targetScoreElem.innerText = currentDisplayVal;
                            if (boardTotalElem) boardTotalElem.innerText = currentDisplayVal;
                            targetScoreElem.classList.remove('text-white');
                            targetScoreElem.classList.add('text-yellow-400');
                        }, 450);

                        if (currentStep < runs) {
                            setTimeout(addNextRun, 1000);
                        } else {
                            // 表示の保持時間。次の投球には別ボタンで進めるので、
                            // ここは急がずしっかり見せる長さにしてある
                            setTimeout(() => {
                                glowElem.classList.add('opacity-0');
                                banner.classList.remove('opacity-100', 'scale-100');
                                banner.classList.add('opacity-0', 'scale-90');

                                // テロップ終了後にサヨナラ判定を行う
                                checkGameEndCondition();

                                // 次に控えている生還者のテロップがあれば、ここで引き継いで再生する
                                if (onDone) onDone();

                            }, 2200);
                        }
                    }
                }

                addNextRun();
            }, 350);
        }

        // パソコン版（横画面）の軌道を基準に、各制御点を400x400のビューボックスに対する
        // 割合（0〜1、ホームランのみ上方向にはみ出すので負の値もあり）として定義したもの。
        // これを実際のフィールド表示サイズに掛け合わせることで、縦画面でも横画面と
        // 「同じだけ飛んでいるように見える」軌道になる。
        const TRAJECTORY_FRACTIONS = [
            { start: [0.5, 0.725], c1: [0.575, 0.275], e1: [0.6125, 0.375], c2: [0.625, 0.35], e2: [0.6375, 0.3575] }, // 1塁打
            { start: [0.5, 0.725], c1: [0.375, 0.275], e1: [0.325, 0.4], c2: [0.2875, 0.3375], e2: [0.2625, 0.375] }, // 2塁打
            { start: [0.5, 0.725], c1: [0.675, 0.2375], e1: [0.7375, 0.3875], c2: [0.8, 0.3], e2: [0.8375, 0.35] }, // 3塁打
            { start: [0.5, 0.725], c1: [0.25, -0.225], e1: [0.15, 0.1125] } // ホームラン
        ];

        function animateTrajectory(typeIndex) {
            const pathElem = document.getElementById('ball-path');
            const coreElem = document.getElementById('ball-path-core');
            const ballElem = document.getElementById('ball-head');
            const scoreboard = document.getElementById('scoreboard-box');
            const svgElem = document.getElementById('trajectory-svg');
            const container = document.getElementById('field-container');

            // 実際に表示されているフィールドの縦横サイズ（縦画面/横画面どちらでも実寸を取得）
            const W = (container && container.clientWidth) || 400;
            const H = (container && container.clientHeight) || 400;
            svgElem.setAttribute('viewBox', `0 0 ${W} ${H}`);

            const t = TRAJECTORY_FRACTIONS[typeIndex];

            // 縦画面は土台の形が横画面と違うため、軌道の割合をそのまま使うと
            // 始点（ホームベース）がズレる。実際のホームベース位置との差分だけ
            // 軌道全体を平行移動させ、カーブの形は保ったまま始点を合わせる。
            const appElem = document.getElementById('app');
            const isPortrait = appElem && appElem.classList.contains('is-portrait');
            let dx = 0, dy = 0;
            if (isPortrait) {
                const pts = getBasePoints(W, H);
                dx = (pts.home[0] / W) - t.start[0];
                dy = (pts.home[1] / H) - t.start[1];
            }

            // 縦画面はホームベースが下寄りにあるため、始点を合わせただけだと
            // どの打球も伸び幅が縮んで見える。始点からの伸び幅を拡大して、
            // しっかり飛んでいるように補正する（ホームランはより大きく）。
            const reachStretch = isPortrait
                ? (typeIndex === 3 ? 1.9 : (typeIndex === 2 ? 1.25 : 1.5))
                : 1;

            const px = (p) => (((t.start[0] + dx) + (p[0] - t.start[0]) * reachStretch) * W).toFixed(1);
            const py = (p) => (((t.start[1] + dy) + (p[1] - t.start[1]) * reachStretch) * H).toFixed(1);

            let d;
            if (typeIndex === 3) {
                d = `M ${px(t.start)} ${py(t.start)} Q ${px(t.c1)} ${py(t.c1)} ${px(t.e1)} ${py(t.e1)}`;
            } else {
                d = `M ${px(t.start)} ${py(t.start)} Q ${px(t.c1)} ${py(t.c1)} ${px(t.e1)} ${py(t.e1)} Q ${px(t.c2)} ${py(t.c2)} ${px(t.e2)} ${py(t.e2)}`;
            }

            pathElem.setAttribute('d', d);
            if (coreElem) coreElem.setAttribute('d', d);

            const length = pathElem.getTotalLength();
            pathElem.style.strokeDasharray = length;
            pathElem.style.strokeDashoffset = length;
            if (coreElem) {
                coreElem.style.strokeDasharray = length;
                coreElem.style.strokeDashoffset = length;
            }

            pathElem.classList.remove('opacity-0');
            if (coreElem) coreElem.classList.remove('opacity-0');
            ballElem.classList.remove('opacity-0');

            let startTime = null;
            const duration = typeIndex === 3 ? 1500 : 1200;

            // ボールらしさを出すため、飛んでいる間だけランダムな速さ・向きでゆっくり回転させる
            const spinSpeed = (220 + Math.random() * 260) * (Math.random() < 0.5 ? -1 : 1); // 度/秒

            // 次の投球へ進んで打ち切られたら、この打球アニメーションの残りは処理しない
            // （ホームランのスコアボード演出が後から遅れて発動するのを防ぐ）
            const myTrajGen = trajectoryAnimGen;

            function step(timestamp) {
                if (myTrajGen !== trajectoryAnimGen) return;
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);

                const currentOffset = length * (1 - progress);
                pathElem.style.strokeDashoffset = currentOffset;
                if (coreElem) coreElem.style.strokeDashoffset = currentOffset;

                const currentPoint = pathElem.getPointAtLength(length * progress);
                const spinAngle = (elapsed / 1000) * spinSpeed;
                ballElem.setAttribute('transform', `translate(${currentPoint.x},${currentPoint.y}) rotate(${spinAngle.toFixed(1)})`);

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    if (typeIndex === 3 && scoreboard) {
                        scoreboard.classList.add('translate-y-[-4px]', 'scale-105', 'border-yellow-400');
                        setTimeout(() => {
                            scoreboard.classList.remove('translate-y-[-4px]', 'scale-105', 'border-yellow-400');
                        }, 300);
                    }
                }
            }

            requestAnimationFrame(step);
        }

        // ランナーのシルエット（トレース元イラスト）の実寸ピクセルサイズ
        const RUNNER_W = 224;
        const RUNNER_H = 237;

        // ホーム・1塁・2塁・3塁の見た目上の位置（W×Hに対する割合）。
        // 実際のスクリーンショットを解析して算出した実測値ベース。横画面（PC版）用。
        const BASE_POINTS = {
            home: [0.495, 0.771],
            first: [0.799, 0.573],
            second: [0.495, 0.435],
            third: [0.223, 0.574]
        };

        // ホーム→1塁→2塁→3塁→（ホームイン）の順で走る。区間ごとの向き。
        // true=左向き、false=右向き（シルエット素材はデフォルトで右向き）
        const BASE_ORDER = ['home', 'first', 'second', 'third', 'home'];
        const LEG_FLIP = [false, true, true, false]; // home→1塁, 1塁→2塁, 2塁→3塁, 3塁→home
        const REST_SLOT_ID = { 1: 'base-runner-1', 2: 'base-runner-2', 3: 'base-runner-3' };

        // 軌道SVGのviewBoxを、実際に表示されているフィールドの実寸（縦画面/横画面どちらでも）
        // に同期させる。これをしておかないと、translate(x,y)で指定する座標（実ピクセル）と
        // SVG内部の座標系がズレてしまう。
        function syncSvgViewBox() {
            const container = document.getElementById('field-container');
            const svgElem = document.getElementById('trajectory-svg');
            const W = (container && container.clientWidth) || 400;
            const H = (container && container.clientHeight) || 400;
            if (svgElem) svgElem.setAttribute('viewBox', `0 0 ${W} ${H}`);
            return { W, H };
        }

        // ホーム・1塁・2塁・3塁の実際の見た目上の位置を返す。
        // 横画面（PC版）は元々調整済みの固定割合をそのまま使用（変更なし）。
        // 縦画面（スマホ版）はグラウンドの形を個別に調整しているため、
        // 実際に描画されているベース要素（DOM）の座標から直接取得する。
        function getBasePoints(W, H) {
            const appElem = document.getElementById('app');
            const isPortrait = appElem && appElem.classList.contains('is-portrait');

            if (!isPortrait) {
                return {
                    home: [BASE_POINTS.home[0] * W, BASE_POINTS.home[1] * H],
                    first: [BASE_POINTS.first[0] * W, BASE_POINTS.first[1] * H],
                    second: [BASE_POINTS.second[0] * W, BASE_POINTS.second[1] * H],
                    third: [BASE_POINTS.third[0] * W, BASE_POINTS.third[1] * H]
                };
            }

            const container = document.getElementById('field-container');
            const homeEl = document.querySelector('.home-base');
            const b1 = document.getElementById('base-1');
            const b2 = document.getElementById('base-2');
            const b3 = document.getElementById('base-3');
            if (!container || !homeEl || !b1 || !b2 || !b3) {
                return {
                    home: [BASE_POINTS.home[0] * W, BASE_POINTS.home[1] * H],
                    first: [BASE_POINTS.first[0] * W, BASE_POINTS.first[1] * H],
                    second: [BASE_POINTS.second[0] * W, BASE_POINTS.second[1] * H],
                    third: [BASE_POINTS.third[0] * W, BASE_POINTS.third[1] * H]
                };
            }
            const cRect = container.getBoundingClientRect();
            // #app 全体は fitToWindow() で transform: scale(...) されているため、
            // getBoundingClientRect() は「拡縮後」の実画面ピクセルを返す。
            // 一方 viewBox は clientWidth/clientHeight（拡縮前のレイアウト寸法）を
            // 基準にしているので、そのままだと拡大縮小率の分だけズレる。
            // ここでスケール比を実測して割り戻し、viewBoxと同じ座標系に揃える。
            const scaleFactor = (container.clientWidth && cRect.width)
                ? (cRect.width / container.clientWidth)
                : 1;
            const centerOf = (el) => {
                const r = el.getBoundingClientRect();
                return [
                    (r.left + r.width / 2 - cRect.left) / scaleFactor,
                    (r.top + r.height / 2 - cRect.top) / scaleFactor
                ];
            };
            return {
                home: centerOf(homeEl),
                first: centerOf(b1),
                second: centerOf(b2),
                third: centerOf(b3)
            };
        }

        // ランナーの表示倍率。縦画面は土台が横長（＝高さが小さい）ので、
        // min(W,H)基準のままだと小さくなりすぎるため係数を上げる。
        function getRunnerScale(W, H) {
            const appElem = document.getElementById('app');
            const isPortrait = appElem && appElem.classList.contains('is-portrait');
            const coef = isPortrait ? 0.24 : 0.13;
            return (Math.min(W, H) * coef) / RUNNER_H;
        }

        function placeRunnerElem(elem, x, y, flip, scale) {
            const flipPart = flip ? ' scale(-1,1)' : '';
            elem.setAttribute('transform',
                `translate(${x},${y}) scale(${scale})${flipPart} translate(${-RUNNER_W / 2},${-RUNNER_H})`);
        }

        // 現在の bases[] に合わせて、塁上で待機しているランナー表示を同期する
        function syncRestingRunners() {
            const { W, H } = syncSvgViewBox();
            const pts = getBasePoints(W, H);
            const scale = getRunnerScale(W, H);

            for (let i = 0; i < 3; i++) {
                const baseNum = i + 1;
                const elem = document.getElementById(REST_SLOT_ID[baseNum]);
                if (!elem) continue;
                if (bases[i]) {
                    const pt = pts[BASE_ORDER[baseNum]];
                    const flip = LEG_FLIP[baseNum]; // 次の塁へ進む向きで待機させる
                    elem.style.color = getBatterColor();
                    placeRunnerElem(elem, pt[0], pt[1], flip, scale);
                    elem.classList.remove('opacity-0');
                } else {
                    elem.classList.add('opacity-0');
                }
            }
        }

        // startIndex→endIndexの区間リストと所要時間を計算する共通ロジック
        function computeRunnerLegs(startIndex, endIndex, W, H) {
            const pts = getBasePoints(W, H);
            const legs = [];
            for (let i = startIndex; i < endIndex; i++) {
                legs.push({
                    from: pts[BASE_ORDER[i]],
                    to: pts[BASE_ORDER[i + 1]],
                    flip: LEG_FLIP[i]
                });
            }
            const legLengths = legs.map(l => Math.hypot(l.to[0] - l.from[0], l.to[1] - l.from[1]));
            const totalLength = legLengths.reduce((a, b) => a + b, 0);
            const baseDuration = 1450; // 1区間あたりの目安タイム（少しゆっくりめに）
            const duration = legs.length > 0 ? baseDuration * (totalLength / (legLengths[0] || 1)) : 0;
            return { legs, legLengths, totalLength, duration };
        }

        // 1人のランナーを startIndex(0=home,1=1塁,2=2塁,3=3塁) から
        // endIndex(1〜3=その塁で停止、4=生還してホームイン) まで走らせる
        // 打球の線と走者の重なり順を区間に応じて切り替える。
        // 3塁→ホームの区間だけは走者を前面に、それ以外は打球の線を前面（走者はその下）にする。
        function setRunnerLayering(elem, globalLegIndex) {
            const svgElem = document.getElementById('trajectory-svg');
            const ballPathElem = document.getElementById('ball-path');
            if (!svgElem || !ballPathElem || !elem) return;
            if (globalLegIndex === 3) {
                svgElem.appendChild(elem); // 3塁→ホーム：走者を最前面に
            } else {
                svgElem.insertBefore(elem, ballPathElem); // それ以外：打球の線より奥に
            }
        }

        function animateOneRunner(elem, startIndex, endIndex, onDone) {
            const { W, H } = syncSvgViewBox();

            const { legs, legLengths, totalLength, duration } = computeRunnerLegs(startIndex, endIndex, W, H);
            if (legs.length === 0) { if (onDone) onDone(); return; }

            const scale = getRunnerScale(W, H);
            elem.style.color = getBatterColor();
            elem.classList.remove('opacity-0');

            // 次の投球へ進んで打ち切られた場合、この走者アニメーションは処理を続けない
            const myGen = runnerAnimGen;

            let startTime = null;
            function step(timestamp) {
                if (myGen !== runnerAnimGen) return; // 次の投球へ進んだので打ち切り
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const overallProgress = Math.min(elapsed / duration, 1);
                const distanceSoFar = overallProgress * totalLength;

                let acc = 0;
                let legIndex = legs.length - 1;
                let legProgress = 1;
                for (let i = 0; i < legs.length; i++) {
                    if (distanceSoFar <= acc + legLengths[i] || i === legs.length - 1) {
                        legIndex = i;
                        legProgress = legLengths[i] > 0 ? Math.min((distanceSoFar - acc) / legLengths[i], 1) : 1;
                        break;
                    }
                    acc += legLengths[i];
                }

                const leg = legs[legIndex];
                const x = leg.from[0] + (leg.to[0] - leg.from[0]) * legProgress;
                const y = leg.from[1] + (leg.to[1] - leg.from[1]) * legProgress;
                setRunnerLayering(elem, startIndex + legIndex);
                placeRunnerElem(elem, x, y, leg.flip, scale);

                if (overallProgress < 1) {
                    requestAnimationFrame(step);
                } else {
                    elem.classList.add('opacity-0');
                    if (onDone) onDone();
                }
            }
            requestAnimationFrame(step);
        }

        // 打者走者と、すでに塁に出ていたランナー全員を、野球のルール通りに同時に走らせる
        // onRunnerScored: 生還する走者が「1人ホームに帰ってくるたび」に個別に呼ばれる
        // （複数人が同時に生還する場面でも、まとめてではなく到着した順に1人ずつ加点させるため）
        function animateAllRunners(advanceBases, oldBases, onRunnerScored) {
            // これから動く塁上のランナーは、走塁アニメーションに差し替えるのでいったん隠す
            for (let i = 0; i < 3; i++) {
                const elem = document.getElementById(REST_SLOT_ID[i + 1]);
                if (elem) elem.classList.add('opacity-0');
            }

            const movers = [{ start: 0, end: advanceBases }]; // 打者走者（ホームから出発）
            for (let i = 2; i >= 0; i--) {
                if (oldBases[i]) {
                    const start = i + 1;
                    const end = Math.min(start + advanceBases, 4); // 3塁を超えたら生還(4)
                    movers.push({ start, end });
                }
            }

            // 生還する走者は、他の走者を待たずに「自分がホームに到達した瞬間」に
            // 個別にコールバックする（同時生還ではなく、到着した順に1人ずつ加点させるため）
            movers.forEach((m, idx) => {
                const elem = document.getElementById('move-runner-' + idx);
                if (!elem) return;
                animateOneRunner(elem, m.start, m.end, () => {
                    if (m.end <= 3) {
                        syncRestingRunners(); // 塁に到達したら待機表示に切り替え
                    } else if (onRunnerScored) {
                        onRunnerScored();
                    }
                });
            });
        }

        // まだ走塁アニメーション中の走者がいても、次の投球へ進むタイミングで
        // 現在の bases[] に合わせた状態へふわっと（フェードで）切り替える
        function settleRunnersForNextPitch() {
            runnerAnimGen++; // 進行中のrequestAnimationFrameループをすべて打ち切る

            for (let i = 0; i < 4; i++) {
                const elem = document.getElementById('move-runner-' + i);
                if (elem) elem.classList.add('opacity-0');
            }

            syncRestingRunners(); // 塁上表示を現在のbases[]に合わせてフェードで同期
        }

        function clearTrajectory() {
            const pathElem = document.getElementById('ball-path');
            const coreElem = document.getElementById('ball-path-core');
            const ballElem = document.getElementById('ball-head');
            // ランナーは塁に残るので、ここでは消さない（次のイニングの開始時などにのみリセットする）
            if (pathElem) pathElem.classList.add('opacity-0');
            if (coreElem) coreElem.classList.add('opacity-0');
            if (ballElem) ballElem.classList.add('opacity-0');

            // 打球アニメーションを打ち切り、ホームランのスコアボード演出が
            // 次の投球まで持ち越されて後から光ったりしないよう即座に消す
            trajectoryAnimGen++;
            const scoreboard = document.getElementById('scoreboard-box');
            if (scoreboard) {
                scoreboard.classList.remove('translate-y-[-4px]', 'scale-105', 'border-yellow-400');
            }
        }

        // スコアボードの得点数字を、くるんと回って黄色に光るアニメーションで再生する
        function playBoardKurun(elem) {
            if (!elem) return;
            elem.classList.remove('animate-kurun');
            void elem.offsetWidth; // 強制リフローでアニメーションを最初から再生させる
            elem.classList.add('animate-kurun');
        }

        // TV中継風のポップアップテロップを表示する。得点はすでに反映済みの
        // 最終スコアをそのまま出し、演出として数字がくるんと白→黄色に光る。
        // 次の投球へ進む操作をブロックしないよう、あくまで見た目だけの演出。
        function playScoreTelop(team, runs) {
            const banner = document.getElementById('tv-score-banner');
            const score1Elem = document.getElementById('tv-team1-score');
            const score2Elem = document.getElementById('tv-team2-score');
            const runsElem = document.getElementById('tv-score-runs');
            const glowElem = document.getElementById('tv-score-glow');
            if (!banner || !score1Elem || !score2Elem || !runsElem || !glowElem) return;

            document.getElementById('tv-team1-name').innerText = player1Name;
            document.getElementById('tv-team2-name').innerText = player2Name;
            runsElem.innerText = `+${runs}点`;

            score1Elem.innerText = score.team1;
            score2Elem.innerText = score.team2;

            const targetScoreElem = team === 'team1' ? score1Elem : score2Elem;
            const otherScoreElem = team === 'team1' ? score2Elem : score1Elem;

            // 得点が入った方だけ「白→黄色」のくるん演出にする。
            // 相手チームの数字はハイライトせず、常に通常の白のままにする
            targetScoreElem.classList.remove('animate-kurun', 'text-yellow-400');
            targetScoreElem.classList.add('text-white');
            otherScoreElem.classList.remove('animate-kurun', 'text-yellow-400');
            otherScoreElem.classList.add('text-white');

            banner.classList.remove('opacity-0', 'scale-90');
            banner.classList.add('opacity-100', 'scale-100');

            scoreTelopGen++;
            const myGen = scoreTelopGen;

            setTimeout(() => {
                if (myGen !== scoreTelopGen) return;
                glowElem.classList.remove('opacity-0');

                targetScoreElem.classList.remove('animate-kurun');
                void targetScoreElem.offsetWidth;
                targetScoreElem.classList.add('animate-kurun');

                setTimeout(() => {
                    if (myGen !== scoreTelopGen) return;
                    targetScoreElem.classList.remove('text-white');
                    targetScoreElem.classList.add('text-yellow-400');
                }, 450);

                setTimeout(() => {
                    if (myGen !== scoreTelopGen) return;
                    glowElem.classList.add('opacity-0');
                    banner.classList.remove('opacity-100', 'scale-100');
                    banner.classList.add('opacity-0', 'scale-90');
                }, 2200);
            }, 350);
        }

        function addScore(runs) {
            const currentTeam = isTop ? 'team1' : 'team2';
            score[currentTeam] += runs;

            let currentInningScore = parseInt(inningScores[currentTeam][currentInning - 1]) || 0;
            inningScores[currentTeam][currentInning - 1] = currentInningScore + runs;

            // 逆転・大逆転判定用に、各チームがこれまでで一番離されていた点差を更新しておく
            const gapAgainstTeam1 = score.team2 - score.team1;
            const gapAgainstTeam2 = score.team1 - score.team2;
            if (gapAgainstTeam1 > maxDeficit.team1) maxDeficit.team1 = gapAgainstTeam1;
            if (gapAgainstTeam2 > maxDeficit.team2) maxDeficit.team2 = gapAgainstTeam2;

            updateScoreDisplay();
            playBoardKurun(document.getElementById(currentTeam === 'team1' ? 'total-team1' : 'total-team2'));
            playScoreTelop(currentTeam, runs);
        }

        function checkGameEndCondition() {
            // 後攻（裏）の攻撃中、かつ最終回以降で、後攻の点数が先攻を上回った瞬間にサヨナラ勝ち
            if (!isTop && currentInning >= totalInnings && score.team2 > score.team1) {
                isSayonara = true;
                updateScoreDisplay(); // xを描画させるため再更新
                
                UI.statusMessage.innerHTML = `<span class="text-yellow-400 text-2xl font-black tracking-widest">サヨナラ勝ち！</span>`;
                UI.statusMessage.className = "text-base font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-4 border-yellow-500 w-full shadow-lg shrink-0";
                
                setTimeout(() => {
                    endGame();
                }, 2000);
            }
        }

        function nextPitch() {
            if(!isSayonara) {
                // まだランナーが走っている途中でも、現在のbases[]に合わせてふわっと切り替える
                settleRunnersForNextPitch();

                // 次の投球へ進むときは、まだ得点テロップが表示中でも即座に消す
                // （予約済みのタイマーも世代カウンタで無効化しておく）
                scoreTelopGen++;
                const scoreBanner = document.getElementById('tv-score-banner');
                const scoreGlow = document.getElementById('tv-score-glow');
                if (scoreBanner) {
                    scoreBanner.classList.remove('opacity-100', 'scale-100');
                    scoreBanner.classList.add('opacity-0', 'scale-90');
                }
                if (scoreGlow) scoreGlow.classList.add('opacity-0');

                startPitchingPhase();
            }
        }

        function resetCards() {
            for(let i=0; i<4; i++) {
                const card = document.getElementById(`card-${i}`);
                if (card) {
                    card.classList.remove('is-flipped');
                    document.getElementById(`pitcher-mark-${i}`).classList.add('hidden');
                    // iOS Safariで裏面の描画が古いまま残る対策として、
                    // 強制的にレイアウトを再計算させる
                    void card.offsetHeight;

                    setTimeout(() => {
                        const backFace = document.getElementById(`card-back-${i}`);
                        if (backFace) {
                            backFace.style.borderColor = '#e5e7eb';
                            backFace.style.backgroundColor = '#ffffff';
                        }
                    }, 600);
                }
            }
        }

        function changeInning() {
            const currentTeam = isTop ? 'team1' : 'team2';
            if (inningScores[currentTeam][currentInning - 1] === '') {
                inningScores[currentTeam][currentInning - 1] = 0;
            }
            // 電光掲示板を必ずこの時点で確定表示させる（ゲーム終了パターンでも反映されるように）
            updateScoreDisplay();

            if (isTop) {
                isTop = false;
                // 後攻の攻撃が始まる前に、すでに後攻が勝っていて最終回なら、その時点でサヨナラ扱い（xのみ表示）で終了
                if (currentInning >= totalInnings && score.team2 > score.team1) {
                     isSayonara = true;
                     inningScores.team2[currentInning - 1] = ''; // 点数は入っていない
                     updateScoreDisplay(); // xを描画
                     endGame();
                     return;
                }
            } else {
                isTop = true;
                currentInning++;
            }

            // 規定イニングを終えても同点なら、延長戦を1回だけ追加する
            if (currentInning > totalInnings && !extraInningUsed && score.team1 === score.team2) {
                extraInningUsed = true;
                totalInnings = currentInning;
                inningScores.team1.push('');
                inningScores.team2.push('');
                setupScoreboard();
                updateScoreDisplay();
                showExtraInningsBanner();
            }

            if (currentInning > totalInnings) {
                endGame();
                return;
            }

            initInningState();
            updateScoreDisplay();
            startPitchingPhase();
        }

        // 試合の展開（点差・逆転・サヨナラの有無）から見出しの文言を組み立てる
        function buildResultHeadline(winnerKey) {
            const winnerName = winnerKey === 'team1' ? player1Name : player2Name;
            const diff = Math.abs(score.team1 - score.team2);
            const comebackAmount = maxDeficit[winnerKey];
            const hadComeback = comebackAmount > 0;
            // サヨナラは後攻（team2）が最終回以降に決勝点を挙げて終わった場合のみ成立する
            const sayonaraApplies = isSayonara && winnerKey === 'team2';

            if (hadComeback) {
                const label = comebackAmount >= 3 ? '大逆転' : '逆転';
                return sayonaraApplies
                    ? `${winnerName}の${label}サヨナラ勝利！`
                    : `${winnerName}の${label}勝利！`;
            }
            if (sayonaraApplies) {
                return `${winnerName}のサヨナラ勝利！`;
            }
            if (diff === 1) return `${winnerName}が接戦を制した！`;
            if (diff === 2) return `${winnerName}の辛勝！`;
            if (diff <= 4) return `${winnerName}の快勝！`;
            return `${winnerName}の圧勝！`;
        }

        // 完全試合・完封などの特別な内容を、見出しの下にもう1行添える
        function buildAchievementLine(winnerKey, loserKey) {
            const winnerName = winnerKey === 'team1' ? player1Name : player2Name;
            if (hitsBy[loserKey] === 0) return `${winnerName}、完全試合達成！`;
            if (score[loserKey] === 0) return `${winnerName}、完封勝利！`;
            return '';
        }

        function endGame() {
            gameEnded = true;
            updateScoreDisplay(); // 電光掲示板の「選択中」ハイライトを消し、すべて同じ見た目にする

            // 決着がついた瞬間に、画面中央へ最終スコアと勝敗を発表する（自動では消えない）
            let winnerLine;
            let achievementLine = '';
            if (score.team1 > score.team2) {
                winnerLine = buildResultHeadline('team1');
                achievementLine = buildAchievementLine('team1', 'team2');
            } else if (score.team2 > score.team1) {
                winnerLine = buildResultHeadline('team2');
                achievementLine = buildAchievementLine('team2', 'team1');
            } else {
                winnerLine = '引き分け！';
            }

            showDecisionAnnounce(winnerLine, achievementLine);
        }

        // 長い文言でも1行に収まるよう、指定した最大幅までフォントサイズを少しずつ縮める
        function fitTextToOneLine(el, maxWidthPx, maxFontPx, minFontPx) {
            let fontSize = maxFontPx;
            el.style.fontSize = fontSize + 'px';
            while (el.scrollWidth > maxWidthPx && fontSize > minFontPx) {
                fontSize -= 1;
                el.style.fontSize = fontSize + 'px';
            }
        }

        // 決着発表オーバーレイを画面中央に表示する。自動では消えず、
        // 「メインメニューに戻る」ボタンを押すまでそのまま表示され続ける。
        function showDecisionAnnounce(text, achievementText) {
            const overlay = document.getElementById('decision-announce');
            const card = document.getElementById('decision-card');
            const textEl = document.getElementById('decision-announce-text');
            const achievementEl = document.getElementById('decision-achievement-text');
            if (!overlay || !textEl) return;

            const isSmallScreen = window.innerWidth < 640;

            textEl.innerText = text;
            const availableWidth = (card ? card.clientWidth : window.innerWidth * 0.85) - (isSmallScreen ? 48 : 96);
            fitTextToOneLine(textEl, availableWidth, isSmallScreen ? 18 : 24, 11);

            if (achievementEl) {
                if (achievementText) {
                    achievementEl.innerText = achievementText;
                    achievementEl.classList.remove('hidden');
                    fitTextToOneLine(achievementEl, availableWidth, isSmallScreen ? 13 : 16, 10);
                    textEl.classList.remove('mb-5');
                    textEl.classList.add('mb-1');
                } else {
                    achievementEl.innerText = '';
                    achievementEl.classList.add('hidden');
                    textEl.classList.remove('mb-1');
                    textEl.classList.add('mb-5');
                }
            }

            document.getElementById('decision-name1').innerText = player1Name;
            document.getElementById('decision-name2').innerText = player2Name;

            const s1El = document.getElementById('decision-score1');
            const s2El = document.getElementById('decision-score2');
            s1El.innerText = score.team1;
            s2El.innerText = score.team2;

            // 勝ったほうのスコアだけ光らせる
            [s1El, s2El].forEach(el => {
                el.classList.remove('text-yellow-300', 'winner-glow');
                el.classList.add('text-white');
            });
            if (score.team1 > score.team2) {
                s1El.classList.remove('text-white');
                s1El.classList.add('text-yellow-300', 'winner-glow');
            } else if (score.team2 > score.team1) {
                s2El.classList.remove('text-white');
                s2El.classList.add('text-yellow-300', 'winner-glow');
            }

            // opacity-0の間はオーバーレイ内のボタンが透明なまま押せてしまわないよう、
            // 表示中だけ pointer-events を有効にする
            overlay.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
            overlay.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
        }

        // オーバーレイの「メインメニューに戻る」ボタンから直接タイトルへ戻る
        function decisionGoToTitle() {
            const overlay = document.getElementById('decision-announce');
            const backBtn = document.getElementById('back-to-result-btn');
            overlay.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
            overlay.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            if (backBtn) backBtn.classList.add('hidden');
            setTimeout(() => {
                returnToTitle();
            }, 300);
        }

        // 「スコアボードを見る」：結果発表オーバーレイをいったん隠して、
        // 裏にある電光掲示板を確認できるようにする
        function peekScoreboard() {
            const overlay = document.getElementById('decision-announce');
            const backBtn = document.getElementById('back-to-result-btn');
            if (overlay) {
                overlay.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                overlay.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            }
            if (backBtn) backBtn.classList.remove('hidden');
        }

        // スコアボード確認中に、結果発表オーバーレイへ戻る
        function backToDecisionAnnounce() {
            const overlay = document.getElementById('decision-announce');
            const backBtn = document.getElementById('back-to-result-btn');
            if (overlay) {
                overlay.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
                overlay.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
            }
            if (backBtn) backBtn.classList.add('hidden');
        }

        function showFinalResultScreen() {
            UI.gameScreen.classList.add('hidden');
            UI.gameoverScreen.classList.remove('hidden');
            UI.gameoverScreen.classList.add('flex');

            const nameEl1 = document.getElementById('final-name-team1');
            const nameEl2 = document.getElementById('final-name-team2');
            const s1 = document.getElementById('final-score-team1');
            const s2 = document.getElementById('final-score-team2');
            const side1 = document.getElementById('finalside-team1');
            const side2 = document.getElementById('finalside-team2');
            const flag1 = document.getElementById('win-flag-team1');
            const flag2 = document.getElementById('win-flag-team2');
            const resultText = document.getElementById('final-result-text');
            const crown = document.getElementById('winner-crown');
            const title = document.getElementById('gameover-title');

            nameEl1.innerText = player1Name;
            nameEl2.innerText = player2Name;
            s1.innerText = score.team1;
            s2.innerText = score.team2;

            // 表示状態をリセット
            [side1, side2].forEach(el => el.classList.remove('scale-110', 'opacity-60'));
            [s1, s2].forEach(el => el.classList.remove('text-yellow-300', 'winner-glow'));
            s1.classList.add('text-white');
            s2.classList.add('text-white');
            flag1.classList.add('hidden');
            flag2.classList.add('hidden');
            crown.classList.remove('hidden');

            if (score.team1 > score.team2) {
                resultText.innerText = `${player1Name} の勝利！`;
                side1.classList.add('scale-110');
                side2.classList.add('opacity-60');
                s1.classList.remove('text-white');
                s1.classList.add('text-yellow-300', 'winner-glow');
                flag1.classList.remove('hidden');
            } else if (score.team2 > score.team1) {
                resultText.innerText = isSayonara ? `${player2Name} のサヨナラ勝利！` : `${player2Name} の勝利！`;
                side2.classList.add('scale-110');
                side1.classList.add('opacity-60');
                s2.classList.remove('text-white');
                s2.classList.add('text-yellow-300', 'winner-glow');
                flag2.classList.remove('hidden');
            } else {
                resultText.innerText = '引き分け！';
                crown.classList.add('hidden');
            }

            // 登場アニメーション（再表示のたびに再生させる）
            [title, s1, s2].forEach(el => el.classList.remove('animate-gameset-in', 'animate-score-pop'));
            resultText.parentElement.classList.remove('animate-score-pop');
            void title.offsetWidth;

            title.classList.add('animate-gameset-in');
            setTimeout(() => {
                s1.classList.add('animate-score-pop');
                s2.classList.add('animate-score-pop');
            }, 300);
            setTimeout(() => {
                resultText.parentElement.classList.add('animate-score-pop');
            }, 650);
        }

        function returnToTitle() {
            UI.gameScreen.classList.add('hidden');
            UI.gameoverScreen.classList.add('hidden');
            UI.gameoverScreen.classList.remove('flex');
            UI.titleScreen.classList.remove('hidden');
            fitToWindow();
        }

        function showOverlay(title, desc) {
            if (!UI.turnOverlay) initUI();
            UI.overlayTitle.innerText = title;
            UI.overlayDesc.innerHTML = desc;
            UI.turnOverlay.classList.remove('hidden');
        }

        function hideOverlay() {
            if (!UI.turnOverlay) initUI();
            UI.turnOverlay.classList.add('hidden');
        }

        const alertModal = document.getElementById('custom-alert');
        const alertMsg = document.getElementById('alert-message');
        
        function showAlert(msg) {
            alertMsg.innerText = msg;
            alertModal.classList.remove('hidden');
            setTimeout(() => {
                alertModal.classList.remove('opacity-0');
                alertModal.children[0].classList.remove('scale-95');
                alertModal.children[0].classList.add('scale-100');
            }, 10);
        }

        function closeAlert() {
            alertModal.classList.add('opacity-0');
            alertModal.children[0].classList.remove('scale-100');
            alertModal.children[0].classList.add('scale-95');
            setTimeout(() => {
                alertModal.classList.add('hidden');
            }, 300);
        }

        function fitToWindow() {
            const app = document.getElementById('app');
            if (!app) return;

            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;

            const isPortrait = (vw / vh) < 1.05;

            let baseWidth, baseHeight;

            if (isPortrait) {
                app.classList.add('is-portrait');
                app.classList.remove('is-landscape');
                baseWidth = 400;
                baseHeight = 680;
            } else {
                app.classList.add('is-landscape');
                app.classList.remove('is-portrait');
                baseWidth = 920;
                baseHeight = 600;
            }

            const padding = 4;
            const availableW = Math.max(100, vw - padding * 2);
            const availableH = Math.max(100, vh - padding * 2);

            const scaleW = availableW / baseWidth;
            const scaleH = availableH / baseHeight;
            const scale = Math.min(scaleW, scaleH);

            app.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        window.addEventListener('resize', fitToWindow);
        window.addEventListener('orientationchange', () => {
            setTimeout(fitToWindow, 100);
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', fitToWindow);
            window.visualViewport.addEventListener('scroll', fitToWindow);
        }
        document.addEventListener('DOMContentLoaded', fitToWindow);
        window.addEventListener('load', fitToWindow);
    </script>
</body>
</html>
