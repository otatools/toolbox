<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>心理野球 - Psychological Baseball</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Share+Tech+Mono&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #1a472a;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            touch-action: none;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* リアルな芝生のストライプ模様 */
        .field-bg {
            background-image: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.02),
                rgba(255,255,255,0.02) 40px,
                rgba(0,0,0,0.02) 40px,
                rgba(0,0,0,0.02) 80px
            );
        }

        /* 自動レスポンシブスケーリング用スタイル */
        #app {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;
            transition: transform 0.05s ease-out;
            will-change: transform;
            flex-shrink: 0;
        }

        #app.is-landscape {
            width: 920px;
            height: 600px;
        }

        #app.is-portrait {
            width: 400px;
            height: 680px;
        }

        /* 縦横レイアウト切り替えスタイリング */
        #app.is-landscape #screen-game {
            display: flex;
            flex-direction: row;
            gap: 16px;
            padding: 16px;
            height: 100%;
            width: 100%;
        }

        #app.is-portrait #screen-game {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
            padding: 8px;
            height: 100%;
            width: 100%;
            box-sizing: border-box;
        }

        #app.is-landscape .game-panel-left {
            width: 436px;
            height: 568px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        #app.is-portrait .game-panel-left {
            width: 100%;
            max-width: 100%;
            height: 315px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        #app.is-landscape .game-panel-right {
            width: 436px;
            height: 568px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        #app.is-portrait .game-panel-right {
            width: 100%;
            max-width: 100%;
            height: 340px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            box-sizing: border-box;
        }

        /* 電光掲示板フォント */
        .scoreboard-text {
            font-family: 'Share Tech Mono', 'M PLUS Rounded 1c', monospace;
            color: #ff9d00;
            text-shadow: 0 0 4px #ff9d00, 0 0 8px rgba(255, 157, 0, 0.5);
        }
        .scoreboard-label {
            color: #a0a0a0;
        }

        /* グラウンド (内野の土) */
        .infield-dirt {
            background-color: #c48a5c;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.15);
        }

        .base-diamond {
            transform: rotate(45deg);
        }
        
        .base {
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .base.occupied {
            background-color: #ffeb3b; 
            box-shadow: 0 0 15px #ffc107, inset 0 0 10px #f57f17;
        }

        /* ホームベース */
        .home-base {
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 50% 100%, 0% 45%);
        }

        .card-container {
            perspective: 1000px;
        }

        .card-inner {
            transition: transform 0.7s cubic-bezier(0.34, 1.3, 0.64, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* 3D 視点（低角度からのグラウンド表示） */
        .field-stage {
            perspective: 800px;
            perspective-origin: 50% 85%;
        }

        .field-3d {
            transform-style: preserve-3d;
            transform: rotateX(54deg);
            will-change: transform;
        }

        /* 縦横別グラウンド・カードサイズ制御 */
        #app.is-landscape .field-3d-box {
            width: 340px;
            height: 340px;
        }
        #app.is-portrait .field-3d-box {
            width: 195px;
            height: 195px;
        }

        #app.is-landscape .base-diamond-box {
            width: 190px;
            height: 190px;
        }
        #app.is-portrait .base-diamond-box {
            width: 115px;
            height: 115px;
        }

        #app.is-landscape .card-grid-box {
            width: 360px;
            height: 360px;
            gap: 12px;
        }
        #app.is-landscape .card-container {
            aspect-ratio: 1 / 1;
        }

        #app.is-portrait .card-grid-box {
            width: 100%;
            max-width: 100%;
            height: 144px;
            gap: 6px;
            box-sizing: border-box;
        }
        #app.is-portrait .card-container {
            height: 68px;
            width: 100%;
            box-sizing: border-box;
        }

        #app.is-portrait .card-face, #app.is-portrait .card-back {
            flex-direction: row !important;
            justify-content: space-between !important;
            padding: 4px 10px !important;
            overflow: hidden !important;
        }
        #app.is-portrait .card-face span:first-child {
            margin-bottom: 0 !important;
            font-size: 0.95rem !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }
        #app.is-portrait .card-face span:nth-child(2) {
            font-size: 1.4rem !important;
        }
        #app.is-portrait .card-back span:first-child {
            font-size: 1.4rem !important;
            margin-bottom: 0 !important;
        }
        #app.is-portrait .card-back span:nth-child(2) {
            font-size: 0.95rem !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        #app.is-portrait #status-message {
            font-size: 0.85rem !important;
            padding: 4px 6px !important;
            height: 52px !important;
            word-break: break-all;
            overflow: hidden;
        }
        #app.is-portrait #status-message span {
            font-size: 0.95rem !important;
            line-height: 1.2;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* プレイヤーごとのテーマカラー用グローアニメーションと枠線スタイル */
        .theme-p1-glow {
            border-color: rgba(59, 130, 246, 0.8) !important;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35) !important;
        }

        .theme-p2-glow {
            border-color: rgba(239, 68, 68, 0.8) !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.35) !important;
        }

        /* 超滑らかな 3D 360°回転＆輝度演出アニメーション */
        @keyframes kurunKurun {
            0% {
                transform: perspective(400px) rotateY(0deg) scale(1);
                opacity: 1;
                filter: brightness(1);
            }
            49% {
                text-shadow: none;
                filter: brightness(1);
            }
            50% {
                transform: perspective(400px) rotateY(180deg) scale(1.35);
                color: #facc15;
                text-shadow: 0 0 25px #eab308, 0 0 35px #f59e0b;
                opacity: 0.9;
                filter: brightness(1.4);
            }
            100% {
                transform: perspective(400px) rotateY(360deg) scale(1);
                opacity: 1;
                filter: brightness(1);
                color: #facc15;
                text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
            }
        }

        .animate-kurun {
            display: inline-block;
            animation: kurunKurun 0.75s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
            will-change: transform, opacity, filter;
            backface-visibility: visible;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="field-bg">

    <div id="app" class="bg-gray-900/95 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-gray-700/50 is-landscape">
        
        <!-- === タイトル画面 === -->
        <div id="screen-title" class="p-6 flex flex-col items-center justify-center h-full text-center">
            <h1 class="text-5xl sm:text-6xl md:text-7xl font-black mb-3 tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
                心理野球
            </h1>
            <p class="text-lg md:text-xl text-gray-300 mb-6">相手の心を読む、究極の駆け引き</p>

            <div class="space-y-5 w-full max-w-md">
                <!-- プレイヤー名入力 -->
                <div class="bg-gray-800/90 p-5 rounded-2xl border border-gray-600 text-left shadow-lg">
                    <h2 class="text-base font-bold mb-3 border-b border-gray-600 pb-2 text-yellow-400">対戦者名設定</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-blue-400 font-bold block mb-1">先攻 (Player 1 / 青テーマ)</label>
                            <input type="text" id="input-p1-name" placeholder="Player 1" value="Player 1" class="w-full bg-gray-900 border border-blue-500/50 focus:border-blue-400 rounded-xl px-4 py-2 text-white focus:outline-none transition">
                        </div>
                        <div id="p2-input-area">
                            <label class="text-xs text-red-400 font-bold block mb-1">後攻 (Player 2 / 赤テーマ)</label>
                            <input type="text" id="input-p2-name" placeholder="Player 2" value="Player 2" class="w-full bg-gray-900 border border-red-500/50 focus:border-red-400 rounded-xl px-4 py-2 text-white focus:outline-none transition">
                        </div>
                    </div>
                </div>

                <button onclick="startGame()" class="w-full py-3.5 text-2xl font-black bg-gradient-to-r from-yellow-500 to-orange-500 hover:from-yellow-400 hover:to-orange-400 text-gray-900 rounded-2xl shadow-[0_0_20px_rgba(245,158,11,0.5)] transition transform hover:scale-[1.02] active:scale-95">
                    PLAY BALL!
                </button>
            </div>
        </div>

        <!-- === ゲーム画面 === -->
        <div id="screen-game" class="hidden">
            
            <!-- 【左カラム / 上段セクション】 スコアボード / グラウンド / イニング・OUTインジケーター -->
            <div class="game-panel-left bg-gray-950/60 p-3.5 rounded-3xl border border-gray-800 shadow-inner relative overflow-hidden">
                
                <!-- 1. スコアボード -->
                <div class="w-full flex justify-start z-10 mb-0">
                    <div id="scoreboard-box" class="bg-gray-900/90 p-1.5 rounded-2xl border-2 border-gray-700/80 shadow-md transition-transform duration-300">
                        <table class="text-center text-sm border-collapse scoreboard-text">
                            <thead>
                                <tr class="scoreboard-label text-xs">
                                    <th class="px-2 py-0.5 border-r border-gray-700 text-left font-bold">TEAM</th>
                                    <th id="score-header-innings" class="px-1 py-0.5"></th>
                                    <th class="px-2 py-0.5 font-bold border-l border-gray-700 text-white text-base">R</th>
                                </tr>
                            </thead>
                            <tbody class="text-lg font-bold">
                                <tr id="row-team1" class="border-t border-gray-700/60">
                                    <td id="name-team1" class="px-2 py-0.5 text-left border-r border-gray-700 font-sans font-bold text-blue-400 text-sm max-w-[100px] truncate">Player 1</td>
                                    <td id="score-cells-team1" class="px-1 py-0.5"></td>
                                    <td id="total-team1" class="px-2 py-0.5 border-l border-gray-700 text-yellow-400 font-black text-xl">0</td>
                                </tr>
                                <tr id="row-team2" class="border-t border-gray-700/60">
                                    <td id="name-team2" class="px-2 py-0.5 text-left border-r border-gray-700 font-sans font-bold text-red-400 text-sm max-w-[100px] truncate">Player 2</td>
                                    <td id="score-cells-team2" class="px-1 py-0.5"></td>
                                    <td id="total-team2" class="px-2 py-0.5 border-l border-gray-700 text-yellow-400 font-black text-xl">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 2. グラウンド (3D & 軌道SVG) -->
                <div class="w-full flex-1 flex items-center justify-center relative field-stage overflow-hidden py-0" id="field-container">
                    
                    <svg id="trajectory-svg" class="absolute inset-0 w-full h-full pointer-events-none z-30" viewBox="0 0 400 400">
                        <defs>
                            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="2" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>
                        <path id="ball-path" d="" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" filter="url(#glow)" class="opacity-0 transition-opacity duration-300"/>
                        <circle id="ball-head" cx="-20" cy="-20" r="8" fill="#ffffff" stroke="#ef4444" stroke-width="2.5" class="opacity-0 transition-opacity duration-200"/>
                    </svg>

                    <div class="field-3d field-3d-box relative flex items-center justify-center">
                        <div class="absolute w-[135%] h-[135%] bg-gradient-to-b from-[#1b3d18] via-[#244a20] to-[#1e3f1b] rounded-t-full border-t-8 border-yellow-600/70 -z-10 top-[-20%] shadow-2xl flex items-end justify-center overflow-hidden">
                            <div class="absolute inset-0 bg-[repeating-linear-gradient(90deg,transparent,transparent_25px,rgba(255,255,255,0.03)_25px,rgba(255,255,255,0.03)_50px)]"></div>
                        </div>

                        <!-- ダイヤモンド -->
                        <div class="base-diamond base-diamond-box infield-dirt relative border-2 border-[#8e5c36] shadow-xl mt-4">
                            <!-- 1塁側ファウルライン (ホームベース起点で1塁・外野方向へ) -->
                            <div class="absolute top-[-45%] right-0 w-[2.5px] h-[145%] bg-white/90 z-10 pointer-events-none"></div>
                            <!-- 3塁側ファウルライン (ホームベース起点で3塁・外野方向へ) -->
                            <div class="absolute bottom-0 left-[-45%] w-[145%] h-[2.5px] bg-white/90 z-10 pointer-events-none"></div>

                            <div class="home-base absolute bottom-0 right-0 w-6 h-6 sm:w-8 sm:h-8 bg-white transform translate-x-[50%] translate-y-[50%] -rotate-45 z-20 shadow-md"></div>
                            
                            <div id="base-1" class="base absolute top-0 right-0 w-5 h-5 sm:w-7 sm:h-7 transform translate-x-[50%] translate-y-[-50%] z-20"></div>
                            <div id="base-2" class="base absolute top-0 left-0 w-5 h-5 sm:w-7 sm:h-7 transform translate-x-[-50%] translate-y-[-50%] z-20"></div>
                            <div id="base-3" class="base absolute bottom-0 left-0 w-5 h-5 sm:w-7 sm:h-7 transform translate-x-[-50%] translate-y-[50%] z-20"></div>
                            
                            <div class="absolute top-1/2 left-1/2 w-8 h-8 sm:w-12 sm:h-12 bg-[#c48a5c] rounded-full transform -translate-x-1/2 -translate-y-1/2 border border-[#a07049] flex items-center justify-center shadow-inner">
                                <div class="w-3 sm:w-4 h-1 sm:h-1.5 bg-white transform -rotate-45 rounded-sm"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. イニング ＆ OUTインジケーター -->
                <div class="w-full flex justify-start z-10 relative">
                    <div class="flex items-center gap-3 bg-gray-900/90 px-3.5 py-1.5 rounded-2xl border-2 border-gray-700/80 shadow-md">
                        <div id="current-inning-display" class="text-lg sm:text-2xl scoreboard-text text-yellow-400 font-black whitespace-nowrap">
                            1回 表
                        </div>
                        <div class="h-5 w-[2px] bg-gray-700"></div>
                        <div class="flex items-center gap-2">
                            <span class="text-red-500 font-black font-sans text-xs sm:text-base tracking-wider">OUT</span>
                            <div class="flex gap-1.5">
                                <div id="out-1" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full border-2 border-gray-600 bg-gray-800 transition-colors"></div>
                                <div id="out-2" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full border-2 border-gray-600 bg-gray-800 transition-colors"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 【右カラム / 下段セクション】 操作エリア -->
            <div id="action-panel" class="game-panel-right bg-gray-900/60 p-4 rounded-3xl border-2 transition-all duration-500 relative">
                
                <!-- ターンチェンジオーバーレイ -->
                <div id="turn-overlay" class="absolute inset-0 bg-gray-900/95 z-40 flex flex-col items-center justify-center rounded-3xl border-2 hidden p-6 text-center transition-all duration-500">
                    <div id="overlay-role-badge" class="px-3.5 py-1 rounded-full text-xs font-black tracking-widest mb-3 border">TURN CHANGE</div>
                    <h3 id="overlay-title" class="text-3xl font-black mb-3 text-transparent bg-clip-text drop-shadow-[0_2px_8px_rgba(0,0,0,0.5)]"></h3>
                    <div id="overlay-desc" class="text-gray-300 mb-6 text-center leading-relaxed"></div>
                    <button id="overlay-start-btn" onclick="hideOverlay()" class="px-8 py-3 font-black text-xl rounded-xl transition transform hover:scale-105 active:scale-95 shadow-lg">START!</button>
                </div>

                <!-- 固定高さのステータスメッセージエリア -->
                <div id="status-message" class="text-base font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-2 w-full shadow-lg transition-all duration-300 shrink-0">
                </div>

                <!-- 常に固定配置された4つのパネル (1塁打, 2塁打, 3塁打, ホームラン) -->
                <div class="grid grid-cols-2 gap-3 card-grid-box mx-auto shrink-0">
                    
                    <!-- Panel 0: 1塁打 -->
                    <div class="card-container cursor-pointer" onclick="handleCardClick(0)">
                        <div id="card-0" class="card-inner w-full h-full relative rounded-2xl shadow-lg">
                            <div class="card-face absolute inset-0 bg-gray-800/90 border-4 border-gray-600/80 rounded-2xl flex flex-col items-center justify-center group hover:bg-gray-700/90 transition p-1">
                                <span class="text-blue-400 font-black text-base sm:text-xl mb-1 tracking-wider text-center leading-tight whitespace-nowrap">1塁打</span>
                                <span class="text-gray-500 text-3xl sm:text-4xl font-black group-hover:text-gray-400">?</span>
                                <div id="pitcher-mark-0" class="absolute inset-0 border-4 rounded-2xl hidden shadow-[inset_0_0_20px_rgba(255,255,255,0.4)]"></div>
                            </div>
                            <div id="card-back-0" class="card-face card-back absolute inset-0 bg-white border-4 border-gray-200 rounded-2xl flex flex-col items-center justify-center p-1">
                                <span id="card-result-icon-0" class="text-3xl sm:text-4xl mb-1">⚾</span>
                                <span id="card-result-text-0" class="text-base sm:text-xl font-black text-gray-800 whitespace-nowrap">1塁打</span>
                            </div>
                        </div>
                    </div>

                    <!-- Panel 1: 2塁打 -->
                    <div class="card-container cursor-pointer" onclick="handleCardClick(1)">
                        <div id="card-1" class="card-inner w-full h-full relative rounded-2xl shadow-lg">
                            <div class="card-face absolute inset-0 bg-gray-800/90 border-4 border-gray-600/80 rounded-2xl flex flex-col items-center justify-center group hover:bg-gray-700/90 transition p-1">
                                <span class="text-purple-400 font-black text-base sm:text-xl mb-1 tracking-wider text-center leading-tight whitespace-nowrap">2塁打</span>
                                <span class="text-gray-500 text-3xl sm:text-4xl font-black group-hover:text-gray-400">?</span>
                                <div id="pitcher-mark-1" class="absolute inset-0 border-4 rounded-2xl hidden shadow-[inset_0_0_20px_rgba(255,255,255,0.4)]"></div>
                            </div>
                            <div id="card-back-1" class="card-face card-back absolute inset-0 bg-white border-4 border-gray-200 rounded-2xl flex flex-col items-center justify-center p-1">
                                <span id="card-result-icon-1" class="text-3xl sm:text-4xl mb-1">⚾</span>
                                <span id="card-result-text-1" class="text-base sm:text-xl font-black text-gray-800 whitespace-nowrap">2塁打</span>
                            </div>
                        </div>
                    </div>

                    <!-- Panel 2: 3塁打 -->
                    <div class="card-container cursor-pointer" onclick="handleCardClick(2)">
                        <div id="card-2" class="card-inner w-full h-full relative rounded-2xl shadow-lg">
                            <div class="card-face absolute inset-0 bg-gray-800/90 border-4 border-gray-600/80 rounded-2xl flex flex-col items-center justify-center group hover:bg-gray-700/90 transition p-1">
                                <span class="text-pink-400 font-black text-base sm:text-xl mb-1 tracking-wider text-center leading-tight whitespace-nowrap">3塁打</span>
                                <span class="text-gray-500 text-3xl sm:text-4xl font-black group-hover:text-gray-400">?</span>
                                <div id="pitcher-mark-2" class="absolute inset-0 border-4 rounded-2xl hidden shadow-[inset_0_0_20px_rgba(255,255,255,0.4)]"></div>
                            </div>
                            <div id="card-back-2" class="card-face card-back absolute inset-0 bg-white border-4 border-gray-200 rounded-2xl flex flex-col items-center justify-center p-1">
                                <span id="card-result-icon-2" class="text-3xl sm:text-4xl mb-1">⚾</span>
                                <span id="card-result-text-2" class="text-base sm:text-xl font-black text-gray-800 whitespace-nowrap">3塁打</span>
                            </div>
                        </div>
                    </div>

                    <!-- Panel 3: ホームラン -->
                    <div class="card-container cursor-pointer" onclick="handleCardClick(3)">
                        <div id="card-3" class="card-inner w-full h-full relative rounded-2xl shadow-lg">
                            <div class="card-face absolute inset-0 bg-gray-800/90 border-4 border-gray-600/80 rounded-2xl flex flex-col items-center justify-center group hover:bg-gray-700/90 transition p-1">
                                <span class="text-red-500 font-black text-base sm:text-xl mb-1 tracking-wider text-center leading-tight whitespace-nowrap">ホームラン</span>
                                <span class="text-gray-500 text-3xl sm:text-4xl font-black group-hover:text-gray-400">?</span>
                                <div id="pitcher-mark-3" class="absolute inset-0 border-4 rounded-2xl hidden shadow-[inset_0_0_20px_rgba(255,255,255,0.4)]"></div>
                            </div>
                            <div id="card-back-3" class="card-face card-back absolute inset-0 bg-white border-4 border-gray-200 rounded-2xl flex flex-col items-center justify-center p-1">
                                <span id="card-result-icon-3" class="text-3xl sm:text-4xl mb-1">🔥</span>
                                <span id="card-result-text-3" class="text-base sm:text-xl font-black text-gray-800 whitespace-nowrap">本塁打</span>
                            </div>
                        </div>
                    </div>

                </div>
                
                <!-- 固定高さのアクションボタン予約エリア -->
                <div class="w-full h-[52px] relative flex justify-center items-center mt-2 shrink-0">
                    <button id="btn-pitch-decide" onclick="handleConfirmBtn()" class="absolute inset-0 w-full h-full font-extrabold text-xl rounded-2xl transition transform hover:scale-[1.02] active:scale-95 invisible opacity-0 pointer-events-none">
                        決定
                    </button>
                    <button id="btn-next-pitch" onclick="nextPitch()" class="absolute inset-0 w-full h-full bg-green-600 hover:bg-green-500 text-white font-extrabold text-xl rounded-2xl shadow-[0_0_20px_rgba(34,197,94,0.4)] transition transform hover:scale-[1.02] active:scale-95 invisible opacity-0 pointer-events-none">
                        次の投球へ
                    </button>
                </div>

            </div>
        </div>

        <!-- === ゲームオーバー画面 === -->
        <div id="screen-gameover" class="hidden flex-col items-center justify-center h-full p-6 text-center bg-gray-900/95 relative z-50">
            <h2 class="text-5xl font-black text-white mb-2 tracking-widest drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">GAME SET</h2>
            <div id="final-result-text" class="text-2xl font-bold text-yellow-400 mb-6"></div>
            
            <div class="bg-gray-800 p-6 rounded-2xl border-2 border-gray-600 mb-6 w-full max-w-sm shadow-2xl">
                <div class="flex justify-between items-center text-xl font-bold mb-3 pb-3 border-b border-gray-600">
                    <span class="text-blue-400">先攻 (Player 1)</span>
                    <span id="final-score-team1" class="text-3xl">0</span>
                </div>
                <div class="flex justify-between items-center text-xl font-bold">
                    <span class="text-red-400">後攻 (Player 2)</span>
                    <span id="final-score-team2" class="text-3xl">0</span>
                </div>
            </div>

            <button onclick="returnToTitle()" class="px-8 py-3.5 bg-white text-gray-900 hover:bg-gray-200 font-bold text-lg rounded-xl shadow-lg transition">
                タイトルに戻る
            </button>
        </div>

        <!-- カスタムアラートモーダル -->
        <div id="custom-alert" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
            <div id="alert-box" class="bg-gray-800 border-2 border-yellow-500 p-6 rounded-2xl max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300 shadow-[0_0_30px_rgba(234,179,8,0.3)]">
                <p id="alert-message" class="text-lg font-bold text-white mb-6"></p>
                <button onclick="closeAlert()" class="px-6 py-2 bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold rounded-lg transition w-full">確認</button>
            </div>
        </div>

        <!-- TV中継風 スコアポップアップテロップ -->
        <div id="tv-score-banner" class="fixed top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none opacity-0 scale-90 transition-all duration-500 flex flex-col items-center">
            <div class="bg-gradient-to-r from-gray-950 via-gray-900 to-gray-950 border-2 border-yellow-500/90 rounded-2xl shadow-[0_0_50px_rgba(234,179,8,0.6)] px-6 py-3.5 flex items-center gap-4 min-w-[280px] sm:min-w-[360px] justify-between relative overflow-hidden backdrop-blur-md">
                <div id="tv-score-glow" class="absolute -inset-1 bg-yellow-500/20 blur-md -z-10 opacity-0 transition-opacity"></div>
                
                <!-- 先攻チーム -->
                <div class="flex flex-col items-center flex-1">
                    <span id="tv-team1-name" class="text-xs font-black text-blue-400 truncate max-w-[100px] tracking-wider">Player 1</span>
                    <div class="h-10 flex items-center justify-center">
                        <span id="tv-team1-score" class="text-3xl font-black text-white">0</span>
                    </div>
                </div>
                
                <!-- 中央 VS / スコア増分バッジ -->
                <div class="flex flex-col items-center justify-center px-1">
                    <span id="tv-score-runs" class="text-xs font-black text-yellow-400 bg-yellow-500/20 border border-yellow-500/50 px-2 py-0.5 rounded-full mb-1 tracking-widest uppercase animate-pulse">+1 RUN</span>
                    <span class="text-xl font-black text-gray-400 tracking-widest">-</span>
                </div>
                
                <!-- 後攻チーム -->
                <div class="flex flex-col items-center flex-1">
                    <span id="tv-team2-name" class="text-xs font-black text-red-400 truncate max-w-[100px] tracking-wider">Player 2</span>
                    <div class="h-10 flex items-center justify-center">
                        <span id="tv-team2-score" class="text-3xl font-black text-white">0</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const maxInnings = 3;
        
        let player1Name = "Player 1";
        let player2Name = "Player 2";

        let currentInning = 1;
        let isTop = true;
        let outs = 0;
        
        let bases = [false, false, false];
        let score = { team1: 0, team2: 0 };
        let inningScores = { team1: [], team2: [] };
        
        let currentPhase = 'pitching';
        let hitPosition = -1;
        let batPosition = -1;
        let activePlayer = 1; // 1: Player 1 (Blue), 2: Player 2 (Red)
        let isSayonara = false; // サヨナラ勝ちフラグ
        
        let UI = {};

        function initUI() {
            UI = {
                titleScreen: document.getElementById('screen-title'),
                gameScreen: document.getElementById('screen-game'),
                gameoverScreen: document.getElementById('screen-gameover'),
                
                actionPanel: document.getElementById('action-panel'),
                statusMessage: document.getElementById('status-message'),
                turnOverlay: document.getElementById('turn-overlay'),
                overlayBadge: document.getElementById('overlay-role-badge'),
                overlayTitle: document.getElementById('overlay-title'),
                overlayDesc: document.getElementById('overlay-desc'),
                overlayStartBtn: document.getElementById('overlay-start-btn'),
                
                pitchBtn: document.getElementById('btn-pitch-decide'),
                nextPitchBtn: document.getElementById('btn-next-pitch'),
                
                bases: [
                    document.getElementById('base-1'),
                    document.getElementById('base-2'),
                    document.getElementById('base-3')
                ]
            };
        }

        const HIT_TYPES = [
            { name: '1塁打', bases: 1, icon: '⚾', color: '#3b82f6' },
            { name: '2塁打', bases: 2, icon: '⚾', color: '#8b5cf6' },
            { name: '3塁打', bases: 3, icon: '⚾', color: '#ec4899' },
            { name: 'ホームラン', bases: 4, icon: '🔥', color: '#ef4444' }
        ];

        function showElem(elem) {
            if (!elem) return;
            elem.classList.remove('invisible', 'opacity-0', 'pointer-events-none');
            elem.classList.add('opacity-100', 'pointer-events-auto');
        }

        function hideElem(elem) {
            if (!elem) return;
            elem.classList.add('invisible', 'opacity-0', 'pointer-events-none');
            elem.classList.remove('opacity-100', 'pointer-events-auto');
        }

        function applyPlayerTheme(playerNum) {
            activePlayer = playerNum;
            const isP1 = playerNum === 1;

            if (!UI.actionPanel) initUI();

            UI.actionPanel.classList.remove('theme-p1-glow', 'theme-p2-glow', 'border-gray-800');
            UI.actionPanel.classList.add(isP1 ? 'theme-p1-glow' : 'theme-p2-glow');

            for (let i = 0; i < 4; i++) {
                const mark = document.getElementById(`pitcher-mark-${i}`);
                if (mark) {
                    mark.classList.remove('border-blue-400', 'border-red-500');
                    mark.classList.add(isP1 ? 'border-blue-400' : 'border-red-500');
                }
            }

            if (isP1) {
                UI.pitchBtn.className = "absolute inset-0 w-full h-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xl rounded-2xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition transform hover:scale-[1.02] active:scale-95 invisible opacity-0 pointer-events-none";
            } else {
                UI.pitchBtn.className = "absolute inset-0 w-full h-full bg-red-600 hover:bg-red-500 text-white font-extrabold text-xl rounded-2xl shadow-[0_0_20px_rgba(239,68,68,0.4)] transition transform hover:scale-[1.02] active:scale-95 invisible opacity-0 pointer-events-none";
            }

            UI.turnOverlay.classList.remove('border-blue-500/80', 'border-red-500/80', 'shadow-[0_0_30px_rgba(59,130,246,0.3)]', 'shadow-[0_0_30px_rgba(239,68,68,0.3)]');
            UI.overlayBadge.classList.remove('bg-blue-500/20', 'text-blue-300', 'border-blue-500/40', 'bg-red-500/20', 'text-red-300', 'border-red-500/40');
            UI.overlayTitle.classList.remove('from-blue-300', 'via-cyan-400', 'to-blue-500', 'from-red-300', 'via-rose-400', 'to-red-500');
            UI.overlayStartBtn.classList.remove('from-blue-600', 'to-cyan-600', 'hover:from-blue-500', 'hover:to-cyan-500', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]', 'from-red-600', 'to-rose-600', 'hover:from-red-500', 'hover:to-rose-500', 'shadow-[0_0_15px_rgba(239,68,68,0.4)]');

            if (isP1) {
                UI.turnOverlay.classList.add('border-blue-500/80', 'shadow-[0_0_30px_rgba(59,130,246,0.3)]');
                UI.overlayBadge.classList.add('bg-blue-500/20', 'text-blue-300', 'border-blue-500/40');
                UI.overlayTitle.classList.add('from-blue-300', 'via-cyan-400', 'to-blue-500');
                UI.overlayStartBtn.classList.add('from-blue-600', 'to-cyan-600', 'hover:from-blue-500', 'hover:to-cyan-500', 'text-white', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]');
            } else {
                UI.turnOverlay.classList.add('border-red-500/80', 'shadow-[0_0_30px_rgba(239,68,68,0.3)]');
                UI.overlayBadge.classList.add('bg-red-500/20', 'text-red-300', 'border-red-500/40');
                UI.overlayTitle.classList.add('from-red-300', 'via-rose-400', 'to-red-500');
                UI.overlayStartBtn.classList.add('from-red-600', 'to-rose-600', 'hover:from-red-500', 'hover:to-rose-500', 'text-white', 'shadow-[0_0_15px_rgba(239,68,68,0.4)]');
            }
        }

        function startGame() {
            initUI();
            const p1Input = document.getElementById('input-p1-name').value.trim();
            const p2Input = document.getElementById('input-p2-name').value.trim();
            player1Name = p1Input || "Player 1";
            player2Name = p2Input || "Player 2";

            document.getElementById('name-team1').innerText = player1Name;
            document.getElementById('name-team2').innerText = player2Name;

            currentInning = 1;
            isTop = true;
            score = { team1: 0, team2: 0 };
            inningScores = { team1: Array(maxInnings).fill(''), team2: Array(maxInnings).fill('') };
            isSayonara = false;
            
            initInningState();
            setupScoreboard();
            updateScoreDisplay();
            
            UI.titleScreen.classList.add('hidden');
            UI.gameoverScreen.classList.add('hidden');
            UI.gameoverScreen.classList.remove('flex');
            UI.gameScreen.classList.remove('hidden');
            
            startPitchingPhase();
            fitToWindow();
        }

        function initInningState() {
            outs = 0;
            bases = [false, false, false];
            updateBSO();
            updateBasesUI();
            resetCards();
        }

        function setupScoreboard() {
            const header = document.getElementById('score-header-innings');
            const cells1 = document.getElementById('score-cells-team1');
            const cells2 = document.getElementById('score-cells-team2');
            
            let headerHTML = '';
            let cellsHTML = '';
            
            for(let i = 1; i <= maxInnings; i++) {
                headerHTML += `<div class="inline-block w-8 sm:w-10 text-center">${i}</div>`;
                cellsHTML += `<div class="inline-block w-8 sm:w-10 text-center" id="score-${i}">-</div>`;
            }
            
            header.innerHTML = `<div class="flex gap-1">${headerHTML}</div>`;
            cells1.innerHTML = `<div class="flex gap-1" id="team1-inning-cells">${cellsHTML}</div>`;
            cells2.innerHTML = `<div class="flex gap-1" id="team2-inning-cells">${cellsHTML.replace(/score-/g, 'score-t2-')}</div>`;
        }

        function updateScoreDisplay() {
            document.getElementById('total-team1').innerText = score.team1;
            document.getElementById('total-team2').innerText = score.team2;
            
            const t1Cells = document.getElementById('team1-inning-cells').children;
            const t2Cells = document.getElementById('team2-inning-cells').children;
            
            for(let i = 0; i < maxInnings; i++) {
                // 先攻のスコア表示
                t1Cells[i].innerText = inningScores.team1[i] !== '' ? inningScores.team1[i] : '-';
                
                // 後攻のスコア表示（サヨナラの判定を含む）
                let t2ScoreText = inningScores.team2[i] !== '' ? inningScores.team2[i] : '-';
                // 最終回以降でサヨナラ勝ちが決まったイニングなら「x」を付ける
                if (isSayonara && i === currentInning - 1) {
                    if (t2ScoreText === '-') {
                         t2ScoreText = 'x';
                    } else {
                         t2ScoreText += 'x';
                    }
                }
                
                // xのフォントを変えるためにspanで囲む処理を追加（サヨナラのxが見やすいように）
                if (typeof t2ScoreText === 'string' && t2ScoreText.includes('x')) {
                    t2Cells[i].innerHTML = t2ScoreText.replace('x', '<span style="font-family: sans-serif; font-size: 0.8em; margin-left:1px;">x</span>');
                } else {
                    t2Cells[i].innerText = t2ScoreText;
                }

                if(i + 1 === currentInning && isTop) {
                    t1Cells[i].classList.add('text-white', 'bg-gray-700');
                } else {
                    t1Cells[i].classList.remove('text-white', 'bg-gray-700');
                }
                
                if(i + 1 === currentInning && !isTop) {
                    t2Cells[i].classList.add('text-white', 'bg-gray-700');
                } else {
                    t2Cells[i].classList.remove('text-white', 'bg-gray-700');
                }
            }

            document.getElementById('current-inning-display').innerText = `${currentInning}回 ${isTop ? '表' : '裏'}`;
        }

        function updateBSO() {
            const out1 = document.getElementById('out-1');
            const out2 = document.getElementById('out-2');
            
            if(outs >= 1) {
                out1.classList.replace('bg-gray-800', 'bg-red-500');
                out1.classList.add('shadow-[0_0_8px_#ef4444]');
            } else {
                out1.classList.replace('bg-red-500', 'bg-gray-800');
                out1.classList.remove('shadow-[0_0_8px_#ef4444]');
            }

            if(outs >= 2) {
                out2.classList.replace('bg-gray-800', 'bg-red-500');
                out2.classList.add('shadow-[0_0_8px_#ef4444]');
            } else {
                out2.classList.replace('bg-red-500', 'bg-gray-800');
                out2.classList.remove('shadow-[0_0_8px_#ef4444]');
            }
        }

        function updateBasesUI() {
            if (!UI.bases) return;
            for (let i = 0; i < 3; i++) {
                if (bases[i]) {
                    UI.bases[i].classList.add('occupied');
                } else {
                    UI.bases[i].classList.remove('occupied');
                }
            }
        }

        function getRoleName(role) {
            if (role === 'pitcher') {
                return isTop ? player2Name : player1Name;
            } else {
                return isTop ? player1Name : player2Name;
            }
        }

        function getPitcherPlayerNum() {
            return isTop ? 2 : 1;
        }

        function getBatterPlayerNum() {
            return isTop ? 1 : 2;
        }

        function startPitchingPhase() {
            currentPhase = 'pitching';
            hitPosition = -1;
            batPosition = -1;
            resetCards();
            clearTrajectory();
            hideElem(UI.nextPitchBtn);
            hideElem(UI.pitchBtn);
            
            const pPlayerNum = getPitcherPlayerNum();
            applyPlayerTheme(pPlayerNum);

            const pName = getRoleName('pitcher');
            const pColorClass = pPlayerNum === 1 ? 'text-blue-400' : 'text-red-400';
            const borderClass = pPlayerNum === 1 ? 'border-blue-500' : 'border-red-500';

            UI.pitchBtn.innerText = '決定';
            
            UI.statusMessage.innerHTML = `<span class="text-xs sm:text-sm font-bold ${pColorClass}">ピッチャー：${pName}</span><span class="text-white mt-0.5 text-sm sm:text-base">どのパネルをヒットにする？</span>`;
            UI.statusMessage.className = `text-base sm:text-lg font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-2 ${borderClass} w-full shadow-lg shrink-0`;

            document.getElementById('overlay-role-badge').innerText = `PITCHING TURN (${pPlayerNum === 1 ? 'P1' : 'P2'})`;
            showOverlay(`⚾ ピッチャー ⚾`, `<span class="text-2xl font-black ${pColorClass} block mb-2">${pName}</span>打者に見えないように、<br>ヒットのパネルを決めてください`);
        }

        function startBattingPhase() {
            currentPhase = 'batting';
            batPosition = -1;
            hideElem(UI.pitchBtn);
            
            for(let i=0; i<4; i++) {
                document.getElementById(`pitcher-mark-${i}`).classList.add('hidden');
            }

            const bPlayerNum = getBatterPlayerNum();
            applyPlayerTheme(bPlayerNum);

            const bName = getRoleName('batter');
            const bColorClass = bPlayerNum === 1 ? 'text-blue-400' : 'text-red-400';
            const borderClass = bPlayerNum === 1 ? 'border-blue-500' : 'border-red-500';

            UI.statusMessage.innerHTML = `<span class="text-xs sm:text-sm font-bold ${bColorClass}">バッター：${bName}</span><span class="text-white mt-0.5 text-sm sm:text-base">ヒットはどこだ？</span>`;
            UI.statusMessage.className = `text-base sm:text-lg font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-2 ${borderClass} w-full shadow-lg shrink-0`;
            
            hideOverlay();
        }

        function handleCardClick(index) {
            if (currentPhase === 'pitching') {
                hitPosition = index;
                for(let i=0; i<4; i++) {
                    document.getElementById(`pitcher-mark-${i}`).classList.add('hidden');
                }
                document.getElementById(`pitcher-mark-${index}`).classList.remove('hidden');
                
                UI.pitchBtn.innerText = '決定';
                showElem(UI.pitchBtn);
            } 
            else if (currentPhase === 'batting') {
                const card = document.getElementById(`card-${index}`);
                if (card.classList.contains('is-flipped')) return;
                
                batPosition = index;
                for(let i=0; i<4; i++) {
                    document.getElementById(`pitcher-mark-${i}`).classList.add('hidden');
                }
                document.getElementById(`pitcher-mark-${index}`).classList.remove('hidden');
                
                UI.pitchBtn.innerText = '決定';
                showElem(UI.pitchBtn);
            }
        }

        function handleConfirmBtn() {
            if (currentPhase === 'pitching') {
                confirmPitch();
            } else if (currentPhase === 'batting') {
                confirmBat();
            }
        }

        function confirmPitch() {
            if (hitPosition !== -1) {
                startBattingPhase();
            }
        }

        function confirmBat() {
            if (batPosition !== -1) {
                hideElem(UI.pitchBtn);
                revealCard(batPosition);
            }
        }

        function revealCard(index) {
            currentPhase = 'result';
            const card = document.getElementById(`card-${index}`);
            const backFace = document.getElementById(`card-back-${index}`);
            const resultIcon = document.getElementById(`card-result-icon-${index}`);
            const resultText = document.getElementById(`card-result-text-${index}`);
            
            if (index === hitPosition) {
                const hitType = HIT_TYPES[index];
                resultIcon.innerText = hitType.icon;
                resultText.innerText = hitType.name;
                resultText.style.color = hitType.color;
                backFace.style.borderColor = hitType.color;
                backFace.style.backgroundColor = '#fffbeb';
            } else {
                resultIcon.innerText = '❌';
                resultText.innerText = 'アウト';
                resultText.style.color = '#ef4444';
                backFace.style.borderColor = '#f87171';
                backFace.style.backgroundColor = '#fef2f2';
            }
            
            card.classList.add('is-flipped');
            
            setTimeout(() => {
                if (index === hitPosition) {
                    handleHit(index);
                } else {
                    handleOut();
                }
            }, 800);
        }

        function handleOut() {
            outs++;
            updateBSO();
            
            if (outs >= 3) {
                UI.statusMessage.innerHTML = `<span class="text-red-400 text-xl font-black tracking-widest">3アウト！ チェンジ！</span>`;
                UI.statusMessage.className = "text-base font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-4 border-red-500 w-full shadow-lg shrink-0";
                
                setTimeout(() => {
                    changeInning();
                }, 2000);
            } else {
                UI.statusMessage.innerHTML = `<span class="text-white">アウト！</span><span class="text-red-400 text-lg font-bold mt-0.5">${outs}アウト</span>`;
                currentPhase = 'batting';
            }
        }

        function handleHit(typeIndex) {
            const hitInfo = HIT_TYPES[typeIndex];
            UI.statusMessage.innerHTML = `<span class="text-green-400 text-2xl font-black">${hitInfo.name}！！</span>`;
            UI.statusMessage.className = "text-base font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-4 border-green-500 w-full shadow-lg shrink-0";
            
            animateTrajectory(typeIndex);

            let runsScored = 0;
            let newBases = [false, false, false];
            const advanceBases = hitInfo.bases;

            for (let i = 2; i >= 0; i--) {
                if (bases[i]) {
                    let nextBase = (i + 1) + advanceBases;
                    if (nextBase > 3) {
                        runsScored++;
                    } else {
                        newBases[nextBase - 1] = true;
                    }
                }
            }
            
            if (advanceBases === 4) {
                runsScored++;
            } else {
                newBases[advanceBases - 1] = true;
            }

            bases = newBases;
            
            setTimeout(() => {
                updateBasesUI();
                if (runsScored > 0) {
                    const prevScore1 = score.team1;
                    const prevScore2 = score.team2;
                    
                    addScore(runsScored);
                    triggerTVScoreBanner(prevScore1, prevScore2, runsScored);
                } else {
                    checkGameEndCondition(); // 点が入らなくてもサヨナラ条件を満たしているかチェック
                }
            }, 1000);

            // サヨナラ勝ちでなければ「次の投球へ」ボタンを表示
            setTimeout(() => {
                if(!isSayonara) {
                   showElem(UI.nextPitchBtn);
                }
            }, 1500);
        }

        function triggerTVScoreBanner(prev1, prev2, runs) {
            const banner = document.getElementById('tv-score-banner');
            const score1Elem = document.getElementById('tv-team1-score');
            const score2Elem = document.getElementById('tv-team2-score');
            const runsElem = document.getElementById('tv-score-runs');
            const glowElem = document.getElementById('tv-score-glow');

            document.getElementById('tv-team1-name').innerText = player1Name;
            document.getElementById('tv-team2-name').innerText = player2Name;
            runsElem.innerText = `+${runs} RUN${runs > 1 ? 'S' : ''}`;

            score1Elem.innerText = prev1;
            score2Elem.innerText = prev2;
            score1Elem.classList.remove('animate-kurun', 'text-yellow-400');
            score2Elem.classList.remove('animate-kurun', 'text-yellow-400');
            score1Elem.classList.add('text-white');
            score2Elem.classList.add('text-white');

            banner.classList.remove('opacity-0', 'scale-90');
            banner.classList.add('opacity-100', 'scale-100');

            const targetScoreElem = isTop ? score1Elem : score2Elem;
            const boardTotalElem = isTop ? document.getElementById('total-team1') : document.getElementById('total-team2');
            const initialScore = isTop ? prev1 : prev2;

            if (boardTotalElem) {
                boardTotalElem.innerText = initialScore;
            }

            let currentStep = 0;

            setTimeout(() => {
                glowElem.classList.remove('opacity-0');
                
                function addNextRun() {
                    if (currentStep < runs) {
                        currentStep++;
                        const currentDisplayVal = initialScore + currentStep;

                        targetScoreElem.classList.remove('animate-kurun');
                        if (boardTotalElem) boardTotalElem.classList.remove('animate-kurun');

                        void targetScoreElem.offsetWidth;

                        targetScoreElem.classList.add('animate-kurun');
                        if (boardTotalElem) boardTotalElem.classList.add('animate-kurun');

                        setTimeout(() => {
                            targetScoreElem.innerText = currentDisplayVal;
                            if (boardTotalElem) boardTotalElem.innerText = currentDisplayVal;
                            targetScoreElem.classList.remove('text-white');
                            targetScoreElem.classList.add('text-yellow-400');
                        }, 375);

                        if (currentStep < runs) {
                            setTimeout(addNextRun, 850);
                        } else {
                            setTimeout(() => {
                                glowElem.classList.add('opacity-0');
                                banner.classList.remove('opacity-100', 'scale-100');
                                banner.classList.add('opacity-0', 'scale-90');
                                
                                // テロップ終了後にサヨナラ判定を行う
                                checkGameEndCondition();
                                
                            }, 1400);
                        }
                    }
                }

                addNextRun();
            }, 350);
        }

        function animateTrajectory(typeIndex) {
            const pathElem = document.getElementById('ball-path');
            const ballElem = document.getElementById('ball-head');
            const scoreboard = document.getElementById('scoreboard-box');
            
            const isPortrait = document.getElementById('app').classList.contains('is-portrait');
            
            let d = "";

            if (isPortrait) {
                const startX = 200;
                const startY = 320;
                // スマホ縦画面専用軌道
                switch(typeIndex) {
                    case 0:
                        d = `M ${startX} ${startY} Q 235 150 250 175 Q 255 170 260 173`;
                        break;
                    case 1:
                        d = `M ${startX} ${startY} Q 140 80 100 120 Q 85 105 75 115`;
                        break;
                    case 2:
                        d = `M ${startX} ${startY} Q 290 60 325 110 Q 340 90 350 100`;
                        break;
                    case 3:
                        d = `M ${startX} ${startY} Q 75 -150 25 -30`;
                        break;
                }
            } else {
                const startX = 200;
                const startY = 290;
                switch(typeIndex) {
                    case 0:
                        d = `M ${startX} ${startY} Q 230 110 245 150 Q 250 140 255 143`;
                        break;
                    case 1:
                        d = `M ${startX} ${startY} Q 150 110 130 160 Q 115 135 105 150`;
                        break;
                    case 2:
                        d = `M ${startX} ${startY} Q 270 95 295 155 Q 320 120 335 140`;
                        break;
                    case 3:
                        d = `M ${startX} ${startY} Q 100 -90 60 45`;
                        break;
                }
            }

            pathElem.setAttribute('d', d);
            
            const length = pathElem.getTotalLength();
            pathElem.style.strokeDasharray = length;
            pathElem.style.strokeDashoffset = length;
            
            pathElem.classList.remove('opacity-0');
            ballElem.classList.remove('opacity-0');
            
            let startTime = null;
            const duration = typeIndex === 3 ? 1500 : 1200;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                
                const currentOffset = length * (1 - progress);
                pathElem.style.strokeDashoffset = currentOffset;
                
                const currentPoint = pathElem.getPointAtLength(length * progress);
                ballElem.setAttribute('cx', currentPoint.x);
                ballElem.setAttribute('cy', currentPoint.y);
                
                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    if (typeIndex === 3 && scoreboard) {
                        scoreboard.classList.add('translate-y-[-4px]', 'scale-105', 'border-yellow-400');
                        setTimeout(() => {
                            scoreboard.classList.remove('translate-y-[-4px]', 'scale-105', 'border-yellow-400');
                        }, 300);
                    }
                }
            }

            requestAnimationFrame(step);
        }

        function clearTrajectory() {
            const pathElem = document.getElementById('ball-path');
            const ballElem = document.getElementById('ball-head');
            if (pathElem) pathElem.classList.add('opacity-0');
            if (ballElem) ballElem.classList.add('opacity-0');
        }

        function addScore(runs) {
            const currentTeam = isTop ? 'team1' : 'team2';
            score[currentTeam] += runs;
            
            let currentInningScore = parseInt(inningScores[currentTeam][currentInning - 1]) || 0;
            inningScores[currentTeam][currentInning - 1] = currentInningScore + runs;
            
            updateScoreDisplay();
        }

        function checkGameEndCondition() {
            // 後攻（裏）の攻撃中、かつ最終回以降で、後攻の点数が先攻を上回った瞬間にサヨナラ勝ち
            if (!isTop && currentInning >= maxInnings && score.team2 > score.team1) {
                isSayonara = true;
                updateScoreDisplay(); // xを描画させるため再更新
                
                UI.statusMessage.innerHTML = `<span class="text-yellow-400 text-2xl font-black tracking-widest">サヨナラ勝ち！</span>`;
                UI.statusMessage.className = "text-base font-bold mb-2 text-center h-[64px] flex flex-col items-center justify-center bg-gray-800/90 px-3 py-1.5 rounded-2xl border-4 border-yellow-500 w-full shadow-lg shrink-0";
                
                setTimeout(() => {
                    endGame();
                }, 2000);
            }
        }

        function nextPitch() {
            if(!isSayonara) {
                startPitchingPhase();
            }
        }

        function resetCards() {
            for(let i=0; i<4; i++) {
                const card = document.getElementById(`card-${i}`);
                if (card) {
                    card.classList.remove('is-flipped');
                    document.getElementById(`pitcher-mark-${i}`).classList.add('hidden');
                    
                    setTimeout(() => {
                        const backFace = document.getElementById(`card-back-${i}`);
                        if (backFace) {
                            backFace.style.borderColor = '#e5e7eb';
                            backFace.style.backgroundColor = '#ffffff';
                        }
                    }, 600);
                }
            }
        }

        function changeInning() {
            const currentTeam = isTop ? 'team1' : 'team2';
            if (inningScores[currentTeam][currentInning - 1] === '') {
                inningScores[currentTeam][currentInning - 1] = 0;
            }

            if (isTop) {
                isTop = false;
                // 後攻の攻撃が始まる前に、すでに後攻が勝っていて最終回なら、その時点でサヨナラ扱い（xのみ表示）で終了
                if (currentInning >= maxInnings && score.team2 > score.team1) {
                     isSayonara = true;
                     inningScores.team2[currentInning - 1] = ''; // 点数は入っていない
                     updateScoreDisplay(); // xを描画
                     endGame();
                     return;
                }
            } else {
                isTop = true;
                currentInning++;
            }

            if (currentInning > maxInnings) {
                endGame();
                return;
            }

            initInningState();
            updateScoreDisplay();
            startPitchingPhase();
        }

        function endGame() {
            UI.gameScreen.classList.add('hidden');
            UI.gameoverScreen.classList.remove('hidden');
            UI.gameoverScreen.classList.add('flex');

            document.getElementById('final-score-team1').innerText = score.team1;
            document.getElementById('final-score-team2').innerText = score.team2;

            const resultText = document.getElementById('final-result-text');
            if (score.team1 > score.team2) {
                resultText.innerText = `${player1Name} の勝利！`;
                resultText.className = "text-3xl font-bold text-blue-400 mb-6 drop-shadow-md";
            } else if (score.team2 > score.team1) {
                if (isSayonara) {
                    resultText.innerText = `${player2Name} のサヨナラ勝利！`;
                    resultText.className = "text-3xl font-bold text-yellow-400 mb-6 drop-shadow-md";
                } else {
                    resultText.innerText = `${player2Name} の勝利！`;
                    resultText.className = "text-3xl font-bold text-red-400 mb-6 drop-shadow-md";
                }
            } else {
                resultText.innerText = '引き分け！';
                resultText.className = "text-3xl font-bold text-gray-300 mb-6 drop-shadow-md";
            }
        }

        function returnToTitle() {
            UI.gameoverScreen.classList.add('hidden');
            UI.gameoverScreen.classList.remove('flex');
            UI.titleScreen.classList.remove('hidden');
            fitToWindow();
        }

        function showOverlay(title, desc) {
            if (!UI.turnOverlay) initUI();
            UI.overlayTitle.innerText = title;
            UI.overlayDesc.innerHTML = desc;
            UI.turnOverlay.classList.remove('hidden');
        }

        function hideOverlay() {
            if (!UI.turnOverlay) initUI();
            UI.turnOverlay.classList.add('hidden');
        }

        const alertModal = document.getElementById('custom-alert');
        const alertMsg = document.getElementById('alert-message');
        
        function showAlert(msg) {
            alertMsg.innerText = msg;
            alertModal.classList.remove('hidden');
            setTimeout(() => {
                alertModal.classList.remove('opacity-0');
                alertModal.children[0].classList.remove('scale-95');
                alertModal.children[0].classList.add('scale-100');
            }, 10);
        }

        function closeAlert() {
            alertModal.classList.add('opacity-0');
            alertModal.children[0].classList.remove('scale-100');
            alertModal.children[0].classList.add('scale-95');
            setTimeout(() => {
                alertModal.classList.add('hidden');
            }, 300);
        }

        function fitToWindow() {
            const app = document.getElementById('app');
            if (!app) return;

            const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;

            const isPortrait = (vw / vh) < 1.05;

            let baseWidth, baseHeight;

            if (isPortrait) {
                app.classList.add('is-portrait');
                app.classList.remove('is-landscape');
                baseWidth = 400;
                baseHeight = 680;
            } else {
                app.classList.add('is-landscape');
                app.classList.remove('is-portrait');
                baseWidth = 920;
                baseHeight = 600;
            }

            const padding = 4;
            const availableW = Math.max(100, vw - padding * 2);
            const availableH = Math.max(100, vh - padding * 2);

            const scaleW = availableW / baseWidth;
            const scaleH = availableH / baseHeight;
            const scale = Math.min(scaleW, scaleH);

            app.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }

        window.addEventListener('resize', fitToWindow);
        window.addEventListener('orientationchange', () => {
            setTimeout(fitToWindow, 100);
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', fitToWindow);
            window.visualViewport.addEventListener('scroll', fitToWindow);
        }
        document.addEventListener('DOMContentLoaded', fitToWindow);
        window.addEventListener('load', fitToWindow);
    </script>
</body>
</html>
