    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* 画面の高さは --app-h で一元管理する。
           古い環境は vh → dvh対応なら dvh → JSが実測値(px)で最終上書き（iOS Safari対策） */
        :root { --wb-bg: #ffffff; --app-h: 100vh; }
        @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
        /* iOS/iPadOS Safari は viewport の maximum-scale / user-scalable=no を無視するため、
           ダブルタップ拡大と長押しの拡大鏡は touch-action と callout で止める。
           manipulation = スクロールとピンチは残し、ダブルタップ拡大だけ無効化 */
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
        }

        html { opacity: 0; }
        html.fonts-loaded { opacity: 1; transition: opacity 0.3s ease-in; }
        body {
            font-family: 'Noto Sans JP', 'Kosugi Maru', sans-serif;
            background-color: #353b48;
            color: #2f3640;
            overflow: hidden;
            height: var(--app-h);
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            margin: 0;
            position: fixed;
            /* 描画中にUIの文字がドラッグ選択されてしまうのを防ぐ */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* 名前入力など、文字を入力する要素だけは選択できるようにする */
        input, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        .whiteboard-frame {
            background: #dcdde1;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #7f8c8d;
            height: calc(var(--app-h) * 0.98);
            width: 98vw;
            max-width: 1600px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .whiteboard-surface {
            background-color: var(--wb-bg);
            border-radius: 6px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .game-layout { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .content-area {
            display: flex;
            flex-grow: 1;
            padding: 10px;
            gap: 10px;
            overflow: hidden;
            min-height: 0;
        }
        .side-panel-left { width: 320px; flex-shrink: 0; }
        /* お題／前の人の絵は枠内に収めつつ、できるだけ大きく表示する */
        #info-image-display { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }

        /* PCでは左パネルを画面幅に応じて可変にする。
           320px固定だとお題の枠が小さくなり、回答用キャンバスと釣り合わないため */
        @media (min-width: 769px) {
            .side-panel-left { width: 34%; min-width: 300px; max-width: 560px; }
            /* 回答（文字を書く）ターンは、前の人の絵を見る領域をさらに広く取る */
            .mode-answer .side-panel-left { width: 42%; max-width: 640px; }
        }
        /* ツールバーの間隔・余白はCSS側で一元管理する（Tailwindのspace-y/pyと競合させない） */
        .side-panel-right {
            width: 80px;
            flex-shrink: 0;
            gap: 16px;
            padding: 16px 0;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .side-panel-right .tool-btn,
        .side-panel-right .util-btn {
            width: 56px;
            height: 56px;
            padding: 4px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .side-panel-right .color-btn { flex-shrink: 0; }
        
        .canvas-container-outer {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #f1f2f6;
            border-radius: 12px;
            padding: 10px;
        }
        #canvas-wrapper-inner {
            background: white;
            border: 4px solid #7f8c8d;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            touch-action: none;
        }
        canvas { touch-action: none; cursor: crosshair; display: block; width: 100% !important; height: 100% !important; }
        .tool-btn { transition: all 0.2s; border: 2px solid #e5e7eb; }
        .tool-btn.active { border-color: #2563eb; background-color: #eff6ff; transform: scale(1.05); }
        .util-btn { transition: all 0.2s; border: 2px solid #e5e7eb; }
        .color-btn { transition: all 0.2s; border-width: 2px; border-color: white; }
        .color-btn.active { transform: scale(1.1); outline: 2px solid #2563eb; outline-offset: 1px; }

        /* タイトル・プレイヤー名など：マーカー風 */
        .marker-text { font-family: 'Yusei Magic', 'Kosugi Maru', cursive; }

        /* ボタンのラベルは折り返さない（狭い画面でも1行に収まる文字サイズにしてある） */
        button { white-space: nowrap; }

        /* 見出しは画面幅に合わせて可変。1行に収まる範囲でできるだけ大きく */
        #setup-title { font-size: clamp(28px, 8.5vw, 48px); line-height: 1.25; }
        #finish-title { font-size: clamp(22px, 7.2vw, 44px); line-height: 1.25; }
        #result-title { font-size: clamp(28px, 9vw, 48px); line-height: 1.25; }

        /* お題の文字は「回答用キャンバス」と同じ 3:1 の枠に入れ、
           枠の大きさはウィンドウに合わせて可変。文字サイズはJSが枠いっぱいに調整する */
        #info-word-display {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        #info-word-display.hidden { display: none; }

        /* スマホ向けレスポンシブ調整 */
        @media (max-width: 768px) {
            .whiteboard-frame { height: var(--app-h); width: 100vw; border-radius: 0; border: none; padding: 4px; }
            .content-area { flex-direction: column; padding: 5px; gap: 5px; }
            .side-panel-left { width: 100%; height: 200px; flex-shrink: 0; }
            /* 回答ターン：前の人の絵を大きく、回答欄(3:1)は必要な分だけ */
            .mode-answer .side-panel-left { height: auto; flex: 1 1 auto; min-height: 0; }
            .mode-answer .canvas-container-outer { flex: 0 0 38%; }
            /* お題が文字だけのターン：パネルを小さくして描画キャンバスを大きく */
            .mode-draw-word .side-panel-left { height: auto; flex: 0 0 175px; }
            /* お題が前の人の手書き文字のターン：ほどよい大きさに */
            .mode-draw-image .side-panel-left { height: auto; flex: 0 0 30%; min-height: 0; }
            .side-panel-right {
                width: 100%;
                height: 64px;
                flex-direction: row !important;
                flex-wrap: nowrap;
                justify-content: center;
                align-items: center;
                padding: 0 8px;
                gap: 6px;
                flex-shrink: 0;
                overflow: hidden;
            }
            .side-panel-right hr { display: none; }
            .side-panel-right .flex-grow { display: none; }
            .side-panel-right .tool-btn,
            .side-panel-right .util-btn { width: 44px; height: 44px; padding: 4px; }
            .side-panel-right .color-btn { width: 28px; height: 28px; }
            #info-footer-msg { display: none; }
            .canvas-container-outer { padding: 5px; flex-grow: 1; }
            /* スマホで前の絵を画面いっぱいに表示 */
            #info-image-display { width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; object-fit: contain; }
        }

        /* 幅の狭い端末でツールバーが横にはみ出さないよう更に縮小 */
        @media (max-width: 400px) {
            .side-panel-right { gap: 4px; padding: 0 4px; }
            .side-panel-right .tool-btn,
            .side-panel-right .util-btn { width: 40px; height: 40px; }
            .side-panel-right .color-btn { width: 24px; height: 24px; }
        }

        /* パソコンでウィンドウの高さが低いとき、右の道具の列（ペン・消しゴム・6色・ぜんぶ消す）が
           縦に入りきらず下の色が隠れていたので、高さに合わせてボタンと間隔を縮める */
        @media (min-width: 769px) and (max-height: 760px) {
            #toolbar { gap: clamp(4px, 1.4vh, 16px); padding: 8px 0; }
            #toolbar .tool-btn,
            #toolbar .util-btn { width: clamp(40px, 7.5vh, 56px); height: clamp(40px, 7.5vh, 56px); }
            #toolbar .color-btn { width: 28px; height: 28px; }
        }
        /* さらに低いとき（スマホ横向きなど）は、色を2列に並べて1画面に収める */
        @media (min-width: 769px) and (max-height: 480px) {
            #toolbar {
                display: grid;
                grid-template-columns: repeat(2, 28px);
                justify-content: center;
                align-content: start;
                gap: 6px;
            }
            #toolbar hr,
            #toolbar .flex-grow { display: none; }
            #toolbar .tool-btn,
            #toolbar .util-btn { grid-column: span 2; justify-self: center; }
        }

        /* はじめの画面：中身が入りきるときは真ん中、入りきらないときは上から表示する
           （justify-content:center のままだと、低い画面で上の見出しが切れてスクロールでも見られなかった）。
           中身の大きさは JS（fitSetupScreen）が画面に合わせて拡大縮小する */
        #setup-screen { justify-content: flex-start; }
        #setup-inner {
            margin: auto 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        #reveal-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .reveal-card {
            position: absolute;
            width: 90%;
            max-width: 340px;
            background: white;
            border: 4px solid #d1d5db;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
        }
        .reveal-card img { width: 100% !important; height: auto !important; border-radius: 8px; border: 1px solid #eee; }
        @media (min-width: 769px) { .reveal-card { max-width: 460px; } }

        /* 振り返り・全記録のカード内のお題も、回答用キャンバスと同じ 3:1 の枠に入れる */
        .word-box {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 3 / 1;
        }
        /* お題は自動折り返しをさせない。1行、または9文字以上のときだけ
           JSが真ん中に <br> を入れて均等な2行にする */
        .word-text {
            display: inline-block;
            white-space: nowrap;
            text-align: center;
            line-height: 1.15;
            font-family: 'Klee One', 'Kosugi Maru', serif;
            font-weight: 600;
            color: #2563eb;
        }

        /* 振り返りは「最初 → 最後」の順に進むので、
           1つ前のカードは左に残り、次のカードは右から入ってくる */
        .pos-center-origin { opacity: 1; transform: translate(0, 0) scale(1.0); z-index: 50; border-color: #3b82f6; box-shadow: 0 20px 40px rgba(59,130,246,0.3); }
        .pos-center { opacity: 1; transform: translate(22%, 0) scale(1.0); z-index: 50; border-color: #3b82f6; box-shadow: 0 20px 40px rgba(59,130,246,0.2); }
        .pos-prev { opacity: 1; transform: translate(-60%, 0) scale(0.9); z-index: 40; border-color: #d1d5db; }

        @media (max-width: 640px) {
            .pos-center { transform: translate(12%, 0) scale(0.9); }
            .pos-prev { transform: translate(-44%, 0) scale(0.8); }
        }

        .pos-hidden-left { opacity: 0; transform: translate(-500px, 0) scale(0.8); z-index: 10; }
        .pos-hidden-right { opacity: 0; transform: translate(500px, 0) scale(0.8); z-index: 10; }

        /* 結果発表のタメ演出 */
        .reveal-step {
            opacity: 0;
            transform: translateY(16px) scale(0.96);
            transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .reveal-step.show { opacity: 1; transform: translateY(0) scale(1); }
        .drumroll-shake { animation: drumShake 0.11s linear infinite; }
        @keyframes drumShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            50% { transform: translate(2px, -1px); }
            75% { transform: translate(-1px, -2px); }
        }

        /* ===== 劇場カーテン ===== */
        #curtain {
            position: absolute;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            overflow: hidden;
        }
        .curtain-half {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 52%;
            /* 布のひだ（ドレープ）を縞のグラデーションで表現 */
            background: repeating-linear-gradient(90deg,
                #5e1010 0px,
                #8e1b1b 13px,
                #c0392b 28px,
                #e05a45 38px,
                #c0392b 48px,
                #8e1b1b 64px,
                #5e1010 78px);
            box-shadow: inset 0 -60px 80px rgba(0,0,0,0.4);
            transition: transform 1s cubic-bezier(0.33, 0.9, 0.35, 1);
            will-change: transform;
        }
        /* 合わせ目の金の縁取り */
        .curtain-half::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 12px;
            background: linear-gradient(90deg, #f7e592, #c9a227 45%, #7d6210);
            box-shadow: 0 0 14px rgba(0,0,0,0.5);
        }
        .curtain-left { left: 0; transform: translateX(-101%); }
        .curtain-right { right: 0; transform: translateX(101%); }
        .curtain-left::after { right: 0; }
        .curtain-right::after { left: 0; }
        .curtain-closed .curtain-left,
        .curtain-closed .curtain-right { transform: translateX(0); }

        /* 上部の垂れ幕（バランス）＋スカラップ（波形の裾） */
        .curtain-valance {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 13%;
            min-height: 54px;
            z-index: 3;
            background: repeating-linear-gradient(90deg,
                #5e1010 0px,
                #8e1b1b 11px,
                #c0392b 24px,
                #e05a45 32px,
                #c0392b 40px,
                #8e1b1b 53px,
                #5e1010 64px);
            border-bottom: 5px solid #c9a227;
            box-shadow: 0 12px 26px rgba(0,0,0,0.45);
            /* 裾のスカラップ(22px)ぶんも画面外に隠す */
            transform: translateY(calc(-100% - 32px));
            transition: transform 0.7s cubic-bezier(0.33, 0.9, 0.35, 1);
        }
        .curtain-valance::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            height: 22px;
            background: radial-gradient(circle at 50% 0%, #a82c1f 0 13px, transparent 13px) repeat-x;
            background-size: 28px 22px;
            filter: drop-shadow(0 4px 3px rgba(0,0,0,0.35));
        }
        .curtain-closed .curtain-valance { transform: translateY(0); }

        #curtain-message {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10vh 24px 24px;
            color: #ffe9a8;
            font-weight: 900;
            line-height: 1.6;
            font-size: clamp(1.3rem, 5.5vw, 2.6rem);
            text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 0 28px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #curtain-message.show { opacity: 1; transform: translateY(0); }
        
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .icon-svg { width: 100%; height: 100%; display: block; }
        .icon-st0 { fill:none; stroke:currentColor; stroke-width:8; stroke-linecap:round; stroke-linejoin:round; stroke-miterlimit:10; }

            <div class="whiteboard-surface">
                
                <div id="curtain">
                    <div class="curtain-half curtain-left"></div>
                    <div class="curtain-half curtain-right"></div>

                <div id="setup-screen" class="absolute inset-0 flex flex-col items-center justify-center p-6 bg-white z-50 overflow-y-auto">

                    <h1 id="setup-title" class="font-black marker-text border-b-4 border-blue-500 mb-8 text-gray-800 text-center whitespace-nowrap">お絵かき伝言ゲーム</h1>
                    <div class="w-full max-w-md space-y-6">
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-gray-50 p-3 rounded-xl border text-center">
                                <label class="block text-[10px] font-black text-gray-400 mb-1 tracking-widest">にんずう</label>
                                <select id="player-count-select" onchange="updateNameInputs()" class="w-full bg-white border border-blue-500 rounded-lg px-1 py-1.5 font-black outline-none text-base">

                                    <option value="4" selected>4人</option>
                                    <option value="5">5人</option>
                                    <option value="6">6人</option>
                                </select>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-xl border text-center">
                                <label class="block text-[10px] font-black text-gray-400 mb-1 tracking-widest">むずかしさ</label>
                                <select id="difficulty-select" onchange="updateDifficultyHint()" class="w-full bg-white border border-gray-300 rounded-lg px-1 py-1.5 font-bold outline-none text-base">
                                    <option value="easy">かんたん</option>
                                    <option value="normal" selected>ふつう</option>
                                    <option value="hard">むずかしい</option>
                                    <option value="custom">じぶんできめる</option>
                                </select>
                            </div>
                            <div class="bg-gray-50 p-3 rounded-xl border text-center">
                                <label class="block text-[10px] font-black text-gray-400 mb-1 tracking-widest">じゅんばん</label>
                                <select id="shuffle-select" class="w-full bg-white border border-gray-300 rounded-lg px-1 py-1.5 font-bold outline-none text-base">
                                    <option value="shuffle" selected>ランダム</option>
                                    <option value="fixed">そのまま</option>
                                </select>
                            </div>
                        </div>
                        <p id="custom-hint" class="hidden -mt-3 text-[11px] font-black text-amber-600 text-center">さいしょの人が、自分でお題を入力します</p>
                        <div id="name-inputs" class="grid grid-cols-2 gap-2 max-h-[30vh] overflow-y-auto p-1"></div>

           そのまま描画すると一瞬だけ代替フォントで表示されてしまうため（FOUT）、
           必要な書体を先に読み込んでから画面を出す。 */
        const FONT_KLEE = '600 40px "Klee One"';
        const FONT_YUSEI = '400 40px "Yusei Magic"';

        function loadFont(spec, text) {
            try {
                if (document.fonts && document.fonts.load) return document.fonts.load(spec, text);
            } catch (e) {}
            return Promise.resolve();
        }

        (function() {
            const reveal = () => { document.documentElement.classList.add('fonts-loaded'); fitSetupScreen(); };
            // 保険：読込が終わらなくても2.5秒で必ず表示する（真っ白のまま固まるのを防止）
            setTimeout(reveal, 2500);
            try {
                Promise.all([
                    loadFont(FONT_YUSEI, 'お絵かき伝言ゲームじゅんびプレイヤー結果発表'),
                    loadFont(FONT_KLEE, 'あいうえおかきくけこさしすせそたちつてとアイウエオカキクケコ'),
                    document.fonts ? document.fonts.ready : Promise.resolve()
                ]).then(reveal, reveal);
            } catch (e) {
                reveal();

        /* ===== 効果音（音声ファイル不要・WebAudioで生成） ===== */
        let audioCtx = null;
        let soundEnabled = true;
        try { soundEnabled = (localStorage.getItem('ota_sound_18') !== 'off'); } catch (e) {}

        function ensureAudio() {
            if (!soundEnabled) return null;
            try {
                if (!audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return null;
                    audioCtx = new AC();
                    // iOS対策：最初の操作時に無音を1回鳴らして音声出力を有効化する
                    const s = audioCtx.createBufferSource();
                    s.buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
                    s.connect(audioCtx.destination);
                    s.start(0);
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            } catch (e) { return null; }
        }

        function updateSoundLabel() {
            const b = document.getElementById('sound-toggle');
            if (b) b.innerText = soundEnabled ? 'おと：ON' : 'おと：OFF';
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            try { localStorage.setItem('ota_sound_18', soundEnabled ? 'on' : 'off'); } catch (e) {}
            updateSoundLabel();
            if (soundEnabled) sfxPop();
        }
        updateSoundLabel();

        function makeNoise(ctx, seconds) {
            const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * seconds)), ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            return buf;
        }

        function sfxTone(freq, at, dur, type = 'triangle', vol = 0.18) {
            const ctx = ensureAudio(); if (!ctx) return;
            const t = ctx.currentTime + at;
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(ctx.destination);
            o.start(t); o.stop(t + dur + 0.05);
        }

        // カーテンの布ずれ音（dir=1:しまる / dir=-1:あく）
        function sfxCurtain(dir) {
            const ctx = ensureAudio(); if (!ctx) return;
            const dur = 1.0;
            const t = ctx.currentTime;
            const src = ctx.createBufferSource();
            src.buffer = makeNoise(ctx, dur);
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.Q.value = 0.9;
            bp.frequency.setValueAtTime(dir > 0 ? 500 : 1700, t);
            bp.frequency.exponentialRampToValueAtTime(dir > 0 ? 1700 : 500, t + dur);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(0.22, t + dur * 0.3);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(bp).connect(g).connect(ctx.destination);
            src.start(t); src.stop(t + dur);
        }

        function sfxDrumroll(dur = 1.7) {
            const ctx = ensureAudio(); if (!ctx) return;
            const t0 = ctx.currentTime;
            const step = 0.045;
            const hits = Math.floor(dur / step);
            for (let i = 0; i < hits; i++) {
                const t = t0 + i * step;
                const src = ctx.createBufferSource();
                src.buffer = makeNoise(ctx, 0.05);
                const lp = ctx.createBiquadFilter();
                lp.type = 'lowpass';
                lp.frequency.value = 850;
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.05 + 0.12 * (i / hits), t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
                src.connect(lp).connect(g).connect(ctx.destination);
                src.start(t); src.stop(t + 0.06);
            }
        }

        function sfxFanfare() {
            [[523.25, 0], [659.25, 0.11], [783.99, 0.22], [1046.5, 0.33]]
                .forEach(([f, at]) => sfxTone(f, at, 0.55, 'triangle', 0.2));
            const ctx = ensureAudio(); if (!ctx) return;
            const t = ctx.currentTime + 0.33;
            const src = ctx.createBufferSource();
            src.buffer = makeNoise(ctx, 1.3);
            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.value = 4200;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.16, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
            src.connect(hp).connect(g).connect(ctx.destination);
            src.start(t); src.stop(t + 1.3);
        }

        function sfxPop() { sfxTone(880, 0, 0.12, 'sine', 0.16); sfxTone(1320, 0.06, 0.12, 'sine', 0.11); }

        function sfxFlip() {
            const ctx = ensureAudio(); if (!ctx) return;
            const t = ctx.currentTime;
            const src = ctx.createBufferSource();
            src.buffer = makeNoise(ctx, 0.22);
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(900, t);
            bp.frequency.exponentialRampToValueAtTime(2600, t + 0.22);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.14, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
            src.connect(bp).connect(g).connect(ctx.destination);
            src.start(t); src.stop(t + 0.22);
        }

        /* はじめの画面の中身を、画面の大きさに合わせて拡大縮小する。
           パソコンの大きな画面では真ん中に小さくまとまって見えないよう大きく、
           高さが低い画面では入りきるよう少し小さくする（zoom なので配置もいっしょに変わる） */
        function fitSetupScreen() {
            const scr = document.getElementById('setup-screen');
            const inner = document.getElementById('setup-inner');
            if (!scr || !inner || scr.classList.contains('hidden')) return;
            inner.style.zoom = '1';
            const cs = getComputedStyle(scr);
            const availW = scr.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const availH = scr.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            const natH = inner.offsetHeight;
            const box = inner.querySelector('.max-w-md');
            const title = document.getElementById('setup-title');
            const natW = Math.max(box ? box.offsetWidth : 0, title ? title.offsetWidth : 0);
            if (!(availW > 0 && availH > 0 && natH > 0 && natW > 0)) return;
            // 横幅いっぱいまで使っている（スマホ縦）ときは、横方向では拡大しない
            const zW = natW >= 440 ? availW / natW : 1;
            let z = Math.min(availH / natH, zW, 1.7);
            z = Math.max(0.75, z);
            if (Math.abs(z - 1) < 0.03) z = 1;
            inner.style.zoom = String(Math.round(z * 1000) / 1000);
        }
        updateNameInputs();

        function shuffleArray(arr) {
            // Fisher-Yates（sort(()=>Math.random()-0.5) は偏るため使わない）
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

            const names = Array.from(document.querySelectorAll('.player-name')).map(i => i.value.trim() || "プレイヤー");
            const shuffleType = document.getElementById('shuffle-select').value;
            players = (shuffleType === 'shuffle') ? shuffleArray(names) : [...names];
            const diff = document.getElementById('difficulty-select').value;

            // 「じぶんできめる」は、さいしょの人が端末を受け取ってからお題を入力する
            if (diff === 'custom') {
                book = { steps: [] };
                customWordPending = true;
                currentPlayerIdx = 0;
                showPassScreen();
                return;
            }

            let availableWords = WORD_LISTS[diff].filter(w => !USED_WORDS.includes(w));
            if (availableWords.length === 0) { USED_WORDS = []; availableWords = WORD_LISTS[diff]; }
            const word = availableWords[Math.floor(Math.random() * availableWords.length)];
            USED_WORDS.push(word); 
            book = { steps: [{ type: 'word', value: word, author: "さいしょのおだい", originalIdx: 0 }] };
            currentPlayerIdx = 0;
            showPassScreen();
        }

        /* お題の文字は「回答用キャンバス」と同じ 3:1 の枠に収める。
           枠は白パネルに入る最大サイズをウィンドウに合わせて計算し、
           その中で文字が最大になるサイズを二分探索で決める（最大2行）。 */
        const WORD_ASPECT = 3;        // 回答用キャンバスと同じ横:縦
        const WORD_ONE_LINE_MAX = 8;  // ここまでは必ず1行（お題の99%が8文字以下）

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        /* お題のHTML。長い語だけ真ん中で割って均等な2行にする。
           自動折り返しに任せると「7文字＋1文字」のような不格好な割れ方をするため。 */
        function wordHtml(word) {
            const chars = [...String(word)];
            if (chars.length <= WORD_ONE_LINE_MAX) return escapeHtml(word);
            const half = Math.ceil(chars.length / 2);
            return escapeHtml(chars.slice(0, half).join('')) + '<br>' +
                   escapeHtml(chars.slice(half).join(''));
        }

        /* 枠に収まる最大の文字サイズを二分探索で決める。
           span は nowrap なので offsetWidth が実際の文字幅になる。 */
        function fitSpanInBox(span, box, maxSize = 220) {
            if (!span || !box) return 0;
            const cs = getComputedStyle(box);
            const w = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const h = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            if (w <= 0 || h <= 0) return 0;

            let lo = 8, hi = maxSize, best = 8;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                span.style.fontSize = `${mid}px`;
                if (span.offsetWidth <= w && span.offsetHeight <= h) { best = mid; lo = mid + 1; }
                else { hi = mid - 1; }
            }
            span.style.fontSize = `${best}px`;
            return best;
        }

        /* 表示中のお題を測り直す。
           フォント未読込のまま測るとサイズがずれるので、読み込み完了後にもう一度呼ぶ。 */
        function refitVisibleWords() {
            fitWordText();
            const stage = document.getElementById('reveal-stage');
            if (stage) fitAllWordBoxes(stage);
            const list = document.getElementById('summary-list');
            if (list) fitAllWordBoxes(list);
            const fw = document.getElementById('first-word-text');
            const fb = document.getElementById('first-word-result');
            if (fw && fb && fw.textContent) fitSpanInBox(fw, fb);
        }

        // そのお題に使われている文字の書体を読み込んでから測り直す
        function refitAfterWordFont(text) {
            loadFont(FONT_KLEE, text || 'あ').then(refitVisibleWords, () => {});
        }

        try {
            if (document.fonts && document.fonts.addEventListener) {
                document.fonts.addEventListener('loadingdone', refitVisibleWords);
            }
        } catch (e) {}

        function fitWordText() {
            const el = document.getElementById('info-word-display');
            const txt = document.getElementById('info-word-text');
            if (!el || !txt || el.classList.contains('hidden')) return;

            const box = el.parentElement;
            const cs = getComputedStyle(box);
            const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
            const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            if (availW <= 0 || availH <= 0) return;

            // 3:1 の枠を、白パネルに収まる最大サイズで作る
            let w = availW;
            let h = w / WORD_ASPECT;
            if (h > availH) { h = availH; w = h * WORD_ASPECT; }
            el.style.width = `${Math.round(w)}px`;
            el.style.height = `${Math.round(h)}px`;

            fitSpanInBox(txt, el);
        }

        function adjustCanvasSize(preserveContent = false) {
            const container = document.getElementById('canvas-container');
            const wrapper = document.getElementById('canvas-wrapper-inner');
            const modeLabel = document.getElementById('mode-label');
            const isMobile = window.innerWidth <= 768;

            const padding = isMobile ? 10 : 40;
            const labelHeight = modeLabel.offsetHeight + 10;
            const availableW = Math.max(container.clientWidth - padding, 100);
            const availableH = Math.max(container.clientHeight - padding - labelHeight, 100);

            const lastStep = book.steps[book.steps.length - 1];
            if (!lastStep) return;   // お題がまだ決まっていない（じぶんできめる の入力中）

            let targetW, targetH;
            if (lastStep.type === 'sketch') {
                // 回答欄は横長(3:1)。幅だけでなく高さでもクランプして枠外にはみ出さないようにする
                targetW = Math.min(availableW, 600);
                targetH = targetW / 3;
                if (targetH > availableH) {
                    targetH = availableH;
                    targetW = Math.min(targetH * 3, availableW);
                }
                targetW = Math.round(Math.max(targetW, 100));
                targetH = Math.round(Math.max(targetH, 40));
            } else {
                targetW = targetH = Math.round(Math.max(Math.min(availableW, availableH), 100));
            }

            // サイズが変わっていなければ再初期化しない
            // （iOSのツールバー開閉などで頻繁にイベントが飛ぶため）
            if (preserveContent && canvas && canvasW === targetW && canvasH === targetH) return;

            // リサイズ・画面回転で描いた絵が消えないよう、いったん退避する
            let snapshot = null;
            if (preserveContent && canvas && canvas.width > 0 && canvas.height > 0) {
                try { snapshot = canvas.toDataURL('image/png'); } catch (e) { snapshot = null; }
            }

            wrapper.style.width = `${targetW}px`;
            wrapper.style.height = `${targetH}px`;
            initCanvas();

            if (snapshot) {
                const img = new Image();
                img.onload = () => { ctx.drawImage(img, 0, 0, canvasW, canvasH); };
                img.src = snapshot;
            }
        }

        function initCanvas() {
            canvas = document.getElementById('drawing-canvas');
            ctx = canvas.getContext('2d', { desynchronized: true });
            const wrapper = canvas.parentNode;
            
            // 重要：高DPR（スマホ）でのボケ・ズレを防止
            const dpr = window.devicePixelRatio || 1;
            const w = wrapper.clientWidth;
            const h = wrapper.clientHeight;
            
            // キャンバス自体のピクセルサイズをセット
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            
            // 表示サイズをCSSで制御（重要：!importantはCSS側に記述済み）
            ctx.scale(dpr, dpr);

            // 以降の描画・消去はすべてCSSピクセル基準（canvasW/H）で扱う
            canvasW = w;
            canvasH = h;

            // 長押しメニューやドラッグ選択を抑止
            canvas.oncontextmenu = (e) => e.preventDefault();
            canvas.onselectstart = (e) => e.preventDefault();
            canvas.ondragstart = (e) => e.preventDefault();

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                let clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                let clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
                // ブラウザ上の表示位置とCanvas内部座標を正しくマッピング
                return { 
                    x: (clientX - rect.left) * (w / rect.width), 
                    y: (clientY - rect.top) * (h / rect.height) 
                };
            };
            
            const applyStrokeStyle = () => {
                ctx.globalCompositeOperation = 'source-over';
                if (currentTool === 'eraser') {
                    // destination-out（透明化）だと保存PNGに穴が空き、
                    // 振り返り・全記録の背景色が透けてしまうため白で塗りつぶす
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 30;
                } else {
                    ctx.strokeStyle = currentColor;
                    // スマホ実機で最適な太さになるよう調整（dprに依存させない固定的な書き心地）
                    ctx.lineWidth = window.innerWidth <= 768 ? 4 : 6;
                }
            };

            const start = (e) => {
                isDrawing = true;
                const p = getPos(e);
                lastX = p.x;
                lastY = p.y;

                // 点を描画するための処理を追加
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(lastX, lastY);
                applyStrokeStyle();
                ctx.stroke();
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(p.x, p.y);
                applyStrokeStyle();
                ctx.stroke();
                lastX = p.x; lastY = p.y;
            };

            // PCのタッチパネル等にも対応するため Pointer Event を追加
            if (window.PointerEvent) {
                canvas.onpointerdown = (e) => { e.preventDefault(); start(e); };
                canvas.onpointermove = (e) => { e.preventDefault(); draw(e); };
                window.onpointerup = () => isDrawing = false;
                window.onpointercancel = () => isDrawing = false;
                // iPadでは Pointer Event と別に touch の既定動作が残るため、
                // ここでも止めないと長押しで拡大鏡（選択ルーペ）が出る
                canvas.ontouchstart = (e) => e.preventDefault();
                canvas.ontouchmove = (e) => e.preventDefault();
            } else {
                canvas.onmousedown = start;
                canvas.onmousemove = draw;
                window.onmouseup = () => isDrawing = false;
                canvas.ontouchstart = (e) => { e.preventDefault(); start(e); };
                canvas.ontouchmove = (e) => { e.preventDefault(); draw(e); };
                canvas.ontouchend = () => isDrawing = false;
            }
        }

        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${t}`).classList.add('active');
        }
        function setStrokeColor(c) { 
            currentColor = c; setTool('pen'); 
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`color-${c}`);
            if (activeBtn) activeBtn.classList.add('active');
        }
        function clearCanvas() {
            // ctxはdpr倍にscale済みなので、CSSピクセル基準のcanvasW/Hで塗りつぶす
            if (ctx) { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvasW, canvasH); }
        }

        function startTimer() {
            let t = 60;
            const el = document.getElementById('timer');
            el.innerText = t;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                t--; el.innerText = t;
                if (t <= 0) {
                    clearInterval(timerInterval);
                    sfxTimeUp();   // 時間切れは自分で押していないので、音で知らせる
                    submitStep();
                }
            }, 1000);
        }

        function submitStep() {
            clearInterval(timerInterval);
            if (!canvas || !ctx) return;   // キャンバス準備前の多重送信を防ぐ
            const lastStep = book.steps[book.steps.length - 1];
            // 画像保存（Canvasの内容をそのまま出力）
            const content = canvas.toDataURL('image/png');
            book.steps.push({ 
                type: lastStep.type === 'sketch' ? 'word_image' : 'sketch', 
                value: content, 
                author: players[currentPlayerIdx],
                originalIdx: book.steps.length
            });
            currentPlayerIdx++;
            if (currentPlayerIdx >= players.length) {
                document.querySelectorAll('.whiteboard-surface > div:not(#curtain)').forEach(d => d.classList.add('hidden'));
                document.getElementById('finish-screen').classList.remove('hidden');
            } else { showPassScreen(); }
        }

        /* ===== エンディング =====
           カーテンが閉じる → 問いかけ → カーテンが開く → 結果発表（タメ）
           → 「みんなのつながりを確認してみよう！」→ 最初から順に振り返り → 全記録 */
        function triggerReviewSequence() {
            ensureAudio();
            const curtain = document.getElementById('curtain');
            const msg = document.getElementById('curtain-message');
            const btn = document.querySelector('#finish-screen button');
            if (btn) btn.disabled = true;

            curtain.classList.add('curtain-closed');
            sfxCurtain(1);

            setTimeout(() => {
                msg.innerHTML = 'みんなのちからで<br>お題はつたわったかな？';
                msg.classList.add('show');
            }, 1000);

            setTimeout(() => { msg.classList.remove('show'); }, 3400);

            setTimeout(() => {
                prepareResultScreen();
                curtain.classList.remove('curtain-closed');
                sfxCurtain(-1);
            }, 4000);

            setTimeout(() => { runResultReveal(); }, 4900);
        }

        function prepareResultScreen() {
            document.querySelectorAll('.whiteboard-surface > div:not(#curtain)').forEach(d => d.classList.add('hidden'));
            const screen = document.getElementById('result-comparison-screen');
            screen.classList.remove('hidden');
            screen.querySelectorAll('.reveal-step').forEach(el => el.classList.remove('show'));

            const firstWordEl = document.getElementById('first-word-text');
            firstWordEl.innerHTML = wordHtml(book.steps[0].value);
            requestAnimationFrame(() => {
                fitSpanInBox(firstWordEl, document.getElementById('first-word-result'));
                refitAfterWordFont(book.steps[0].value);
            });

            const lastImageEl = document.getElementById('last-image-result');
            const lastStep = book.steps[book.steps.length - 1];
            if (lastStep.type === 'sketch' || lastStep.type === 'word_image') {
                lastImageEl.src = lastStep.value;
                lastImageEl.classList.remove('hidden');
            } else {
                lastImageEl.classList.add('hidden');
            }
        }

        function runResultReveal() {
            const show = (id, delay) => setTimeout(() => {
                const el = document.getElementById(id);
                if (el) el.classList.add('show');
            }, delay);
            const arrow = document.getElementById('result-arrow');

            show('result-title', 0);
            sfxPop();

            show('result-first', 700);
            setTimeout(sfxPop, 700);

            show('result-arrow', 1500);

            // ドラムロールでタメる
            setTimeout(() => { sfxDrumroll(1.7); arrow.classList.add('drumroll-shake'); }, 1900);

            setTimeout(() => {
                arrow.classList.remove('drumroll-shake');
                document.getElementById('result-last').classList.add('show');
                sfxFanfare();
            }, 3600);

            show('result-buttons', 4400);
        }

        function startReview() {
            ensureAudio();
            document.querySelectorAll('.whiteboard-surface > div:not(#curtain)').forEach(d => d.classList.add('hidden'));
            document.getElementById('reveal-screen').classList.remove('hidden');
            reviewSteps = [...book.steps]; // 最初のお題から順に進む
            const stage = document.getElementById('reveal-stage');
            stage.innerHTML = '';
            reviewSteps.forEach((step, i) => {
                const card = document.createElement('div');
                card.id = `reveal-card-${i}`;
                card.className = "reveal-card pos-hidden-right";
                let contentHtml = step.type === 'word' ? `<div class="word-box"><span class="word-text">${wordHtml(step.value)}</span></div>` : `<img src="${step.value}" alt="step">`;
                // プレイヤー名は入力値なので必ずエスケープする
                let label = step.author === "さいしょのおだい" ? 'START おだい' : `${step.originalIdx}人目：${escapeHtml(step.author)}`;
                card.innerHTML = `<div class="text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-tighter">${label}</div><div class="bg-gray-50 rounded-lg overflow-hidden border">${contentHtml}</div>`;
                stage.appendChild(card);
            });
            currentRevealIdx = 0;
            updateRevealDisplay();
            requestAnimationFrame(() => {
                fitAllWordBoxes(stage);
                refitAfterWordFont(book.steps[0].value);
            });
        }

        // カード内のお題を、それぞれの枠いっぱいの大きさに調整する
        function fitAllWordBoxes(root) {
            root.querySelectorAll('.word-box').forEach(box => {
                fitSpanInBox(box.querySelector('.word-text'), box);
            });
        }

        function updateRevealDisplay() {
            const total = reviewSteps.length;
            const titleEl = document.getElementById('reveal-title');
            const btn = document.getElementById('next-reveal-btn');
            const restartBtn = document.getElementById('reveal-restart-btn');
            const counter = document.getElementById('reveal-counter');

            reviewSteps.forEach((_, i) => {
                const card = document.getElementById(`reveal-card-${i}`);
                if (!card) return;
                if (currentRevealIdx === 0) {
                    card.className = (i === 0) ? "reveal-card pos-center-origin" : "reveal-card pos-hidden-right";
                } else if (i === currentRevealIdx) {
                    card.className = "reveal-card pos-center";
                } else if (i === currentRevealIdx - 1) {
                    card.className = "reveal-card pos-prev";
                } else if (i < currentRevealIdx - 1) {
                    card.className = "reveal-card pos-hidden-left";
                } else {
                    card.className = "reveal-card pos-hidden-right";
                }
            });

            const step = reviewSteps[currentRevealIdx];
            if (currentRevealIdx === 0) titleEl.innerText = "これが最初のお題！";
            else if (step.type === 'sketch') titleEl.innerText = `${step.author} が描いた絵は…`;
            else titleEl.innerText = `${step.author} の答えは…`;

            counter.innerText = `${currentRevealIdx + 1} / ${total}`;
            btn.innerText = (currentRevealIdx === total - 1) ? "全記録を見る" : "つぎへ →";
            restartBtn.classList.toggle('hidden', currentRevealIdx !== total - 1);
        }

        function handleRevealNext() {
            if (currentRevealIdx < reviewSteps.length - 1) {
                currentRevealIdx++;
                sfxFlip();
                updateRevealDisplay();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            document.getElementById('summary-screen').classList.remove('hidden');
            const list = document.getElementById('summary-list');
            list.innerHTML = '';
            book.steps.forEach((step, index) => {
                const item = document.createElement('div');
                item.className = "bg-white p-5 rounded-2xl border shadow-sm flex flex-col w-full max-w-sm fade-in-up";
                item.style.animationDelay = `${index * 0.1}s`;
                let contentHtml = step.type === 'word' ? `<div class="word-box bg-gray-50 rounded-xl border mt-2"><span class="word-text">${wordHtml(step.value)}</span></div>` : `<img src="${step.value}" class="w-full h-auto rounded-xl border bg-gray-50 mt-2">`;
                // プレイヤー名は入力値なので必ずエスケープする
                let label = step.author === "さいしょのおだい" ? 'おだい' : `${step.originalIdx}人目：${escapeHtml(step.author)}`;
                item.innerHTML = `<div class="text-xs font-black text-gray-500 mb-2 border-b pb-2 tracking-wider">${label}</div>${contentHtml}`;
                list.appendChild(item);
                if (index < book.steps.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = "flex justify-center py-2 fade-in-up";
                    arrow.innerHTML = `<div class="bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center text-gray-500 font-bold shadow-inner">↓</div>`;
                    list.appendChild(arrow);
                }
            });
            requestAnimationFrame(() => {
                fitAllWordBoxes(list);
                refitAfterWordFont(book.steps[0].value);
            });
        }

        function resetGame() {
            document.querySelectorAll('.whiteboard-surface > div:not(#curtain)').forEach(d => d.classList.add('hidden'));
            document.getElementById('setup-screen').classList.remove('hidden');
            fitSetupScreen();
            // 演出用の状態を初期化
            document.getElementById('curtain').classList.remove('curtain-closed');
            document.getElementById('curtain-message').classList.remove('show');
            const arrow = document.getElementById('result-arrow');
            if (arrow) arrow.classList.remove('drumroll-shake');
            customWordPending = false;
            document.getElementById('custom-word-input').value = '';
            const finishBtn = document.querySelector('#finish-screen button');
            if (finishBtn) finishBtn.disabled = false;
        }

        /* iOS Safari はツールバーの出し入れで表示領域が変わり、
           100vh/100dvh だけだと下が隠れることがあるので実測値をCSS変数に流し込む。
           キーボード表示中（名前入力中）は縮めない。 */
        function setAppHeight() {
            const el = document.activeElement;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
            const vv = window.visualViewport;
            const h = vv ? vv.height : window.innerHeight;
            if (h > 0) document.documentElement.style.setProperty('--app-h', `${Math.round(h)}px`);
        }

        function handleViewportChange(delay = 150) {
            setAppHeight();
            const inGame = !document.getElementById('game-screen').classList.contains('hidden');
            // 連続発火を抑えつつ、描いた内容を保持したままリサイズする。
            // 振り返り・結果発表・全記録の文字も枠に合わせて測り直す（枠だけ伸びて文字が取り残されるのを防ぐ）
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (inGame) adjustCanvasSize(true);
                refitVisibleWords();
                fitSetupScreen();
            }, delay);
        }

        setAppHeight();
        window.addEventListener('resize', () => handleViewportChange(150));
        window.addEventListener('orientationchange', () => setTimeout(() => handleViewportChange(250), 250));
        window.addEventListener('pageshow', () => setAppHeight());
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => handleViewportChange(150));
            window.visualViewport.addEventListener('scroll', () => setAppHeight());
        }
    </script>
