<!DOCTYPE html><html lang="ja"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入室 - ver.5.6</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        * { touch-action: manipulation; }
        :root { --app-h: 100vh; }
        body { background: #0047AB; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: var(--app-h); margin: 0; flex-direction: column; padding: 16px 16px 40px; box-sizing: border-box; }
        .box { background: rgba(255,255,255,0.2); padding: clamp(20px, 2.2vw, 36px); border-radius: 20px; box-sizing: border-box; width: min(100%, clamp(400px, 30vw, 560px)); text-align: center; border: 1px solid rgba(255,255,255,0.3); }
        .box h2 { font-size: clamp(22px, 1.9vw, 34px); }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; box-sizing: border-box; font-size: clamp(18px, 1.4vw, 24px); }
        #noSelector { background: #fff; color: #333; padding: 15px; border-radius: 10px; cursor: pointer; font-size: clamp(18px, 1.4vw, 24px); font-weight: bold; margin: 10px 0; }
        #noPanel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; padding: 20px; box-sizing: border-box; flex-direction: column; }
        .no-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; flex-grow: 1; margin: 20px 0; overflow-y: auto; }
        .no-btn { background: #444; color: white; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; min-height: 44px; }
        .btn-gold { background: #ffcc00; color: #333; width:100%; padding:20px; border:none; border-radius:10px; font-weight:bold; font-size:clamp(22px, 1.875vw, 32px); margin-top:15px; cursor:pointer; }
        .direct-input-area { background: #333; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
        
        /* 全ページ共通のフッターデザイン */
        .footer { position: fixed; bottom: 5px; width: 100%; text-align: center; font-size: 12px; color: rgba(255,255,255,0.4); border-top: 1px solid rgba(255,255,255,0.1); padding-top: 5px; }
    </style></head><body>
    <script>
        // iOS: ピンチ拡大の抑止・拡大されたままの自己修復・実際の画面の高さ
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
            document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
        });
        function resetZoomIfNeeded() {
            if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
            const meta = document.querySelector('meta[name="viewport"]');
            if (!meta) return;
            const original = meta.getAttribute('content');
            meta.setAttribute('content', original + ', maximum-scale=1.0');
            requestAnimationFrame(() => meta.setAttribute('content', original));
        }
        function setAppHeight() {
            const el = document.activeElement;
            if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
            const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            if (h > 0) document.documentElement.style.setProperty('--app-h', `${Math.round(h)}px`);
        }
        setAppHeight();
        ['resize', 'pageshow'].forEach(t => window.addEventListener(t, setAppHeight));
        window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 250));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => { setAppHeight(); resetZoomIfNeeded(); });
            window.visualViewport.addEventListener('scroll', resetZoomIfNeeded);
        }
        document.addEventListener('gestureend', () => setTimeout(resetZoomIfNeeded, 50), { passive: true });
    </script>
    <div class="box">
        <h2 style="margin-top:0">回答ボード 入室</h2>
        <input type="text" id="roomID" placeholder="部屋番号" inputmode="numeric" autocomplete="off">
        <div id="noSelector" onclick="openNoPanel()">出席番号をえらぶ (任意)</div>
        <input type="text" id="userName" placeholder="なまえ" autocomplete="off">
        <button id="enterBtn" class="btn-gold" onclick="enter()">入室する</button>
    </div>

    <div id="noPanel">
        <h3 style="text-align:center; margin:0;">番号をえらぶ、または入力</h3>
        <div class="no-grid">
            <script>for(let i=1;i<=40;i++) document.write(`<button class="no-btn" onclick="setNo(${i})">${i}</button>`);</script>
        </div>
        <div class="direct-input-area">
            <span>直接入力:</span>
            <input type="number" id="noInput" style="margin:0; width:100px; text-align:center;" placeholder="番号">
            <button onclick="setNo(document.getElementById('noInput').value)" style="padding:15px; border-radius:8px; background:#ffcc00; border:none; font-weight:bold;">決定</button>
        </div>
        <button style="margin-top:15px; padding:15px; background:#888; color:white; border:none; border-radius:8px;" onclick="closeNoPanel()">もどる</button>
    </div>

    <div class="footer">オンライン回答ボード | ver.5.6 | ota tools</div>

    <script>
        const config = { apiKey: "AIzaSyCQeNeHqy9VbtBv-hYHa7nantsoE6KLigw", authDomain: "ota-tools.firebaseapp.com", databaseURL: "https://ota-tools-default-rtdb.firebaseio.com", projectId: "ota-tools", appId: "1:671143719220:web:c89149c15de830e6d03561" };
        firebase.initializeApp(config); const db = firebase.database();
        let currentNo = "";

        window.onload = () => {
            const r = new URLSearchParams(window.location.search).get('r');
            if (r) document.getElementById('roomID').value = r;
            document.getElementById('userName').value = localStorage.getItem('quiz_name') || '';
            const savedNo = localStorage.getItem('quiz_no') || '';
            if(savedNo) setNo(savedNo);
        };

        function openNoPanel() { document.getElementById('noPanel').style.display = 'flex'; }
        function closeNoPanel() { document.getElementById('noPanel').style.display = 'none'; }
        
        function setNo(n) { 
            currentNo = n; 
            document.getElementById('noSelector').innerText = n ? "出席番号: " + n : "出席番号をえらぶ (任意)";
            closeNoPanel(); 
        }

        async function enter() {
            const btn = document.getElementById('enterBtn'); 
            const room = document.getElementById('roomID').value;
            const name = document.getElementById('userName').value;
            if(!room || !name) return alert('部屋番号となまえを入れてね');
            
            btn.disabled = true;
            localStorage.setItem('quiz_name', name); 
            localStorage.setItem('quiz_no', currentNo);
            
            const uid = btoa(encodeURIComponent(name + currentNo)).replace(/=/g, "");
            
            await db.ref(`rooms/${room}/users/${uid}`).update({ 
                name: name, 
                no: currentNo, 
                status: 'normal',
                image: "" 
            });
            
            sessionStorage.setItem('quiz_room', room); 
            sessionStorage.setItem('quiz_uid', uid);
            location.href = 'student.html';
        }
    </script></body></html>
