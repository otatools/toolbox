'use strict';
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
function setAppHeight(){var h=window.visualViewport?window.visualViewport.height:window.innerHeight;if(h>0)document.documentElement.style.setProperty('--app-h',Math.round(h)+'px');}
setAppHeight();['resize','pageshow'].forEach(function(t){window.addEventListener(t,setAppHeight);});
if(window.visualViewport)visualViewport.addEventListener('resize',setAppHeight);

// ---- よみとり（てがきの もじを まなんだ しくみ） ----
var M=TEGAKI_MODEL, CLS=Array.from(M.cls);
M.layers.forEach(function(L){var b=atob(L.w),a=new Int8Array(b.length);for(var i=0;i<b.length;i++)a[i]=(b.charCodeAt(i)<<24)>>24;L.W=a;});
var G=32,BOX=26;
function render(strokes){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;strokes.forEach(function(s){s.forEach(function(p){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];});});
  var w=x1-x0,h=y1-y0,m=Math.max(w,h,1e-3),s=BOX/m,ox=(G-w*s)/2,oy=(G-h*s)/2;
  var a=new Float32Array(G*G);
  function put(x,y){var X=Math.round((x-x0)*s+ox),Y=Math.round((y-y0)*s+oy);if(X<0)X=0;if(X>G-1)X=G-1;if(Y<0)Y=0;if(Y>G-1)Y=G-1;a[Y*G+X]=1;}
  strokes.forEach(function(st){put(st[0][0],st[0][1]);for(var j=1;j<st.length;j++){var p=st[j-1],q=st[j],L=Math.hypot(q[0]-p[0],q[1]-p[1])*s,n=Math.max(1,Math.ceil(L/0.3));for(var t=1;t<=n;t++)put(p[0]+(q[0]-p[0])*t/n,p[1]+(q[1]-p[1])*t/n);}});
  var d=new Float32Array(G*G),x,y,i,dx,dy,v;
  for(y=0;y<G;y++)for(x=0;x<G;x++){v=0;for(dy=-1;dy<=1;dy++)for(dx=-1;dx<=1;dx++){var X=x+dx,Y=y+dy;if(X>=0&&X<G&&Y>=0&&Y<G&&a[Y*G+X]>v)v=a[Y*G+X];}d[y*G+x]=v;}
  var b=new Float32Array(G*G),c=new Float32Array(G*G);
  for(y=0;y<G;y++)for(x=0;x<G;x++){i=y*G+x;b[i]=(2*d[i]+(x?d[i-1]:0)+(x<G-1?d[i+1]:0))/4;}
  for(y=0;y<G;y++)for(x=0;x<G;x++){i=y*G+x;c[i]=(2*b[i]+(y?b[i-G]:0)+(y<G-1?b[i+G]:0))/4;}
  return c;
}
function forward(x){
  var h=x;
  M.layers.forEach(function(L,li){var o=new Float32Array(L.n_out),W=L.W,s=L.s,ni=L.n_in,no=L.n_out,i,j;
    for(j=0;j<no;j++)o[j]=0;
    for(i=0;i<ni;i++){var v=h[i];if(!v)continue;var base=i*no;for(j=0;j<no;j++)o[j]+=v*W[base+j];}
    for(j=0;j<no;j++){o[j]=o[j]*s+L.b[j];if(li<M.layers.length-1&&o[j]<0)o[j]=0;}
    h=o;});
  var mx=-1e9,i;for(i=0;i<h.length;i++)if(h[i]>mx)mx=h[i];var sum=0,p=new Float32Array(h.length);for(i=0;i<h.length;i++){p[i]=Math.exp(h[i]-mx);sum+=p[i];}for(i=0;i<h.length;i++)p[i]/=sum;return p;
}

// ---- かくすう（ふつうの かきかた。/ は どちらでも よい） ----
var SC_H='あ3い2う2え2お3か3き4/3く1け3こ2さ3/2し1す2せ3そ1/2た4ち2つ1て1と2な4に3ぬ2ね2の1は3ひ1ふ4/3へ1ほ4ま3み2む3め2も3や3ゆ2よ2ら2り2/1る1れ2ろ1わ2を3/2ん1';
var SC_K='ア2イ2ウ3エ3オ3カ2キ3ク2ケ3コ2サ3シ3ス2セ2ソ2タ3チ3ツ3テ3ト2ナ2ニ2ヌ2ネ4ノ1ハ2ヒ2フ1ヘ1ホ4マ2ミ3ム2メ2モ3ヤ2ユ2ヨ3ラ2リ2ル2レ1ロ3ワ2ヲ3ン2';
var SC={'ー':[1]};
[SC_H,SC_K].forEach(function(src){var re=/(.)([0-9/]+)/g,m;while((m=re.exec(src)))SC[m[1]]=m[2].split('/').map(Number);});
(function(){var b='かきくけこさしすせそたちつてとはひふへほカキクケコサシスセソタチツテトハヒフヘホウ',d='がぎぐげござじずぜぞだぢづでどばびぶべぼガギグゲゴザジズゼゾダヂヅデドバビブベボヴ',h='はひふへほハヒフヘホ',p='ぱぴぷぺぽパピプペポ';
  for(var i=0;i<b.length;i++)SC[d[i]]=SC[b[i]].map(function(n){return n+2;});
  for(i=0;i<h.length;i++)SC[p[i]]=SC[h[i]].map(function(n){return n+1;});})();
function strokeFit(c,n){var a=SC[c];if(!a)return 1;var best=0.03;a.forEach(function(s){var d=n-s,f=d===0?1:d===-1?0.35:d===1?0.45:(d===-2||d===2)?0.12:0.03;if(f>best)best=f;});return best;}
window.__SC=SC;
function isKata(c){return c>='ァ'&&c<='ヺ';}
function isHira(c){return c>='ぁ'&&c<='ゖ';}
function twin(c){if(isHira(c))return String.fromCharCode(c.charCodeAt(0)+0x60);if(isKata(c)&&c!=='ヴ')return String.fromCharCode(c.charCodeAt(0)-0x60);return null;}
// mode: 'h' ひらがな, 'k' カタカナ, 'a' じどう（prev = ひとつ まえの もじ）
function recog(strokes,mode,prev){
  var p=forward(render(strokes)),list=[];
  var pk=(mode==='a'&&prev&&prev!=='ー')?isKata(prev):null;
  for(var i=0;i<CLS.length;i++){var c=CLS[i];if(mode==='h'&&isKata(c))continue;if(mode==='k'&&isHira(c))continue;var v=p[i]*strokeFit(c,strokes.length);if(pk!==null&&c!=='ー'&&isKata(c)!==pk)v*=0.4;list.push([c,v]);}
  list.sort(function(a,b){return b[1]-a[1];});
  if(mode==='a'&&list.length>1){
    // ひらがなと カタカナで かたちが にている とき（へ・ヘ など）は まえの もじに あわせる
    var top=list[0][0],tw=twin(top),ti=-1;
    for(var j=1;j<list.length;j++)if(list[j][0]===tw){ti=j;break;}
    var same='へべぺりヘベペリ'.indexOf(top)>=0;
    if(ti>0&&list[ti][1]>list[0][1]*(same?0.02:0.35)){
      var wantK=prev?isKata(prev):false;
      if(isKata(top)!==wantK&&!(prev==='ー')){var t=list[ti];list.splice(ti,1);list.unshift(t);}
    }
  }
  // てんてん・まるが あるかを ふでの かたちで しらべて きめる
  var top0=list[0][0],fam=famOf(top0);
  if(fam){var mk=marks(strokes),want=mk==='h'?(fam[2]||fam[1]):mk==='d'?fam[1]:fam[0];
    if(want&&want!==top0){var k=-1;for(var q=0;q<list.length;q++)if(list[q][0]===want)k=q;
      if(k<0){list.unshift([want,list[0][1]]);}else{var t2=list[k];list.splice(k,1);list.unshift(t2);}}}
  return list.slice(0,8).map(function(e){return e[0];});
}
function probOf(list,c){for(var i=0;i<list.length;i++)if(list[i][0]===c)return list[i][1];return 0;}
var FAMS=[];
(function(){var b='かきくけこさしすせそたちつてとはひふへほカキクケコサシスセソタチツテトハヒフヘホウ',d='がぎぐげござじずぜぞだぢづでどばびぶべぼガギグゲゴザジズゼゾダヂヅデドバビブベボヴ',h={'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ','ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ'};
  for(var i=0;i<b.length;i++)FAMS.push([b[i],d[i],h[b[i]]||'']);})();
function famOf(c){for(var i=0;i<FAMS.length;i++)if(FAMS[i].indexOf(c)>=0)return FAMS[i];return null;}
// みぎうえの ちいさな ふでを しらべる
function marks(strokes){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;strokes.forEach(function(s){s.forEach(function(p){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];});});
  var W=Math.max(x1-x0,y1-y0,1),small=[];
  strokes.forEach(function(s){var a=1e9,b=1e9,c=-1e9,d=-1e9,len=0;s.forEach(function(p,j){if(p[0]<a)a=p[0];if(p[0]>c)c=p[0];if(p[1]<b)b=p[1];if(p[1]>d)d=p[1];if(j)len+=Math.hypot(p[0]-s[j-1][0],p[1]-s[j-1][1]);});
    var sz=Math.max(c-a,d-b),cx=(a+c)/2,cy=(b+d)/2;
    if(sz<W*0.32&&cx>x0+(x1-x0)*0.55&&cy<y0+(y1-y0)*0.5){var e=Math.hypot(s[0][0]-s[s.length-1][0],s[0][1]-s[s.length-1][1]);small.push({loop:len>sz*2.2&&e<sz*0.6});}});
  if(small.some(function(o){return o.loop;}))return 'h';
  if(small.length>=2)return 'd';
  return null;
}
window.__recog=recog;window.__render=render;window.__forward=forward;window.__CLS=CLS;

// ---- もじの へんかん ----
var DK={},HD={},SM={};
function pairs(a,b,o){for(var i=0;i<a.length;i++){o[a[i]]=b[i];o[b[i]]=a[i];}}
pairs('かきくけこさしすせそたちつてとはひふへほ','がぎぐげござじずぜぞだぢづでどばびぶべぼ',DK);
pairs('カキクケコサシスセソタチツテトハヒフヘホウ','ガギグゲゴザジズゼゾダヂヅデドバビブベボヴ',DK);
pairs('はひふへほ','ぱぴぷぺぽ',HD);pairs('ハヒフヘホ','パピプペポ',HD);
pairs('あいうえおつやゆよわ','ぁぃぅぇぉっゃゅょゎ',SM);pairs('アイウエオツヤユヨワカケ','ァィゥェォッャュョヮヵヶ',SM);
function toBase(c){if('がぎぐげござじずぜぞだぢづでどばびぶべぼガギグゲゴザジズゼゾダヂヅデドバビブベボヴ'.indexOf(c)>=0)return DK[c];if('ぱぴぷぺぽパピプペポ'.indexOf(c)>=0)return HD[c];return c;}

// ---- じょうたい ----
var mode='a', text=[], sel=-1;
var outEl=document.getElementById('out'), candEl=document.getElementById('cands'), infoEl=document.getElementById('info');
function render2(){
  if(!text.length){outEl.innerHTML='<span class="ph">したの わくに 1もじずつ かいてね</span>';}
  else outEl.innerHTML=text.map(function(t,i){return '<span class="c'+(i===sel?' sel':'')+'" data-i="'+i+'">'+t.c+'</span>';}).join('');
  if(sel>=0&&text[sel]){
    var cs=text[sel].cands.filter(function(c){return c!==text[sel].c;}).slice(0,4);
    candEl.innerHTML=cs.length?cs.map(function(c){return '<button data-c="'+c+'">'+c+'</button>';}).join(''):'<span class="hint">ほかの こうほは ないよ</span>';
  } else candEl.innerHTML='<span class="hint">ちがう ときは もじを おしてね</span>';
}
outEl.addEventListener('click',function(e){var s=e.target.closest('.c');if(!s)return;var i=+s.dataset.i;sel=(sel===i?-1:i);render2();});
candEl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||sel<0)return;text[sel].c=b.dataset.c;sel=-1;render2();});
function target(){return sel>=0?sel:text.length-1;}
function conv(map){var i=target();if(i<0)return;var c=text[i].c;
  if(map===SM){if(SM[c])text[i].c=SM[c];}
  else{var b=toBase(c);var n=map[b];if(n&&c!==n)text[i].c=n;else text[i].c=b;}
  render2();}
document.getElementById('bDaku').onclick=function(){flushAll();conv(DK);};
document.getElementById('bHan').onclick=function(){flushAll();conv(HD);};
document.getElementById('bSmall').onclick=function(){flushAll();conv(SM);};
document.getElementById('bBar').onclick=function(){flushAll();text.push({c:'ー',cands:[]});sel=-1;render2();};
document.getElementById('bBack').onclick=function(){
  var p=pads[cur];if(p.strokes.length){p.strokes.pop();p.redraw();return;}
  if(sel>=0){text.splice(sel,1);sel=-1;}else text.pop();render2();};
document.getElementById('bClear').onclick=function(){pads.forEach(function(p){p.clear();});text=[];sel=-1;render2();};
function setMode(m){flushAll();mode=m;['a','h','k'].forEach(function(x){document.getElementById('m_'+x).classList.toggle('on',x===m);});}
['a','h','k'].forEach(function(x){document.getElementById('m_'+x).onclick=function(){setMode(x);};});

// ---- かく わく ----
var IDLE_MS=1000, timer=null, cur=0;
function Pad(id,cvId){
  var self=this;this.el=document.getElementById(id);this.cv=document.getElementById(cvId);this.ctx=this.cv.getContext('2d');this.strokes=[];this.line=null;
  this.size=function(){var r=self.cv.getBoundingClientRect();var w=Math.round(r.width);if(w&&self.cv.width!==w*2){self.cv.width=w*2;self.cv.height=w*2;self.redraw();}};
  this.redraw=function(){var c=self.ctx,W=self.cv.width;c.clearRect(0,0,W,W);c.lineCap='round';c.lineJoin='round';c.strokeStyle='#3b2f22';c.lineWidth=W*0.035;
    var k=W/256;self.strokes.forEach(function(s){c.beginPath();s.forEach(function(p,j){if(j)c.lineTo(p[0]*k,p[1]*k);else c.moveTo(p[0]*k,p[1]*k);});if(s.length===1)c.lineTo(s[0][0]*k+0.1,s[0][1]*k);c.stroke();});};
  this.clear=function(){self.strokes=[];self.redraw();};
  function pt(e){var r=self.cv.getBoundingClientRect();return [(e.clientX-r.left)*256/r.width,(e.clientY-r.top)*256/r.height];}
  this.cv.addEventListener('pointerdown',function(e){e.preventDefault();down(self);try{self.cv.setPointerCapture(e.pointerId);}catch(_){}
    self.line=[pt(e)];self.strokes.push(self.line);self.redraw();});
  this.cv.addEventListener('pointermove',function(e){if(!self.line)return;e.preventDefault();var p=pt(e),q=self.line[self.line.length-1];
    if(Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])>1.5){self.line.push(p);self.redraw();}});
  function up(){if(!self.line)return;self.line=null;clearTimeout(timer);timer=setTimeout(function(){commit(self);},IDLE_MS);}
  this.cv.addEventListener('pointerup',up);this.cv.addEventListener('pointercancel',up);
  this.cv.ontouchstart=function(e){e.preventDefault();};this.cv.ontouchmove=function(e){e.preventDefault();};
}
var pads=[new Pad('padA','cvA'),new Pad('padB','cvB')];
function setCur(i){cur=i;pads.forEach(function(p,j){p.el.classList.toggle('on',j===i);});}
function down(p){clearTimeout(timer);var i=pads.indexOf(p);
  if(i!==cur){if(pads[cur].strokes.length)commit(pads[cur]);setCur(i);}
  if(sel>=0){sel=-1;render2();}}
function commit(p){
  if(!p.strokes.length)return;clearTimeout(timer);
  var prev=text.length?text[text.length-1].c:null;
  var t0=performance.now(),cs=recog(p.strokes,mode,prev),ms=Math.round(performance.now()-t0);
  p.clear();
  infoEl.textContent='こうほ: '+cs.slice(0,5).join(' ')+'　('+ms+'ms)';
  text.push({c:cs[0],cands:cs.slice(0,6)});sel=-1;render2();
  var i=pads.indexOf(p);if(i===cur)setCur(1-i);
}
function flushAll(){pads.forEach(function(p){if(p.strokes.length)commit(p);});}
window.__commitTest=function(strokes,m,prev){return recog(strokes,m||mode,prev||null);};
function sizeAll(){pads.forEach(function(p){p.size();});}
sizeAll();window.addEventListener('resize',sizeAll);window.addEventListener('load',sizeAll);
render2();
})();
</script>
</body>
</html>
