<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ことばこうじょう ？ になったことば（集計）</title>
<style>
  body{font-family:'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;margin:0;background:#f5f1ea;color:#2b2118}
  main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:4px 0 14px;color:#6b5a48;font-size:14px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
  button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;background:#f3d6a6;color:#6b4a1e;box-shadow:0 4px 0 #c99a5b;cursor:pointer;touch-action:manipulation}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #c99a5b}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;font-size:17px}
  th{background:#8a99a9;color:#fff;font-size:14px}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  #msg{color:#a33a3a}
  th.s{cursor:pointer;user-select:none;white-space:nowrap}
  th.s i{font-style:normal;margin-left:4px;opacity:.9}
  th.c,td.c{width:44px;text-align:center;padding:10px 6px}
  input[type=checkbox]{width:24px;height:24px;cursor:pointer}
  tr.sel{background:#fff6dd !important}
  button.del{background:#ffd6d6;color:#a33a3a;box-shadow:0 4px 0 #e39494}
  button.del:disabled{opacity:.4;cursor:default}
  tbody tr{cursor:pointer}
  .flt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .flt button{background:#fff;color:#5a4426;box-shadow:0 3px 0 #ddcbb0;border:2px solid #eadcc6;padding:9px 14px;font-size:15px}
  .flt button.on{background:#ffe3a3;border-color:#e9b54a;box-shadow:0 3px 0 #d9a93f}
  .flt small{font-weight:400;color:#8a7558;margin-left:4px}
</style>
</head>
<body>
<main>
  <h1>？になったことば</h1>
  <p>この一覧は、ひらいた時点か「さいしんにする」をおした時点のものです（けしたり じょがいにしても、じどうでは あたらしくなりません）。子どもたちが入れて、イラストにできなかったことばの回数です。回数の多いものから、辞書に足していくと効果的です。</p>
  <div class="bar"><button id="reload">さいしんにする</button><button id="csv">CSVでほぞん（Excel用）</button><button id="exclBtn" disabled>じょがいに いれる</button><button id="restoreBtn" disabled hidden>ぜんぶの ほうへ もどす</button><button id="del" class="del" disabled>えらんだものを けす</button></div>
  <div class="flt" id="flt"><button data-f="all" class="on">ぜんぶ<small id="fc_all"></small></button><button data-f="guess">「〇〇？」がでた<small id="fc_guess"></small></button><button data-f="none">？だけ<small id="fc_none"></small></button><button data-f="blocked">使えないことば<small id="fc_blocked"></small></button><button data-f="excl">じょがい（てきとうな入力）<small id="fc_excl"></small></button><button data-f="reg">辞書にあるので かくしていたことば<small id="fc_reg"></small></button></div>
  <div id="msg"></div>
  <table><thead><tr><th class="c"><input type="checkbox" id="all" aria-label="ぜんぶ えらぶ"></th><th class="s" data-s="word">ことば<i></i></th><th class="s" data-s="count" style="text-align:right">回数<i></i></th><th class="s" data-s="last">さいご<i></i></th></tr></thead><tbody id="body"></tbody></table>
  <p id="total"></p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getDatabase, ref, get, remove, update } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
const cfg = { apiKey: "AIzaSyBjnWqAcunbf_TBPraMHZRmI1bPjTnFhQU", authDomain: "typing-48f95.firebaseapp.com", databaseURL: "https://typing-48f95-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "typing-48f95", storageBucket: "typing-48f95.firebasestorage.app", messagingSenderId: "1045024853093", appId: "1:1045024853093:web:3484649a3b1544bb51ca8c" };
const app = initializeApp(cfg, 'stats'), auth = getAuth(app), db = getDatabase(app);
let rows = [], filt = 'all', sortKey = 'count', sortDir = -1;
let LOCAL = {}; try { LOCAL = JSON.parse(localStorage.getItem('kotoba.excl') || '{}') || {}; } catch (e) {}
function looksRandom(w, kf) {
  if (w.length >= 5 && new Set(w.split('')).size <= 2) return true;
  if (w.length < 8 || !kf) return false;
  const cov = new Array(w.length).fill(false);
  for (let i = 0; i < w.length; i++) for (let j = i + 3; j <= w.length && j <= i + 12; j++) { if (kf(w.slice(i, j))) for (let k = i; k < j; k++) cov[k] = true; }
  return cov.filter(Boolean).length / w.length < 0.5;
}
// いまの辞書（index.html）に のっている ことばは ひょうじしない：index.html を かくして よみこみ、__known で しらべる
const known = new Promise(res => {
  try {
    const f = document.createElement('iframe'); f.style.display = 'none'; f.src = 'index.html';
    f.onload = () => { let n = 0; const t = setInterval(() => { try { if (f.contentWindow.__known) { clearInterval(t); res(f.contentWindow.__known); } } catch (e) {} if (++n > 100) { clearInterval(t); res(null); } }, 100); };
    document.body.appendChild(f);
  } catch (e) { res(null); }
  setTimeout(() => res(null), 20000);
});
const pass = r => filt === 'excl' ? r.excl : filt === 'reg' ? (r.reg && !r.excl) : !r.excl && !r.reg && (filt === 'all' || (filt === 'guess' ? !!r.guess && !r.blocked : filt === 'none' ? !r.guess && !r.blocked : r.blocked));
const fmt = d => d ? d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') : '';
async function load() {
  const msg = document.getElementById('msg'); msg.textContent = '';
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    const snap = await get(ref(db, 'kotoba_unknown'));
    const v = snap.val() || {};
    rows = Object.keys(v).map(k => ({ key: k, word: v[k].word || k, count: v[k].count || 0, last: v[k].last ? new Date(v[k].last) : null, blocked: !!v[k].blocked, guess: v[k].guess || '', hit: v[k].hit || '', exclv: v[k].excl }));
    const kf = await known;
    rows.forEach(r => {
      r.reg = !!kf && !r.blocked && !!kf(r.word);
      const ov = r.exclv !== undefined ? r.exclv : LOCAL[r.key];
      r.excl = ov !== undefined ? !!ov : (!r.blocked && !r.reg && !r.guess && looksRandom(r.word, kf));
    });
    rows.sort((a, b) => b.count - a.count || (b.last||0) - (a.last||0));
    render();
  } catch (e) { msg.textContent = 'よみこめませんでした：' + e.message; }
}
function render() {
    ['all','guess','none','blocked','excl','reg'].forEach(f => { const o = filt; filt = f; document.getElementById('fc_' + f).textContent = rows.filter(pass).length; filt = o; });
    document.querySelectorAll('#flt button').forEach(b => b.classList.toggle('on', b.dataset.f === filt));
    const cmp = (x, y) => { const a = x[0], b = y[0]; let d = sortKey === 'word' ? a.word.localeCompare(b.word, 'ja') : sortKey === 'last' ? (a.last || 0) - (b.last || 0) : a.count - b.count; if (!d) d = sortKey === 'count' ? (b.last || 0) - (a.last || 0) : a.word.localeCompare(b.word, 'ja'); return d * sortDir; };
    const shown = rows.map((r, i) => [r, i]).filter(x => pass(x[0])).sort(cmp);
    document.querySelectorAll('th.s').forEach(h => { h.querySelector('i').textContent = h.dataset.s === sortKey ? (sortDir > 0 ? '▲' : '▼') : ''; });
    document.getElementById('body').innerHTML = shown.map(([r, i]) => '<tr data-i="' + i + '"' + (r.blocked ? ' style="background:#fff0f0"' : '') + '><td class="c"><input type="checkbox" class="chk" data-i="' + i + '"></td><td>' + r.word.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + (r.blocked ? ' <small style="color:#a33a3a">【使えないことば' + (r.hit ? '：「' + r.hit.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '」にひっかかった' : '') + '】</small>' : '') + (r.guess ? ' <small style="color:#2f6f9f">→ 「' + r.guess.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '？」と表示</small>' : '') + '</td><td class="n">' + r.count + '</td><td>' + fmt(r.last) + '</td></tr>').join('');
    document.getElementById('all').checked = false; updSel();
    document.getElementById('restoreBtn').hidden = filt !== 'excl'; document.getElementById('exclBtn').hidden = filt === 'excl';
    const hid = rows.filter(r => r.reg && !r.excl).length;
    const sr = shown.map(x => x[0]);
    document.getElementById('total').textContent = sr.length + 'しゅるい／ごうけい ' + sr.reduce((s, r) => s + r.count, 0) + '回' + (hid ? '（辞書にあるので ひょうじしていない ことば：' + hid + 'しゅるい。「ぜんぶ えらぶ」で けすと、これも いっしょに きえます）' : '');
}
document.querySelector('thead').addEventListener('click', e => { const h = e.target.closest('th.s'); if (!h) return; const k = h.dataset.s; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'word' ? 1 : -1; } render(); });
document.getElementById('flt').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filt = b.dataset.f; render(); });
const chks = () => Array.from(document.querySelectorAll('.chk'));
function updSel() {
  const n = chks().filter(c => c.checked).length;
  const b = document.getElementById('del'); b.disabled = n === 0; b.textContent = n ? 'えらんだ ' + n + '件を けす' : 'えらんだものを けす';
  document.getElementById('exclBtn').disabled = n === 0; document.getElementById('restoreBtn').disabled = n === 0;
  chks().forEach(c => c.closest('tr').classList.toggle('sel', c.checked));
  const all = document.getElementById('all'); all.checked = n > 0 && n === chks().length;
}
document.getElementById('body').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const c = tr.querySelector('.chk'); if (e.target !== c) c.checked = !c.checked;
  updSel();
});
document.getElementById('all').onclick = e => { chks().forEach(c => c.checked = e.target.checked); updSel(); };
document.getElementById('del').onclick = async () => {
  const sel = chks().filter(c => c.checked).map(c => rows[+c.dataset.i]);
  if (!sel.length) return;
  // 「ぜんぶ えらぶ」（ぜんぶ ひょうじ）で けすときは、辞書にあって ひょうじしていない ことばも いっしょに けす
  const extra = (document.getElementById('all').checked && filt === 'all') ? rows.filter(r => r.reg && !r.excl) : [];
  const all = sel.concat(extra);
  if (!confirm(sel.length + '件' + (extra.length ? 'と、辞書にあって ひょうじしていない ' + extra.length + '件' : '') + 'を けしますか？（もとには もどせません）')) return;
  const msg = document.getElementById('msg'); msg.textContent = '';
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    await Promise.all(all.map(r => remove(ref(db, 'kotoba_unknown/' + r.key))));
    // さいしんには せず、いま ひょうじしている 一覧から けすだけ（「さいしんにする」を おしたときだけ あたらしくなる）
    const gone = new Set(all); rows = rows.filter(r => !gone.has(r));
  } catch (e) { msg.textContent = 'けせませんでした：' + e.message; }
  render();
};
async function setExcl(val) {
  const sel = chks().filter(c => c.checked).map(c => rows[+c.dataset.i]);
  if (!sel.length) return;
  const msg = document.getElementById('msg'); msg.textContent = '';
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    const u = {}; sel.forEach(r => { u[r.key + '/excl'] = val; });
    await update(ref(db, 'kotoba_unknown'), u);
    sel.forEach(r => { r.excl = val; r.exclv = val; });
  } catch (e) {
    sel.forEach(r => { LOCAL[r.key] = val; r.excl = val; });
    try { localStorage.setItem('kotoba.excl', JSON.stringify(LOCAL)); } catch (e2) {}
    msg.textContent = 'サーバーに かきこめなかったので、このブラウザだけに きおくしました：' + e.message;
    render(); return;
  }
  render();
}
document.getElementById('exclBtn').onclick = () => setExcl(true);
document.getElementById('restoreBtn').onclick = () => setExcl(false);
document.getElementById('reload').onclick = load;
document.getElementById('csv').onclick = () => {
  const csv = '﻿ことば,回数,最後に入力された日時,種類,表示した「？」\r\n' + rows.filter(pass).sort((a, b) => { let d = sortKey === 'word' ? a.word.localeCompare(b.word, 'ja') : sortKey === 'last' ? (a.last || 0) - (b.last || 0) : a.count - b.count; return d * sortDir; }).map(r => r.word + ',' + r.count + ',' + fmt(r.last) + ',' + (r.blocked ? '使えないことば（' + r.hit + '）' : r.excl ? 'じょがい' : '辞書にない') + ',' + (r.guess ? r.guess + '？' : '')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'はてなになったことば.csv'; a.click();
};
load();
</script>
</body>
</html>
