<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ことばこうじょう ？・× になったことば（集計）</title>
<style>
  body{font-family:'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;margin:0;background:#f5f1ea;color:#2b2118}

  .flt small{font-weight:400;color:#8a7558;margin-left:3px}
</style>
</head>
<body>
<main>
  <h1>？・×になったことば</h1>
  <div class="bar"><button id="reload">最新にする</button><button id="csv">CSVでほぞん（Excel用）</button><button id="xlsx">Excelでほぞん（種類ごとのシート）</button><button id="exclBtn" disabled>除外に入れる</button><button id="restoreBtn" disabled hidden>選んだものを全部に入れる</button><button id="del" class="del" disabled>選んだものを消す</button></div>
  <div class="flt" id="flt"><button data-f="all" class="on">全部<small id="fc_all"></small></button><button data-f="guess" title="「〇〇？」と表示した言葉">「〇〇？」<small id="fc_guess"></small></button><button data-f="none" title="？だけ表示した言葉">？だけ<small id="fc_none"></small></button><button data-f="blocked" title="使えないことば">使えない<small id="fc_blocked"></small></button><button data-f="x" title="×になった言葉（キャラクター・ゲーム・まんが・人名など）">×になった<small id="fc_x"></small></button><button data-f="junk" title="存在しない言葉（でたらめ入力）">ぐちゃぐちゃ<small id="fc_junk"></small></button><button data-f="excl" title="除外リスト（消えない・CSVに入らない）">除外<small id="fc_excl"></small></button><button data-f="qty" title="数量のことば（よにん・はちびき・いっこ・いちおくえん…）">数量<small id="fc_qty"></small></button><button data-f="reg" title="辞書にあるので隠していた言葉">辞書にある<small id="fc_reg"></small></button></div>
  <div class="flt" id="sub" hidden><button data-s="all" class="on">除外の全部<small id="sc_all"></small></button><button data-s="guess">「〇〇？」<small id="sc_guess"></small></button><button data-s="none">？だけ<small id="sc_none"></small></button><button data-s="x">×<small id="sc_x"></small></button><button data-s="blocked">使えない<small id="sc_blocked"></small></button></div>
  <div id="exclAdd" hidden style="margin:8px 0;padding:10px;background:#f4f7ff;border-radius:8px"><div style="font-size:.9em;margin-bottom:4px">ここに ことばを いれると、まとめて 除外リストに くわえます（いくつでも：改行か「、」「,」でくぎる）。こどもが また いれても 除外リストに はいります。</div><textarea id="exclTxt" rows="3" style="width:100%;box-sizing:border-box;font-size:16px"></textarea><button id="exclAddBtn" style="margin-top:6px">除外リストに くわえる</button></div>
  <div id="msg"></div>
  <table><thead><tr><th class="c"><input type="checkbox" id="all" aria-label="ぜんぶ えらぶ"></th><th class="s" data-s="word">ことば<i></i></th><th class="s" data-s="count" style="text-align:right">回数<i></i></th><th class="s" data-s="last">さいご<i></i></th></tr></thead><tbody id="body"></tbody></table>
  <p id="total"></p>
</main>
<script src="kanadict.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getDatabase, ref, get, remove, update } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
const cfg = { apiKey: "AIzaSyBjnWqAcunbf_TBPraMHZRmI1bPjTnFhQU", authDomain: "typing-48f95.firebaseapp.com", databaseURL: "https://typing-48f95-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "typing-48f95", storageBucket: "typing-48f95.firebasestorage.app", messagingSenderId: "1045024853093", appId: "1:1045024853093:web:3484649a3b1544bb51ca8c" };
const app = initializeApp(cfg, 'stats'), auth = getAuth(app), db = getDatabase(app);
const XK = { char: 'キャラクター', game: 'ゲームの名前', gameword: 'ゲームの中の言葉', anime: 'まんが・アニメ', fiction: '架空のもの', person: '人名・グループ名', notword: '言葉ではない' };
let rows = [], filt = 'all', sub = 'all', sortKey = 'count', sortDir = -1;
// 除外の なかの しゅるい
const ekind = r => r.blocked ? 'blocked' : r.x ? 'x' : r.guess ? 'guess' : 'none';
let LOCALB = {}; try { LOCALB = JSON.parse(localStorage.getItem('kotoba.unblk') || '{}') || {}; } catch (e) {}
let LOCALJ = {}; try { LOCALJ = JSON.parse(localStorage.getItem('kotoba.junk') || '{}') || {}; } catch (e) {}
let LOCAL = {}; try { LOCAL = JSON.parse(localStorage.getItem('kotoba.excl') || '{}') || {}; } catch (e) {}
function looksRandom(w, kf) {
  if (w.length >= 5 && new Set(w.split('')).size <= 2) return true;
  if (w.length < 8 || !kf) return false;
  const cov = new Array(w.length).fill(false);
  for (let i = 0; i < w.length; i++) for (let j = i + 3; j <= w.length && j <= i + 12; j++) { if (kf(w.slice(i, j))) for (let k = i; k < j; k++) cov[k] = true; }
  return cov.filter(Boolean).length / w.length < 0.5;
}

// ===== 「ぜったいに そんざいしない ことば（ぐちゃぐちゃに うった もの）」の はんてい =====
// 辞書（kanadict.js）の たんごを つなげて つくれない、かつ 4もじ いじょう（または ありえない かな ならび）だけを 「ない」と する。うたがわしい ものは ふくめない。
const JK = (() => {
  const P = new Set('のはがをにでともへやかねよ'.split(''));
  const A = new Set((window.KANA_A || '').split(' ').filter(Boolean)), D = new Set(A);
  (window.KANA_N || '').split(' ').filter(Boolean).forEach(w => D.add(w));
  const ENDS = new Set(['た','て','ない','なかった','なくて','ます','ました','ません','ましょう','たい','たく','たかった','ている','てる','ていた','てた','ちゃう','ちゃった','れる','られる','せる','させる','れた','ば','れば','よう','ろ','ず','ぬ','く','くて','かった','くない','さ','み','そう','すぎる','ながら','たり','って','んで','いで','いた','った','んだ','いだ','し']);
  const SUF = new Set(['だ','です','でした','じゃ','だった','だよ','ね','よ','さん','ちゃん','くん','たち','ら','など','みたい','な','に','で','の','と','も','は','が','を','へ','や','から','まで','より','って','だけ','しか','ほど','こそ']);
  const STEM = new Set(); A.forEach(d => { if (d.length >= 3 && 'るうくぐすつぬぶむい'.indexOf(d[d.length - 1]) >= 0) STEM.add(d.slice(0, -1)); });
  const pieceOk = (s, first) => {
    if (s.length === 1) return P.has(s) && !first;
    if (D.has(s)) return true;
    for (let k = 2; k <= s.length; k++) if (STEM.has(s.slice(0, k)) && ENDS.has(s.slice(k))) return true;
    for (let k = 2; k < s.length; k++) if (D.has(s.slice(0, k)) && SUF.has(s.slice(k))) return true;
    if (s.length >= 3 && 'っんりと'.indexOf(s[s.length - 1]) >= 0 && D.has(s.slice(0, -1))) return true;
    return false;
  };
  const part = (w, kf) => {
    const n = w.length;
    if (n >= 4 && n % 2 === 0 && w.slice(0, n / 2).repeat(2) === w && new Set(w.slice(0, n / 2)).size >= 2) return true;
    if (n >= 6 && n % 3 === 0 && w.slice(0, n / 3).repeat(3) === w && new Set(w.slice(0, n / 3)).size >= 2) return true;
    const ok = new Array(n + 1).fill(false); ok[0] = true;
    for (let i = 0; i < n; i++) { if (!ok[i]) continue;
      for (let j = i + 1; j <= Math.min(n, i + 16); j++) if (!ok[j] && (pieceOk(w.slice(i, j), i === 0) || (kf && j - i >= 2 && kf(w.slice(i, j))))) ok[j] = true; }
    return ok[n];
  };
  const anomaly = w => /^[っんーぁぃぅぇぉゃゅょゎ]/.test(w) || [...w].some((c, i) => 'ゃゅょ'.indexOf(c) >= 0 && (i === 0 || 'きしちにひみりぎじぢびぴいゐ'.indexOf(w[i - 1]) < 0)) || /っ[あいうえおなにぬねのまみむめもやゆよらりるれろわをんっー]/.test(w) || /(.)\1\1/.test(w);
  return (w, kf) => {
    if (!window.KANA_A || !/^[ぁ-ゖー]+$/.test(w)) return false;
    if (kf && kf(w)) return false;
    if (D.has(w)) return false;
    if (/(.)\1\1/.test(w)) return true;
    if (part(w, kf)) return false;
    if (/.[ーぁぃぅぇぉ]/.test(w) && !/(.)\1\1/.test(w)) return false;
    return w.length >= 4 ? true : anomaly(w);
  };
})();
// いまの辞書（index.html）に のっている ことばは ひょうじしない：index.html を かくして よみこみ、__known で しらべる
let LOCALQ = {}; try { LOCALQ = JSON.parse(localStorage.getItem('kotoba.qty') || '{}') || {}; } catch (e) {}
let QTYF = null, CURV = '', JUDGE = null;
const known = new Promise(res => {
  try {
    const f = document.createElement('iframe'); f.style.display = 'none'; f.src = 'index.html';
    f.onload = () => { let n = 0; const t = setInterval(() => { try { if (f.contentWindow.__known) { clearInterval(t); QTYF = f.contentWindow.__isQty || null; JUDGE = f.contentWindow.__judge || null; CURV = f.contentWindow.__IMGV || ''; res(f.contentWindow.__known); } } catch (e) {} if (++n > 100) { clearInterval(t); res(null); } }, 100); };
    document.body.appendChild(f);
  } catch (e) { res(null); }
  setTimeout(() => res(null), 20000);
});
const pass = r => filt === 'excl' ? (r.excl && (sub === 'all' || ekind(r) === sub)) : filt === 'x' ? (!!r.x && !r.excl) : r.x ? false : filt === 'junk' ? (r.junk && !r.excl) : filt === 'reg' ? (r.reg && !r.excl) : filt === 'qty' ? (r.qty && !r.excl) : !r.excl && !r.reg && !r.junk && !r.qty && (filt === 'all' || (filt === 'guess' ? !!r.guess && !r.blocked : filt === 'none' ? !r.guess && !r.blocked : r.blocked));
const fmt = d => d ? d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') : '';
// いまの アプリで うったら どう でるかで「〇〇？」を さいしんに する（おもいので すこしずつ うしろで しらべる）
let GTOKEN = 0;
function refreshGuess() {
  if (!JUDGE) return;
  const tok = ++GTOKEN, list = rows.filter(r => !r.blocked && !r.junk && !r.reg);
  let i = 0; const msg = document.getElementById('msg');
  const step = () => {
    if (tok !== GTOKEN) return;
    const end = Math.min(list.length, i + 15);
    for (; i < end; i++) {
      const r = list[i]; let j = null; try { j = JUDGE(r.word); } catch (e) {}
      if (!j || !j.t) continue;
      if (j.t === 'guess') r.guess = j.g;
      else if (j.t === 'q') r.guess = '';
      else if (j.t === 'x' && !r.x) r.x = /ゲームの なまえ/.test(j.msg) ? 'game' : /ゲームの なか/.test(j.msg) ? 'gameword' : /まんが/.test(j.msg) ? 'anime' : /じんぶつ/.test(j.msg) ? 'person' : /ことばじゃない|すうじ/.test(j.msg) ? 'notword' : 'char';
    }
    if (i < list.length) { msg.style.color = '#7a6a55'; msg.textContent = '「〇〇？」を さいしんに しています… ' + i + ' / ' + list.length; setTimeout(step, 0); }
    else { msg.textContent = ''; msg.style.color = ''; render(); }
  };
  setTimeout(step, 0);
}
async function load() {
  const msg = document.getElementById('msg'); msg.textContent = '';
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    const snap = await get(ref(db, 'kotoba_unknown'));
    const v = snap.val() || {};
    rows = Object.keys(v).map(k => ({ key: k, word: v[k].word || k, count: v[k].count || 0, last: v[k].last ? new Date(v[k].last) : null, blocked: !!v[k].blocked && !(v[k].unblk !== undefined ? v[k].unblk : LOCALB[k]), wasBlocked: !!v[k].blocked, guess: v[k].guess || '', hit: v[k].hit || '', exclv: v[k].excl, junkv: v[k].junk, qtyv: v[k].qty, notqty: !!v[k].notqty, imgfail: !!v[k].imgfail, ver: v[k].v || '', x: v[k].x || '' }));
    const kf = await known;
    rows.forEach(r => {
      const notq = r.notqty || LOCALQ[r.key] === false;
      r.qty = !r.blocked && !r.x && !notq && (r.qtyv === true || (!!QTYF && !!QTYF(r.word)));
      r.reg = !!kf && !r.blocked && !r.x && !r.qty && !!kf(r.word);
      const ov = r.exclv !== undefined ? r.exclv : LOCAL[r.key];
      r.excl = ov !== undefined ? !!ov : false;
      const jv = r.junkv !== undefined ? r.junkv : LOCALJ[r.key];
      r.junk = jv !== undefined ? !!jv : (!r.excl && !r.blocked && !r.x && !r.reg && !r.qty && !r.guess && (looksRandom(r.word, kf) || JK(r.word, kf)));
    });
    rows.sort((a, b) => b.count - a.count || (b.last||0) - (a.last||0));
    render();
    refreshGuess();
  } catch (e) { msg.textContent = 'よみこめませんでした：' + e.message; }
}
function render() {
    ['all','guess','none','blocked','x','junk','excl','reg','qty'].forEach(f => { const o = filt; filt = f; document.getElementById('fc_' + f).textContent = rows.filter(pass).length; filt = o; });
    document.querySelectorAll('#flt button').forEach(b => b.classList.toggle('on', b.dataset.f === filt));
    document.getElementById('sub').hidden = filt !== 'excl';
    ['all','guess','none','x','blocked'].forEach(s => { document.getElementById('sc_' + s).textContent = rows.filter(r => r.excl && (s === 'all' || ekind(r) === s)).length; });
    document.querySelectorAll('#sub button').forEach(b => b.classList.toggle('on', b.dataset.s === sub));
    const cmp = (x, y) => { const a = x[0], b = y[0]; let d = sortKey === 'word' ? a.word.localeCompare(b.word, 'ja') : sortKey === 'last' ? (a.last || 0) - (b.last || 0) : a.count - b.count; if (!d) d = sortKey === 'count' ? (b.last || 0) - (a.last || 0) : a.word.localeCompare(b.word, 'ja'); return d * sortDir; };
    const shown = rows.map((r, i) => [r, i]).filter(x => pass(x[0])).sort(cmp);
    document.querySelectorAll('th.s').forEach(h => { h.querySelector('i').textContent = h.dataset.s === sortKey ? (sortDir > 0 ? '▲' : '▼') : ''; });
    document.getElementById('body').innerHTML = shown.map(([r, i]) => '<tr data-i="' + i + '"' + (r.blocked ? ' style="background:#fff0f0"' : '') + '><td class="c"><input type="checkbox" class="chk" data-i="' + i + '"></td><td>' + r.word.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + (r.blocked ? ' <small style="color:#a33a3a">【使えないことば' + (r.hit ? '：「' + r.hit.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '」にひっかかった' : '') + '】</small>' : '') + (r.reg ? ' <small style="color:#7a5a12">【' + (r.imgfail ? '絵の よみこみに しっぱい（つうしんが おそい など）' : (r.ver && CURV && r.ver < CURV) ? 'ふるい版のアプリで 入力' : r.ver ? 'いまの版で 入力（しらべてください）' : '登録まえ／ふるい版で 入力') + '】</small>' : '') + (r.x ? ' <small style="color:#6a4fa3">【×：' + (XK[r.x] || r.x) + '】</small>' : '') + (r.guess ? ' <small style="color:#2f6f9f">→ 「' + r.guess.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '？」と表示</small>' : '') + '</td><td class="n">' + r.count + '</td><td>' + fmt(r.last) + '</td></tr>').join('');
    document.getElementById('all').checked = false; updSel();
    document.getElementById('restoreBtn').hidden = filt !== 'excl' && filt !== 'junk' && filt !== 'blocked' && filt !== 'qty'; document.getElementById('exclBtn').hidden = filt === 'excl';
    document.getElementById('del').hidden = filt === 'excl'; document.getElementById('csv').disabled = filt === 'excl' || filt === 'junk'; document.getElementById('exclAdd').hidden = filt !== 'excl';
    const hid = rows.filter(r => r.reg && !r.excl).length;
    const sr = shown.map(x => x[0]);
    document.getElementById('total').textContent = sr.length + 'しゅるい／ごうけい ' + sr.reduce((s, r) => s + r.count, 0) + '回' + (hid ? '（辞書にあるので ひょうじしていない ことば：' + hid + 'しゅるい。「ぜんぶ えらぶ」で けすと、これも いっしょに きえます）' : '');
}
document.querySelector('thead').addEventListener('click', e => { const h = e.target.closest('th.s'); if (!h) return; const k = h.dataset.s; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'word' ? 1 : -1; } render(); });
document.getElementById('flt').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filt = b.dataset.f; if (filt !== 'excl') sub = 'all'; render(); });
document.getElementById('sub').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; sub = b.dataset.s; render(); });
const chks = () => Array.from(document.querySelectorAll('.chk'));
function updSel() {
  const n = chks().filter(c => c.checked).length;
  const b = document.getElementById('del'); b.disabled = n === 0; b.textContent = n ? '選んだ ' + n + '件を消す' : '選んだものを消す';
  document.getElementById('exclBtn').disabled = n === 0; document.getElementById('restoreBtn').disabled = n === 0;
  chks().forEach(c => c.closest('tr').classList.toggle('sel', c.checked));
  const all = document.getElementById('all'); all.checked = n > 0 && n === chks().length;
}
document.getElementById('body').addEventListener('click', e => {
  const tr = e.target.closest('tr'); if (!tr) return;
  const c = tr.querySelector('.chk'); if (e.target !== c) c.checked = !c.checked;
  updSel();
});
document.getElementById('all').onclick = e => { chks().forEach(c => c.checked = e.target.checked); updSel(); };
document.getElementById('del').onclick = async () => {
  const sel = chks().filter(c => c.checked).map(c => rows[+c.dataset.i]);
  if (!sel.length) return;
  // 「ぜんぶ えらぶ」（ぜんぶ ひょうじ）で けすときは、辞書にあって ひょうじしていない ことばも いっしょに けす
  const extra = (document.getElementById('all').checked && filt === 'all') ? rows.filter(r => r.reg && !r.excl) : [];
  const all = sel.concat(extra);
  if (!confirm(sel.length + '件' + (extra.length ? 'と、辞書にあって ひょうじしていない ' + extra.length + '件' : '') + 'を けしますか？（もとには もどせません）')) return;
  const msg = document.getElementById('msg'); msg.textContent = '';
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    await Promise.all(all.map(r => remove(ref(db, 'kotoba_unknown/' + r.key))));
    // さいしんには せず、いま ひょうじしている 一覧から けすだけ（「最新にする」を おしたときだけ あたらしくなる）
    const gone = new Set(all); rows = rows.filter(r => !gone.has(r));
  } catch (e) { msg.textContent = 'けせませんでした：' + e.message; }
  render();
};
async function setExcl(val) {
  const sel = chks().filter(c => c.checked).map(c => rows[+c.dataset.i]);
  if (!sel.length) return;
  const msg = document.getElementById('msg'); msg.textContent = '';
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    const u = {}; sel.forEach(r => { u[r.key + '/excl'] = val; });
    await update(ref(db, 'kotoba_unknown'), u);
    sel.forEach(r => { r.excl = val; r.exclv = val; });
  } catch (e) {
    sel.forEach(r => { LOCAL[r.key] = val; r.excl = val; });
    try { localStorage.setItem('kotoba.excl', JSON.stringify(LOCAL)); } catch (e2) {}
    msg.textContent = 'サーバーに かきこめなかったので、このブラウザだけに きおくしました：' + e.message;
    render(); return;
  }
  render();
}
async function setJunk(val) {
  const sel = chks().filter(c => c.checked).map(c => rows[+c.dataset.i]);
  if (!sel.length) return;
  const msg = document.getElementById('msg'); msg.textContent = '';
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    const u = {}; sel.forEach(r => { u[r.key + '/junk'] = val; });
    await update(ref(db, 'kotoba_unknown'), u);
    sel.forEach(r => { r.junk = val; r.junkv = val; });
  } catch (e) {
    sel.forEach(r => { LOCALJ[r.key] = val; r.junk = val; });

    msg.textContent = 'サーバーに かきこめなかったので、このブラウザだけに きおくしました：' + e.message;
  }
  render();
}

document.getElementById('restoreBtn').onclick = () => filt === 'blocked' ? unBlock() : filt === 'junk' ? setJunk(false) : filt === 'qty' ? unQty() : setExcl(false);

document.getElementById('exclAddBtn').onclick = async () => {
  const ws = Array.from(new Set(document.getElementById('exclTxt').value.split(/[\n\r,、，\t]+/).map(w => w.replace(/[.$#\[\]\/\s]/g, '')).filter(w => w && w.length <= 20)));
  if (!ws.length) return;
  const msg = document.getElementById('msg'); msg.textContent = '';
  const u = {}, byKey = {}; rows.forEach(r => { byKey[r.key] = r; });
  ws.forEach(w => { u[w + '/excl'] = true; if (!byKey[w]) { u[w + '/word'] = w; u[w + '/count'] = 0; } });
  let ok = true;
  try { if (!auth.currentUser) await signInAnonymously(auth); await update(ref(db, 'kotoba_unknown'), u); }
  catch (e) { ok = false; msg.textContent = 'サーバーに かきこめなかったので、このブラウザだけに きおくしました：' + e.message; }
  ws.forEach(w => {
    if (byKey[w]) { byKey[w].excl = true; byKey[w].exclv = ok ? true : byKey[w].exclv; }
    else rows.push({ key: w, word: w, count: 0, last: null, blocked: false, guess: '', hit: '', exclv: ok ? true : undefined, excl: true, reg: false });
    if (!ok) { LOCAL[w] = true; try { localStorage.setItem('kotoba.excl', JSON.stringify(LOCAL)); } catch (e2) {} }
  });
  document.getElementById('exclTxt').value = '';
  if (ok) msg.textContent = ws.length + 'こ 除外リストに くわえました';
  render();
};
document.getElementById('reload').onclick = load;
document.getElementById('csv').onclick = () => {
  const csv = '﻿ことば,回数,最後に入力された日時,種類,表示した「？」\r\n' + rows.filter(pass).sort((a, b) => { let d = sortKey === 'word' ? a.word.localeCompare(b.word, 'ja') : sortKey === 'last' ? (a.last || 0) - (b.last || 0) : a.count - b.count; return d * sortDir; }).map(r => r.word + ',' + r.count + ',' + fmt(r.last) + ',' + (r.blocked ? '使えないことば（' + r.hit + '）' : r.x ? '×：' + (XK[r.x] || r.x) : r.excl ? 'じょがい' : '辞書にない') + ',' + (r.guess ? r.guess + '？' : '')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'はてなになったことば.csv'; a.click();
};
// Excel：しゅるいごとに シートを わける（除外も 〇〇？／？だけ／×／使えない に わける）
document.getElementById('xlsx').onclick = async () => {
  const msg = document.getElementById('msg');
  if (!window.XLSX) {
    msg.textContent = 'Excelの じゅんびを しています…';
    await new Promise((ok, ng) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = ng; document.head.appendChild(s); }).catch(() => {});
    if (!window.XLSX) { msg.textContent = 'Excelの じゅんびが できませんでした（ネットを たしかめてください）'; return; }
    msg.textContent = '';
  }
  const kind = r => r.blocked ? '使えないことば' + (r.hit ? '（' + r.hit + '）' : '') : r.x ? '×：' + (XK[r.x] || r.x) : r.guess ? '「' + r.guess + '？」' : '？だけ';
  const sheet = list => [['ことば', '回数', '最後に入力された日時', '種類', '表示した「？」']].concat(list.slice().sort((a, b) => b.count - a.count || a.word.localeCompare(b.word, 'ja')).map(r => [r.word, r.count, fmt(r.last), kind(r), r.guess ? r.guess + '？' : '']));
  const ne = r => !r.excl, by = f => { const o = filt; filt = f; const l = rows.filter(pass); filt = o; return l; };
  const S = [
    ['「〇〇？」', by('guess')], ['？だけ', by('none')], ['使えない', by('blocked')], ['×になった', by('x')],
    ['ぐちゃぐちゃ', by('junk')], ['数量', by('qty')],
    ['除外_「〇〇？」', rows.filter(r => r.excl && ekind(r) === 'guess')], ['除外_？だけ', rows.filter(r => r.excl && ekind(r) === 'none')],
    ['除外_×', rows.filter(r => r.excl && ekind(r) === 'x')], ['除外_使えない', rows.filter(r => r.excl && ekind(r) === 'blocked')]
  ];
  const wb = XLSX.utils.book_new();
  S.forEach(([name, list]) => { const ws = XLSX.utils.aoa_to_sheet(sheet(list)); ws['!cols'] = [{ wch: 24 }, { wch: 6 }, { wch: 18 }, { wch: 26 }, { wch: 20 }]; XLSX.utils.book_append_sheet(wb, ws, name); });
  const d = new Date(), ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  XLSX.writeFile(wb, 'ことばこうじょう集計_' + ymd + '.xlsx');
};
