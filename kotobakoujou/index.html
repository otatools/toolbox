    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ことばこうじょう｜ことばが イラストに かわる！</title>
    <meta name="description" content="50音表でことばを入力して「できた！」を押すと、文字がもにゃもにゃ動いてイラストに変身し、コレクションできるひらがなアプリ。幼稚園・小学生向け。">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.iconify.design" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
    * {
        touch-action: manipulation;
        -webkit-touch-callout: none;
        box-sizing: border-box;
    }
    [hidden] { display: none !important; }

    :root { --app-h: 100vh; --ch-fs: 60px; }
    @supports (height: 100dvh) { :root { --app-h: 100dvh; } }

    html { background: #fff; height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
        margin: 0;
        height: var(--app-h);
        overflow: hidden;
        overscroll-behavior: none;
        position: relative;
        background: #fff;
        font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif;
        color: #3a2a1a;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    .sr-only {
        position: absolute; width: 1px; height: 1px; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* ===== 全体：固定デザインを丸ごと拡大縮小 ===== */
    #app {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(1);
        transform-origin: center center;
        display: grid;
        opacity: 0;
    }
    #app.is-ready { opacity: 1; transition: opacity .25s ease-out; }

    #app.is-landscape {
        width: 1200px; height: 844px;
        padding: 18px; column-gap: 16px; row-gap: 18px;
        grid-template-columns: 170px 98px 1fr 134px 134px;
        grid-template-rows: 118px 118px 1fr;
        grid-template-areas:
            "done done disp clear coll"
            "done done disp back  coll"
            "ext  grid grid grid  grid";
    }
    #app.is-portrait {
        width: 760px; height: 1200px;
        padding: 16px; column-gap: 12px; row-gap: 16px;
        grid-template-columns: 120px 1fr 1fr 1fr;
        grid-template-rows: 97px 97px 96px 1fr;
        grid-template-areas:
            "disp disp disp  clear"
            "disp disp disp  back"
            "done done done  coll"
            "ext  grid grid  grid";
    }

    /* ===== ボタン共通 ===== */
    button {
        -webkit-appearance: none; appearance: none;
        border: 0; padding: 0; margin: 0;
        font: inherit; color: inherit; background: none;
        cursor: pointer; position: relative; line-height: 0;
    }
    .key {
        display: block;
        width: 100%; height: 100%;
        border-radius: 18px;
        background: var(--bg);
        box-shadow: 0 6px 0 var(--sh);
        transform: translateY(0);
        transition: transform .05s, box-shadow .05s;
    }
    .key.pressed {
        transform: translateY(5px);
        box-shadow: 0 1px 0 var(--sh);
        filter: brightness(.96);
    }
    .key .inner {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        line-height: 1; white-space: nowrap;
        pointer-events: none;
    }
    .key .inner > * + * { margin-top: 6px; }
    .key.disabled { opacity: .4; }

    /* ===== 入力表示 ===== */
    /* 機械の外わく（鉄の板・ボルト・しましま） */
    #display {
        grid-area: disp;
        position: relative; z-index: 4;
        background: linear-gradient(#8a99a9, #6b7987);
        border-radius: 26px;
        padding: 34px 14px 28px;
        box-shadow: 0 6px 0 #4a5663, inset 0 2px 0 rgba(255,255,255,.35);
    }
    #display::after {
        content: ""; position: absolute; left: 16px; right: 16px; bottom: 7px; height: 14px;
        border-radius: 7px;
        background: repeating-linear-gradient(-45deg, #ffcf3a 0 12px, #3a3a3a 12px 24px);
    }
    #screen {
        position: relative; width: 100%; height: 100%;
        background: #fffdf5;
        border-radius: 16px;
        box-shadow: inset 0 0 0 4px #4f5b68, inset 0 8px 0 rgba(0,0,0,.08);
        overflow: hidden;
    }
    .plate {
        position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
        height: 24px; line-height: 24px; padding: 0 18px; border-radius: 12px;
        background: #4f5b68; color: #fff; font-size: 18px; letter-spacing: .25em; white-space: nowrap;
    }
    .bolt {
        position: absolute; top: 12px; width: 13px; height: 13px; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #eef2f6, #8f9ca9 70%);
        box-shadow: 0 1px 0 rgba(0,0,0,.35);
    }
    .bolt.b1 { left: 52px; } .bolt.b2 { right: 52px; }
    .gear { position: absolute; color: #aab6c2; pointer-events: none; }
    .gear svg { display: block; width: 100%; height: 100%; }
    #display .gear.g1 { left: -20px; top: -22px; width: 66px; height: 66px; }
    #display .gear.g2 { right: -16px; top: -16px; width: 50px; height: 50px; color: #c3ccd5; }
    .working .gear.g1 { animation: spin 1s linear infinite; }
    .working .gear.g2 { animation: spin .7s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lamp {
        position: absolute; top: 9px; width: 18px; height: 18px; border-radius: 50%;
        background: #c9d2db; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15);
    }
    .lamp.l1 { left: 22px; } .lamp.l2 { right: 22px; }
    .working .lamp { animation: lamp .3s steps(1) infinite; }
    .working .lamp.l2 { animation-delay: .15s; }
    @keyframes lamp { 0% { background: #ffb020; } 50% { background: #ff5a3c; } }
    #textWrap {
        position: absolute; top: 0; bottom: 0; left: 22px; right: 22px;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    #textWrap.overflow {
        justify-content: flex-end;
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 70px);
        mask-image: linear-gradient(90deg, transparent 0, #000 70px);
    }
    #text {
        flex-shrink: 0;
        display: flex; align-items: center;
        white-space: nowrap;
        font-family: 'Klee One', 'Hiragino Mincho ProN', serif;
        font-weight: 600; line-height: 1;
        color: #2b2118;
    }
    #text .c { display: inline-block; }

    #hint {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 36px; color: #cbb69c; letter-spacing: .04em;
        pointer-events: none;
    }

    /* ===== けすボタン ===== */
    #blockMsg {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 6;
        display: flex; align-items: center; justify-content: center; text-align: center;
        background: #fffaf0; border-radius: 12px; color: #a33a3a; font-size: 44px; font-weight: 700; line-height: 1.3;
    }
    #blockMsg[hidden] { display: none; }
    #btnClear { grid-area: clear; --bg: #ffd6d6; --sh: #e39494; }
    #btnBack  { grid-area: back;  --bg: #d6e8ff; --sh: #88ade3; }
    #btnClear .inner, #btnBack .inner { font-size: 22px; }
    #btnClear .inner { color: #a33a3a; }
    #btnBack .inner { color: #2d5a9c; }
    #btnClear svg, #btnBack svg { width: 44px; height: 44px; }
    .is-portrait #btnClear .inner, .is-portrait #btnBack .inner { flex-direction: row; font-size: 24px; }
    .is-portrait #btnClear .inner > * + *, .is-portrait #btnBack .inner > * + * { margin-top: 0; margin-left: 8px; }
    .is-portrait #btnClear svg, .is-portrait #btnBack svg { width: 36px; height: 36px; }

    /* ===== できた！ボタン（赤いスイッチ） ===== */
    #btnDone {
        grid-area: done; border-radius: 26px; --sh: #3f4a55;
        background:
            repeating-linear-gradient(-45deg, #ffcf3a 0 12px, #3a3a3a 12px 24px) left top / 100% 16px no-repeat,
            repeating-linear-gradient(-45deg, #ffcf3a 0 12px, #3a3a3a 12px 24px) left bottom / 100% 16px no-repeat,
            linear-gradient(#7d8b99, #5f6c79);
    }
    #btnDone .knob {
        display: flex; align-items: center; justify-content: center;
        width: 112px; height: 112px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffb3a8 0, #ff5241 40%, #cf281b 100%);
        box-shadow: 0 7px 0 #8a1a12, 0 0 0 6px #3f4a55;
        transition: transform .05s, box-shadow .05s;
    }
    #btnDone.pressed .knob { transform: translateY(5px); box-shadow: 0 2px 0 #8a1a12, 0 0 0 6px #3f4a55; }
    #btnDone .knob svg { width: 56px; height: 56px; color: #fff; }
    #btnDone .lbl {
        margin-top: 16px; font-size: 36px; color: #fff;
        text-shadow: 0 3px 0 rgba(0, 0, 0, .35);
    }
    .is-portrait #btnDone .inner { flex-direction: row; }
    .is-portrait #btnDone .knob { width: 62px; height: 62px; box-shadow: 0 5px 0 #8a1a12, 0 0 0 4px #3f4a55; }
    .is-portrait #btnDone .knob svg { width: 32px; height: 32px; }
    .is-portrait #btnDone .lbl { margin: 0 0 0 18px; font-size: 40px; }
    #btnDone.disabled { opacity: .55; }

    /* ===== コレクション ボタン（だんボール箱） ===== */
    #btnColl { grid-area: coll; --bg: #f3d6a6; --sh: #c99a5b; }
    #btnColl .inner { color: #6b4a1e; font-size: 20px; }
    #btnColl .inner > * + * { margin-top: 10px; }
    #btnColl svg { width: 74px; height: 74px; }
    .is-portrait #btnColl .inner { font-size: 18px; }
    .is-portrait #btnColl .inner > * + * { margin-top: 4px; }
    .is-portrait #btnColl svg { width: 44px; height: 44px; }
    .card .more { position: absolute; right: 8px; bottom: 44px; background: #ff8a3d; color: #fff; font-size: 20px; font-weight: bold; line-height: 1; padding: 5px 9px; border-radius: 14px; box-shadow: 0 2px 0 #c4621f; pointer-events: none; }
    #collBadge {
        position: absolute; top: -12px; right: -10px; z-index: 2;
        min-width: 48px; height: 48px; padding: 0 10px; border-radius: 24px;
        background: #ff5a4e; color: #fff; font-size: 24px; line-height: 48px; text-align: center;
        box-shadow: 0 3px 0 #b8322a;
    }

    /* ===== てんてん・まる など ===== */
    #extras {
        grid-area: ext;
        display: flex; flex-direction: column;
        padding-bottom: 6px;
    }
    #extras .key { width: 100%; height: auto; flex: 1 1 0; min-height: 0; --bg: #ece3ff; --sh: #b5a2e0; }
    #extras .key + .key { margin-top: 14px; }
    #extras .g {
        font-family: 'Klee One', serif; font-weight: 600;
        font-size: 50px; color: #4a3485;
    }
    #extras .cap { font-size: 20px; color: #6a55a8; }
    .is-portrait #extras .cap { font-size: 17px; }
    #extras .mk { width: 50px; height: 50px; color: #4a3485; }

    /* ===== 50音表 ===== */
    #grid {
        grid-area: grid;
        display: grid;
        column-gap: 8px; row-gap: 12px;
    }
    .is-landscape #grid {
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(5, 1fr);
    }
    .is-portrait #grid {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(5, 1fr) 14px repeat(5, 1fr);
        row-gap: 10px;
    }
    #grid .key { border-radius: 16px; }
    #grid .ch {
        font-family: 'Klee One', 'Hiragino Mincho ProN', serif;
        font-weight: 600;
        font-size: var(--ch-fs);
        color: #33251a;
        margin-top: -0.06em;
    }

    /* ===== 変身の結果（ベルトコンベア） ===== */
    #result {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0;
        background: #fff;
        z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .scene { position: relative; width: 100%; height: 470px; flex: 0 0 auto; }
    .is-portrait .scene { height: 600px; }
    .belt {
        position: absolute; left: 150px; right: 30px; bottom: 14px; height: 46px; border-radius: 23px;
        background: repeating-linear-gradient(90deg, #5e6873 0 26px, #78838f 26px 52px);
        box-shadow: inset 0 4px 0 rgba(255,255,255,.18), 0 6px 0 #3e464f;
    }
    .is-portrait .belt { left: 90px; right: 10px; }
    .machine {
        position: absolute; left: 24px; bottom: 14px; width: 220px; height: 290px;
        border-radius: 26px 26px 14px 14px;
        transform-origin: 50% 100%;
        z-index: 2;   /* イラストは きかいの うしろから でてくる */
        background: linear-gradient(#8a99a9, #6b7987);
        box-shadow: 0 6px 0 #4a5663, inset 0 2px 0 rgba(255,255,255,.35);
    }
    .machine::after {
        content: ""; position: absolute; left: 14px; right: 14px; bottom: 10px; height: 14px; border-radius: 7px;
        background: repeating-linear-gradient(-45deg, #ffcf3a 0 12px, #3a3a3a 12px 24px);
    }
    .machine .win {
        position: absolute; left: 50%; top: 52px; width: 104px; height: 104px; margin-left: -52px; border-radius: 50%;
        background: #fffdf5; box-shadow: inset 0 0 0 8px #4f5b68;
    }
    .machine .mouth {
        position: absolute; right: 0; bottom: 46px; width: 54px; height: 104px;
        border-radius: 14px 0 0 14px; background: #2e353d;
    }
    .machine .gear.g1 { left: -22px; top: -26px; width: 72px; height: 72px; }
    .machine .gear.g2 { right: 30px; top: -18px; width: 46px; height: 46px; color: #c3ccd5; }
    .machine .lamp.l1 { left: 50%; margin-left: -9px; top: 18px; }
    .chimney {
        position: absolute; left: 46px; bottom: 100%; margin-bottom: -2px; width: 44px; height: 72px;
        border-radius: 6px 6px 0 0; background: linear-gradient(90deg, #5f6c79, #7d8b99);
        z-index: 2;
    }
    .is-portrait .machine { left: 6px; width: 150px; height: 220px; }
    .is-portrait .machine .win { width: 76px; height: 76px; margin-left: -38px; top: 44px; }
    .is-portrait .machine .mouth { width: 40px; height: 84px; }
    .is-portrait .chimney { left: 34px; height: 58px; }
    #stage {
        position: absolute; left: 50%; bottom: 60px;
        width: 420px; height: 420px; margin-left: -210px;
        transform-origin: 50% 100%;
        z-index: 1;
        mix-blend-mode: multiply;   /* jpgの しろい はいけいを すかす（ベルトが かくれない） */
    }
    .is-portrait #stage { width: 440px; height: 440px; margin-left: -160px; }
    #pic {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        display: block;
        object-fit: contain;
    }
    #picText {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        font-size: 300px; line-height: 1;
        font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    }
    .puff {
        position: absolute; z-index: 3; width: 44px; height: 44px; margin: -22px 0 0 -22px;
        border-radius: 50%; color: #e8edf2; background: currentColor; pointer-events: none;
        box-shadow: -26px 10px 0 -5px currentColor, 25px 9px 0 -7px currentColor, -4px -17px 0 -3px currentColor, 10px 14px 0 -2px currentColor;
        filter: drop-shadow(0 4px 0 rgba(100, 116, 134, .5));
    }
    .spark {
        position: absolute; z-index: 3; width: 34px; height: 34px; margin: -17px 0 0 -17px;
        pointer-events: none;
    }
    #word {
        margin-top: 6px;
        font-family: 'Klee One', 'Hiragino Mincho ProN', serif;
        font-weight: 600; font-size: 92px; line-height: 1.1;
        color: #2b2118; white-space: nowrap;
    }
    #msg { margin-top: 8px; font-size: 32px; color: #8a7560; line-height: 1.3; }
    #msg.ok { color: #2f8a49; }
    #msg:empty { display: none; }
    #resultBtns { display: flex; margin-top: 26px; }
    #resultBtns .key { width: 340px; height: 100px; flex: 0 0 auto; }
    #resultBtns .key + .key { margin-left: 22px; }
    #resultBtns .inner { flex-direction: row; font-size: 36px; }
    #resultBtns .inner > * + * { margin-top: 0; margin-left: 10px; }
    #btnNext { --bg: #c9f0cf; --sh: #78c487; }
    #btnNext .inner { color: #22693a; }
    #btnFix  { --bg: #d6e8ff; --sh: #88ade3; }
    #btnFix .inner { color: #2d5a9c; }
    /* 縦向きはボタンを縦に並べる */
    .is-portrait #resultBtns { flex-direction: column; align-items: center; }
    .is-portrait #resultBtns .key { width: 440px; height: 96px; }
    .is-portrait #resultBtns .key + .key { margin-left: 0; margin-top: 18px; }
    .is-portrait #btnMaybe { width: 440px !important; padding: 0; }
    .is-portrait #btnMaybe .inner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: auto; }
    #btnMaybe { --bg: #fff1c2; --sh: #e2bf55; width: auto !important; padding: 0 30px; }
    #btnMaybe .inner { position: static; transform: none; height: 100%; color: #7a5a12; }

    /* ===== コレクション ===== */
    #coll {
        position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 12;
        background: #fff; display: flex; flex-direction: column; padding: 18px;
    }
    .collHead { display: flex; align-items: center; flex: 0 0 92px; }
    .collHead .key { flex: 0 0 auto; height: 84px; }
    #btnCollBack { width: 180px; --bg: #d6e8ff; --sh: #88ade3; }
    #btnCollBack .inner { flex-direction: row; font-size: 30px; color: #2d5a9c; }
    #btnCollBack .inner > * + * { margin: 0 0 0 8px; }
    #btnEdit { width: 260px; --bg: #ffe3a3; --sh: #d9a93f; }
    #btnEdit .inner { font-size: 26px; color: #7a5a12; }
    .collTitle { flex: 1 1 0; text-align: center; font-size: 44px; color: #5a4426; line-height: 1.1; white-space: nowrap; }
    .collTitle small { font-size: 28px; color: #9a8566; margin-left: 8px; }
    .is-portrait .collTitle { font-size: 36px; }
    .is-portrait .collTitle small { display: block; margin: 4px 0 0; font-size: 24px; }
    .is-portrait #btnCollBack { width: 150px; }
    .is-portrait #btnEdit { width: 220px; }
    .is-portrait #btnEdit .inner { font-size: 22px; }
    .collTools { display: flex; justify-content: center; flex: 0 0 auto; margin-top: 14px; }
    .collTools .key { width: 230px; height: 70px; flex: 0 0 auto; }
    .collTools .key + .key { margin-left: 16px; }
    .collTools .inner { font-size: 24px; }
    #btnSortAiu, #btnSortNew { --bg: #e4ecf6; --sh: #a9b9cc; }
    #btnSortAiu .inner, #btnSortNew .inner { color: #36536f; }
    #btnClearAll { --bg: #ffd6d6; --sh: #e39494; }
    #btnClearAll .inner { color: #a33a3a; }
    .is-portrait .collTools .key { width: 220px; }
    .is-portrait .collTools .inner { font-size: 22px; }
    #collTabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 10px; margin-top: 14px; }
    #collTabs:empty { display: none; }
    #collTabs button {
        font: inherit; font-size: 24px; color: #5a4426; background: #fff; border: 4px solid #eadcc6; border-radius: 30px;
        padding: 6px 16px; cursor: pointer; box-shadow: 0 4px 0 #ddcbb0; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    #collTabs button small { font-size: 18px; color: #a08c6c; margin-left: 6px; }
    #collTabs button.on { background: #ffe3a3; border-color: #e9b54a; box-shadow: 0 4px 0 #d9a93f; }
    .is-portrait #collTabs button { font-size: 22px; padding: 5px 13px; }
    #collList {
        flex: 1 1 0; min-height: 0; margin-top: 14px;
        overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y;
        display: grid; grid-template-columns: repeat(5, 1fr); grid-gap: 22px 18px;
        align-content: start; padding: 14px 10px 40px;
    }
    .is-portrait #collList { grid-template-columns: repeat(3, 1fr); }
    .card {
        position: relative; display: flex; flex-direction: column; align-items: center;
        padding: 14px 8px 12px; border-radius: 22px;
        background: #fff; border: 4px solid #eadcc6; box-shadow: 0 5px 0 #ddcbb0;
        cursor: pointer;
    }
    #coll.editing .card { border-color: #ffd27a; box-shadow: 0 5px 0 #e9b54a; }
    .card .pic { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .card .pic img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .card .w {

            } catch (e) { stage.style.bottom = '34px'; }
        };
        im.onerror = function () { stage.style.bottom = '34px'; };
        if (/^https?:/.test(src)) im.crossOrigin = 'anonymous';
        im.src = src;
    }

    function fitWord() {
        var maxW = (isPortrait ? 700 : app.offsetWidth - 80);
        var fs = isPortrait ? 84 : 92;
        wordEl.style.fontSize = fs + 'px';
        var w = wordEl.scrollWidth;
        if (w > maxW) wordEl.style.fontSize = Math.floor(fs * maxW / w) + 'px';
    }

    function closeResult(clearText) {
        if (Date.now() < resultReadyAt) return;
        cancelTimers();
        result.hidden = true;
        pic.removeAttribute('src');
        Array.prototype.slice.call(scene.querySelectorAll('.puff,.spark')).forEach(function (e) { e.remove(); });
        scene.classList.remove('working');
        display.classList.remove('working');
        busy = false;
        if (clearText) chars = [];
        render(false);
    }

    /* ---------- コレクション（この端末に保存） ---------- */
    var COLL_KEY = 'kotobakoujou.collection.v1';
    var coll = [];
    try {
        var saved = JSON.parse(localStorage.getItem(COLL_KEY) || '[]');
        if (Array.isArray(saved)) coll = saved.filter(function (x) { return x && typeof x.w === 'string'; });
    } catch (e) { coll = []; }
    coll.forEach(function (it) { if (!Array.isArray(it.ws) || !it.ws.length) it.ws = [it.w]; });
    function saveColl() { try { localStorage.setItem(COLL_KEY, JSON.stringify(coll)); } catch (e) {} }
    // おなじ ことばが どこかのカードに あるか
    function findWord(w) { for (var i = 0; i < coll.length; i++) if (coll[i].ws.indexOf(w) >= 0) return i; return -1; }
    // おなじ イラストの カードを さがす（絵が かわったら べつのカード＝むかしの絵は そのまま）
    function findPic(src, text) {
        for (var i = 0; i < coll.length; i++) {
            var it = coll[i];
            if (src && it.src === src) return i;
            if (!src && !it.src && it.text && it.text === text) return i;
        }
        return -1;
    }
    // 戻り値：'new'（あたらしいカード） / 'more'（おなじ絵に ことばが ふえた） / 'have'（もう ある）
    function addToColl(w, src, text) {
        var i = findWord(w);
        if (i >= 0) {
            if (!coll[i].src && src) { coll[i].src = src; saveColl(); }   // 前はネットにつながらず絵文字だった時
            return 'have';
        }
        var j = findPic(src, text);
        if (j >= 0) {
            coll[j].ws.push(w);
            saveColl();
            return 'more';
        }
        coll.push({ w: w, ws: [w], src: src || null, text: text || '', t: Date.now() });
        saveColl();
        updateBadge();
        return 'new';
    }
    function updateBadge() {
        collBadge.textContent = coll.length;
        collBadge.hidden = coll.length === 0;
    }
    function esc(t) {
        return String(t).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function picHtml(item) {
        return item.src ? '<img src="' + esc(item.src) + '" alt="" draggable="false">'
                        : '<span class="em">' + esc(item.text || '？') + '</span>';
    }
    var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    var ICON_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
    var ICON_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
    var editing = false;

    var curTab = 'ぜんぶ';          // いま えらんでいる カテゴリー
    var collTabs = document.getElementById('collTabs');
    function catOfCard(item) { return catOf(item.ws[0]); }
    function visible(item) { return curTab === 'ぜんぶ' || catOfCard(item) === curTab; }

    function renderColl(movedIndex) {
        collCount.textContent = '（' + coll.length + 'こ）';
        // カテゴリーの ボタン：カードが ある カテゴリーだけ ふやしていく
        var cnt = {};
        coll.forEach(function (it) { var c = catOfCard(it); cnt[c] = (cnt[c] || 0) + 1; });
        if (curTab !== 'ぜんぶ' && !cnt[curTab]) curTab = 'ぜんぶ';
        var used = CATS.filter(function (c) { return cnt[c]; });
        var th = '';
        if (used.length >= 2) {
            th = '<button data-tab="ぜんぶ" class="' + (curTab === 'ぜんぶ' ? 'on' : '') + '">ぜんぶ<small>' + coll.length + '</small></button>';
            used.forEach(function (c) {
                th += '<button data-tab="' + c + '" class="' + (curTab === c ? 'on' : '') + '">' + c + '<small>' + cnt[c] + '</small></button>';
            });
        } else { curTab = 'ぜんぶ'; }
        collTabs.innerHTML = th;
        if (!coll.length) {
            collList.innerHTML = '<div class="collEmpty">まだ なにも ないよ。<br>ことばを いれて つくってみよう！</div>';
            return;
        }
        var html = '', n = 0;
        coll.forEach(function (item, i) {
            if (!visible(item)) return;
            n++;
            var shown = item.ws.length > 1 ? item.ws.join('・') : item.w;
            var fs = Math.min(34, Math.floor(190 / Math.max(1, Math.min(shown.length, 7))));
            html += '<div class="card' + (i === movedIndex ? ' moved' : '') + '" data-i="' + i + '">' +
                '<span class="num">' + n + '</span>' +
                '<div class="pic">' + picHtml(item) + '</div>' +
                '<div class="w" style="font-size:' + fs + 'px">' + esc(item.ws.length > 1 ? item.ws[0] : item.w) + '</div>' +
                (item.ws.length > 1 ? '<span class="more">+' + (item.ws.length - 1) + '</span>' : '') +
                '<div class="mv"><button data-act="left" aria-label="まえへ">' + ICON_L + '</button>' +
                '<button data-act="right" aria-label="うしろへ">' + ICON_R + '</button></div>' +
                '<button class="del" data-act="del" aria-label="けす">' + ICON_X + '</button>' +
                '</div>';
        });
        collList.innerHTML = html;
    }
    // いま みえている カードの なかで となりの カードの いち
    function neighbor(i, dir) {
        for (var j = i + dir; j >= 0 && j < coll.length; j += dir) if (visible(coll[j])) return j;
        return -1;
    }
    collTabs.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('[data-tab]') : null;
        if (!b) return;
        curTab = b.getAttribute('data-tab');
        renderColl();
        collList.scrollTop = 0;
    });
    function setEditing(on) {
        editing = on;
        collEl.classList.toggle('editing', on);
        collTools.hidden = !on;
        editLbl.textContent = on ? 'おわり' : 'ならべかえ・けす';
    }
    function openColl() {
        if (busy) return;
        setEditing(false);
        renderColl();
        collList.scrollTop = 0;
        collEl.hidden = false;
    }
    function closeColl() { collEl.hidden = true; collView.hidden = true; confirmEl.hidden = true; }

    // カードの中のボタン（スクロールと まちがえないよう click で受ける）
    collList.addEventListener('click', function (e) {
        var card = e.target.closest ? e.target.closest('.card') : null;
        if (!card) return;
        var i = +card.getAttribute('data-i');
        var btn = e.target.closest('[data-act]');
        var act = btn ? btn.getAttribute('data-act') : null;
        if (act === 'left' && neighbor(i, -1) >= 0) {
            var j = neighbor(i, -1);
            var a = coll[i]; coll[i] = coll[j]; coll[j] = a;
            saveColl(); renderColl(j);
        } else if (act === 'right' && neighbor(i, 1) >= 0) {
            var k = neighbor(i, 1);
            var b = coll[i]; coll[i] = coll[k]; coll[k] = b;
            saveColl(); renderColl(k);
        } else if (act === 'del') {
            askConfirm('「' + coll[i].ws.join('」「') + '」を けしても いい？', function () {
                coll.splice(i, 1); saveColl(); updateBadge(); renderColl();
            });
        } else if (!act && !editing) {
            cvPic.innerHTML = picHtml(coll[i]);
            var all = coll[i].ws.join('・');
            cvWord.textContent = all;
            var fs = Math.min(92, Math.floor(1000 / Math.max(1, all.length)));
            cvWord.style.fontSize = (isPortrait ? Math.min(fs, 80) : fs) + 'px';
            collView.hidden = false;
        }
    });
    collView.addEventListener('click', function (e) {
        if (e.target === collView) collView.hidden = true;
    });

    var pendingYes = null;
    function askConfirm(message, onYes) {
        cfMsg.textContent = message;
        pendingYes = onYes;
        confirmEl.hidden = false;
    }

    /* ---------- 画面サイズ（webapp §5・§7） ---------- */
    function setAppHeight() {
        var vv = window.visualViewport;
        var h = vv ? vv.height * (vv.scale > 1 ? vv.scale : 1) : window.innerHeight;
        if (h > 0) document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    }

    function fitToWindow() {
        setAppHeight();
        var vv = window.visualViewport;
        var zs = (vv && vv.scale > 1) ? vv.scale : 1;
        var vw = vv ? vv.width * zs : window.innerWidth;
        var vh = vv ? vv.height * zs : window.innerHeight;
        if (!vw || !vh) return;

        var LW = Math.max(1200, Math.min(1700, Math.round(844 * vw / vh)));
        var sL = Math.min((vw - 8) / LW, (vh - 8) / 844);
        var PH = Math.max(1200, Math.min(1700, Math.round(760 * vh / vw)));
        var sP = Math.min((vw - 8) / 760, (vh - 8) / PH);

        var portrait = sP > sL;
        if (portrait !== isPortrait) {
            isPortrait = portrait;
            app.classList.toggle('is-portrait', portrait);
            app.classList.toggle('is-landscape', !portrait);
            layoutKeys();
        }
        if (portrait) { app.style.width = '760px'; app.style.height = PH + 'px'; }
        else          { app.style.width = LW + 'px'; app.style.height = '844px'; }

        app.style.transform = 'translate(-50%, -50%) scale(' + (portrait ? sP : sL) + ')';
        sizeKeyFont();
        fitText();
        if (!result.hidden) fitWord();
    }

    ['resize', 'pageshow'].forEach(function (t) { window.addEventListener(t, fitToWindow); });
    window.addEventListener('orientationchange', function () { setTimeout(fitToWindow, 250); });
    if (window.visualViewport) {
        visualViewport.addEventListener('resize', fitToWindow);
        visualViewport.addEventListener('scroll', setAppHeight);
    }

    /* ---------- ボタンをつなぐ ---------- */
    bindPress(btnBack, backspace);
    bindPress(btnClear, clearAll);
    bindPress(btnDone, make);
    bindPress(btnColl, openColl);
    bindPress(document.getElementById('btnCollBack'), closeColl);
    bindPress(document.getElementById('btnEdit'), function () { setEditing(!editing); });
    bindPress(document.getElementById('btnSortAiu'), function () {
        coll.sort(function (a, b) { return a.w < b.w ? -1 : a.w > b.w ? 1 : 0; });
        saveColl(); renderColl();
    });
    bindPress(document.getElementById('btnSortNew'), function () {
        coll.sort(function (a, b) { return (a.t || 0) - (b.t || 0); });
        saveColl(); renderColl();
    });
    bindPress(document.getElementById('btnClearAll'), function () {
        if (!coll.length) return;
        askConfirm('コレクションを ぜんぶ けしても いい？', function () {
            coll = []; saveColl(); updateBadge(); renderColl();
        });
    });
    bindPress(document.getElementById('btnCvClose'), function () { collView.hidden = true; });
    bindPress(document.getElementById('btnNo'), function () { confirmEl.hidden = true; pendingYes = null; });
    bindPress(document.getElementById('btnYes'), function () {
        confirmEl.hidden = true;
        var f = pendingYes; pendingYes = null;
        if (f) f();
    });
    updateBadge();
    // イラストが かわっていたら、むかしに ゲットした カードも あたらしい絵に こうしんする
    var refreshing = false;
    function refreshColl() {
        if (refreshing || !coll.length) return;
        refreshing = true;
        var flat = [];
        coll.forEach(function (it) { it.ws.forEach(function (w) { flat.push({ w: w, src: it.src, text: it.text, t: it.t }); }); });
        Promise.all(flat.map(function (f) {
            return loadPicture(lookup(f.w)).then(function (r) {
                if (r && r.found && r.src) { f.src = r.src; f.text = r.text || ''; }   // つながらない時は むかしのまま
            }, function () {});
        })).then(function () {
            var out = [], changed = false;
            flat.forEach(function (f) {
                var hit = null;
                for (var k = 0; k < out.length; k++) {
                    if (f.src ? out[k].src === f.src : (!out[k].src && out[k].text && out[k].text === f.text)) { hit = out[k]; break; }
                }
                if (hit) hit.ws.push(f.w);
                else out.push({ w: f.w, ws: [f.w], src: f.src, text: f.text, t: f.t });
            });
            if (JSON.stringify(out) !== JSON.stringify(coll)) changed = true;
            // いま ひらいている間に ならべかえ等が あったら、こうしんは やめる
            if (changed && !busy) {
                coll = out; saveColl(); updateBadge();
                if (!collEl.hidden && !editing) renderColl();
            }
            refreshing = false;
        });
    }
    refreshColl();
    bindPress(btnNext, function () { closeResult(true); });
    bindPress(btnFix, function () { closeResult(false); });
    bindPress(btnMaybe, function () {
        if (Date.now() < resultReadyAt) return;
        var g = btnMaybe._guess;
        if (!g) return;
        closeResult(false);
        chars = Array.from(g);
        render(false);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#extras .key'), function (b) {
        bindPress(b, function () { modifyLast(b.getAttribute('data-op'), b); });
    });

    /* ---------- 起動 ---------- */
    fitToWindow();
    render(false);

    var shown = false;
    function reveal() {
        if (shown) return;
        shown = true;
        fitToWindow();
        app.classList.add('is-ready');
    }
    setTimeout(fitToWindow, 300);
    var fontWait = (document.fonts && document.fonts.load)
        ? Promise.all([
            document.fonts.load('600 60px "Klee One"', 'あいうえおん'),
            document.fonts.load('700 28px "Zen Maru Gothic"', 'できたぜんぶけす')
          ])
        : Promise.resolve();
    fontWait.then(function () { setTimeout(reveal, 300); }, function () { setTimeout(reveal, 300); });
    setTimeout(reveal, 1800);
    window.addEventListener('load', fitToWindow);
    if (document.fonts && document.fonts.addEventListener) {
        document.fonts.addEventListener('loadingdone', function () { fitToWindow(); });
    }
})();
</script>

    // ？になったことばを集計（ことばと回数だけ。だれが入れたかは記録しない）
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getDatabase, ref, update, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
    var cfg = { apiKey: "AIzaSyBjnWqAcunbf_TBPraMHZRmI1bPjTnFhQU", authDomain: "typing-48f95.firebaseapp.com", databaseURL: "https://typing-48f95-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "typing-48f95", storageBucket: "typing-48f95.firebasestorage.app", messagingSenderId: "1045024853093", appId: "1:1045024853093:web:3484649a3b1544bb51ca8c" };
    var fb = null;
    function ready() {
        if (!fb) {
            var app = initializeApp(cfg, 'kotoba');
            var auth = getAuth(app), db = getDatabase(app);
            fb = signInAnonymously(auth).then(function () { return db; });
        }
        return fb;
    }
    window.__logUnknown = function (word, blocked) {
        word = String(word || '').replace(/[.$#\[\]\/\s]/g, '');
        if (!word || word.length > 20) return;
        ready().then(function (db) {
            return update(ref(db, 'kotoba_unknown/' + word), (blocked ? { word: word, count: increment(1), last: serverTimestamp(), blocked: true } : { word: word, count: increment(1), last: serverTimestamp() }));
        }).catch(function (e) { console.error('unknown-log failed', e); });
    };
</script>
