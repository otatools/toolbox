<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>絵の とうろく かくにん（デバッグ用）</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Zen Maru Gothic","Yu Gothic UI","Hiragino Sans",sans-serif;background:#fff7e3;color:#4a3418}
.wrap{max-width:960px;margin:0 auto;padding:14px 16px 60px}
h1{font-size:19px;margin:4px 0 6px}
.sub{font-size:13px;opacity:.8;margin:0 0 10px;line-height:1.5}
textarea{width:100%;height:110px;font-size:16px;font-family:inherit;border:2px solid #e8cf9f;border-radius:12px;padding:10px;background:#fff;color:#4a3418;resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:#f3d6a6;color:#6b4a1e;box-shadow:0 4px 0 #c99a5b;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c99a5b}
.flt button{background:#fff;box-shadow:0 3px 0 #ddcbb0;border:2px solid #eadcc6;padding:7px 10px;font-size:14px}
.flt button.on{background:#ffe3a3;border-color:#e9b54a}
#state{font-size:13px;margin:6px 0;color:#8a5a1e}
.card{display:flex;gap:12px;background:#fff;border-radius:14px;box-shadow:0 3px 0 #e0c999;padding:10px;margin:10px 0;align-items:flex-start}
.pic{flex:0 0 108px;width:108px;height:108px;border-radius:10px;background:#fffaf0;border:2px solid #eadcc6;display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.info{flex:1;min-width:0;font-size:14px;line-height:1.55}
.w{font-size:19px;font-weight:700}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;margin-left:6px;vertical-align:2px}
.ok{background:#d7f3d4;color:#256b2a}.img{background:#d6e8ff;color:#1d4d8f}.warn{background:#ffe9b8;color:#8a5a00}.ng{background:#ffd6d6;color:#a33a3a}.emo{background:#eadcff;color:#5a3a99}
.k{color:#8a6a3a;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{background:#f6ecd5;border-radius:8px;padding:2px 8px;font-size:13px;cursor:pointer;border:1px solid #e5d3a8}
.chip.me{background:#ffe3a3;border-color:#e9b54a}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
</style></head><body>
<div class="wrap">
<h1>絵の とうろく かくにん（デバッグ用）</h1>
<p class="sub">ことばを うつ・コピペ すると、①絵が でるか ②辞書に あるか／画像だけ あるか ③その絵が ほかに どんな ことばで でるか を しらべます。ふくすうは 改行・スペース・「、」「,」で くぎってください（カタカナは ひらがなに なおします）。</p>
<textarea id="inp" placeholder="例：しんかんせん&#10;ぜろけい&#10;でごいち" autocomplete="off" autocapitalize="off"></textarea>
<div class="bar"><button id="go">しらべる</button><button id="clr">ぜんぶ けす</button></div>
<div class="flt" id="flt"><button data-f="all" class="on">ぜんぶ</button><button data-f="ok">絵あり</button><button data-f="img">画像だけ</button><button data-f="warn">画像がよめない</button><button data-f="ng">なにもなし</button></div>
<div id="state">辞書を よみこみ中…</div>
<div id="out"></div>
</div>
<iframe id="app" src="index.html" style="position:absolute;left:-9999px;top:0;width:360px;height:640px;border:0" tabindex="-1" aria-hidden="true"></iframe>
<script>
(function () {
  var dbg = null, isBad = null, catOf = null, filt = 'all', rev = null;
  var $ = function (id) { return document.getElementById(id); };
  var kata = function (s) { return s.replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); }); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  // iframe の index.html が よみおわるのを まつ
  var n = 0, tm = setInterval(function () {
    try {
      var w = $('app').contentWindow;
      if (w && w.__dbg) { dbg = w.__dbg; isBad = w.__isBad; catOf = w.__catOf; clearInterval(tm); buildRev(); $('state').textContent = '準備できました（辞書：' + Object.keys(dbg.PREFER).length + ' + ' + Object.keys(dbg.DICT).length + ' + ' + Object.keys(dbg.CUSTOM).length + ' ことば）'; if ($('inp').value.trim()) run(); }
    } catch (e) {}
    if (++n > 200) { clearInterval(tm); $('state').textContent = 'index.html を よみこめませんでした（おなじフォルダに おいてください）'; }
  }, 100);

  // 絵 → その絵が でる ことば
  function buildRev() {
    rev = { c: {}, e: {} };
    [dbg.PREFER, dbg.CUSTOM].forEach(function (m) { Object.keys(m).forEach(function (k) { (rev.c[m[k]] = rev.c[m[k]] || []).push(k); }); });
    Object.keys(dbg.DICT).forEach(function (k) { (rev.e[dbg.DICT[k]] = rev.e[dbg.DICT[k]] || []).push(k); });
  }
  function tokens(s) {
    return kata(s).split(/[\s、,，]+/).map(function (x) { return x.trim(); }).filter(Boolean).filter(function (x, i, a) { return a.indexOf(x) === i; });
  }
  function analyze(w) {
    var D = dbg, c = D.variants(w), hit = null, kind = '';
    for (var i = 0; i < c.length; i++) {
      if (D.PREFER[c[i]]) { hit = c[i]; kind = 'prefer'; break; }
      if (D.DICT[c[i]]) { hit = c[i]; kind = 'emoji'; break; }
      if (D.CUSTOM[c[i]]) { hit = c[i]; kind = 'custom'; break; }
    }
    var lk = D.lookup(w), name = lk.custom || null, emoji = lk.emoji || (hit && D.DICT[hit]) || null;
    var urls = name ? D.customUrls(name) : [];
    var cat = '';
    try { cat = catOf(hit || w); } catch (e) {}
    var same = [];
    if (name && rev.c[name]) same = same.concat(rev.c[name]);
    if (emoji && rev.e[emoji]) same = same.concat(rev.e[emoji]);
    if (name && !hit && same.indexOf(name) < 0) same.unshift(name);
    same = same.filter(function (x, i, a) { return a.indexOf(x) === i; });
    return { word: w, hit: hit, kind: kind, name: name, emoji: emoji, urls: urls, cat: cat, same: same, bad: !!(isBad && isBad(w)) };
  }
  function status(r, loaded) {
    // loaded: 画像が よめたか（null=まだ）
    if (r.bad) return ['ng', '使えないことば'];
    if (r.kind === 'emoji' && !(r.kind === 'prefer')) return ['emo', '絵文字で でる'];
    if (loaded === true) return r.hit ? ['ok', '絵あり（辞書に あり）'] : ['img', '画像だけ あり（辞書に なし）'];
    if (loaded === false) return r.hit ? ['warn', '辞書に あるが 画像が よめない'] : ['ng', 'なにもなし（？に なる）'];
    return ['warn', 'かくにん中…'];
  }
  function render(list) {
    var out = $('out'); out.innerHTML = '';
    list.forEach(function (w) {
      var r = analyze(w), card = document.createElement('div'); card.className = 'card'; card.dataset.w = w;
      var pic = document.createElement('div'); pic.className = 'pic';
      var info = document.createElement('div'); info.className = 'info';
      card.appendChild(pic); card.appendChild(info); out.appendChild(card);
      var emojiShow = function () { pic.textContent = r.emoji ? r.emoji.split('=')[0] : '？'; };
      function paint(loaded, url) {
        var st = status(r, loaded);
        // 絵文字だけ の ことば（画像なしでも 絵文字が でる）
        if (loaded !== true && r.kind === 'emoji') st = ['emo', '絵文字で でる'];
        card.dataset.s = st[0] === 'emo' ? 'ok' : st[0];
        var h = '<div><span class="w">' + esc(w) + '</span><span class="badge ' + st[0] + '">' + st[1] + '</span></div>';
        h += '<div class="k">辞書：' + (r.hit ? (r.hit !== w ? '「' + esc(r.hit) + '」として ' : '') + ({ prefer: '自作の絵（!）', custom: '自作の絵（@）', emoji: '絵文字のみ' }[r.kind]) : 'なし') + (r.cat ? '　／　カテゴリー：' + esc(r.cat) : '') + '</div>';
        if (r.name) h += '<div class="k">絵の ファイル：<span class="mono">' + esc(r.name) + '</span>' + (url ? '　<span class="mono">' + esc(url) + '</span>' : '') + '</div>';
        if (r.emoji) h += '<div class="k">絵文字：' + esc(r.emoji) + '</div>';
        if (loaded === false && !r.hit && !r.emoji) r.same = [];
        h += '<div class="k" style="margin-top:4px">この絵が でる ことば（' + r.same.length + '）：</div><div class="chips">' + (r.same.length ? r.same.map(function (x) { return '<span class="chip' + (x === w ? ' me' : '') + '" data-w="' + esc(x) + '">' + esc(x) + '</span>'; }).join('') : '<span class="k">なし</span>') + '</div>';
        info.innerHTML = h; applyFilter();
      }
      paint(null);
      if (!r.urls.length) { if (r.kind === 'emoji') emojiShow(); else pic.textContent = '？'; paint(false); return; }
      var i = 0;
      (function tryNext() {
        if (i >= r.urls.length) { if (r.emoji) emojiShow(); else pic.textContent = '？'; paint(false); return; }
        var u = r.urls[i++], im = new Image();
        im.onload = function () { pic.innerHTML = ''; pic.appendChild(im); paint(true, u); };
        im.onerror = tryNext;
        im.src = u;
      })();
    });
  }
  function applyFilter() {
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function (c) { c.style.display = (filt === 'all' || c.dataset.s === filt) ? '' : 'none'; });
  }
  function run() {
    if (!dbg) { $('state').textContent = 'まだ じゅんび中です。すこし まって もういちど おして ください'; return; }
    var t = tokens($('inp').value);
    $('state').textContent = t.length + 'ことば しらべました';
    render(t.slice(0, 300));
  }
  $('go').onclick = run;
  $('clr').onclick = function () { $('inp').value = ''; $('out').innerHTML = ''; };
  var dt; $('inp').addEventListener('input', function () { clearTimeout(dt); dt = setTimeout(run, 500); });
  $('flt').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; filt = b.dataset.f; Array.prototype.forEach.call(document.querySelectorAll('#flt button'), function (x) { x.classList.toggle('on', x === b); }); applyFilter(); });
  $('out').addEventListener('click', function (e) { var c = e.target.closest('.chip'); if (!c) return; $('inp').value = c.dataset.w; run(); window.scrollTo(0, 0); });
})();
</script>
</body></html>
