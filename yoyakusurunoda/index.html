<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>施設利用予約システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js"></script>
  <!-- SheetJS for Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    /* ダブルタップ拡大を無効化(スクロール・ピンチは残る) */
    * { touch-action: manipulation; -webkit-touch-callout: none; }
    /* iOS で高さがずれないよう、実測値で上書きする高さ変数 */
    :root { --app-h: 100vh; }
    @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
    html { background: #f9fafb; }
    body { overscroll-behavior-y: none; }
    /* 予約表のスクロール枠とモーダルの最大高さ(iOS で下が切れないように) */
    .table-scroll { max-height: calc(var(--app-h) * 0.7); }  /* JSが実測で上書きする */
    .cell-h { height: var(--row-h, 56px); }
    /* 画面が低いとき(スマホ横向きなど)：操作欄を1行にまとめ、表の余白を詰めて1画面に収める */
    @media (max-height: 500px) {
      main { padding-top: 6px !important; padding-bottom: 6px !important; }
      #controlPanel { flex-direction: row !important; flex-wrap: wrap; align-items: center !important; padding: 6px 8px !important; margin-bottom: 6px !important; gap: 6px !important; }
      #controlPanel > div { width: auto !important; gap: 6px !important; }
      #controlPanel button, #controlPanel label { padding-top: 4px !important; padding-bottom: 4px !important; }
      #controlPanel .icon-btn { height: 32px; }
      #controlPanel input, #controlPanel select { padding-top: 2px !important; padding-bottom: 2px !important; }
      #tableHead th { padding-top: 3px !important; padding-bottom: 3px !important; }
      #tableBody td { padding-top: 1px !important; padding-bottom: 1px !important; }
      #tableBody td span { font-size: 13px !important; line-height: 1.2 !important; }
    }
    .modal-box { max-height: calc(var(--app-h) * 0.9); }
    /* iOS は16px未満の入力欄にフォーカスすると勝手に拡大する */
    @media (hover: none) and (pointer: coarse) {
      input, select, textarea { font-size: 16px !important; }
      /* モバイルGPUで重い背景ぼかしを切る */
      #reservationModal { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(17,24,39,.5); }
    }
    /* アイコンだけのボタンの中身を確実に中央へ(Safari対策) */
    .icon-btn { position: relative; -webkit-appearance: none; appearance: none; line-height: 0; width: 36px; height: 36px; padding: 0; }
    .icon-btn svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    #btnCloseModal.icon-btn { width: 32px; height: 32px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  
  <!-- トースト通知用 -->
  <div id="toastMessage" class="hidden fixed top-4 right-4 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg z-50 transition-opacity duration-300 text-sm font-medium"></div>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-3 md:py-4">
    <!-- コントロールパネル -->
    <div id="controlPanel" class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 mb-3 flex flex-col md:flex-row gap-3 justify-between items-start md:items-center">
      
      <!-- ビュー切り替えと施設選択 -->
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <div class="flex bg-gray-100 p-1 rounded-lg border border-gray-200 w-full md:w-auto">
          <button id="btnDailyView" class="flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all bg-white shadow-sm text-indigo-700">
            日別状況
          </button>
          <button id="btnFacilityView" class="flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all text-gray-500 hover:text-gray-700">
            施設別状況
          </button>
        </div>

        <select id="facilitySelect" class="hidden px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-sm font-medium outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-sm">
          <!-- JSで動的に追加 -->
        </select>
      </div>

      <!-- 日付セレクターとExcel操作 -->
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <div class="flex items-center bg-gray-50 rounded-lg overflow-hidden border border-gray-300 shadow-sm">
          <button id="btnPrevDate" class="icon-btn shrink-0 hover:bg-gray-200 text-gray-600 transition-colors">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <input type="date" id="dateInput" class="bg-transparent border-none outline-none px-2 py-2 text-sm font-medium text-gray-800 cursor-pointer" />
          <button id="btnNextDate" class="icon-btn shrink-0 hover:bg-gray-200 text-gray-600 transition-colors">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>
        
        <button id="btnToday" class="px-4 py-2.5 bg-indigo-50 text-indigo-700 rounded-lg text-sm font-medium hover:bg-indigo-100 transition-colors border border-indigo-200">
          今日
        </button>

        <!-- Excel入出力 (URLが/#adminの時のみ表示) -->
        <div id="adminControls" class="hidden items-center gap-2 border-l pl-3 border-gray-200 ml-auto md:ml-0">
          <button id="btnExportExcel" class="px-3 py-2.5 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition-colors shadow-sm flex items-center gap-1" title="Excel出力">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span class="hidden lg:inline">出力</span>
          </button>
          <label for="excelInput" class="px-3 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors shadow-sm flex items-center gap-1 cursor-pointer mb-0" title="Excel入力">
            <i data-lucide="upload" class="w-4 h-4"></i>
            <span class="hidden lg:inline">入力</span>
            <input type="file" id="excelInput" accept=".xlsx, .xls" class="hidden" />
          </label>
        </div>
      </div>
    </div>

    <!-- 予約テーブル -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative z-0">
      <!-- overflow-auto と max-h-[70vh] を追加して縦スクロール可能に -->
      <div class="table-scroll overflow-auto">
        <table class="w-full text-left border-collapse table-fixed">
          <thead id="tableHead">
            <!-- JSで動的に追加 -->
          </thead>
          <tbody id="tableBody">
            <!-- JSで動的に追加 -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 予約用モーダル (初期状態は非表示) -->
  <div id="reservationModal" class="hidden fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl modal-box w-full max-w-md flex flex-col transform transition-all overflow-hidden">
      
      <!-- モーダルヘッダー -->
      <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 shrink-0">
        <h3 id="modalTitle" class="font-bold text-lg text-gray-800">新規予約</h3>
        <button id="btnCloseModal" class="icon-btn shrink-0 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-200 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- モーダルコンテンツ (JSで動的に更新) -->
      <div id="modalContent" class="p-6 space-y-5 overflow-y-auto">
        <!-- JSで動的に追加 -->
      </div>

      <!-- モーダルフッター -->
      <div id="modalFooter" class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex flex-row-reverse gap-3 shrink-0">
        <!-- JSで動的に追加 -->
      </div>

    </div>
  </div>

  <!-- Firebase & App Logic -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Firebase 初期化
    const fallbackConfig = {
      apiKey: "AIzaSyBQSo6WJBCN42UyUxZ8M-d3JaxuartXJZc",
      authDomain: "noda-yoyaku.firebaseapp.com",
      projectId: "noda-yoyaku",
      storageBucket: "noda-yoyaku.firebasestorage.app",
      messagingSenderId: "1074761092556",
      appId: "1:1074761092556:web:d0c660d8daf61bda092169"
    };
    
    const firebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config 
      ? JSON.parse(__firebase_config) 
      : fallbackConfig;
      
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    // 定数定義
    const FACILITIES = [
      { id: 'field', name: '運動場' },
      { id: 'auditorium', name: '講堂' },
      { id: 'multipurpose', name: '多目的室' },
      { id: 'art', name: '図工室' },
      { id: 'music', name: '音楽室' },
      { id: 'library', name: 'としょ室' },
      { id: 'science', name: '理科室' },
      { id: 'home_ec', name: '家庭科室' }
    ];

    const PERIODS = [
      { id: 'p1', name: '1時間目' },
      { id: 'p2', name: '2時間目' },
      { id: 'p3', name: '3時間目' },
      { id: 'p4', name: '4時間目' },
      { id: 'p5', name: '5時間目' },
      { id: 'p6', name: '6時間目' },
      { id: 'after', name: '放課後' }
    ];

    const DAYS = ['日', '月', '火', '水', '木', '金', '土'];

    // ストレージ(プライベートブラウズ等で例外が出ても止まらないように)
    function storageGet(store, key) {
      try { return window[store].getItem(key); } catch (e) { return null; }
    }
    function storageSet(store, key, value) {
      try { window[store].setItem(key, value); } catch (e) {}
    }

    // 状態管理
    let user = null;
    let reservations = [];
    let viewMode = 'daily';
    let currentDateStr = formatDateForInput(new Date());
    let selectedFacilityId = FACILITIES[0].id;
    let unsubscribeFirestore = null;

    let modalState = { isOpen: false, data: null };
    let userName = storageGet('localStorage', 'teacherName') || '';
    let purpose = '';
    let isRecurring = storageGet('sessionStorage', 'isRecurring') === 'true';
    let recurringEndDate = storageGet('sessionStorage', 'recurringEndDate') || '';
    let isConfirmingDelete = false;
    let isSaving = false;
    let saveError = '';
    let conflictInfo = null;  // 繰り返し予約で重なった日がある時の確認待ち情報
    let skipResult = null;    // 空いている日だけ予約した後の結果

    // トースト通知関数
    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toastMessage');
      toast.textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 4000);
    }

    // 日付ヘルパー関数
    function formatDateForInput(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateStr(dateStr) {
      const [y, m, d] = String(dateStr).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function formatDateForDisplay(dateStr) {
      if (!dateStr) return '';
      const date = parseDateStr(dateStr);
      return `${date.getMonth() + 1}/${date.getDate()} (${DAYS[date.getDay()]})`;
    }

    function addDaysToDateStr(dateStr, days) {
      const date = parseDateStr(dateStr);
      date.setDate(date.getDate() + days);
      return formatDateForInput(date);
    }

    function getWeekDates(startDateStr) {
      const dates = [];
      for (let i = 0; i < 7; i++) {
        dates.push(addDaysToDateStr(startDateStr, i));
      }
      return dates;
    }

    // HTMLエスケープ関数
    function escapeHtml(unsafe) {
      if (unsafe === null || unsafe === undefined) return '';
      return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // クラス名フォーマット関数
    function formatClassName(inputStr) {
      if (!inputStr) return inputStr;

      // 1. 全角英数字・ハイフン系を半角に変換
      let formattedStr = inputStr.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
          return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      }).replace(/[ー−‐―]/g, '-');

      // 2. 「数字+年+数字+組」のパターンに一致する場合のみ「数字-数字」に変換
      // 例: "6年1組" -> "6-1", "１２年３４組" -> "12-34"
      const match = formattedStr.match(/^(\d+)年(\d+)組$/);
      if (match) {
        return `${match[1]}-${match[2]}`;
      }

      return formattedStr;
    }

    // 管理者モードのチェック
    function checkAdminMode() {
      const adminControls = document.getElementById('adminControls');
      if (window.location.hash === '#admin') {
        adminControls.classList.remove('hidden');
        adminControls.classList.add('flex');
      } else {
        adminControls.classList.add('hidden');
        adminControls.classList.remove('flex');
      }
    }

    // 認証とデータ取得
    async function initApp() {
      lucide.createIcons();
      setupEventListeners();
      updateControlsUI();
      checkAdminMode();

      window.addEventListener('hashchange', checkAdminMode);

      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Authentication Error:", error);
      }

      onAuthStateChanged(auth, (currentUser) => {
        user = currentUser;
        if (user) {
          subscribeData();
        } else {
          if(unsubscribeFirestore) unsubscribeFirestore();
          unsubscribeFirestore = null;
          subscribedRange = '';
          reservations = [];
          renderTable();
        }
      });
    }

    // 表示している範囲(日別=その日、施設別=表示中の7日間)だけを読み込む
    let subscribedRange = '';
    function getVisibleRange() {
      const start = currentDateStr;
      const end = viewMode === 'facility' ? addDaysToDateStr(currentDateStr, 6) : currentDateStr;
      return { start, end };
    }

    // 管理者のExcel入出力用：全件を1回だけ読み込む
    async function fetchAllReservations() {
      const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'facility_reservations');
      const snap = await getDocs(colRef);
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    function subscribeData() {
      if (!user) return;
      const { start, end } = getVisibleRange();
      const rangeKey = `${start}_${end}`;
      if (rangeKey === subscribedRange && unsubscribeFirestore) return;  // 範囲が同じなら購読し直さない
      if (unsubscribeFirestore) { unsubscribeFirestore(); unsubscribeFirestore = null; }
      subscribedRange = rangeKey;
      reservations = [];
      const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'facility_reservations');
      const q = query(colRef, where('date', '>=', start), where('date', '<=', end));
      unsubscribeFirestore = onSnapshot(
        q,
        (snapshot) => {
          reservations = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          renderTable();
          // もしモーダルが開いていたら、表示を最新化する
          if (modalState.isOpen && modalState.data && modalState.data.reservation) {
            const updatedRes = reservations.find(r => r.id === modalState.data.reservation.id);
            if (!updatedRes) {
               // 削除されていたら閉じる
               closeModal();
            } else {
               const prev = modalState.data.reservation;
               modalState.data.reservation = updatedRes;
               // その予約自体が変わったときだけ描き直す(入力中のフォーカスを奪わない)
               if (prev.teacherName !== updatedRes.teacherName || (prev.purpose || '') !== (updatedRes.purpose || '')) {
                 renderModal();
               }
            }
          }
        },
        (error) => {
          console.error("Firestore Subscribe Error:", error);
        }
      );
    }

    // UI更新処理
    function updateControlsUI() {
      // 施設セレクトボックス初期化
      const select = document.getElementById('facilitySelect');
      select.innerHTML = FACILITIES.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
      select.value = selectedFacilityId;

      // 日付インプット更新
      document.getElementById('dateInput').value = currentDateStr;

      // ビュー切り替えボタンのスタイル更新
      const btnDaily = document.getElementById('btnDailyView');
      const btnFacility = document.getElementById('btnFacilityView');
      
      if (viewMode === 'daily') {
        btnDaily.className = 'flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all bg-white shadow-sm text-indigo-700';
        btnFacility.className = 'flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all text-gray-500 hover:text-gray-700';
        select.classList.add('hidden');
      } else {
        btnFacility.className = 'flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all bg-white shadow-sm text-indigo-700';
        btnDaily.className = 'flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all text-gray-500 hover:text-gray-700';
        select.classList.remove('hidden');
      }
      scheduleFit();
    }

    function renderCell(dateStr, facilityId, periodId) {
      const reservation = reservations.find(
        r => r.date === dateStr && r.facilityId === facilityId && r.period === periodId
      );

      const cellDataAttrs = `data-date="${dateStr}" data-facility="${facilityId}" data-period="${periodId}"`;

      if (reservation) {
        // すべての予約を同じ青色（インディゴ）で表示する
        const bgClass = 'bg-indigo-100 hover:bg-indigo-200';
        const borderClass = 'border-indigo-300';

        return `
          <td ${cellDataAttrs} data-has-reservation="true"
            class="cell-target border ${borderClass} p-1 sm:p-2 cell-h cursor-pointer transition-colors relative overflow-hidden ${bgClass}">
            <div class="w-full h-full flex items-center justify-center overflow-hidden pointer-events-none">
              <span class="font-bold text-gray-800 text-sm sm:text-base md:text-lg truncate px-1 pointer-events-none">
                ${escapeHtml(reservation.teacherName)}
              </span>
            </div>
          </td>
        `;
      } else {
        return `
          <td ${cellDataAttrs} data-has-reservation="false"
            class="cell-target border border-gray-200 p-1 sm:p-2 cell-h cursor-pointer hover:bg-emerald-50 transition-colors group overflow-hidden">
            <div class="w-full h-full flex items-center justify-center opacity-0 group-hover:opacity-100 text-emerald-600 transition-opacity pointer-events-none">
              <i data-lucide="plus" class="w-3 h-3 sm:w-5 sm:h-5"></i>
              <span class="text-[10px] sm:text-sm ml-0.5 sm:ml-1 font-medium hidden sm:inline">予約</span>
            </div>
          </td>
        `;
      }
    }

    function renderTable() {
      subscribeData();  // 表示範囲が変わっていれば購読し直す
      // 1. Table Head
      // スクロール時にヘッダーを固定 (sticky top-0 / z-20, z-30 を追加)
      let theadHtml = `
        <tr>
          <th class="w-[15%] sm:w-24 md:w-32 p-1 sm:p-2 md:p-3 font-medium text-gray-600 text-[10px] sm:text-xs md:text-sm sticky left-0 top-0 bg-gray-50 z-30 border-r border-b border-gray-300 shadow-[2px_2px_5px_-2px_rgba(0,0,0,0.1)]">
            ${viewMode === 'daily' ? '施設' : '日付'}
          </th>
      `;
      PERIODS.forEach(p => {
        theadHtml += `
          <th class="p-1 sm:p-2 md:p-3 font-medium text-gray-600 text-[10px] sm:text-xs md:text-sm text-center border-l border-b border-gray-300 first:border-l-0 overflow-hidden whitespace-nowrap text-ellipsis sticky top-0 bg-gray-50 z-20 shadow-[0_2px_5px_-2px_rgba(0,0,0,0.1)]">
            <span class="hidden sm:inline">${p.name}</span>
            <span class="sm:hidden">${p.name.replace('時間目', '限').replace('放課後', '放')}</span>
          </th>
        `;
      });
      theadHtml += `</tr>`;
      document.getElementById('tableHead').innerHTML = theadHtml;

      // 2. Table Body
      let tbodyHtml = '';
      if (viewMode === 'daily') {
        FACILITIES.forEach(fac => {
          tbodyHtml += `
            <tr class="border-b border-gray-200 last:border-none group">
              <td class="p-1 sm:p-2 md:p-3 font-medium text-[10px] sm:text-xs md:text-sm text-gray-800 sticky left-0 bg-white z-10 border-r border-gray-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] group-hover:bg-gray-50 transition-colors">
                <div class="flex items-center gap-1 sm:gap-2 overflow-hidden">
                  <i data-lucide="map-pin" class="text-gray-400 shrink-0 w-3 h-3 sm:w-4 sm:h-4 hidden sm:block"></i>
                  <span class="truncate">${fac.name}</span>
                </div>
              </td>
          `;
          PERIODS.forEach(period => {
            tbodyHtml += renderCell(currentDateStr, fac.id, period.id);
          });
          tbodyHtml += `</tr>`;
        });
      } else {
        const weekDates = getWeekDates(currentDateStr);
        const todayStr = formatDateForInput(new Date());
        
        weekDates.forEach(dateStr => {
          const isToday = dateStr === todayStr;
          const dayOfWeek = parseDateStr(dateStr).getDay();
          
          let bgClass = '';
          let stickyBgClass = 'bg-white text-gray-800 group-hover:bg-gray-50';
          
          if (isToday) {
            bgClass = 'bg-indigo-50/30';
            stickyBgClass = 'bg-indigo-50/80 text-indigo-800';
          } else if (dayOfWeek === 0) { // 日曜
            bgClass = 'bg-red-50';
            stickyBgClass = 'bg-red-50 text-gray-800 group-hover:bg-red-100';
          } else if (dayOfWeek === 6) { // 土曜
            bgClass = 'bg-blue-50';
            stickyBgClass = 'bg-blue-50 text-gray-800 group-hover:bg-blue-100';
          }

          const iconClass = isToday ? "text-indigo-500" : "text-gray-400";

          tbodyHtml += `
            <tr class="border-b border-gray-200 last:border-none group ${bgClass}">
              <td class="p-1 sm:p-2 md:p-3 font-medium text-[10px] sm:text-xs md:text-sm sticky left-0 z-10 border-r border-gray-200 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] transition-colors ${stickyBgClass}">
                <div class="flex items-center gap-1 sm:gap-2 overflow-hidden">
                  <i data-lucide="calendar" class="shrink-0 w-3 h-3 sm:w-4 sm:h-4 hidden sm:block ${iconClass}"></i>
                  <span class="truncate">${formatDateForDisplay(dateStr)}</span>
                </div>
              </td>
          `;
          PERIODS.forEach(period => {
            tbodyHtml += renderCell(dateStr, selectedFacilityId, period.id);
          });
          tbodyHtml += `</tr>`;
        });
      }
      
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = tbodyHtml;
      lucide.createIcons();
      fitTableToScreen();

      // セルへのクリックイベント登録
      const cells = tbody.querySelectorAll('.cell-target');
      cells.forEach(cell => {
        cell.addEventListener('click', (e) => {
          const t = e.currentTarget;
          const d = t.getAttribute('data-date');
          const f = t.getAttribute('data-facility');
          const p = t.getAttribute('data-period');
          
          const reservation = reservations.find(r => r.date === d && r.facilityId === f && r.period === p);
          openModal(d, f, p, reservation || null);
        });
      });
    }

    // Excel出力処理
    async function handleExportExcel() {
      let allReservations;
      try {
        allReservations = await fetchAllReservations();
      } catch (error) {
        console.error("Export Error:", error);
        showToast("データの取得に失敗しました。");
        return;
      }
      if (allReservations.length === 0) {
        showToast("出力する予約データがありません。");
        return;
      }
      
      const facOrder = (name) => { const i = FACILITIES.findIndex(f => f.name === name); return i < 0 ? 999 : i; };
      const perOrder = (name) => { const i = PERIODS.findIndex(p => p.name === name); return i < 0 ? 999 : i; };
      const exportData = allReservations.map(r => {
        const facility = FACILITIES.find(f => f.id === r.facilityId);
        const period = PERIODS.find(p => p.id === r.period);
        return {
          "日付": r.date,
          "施設": facility ? facility.name : r.facilityId,
          "時間帯": period ? period.name : r.period,
          "予約者（クラス）": r.teacherName,
          "利用目的": r.purpose || ""
        };
      });

      // ソートして見やすくする
      exportData.sort((a, b) => {
        if (a["日付"] !== b["日付"]) return a["日付"].localeCompare(b["日付"]);
        if (a["施設"] !== b["施設"]) return facOrder(a["施設"]) - facOrder(b["施設"]);
        return perOrder(a["時間帯"]) - perOrder(b["時間帯"]);
      });

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "予約データ");
      XLSX.writeFile(workbook, `施設予約_${formatDateForInput(new Date())}.xlsx`);
      showToast("Excelファイルを出力しました。");
    }

    // Excel入力処理 (完全同期)
    function handleImportExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      showToast("読み込みと同期中...");

      const reader = new FileReader();
      reader.onload = async function(event) {
        try {
          const data = new Uint8Array(event.target.result);
          const workbook = XLSX.read(data, {type: 'array'});
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);

          let addCount = 0;
          let updateCount = 0;
          let deleteCount = 0;
          let skipCount = 0;
          
          const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'facility_reservations');
          const tasks = [];  // 確認後にまとめて実行する
          const allReservations = await fetchAllReservations();
          const excelKeys = new Set();

          for (const row of jsonData) {
            let dateVal = row["日付"];
            const facName = row["施設"];
            const periodName = row["時間帯"];
            const tName = row["予約者（クラス）"];
            const purposeVal = row["利用目的"] || "";

            if(!dateVal || !facName || !periodName || !tName) continue;

            // Excelシリアル値(数値)の場合は日付文字列に変換
            if (typeof dateVal === 'number') {
              const excelEpoch = new Date(1899, 11, 30);
              const jsDate = new Date(excelEpoch.getTime() + dateVal * 86400000);
              dateVal = formatDateForInput(jsDate);
            } else if (typeof dateVal === 'string') {
              dateVal = dateVal.replace(/\//g, '-');
            }

            const fac = FACILITIES.find(f => f.name === String(facName).trim());
            const per = PERIODS.find(p => p.name === String(periodName).trim());
            
            if (!fac || !per) {
              skipCount++;
              continue;
            }
            
            const key = `${dateVal}_${fac.id}_${per.id}`;
            if (excelKeys.has(key)) {  // 同じ枠の行が2回ある場合は最初の行だけ使う
              skipCount++;
              continue;
            }
            excelKeys.add(key);
            
            const existingRes = allReservations.find(
              r => r.date === dateVal && r.facilityId === fac.id && r.period === per.id
            );

            const formattedName = formatClassName(tName.toString());

            if (existingRes) {
              // 変更があれば更新
              if (existingRes.teacherName !== formattedName || (existingRes.purpose || "") !== purposeVal.toString()) {
                tasks.push(() => updateDoc(doc(colRef, existingRes.id), {
                  teacherName: formattedName,
                  purpose: purposeVal.toString(),
                  updatedAt: new Date().toISOString()
                }));
                updateCount++;
              }
            } else {
              // 新規追加
              tasks.push(() => addDoc(colRef, {
                date: dateVal,
                facilityId: fac.id,
                period: per.id,
                teacherName: formattedName,
                purpose: purposeVal.toString(),
                userId: user ? user.uid : 'imported',
                createdAt: new Date().toISOString()
              }));
              addCount++;
            }
          }
          
          // エクセルに存在しない既存データを削除
          for (const res of allReservations) {
             const key = `${res.date}_${res.facilityId}_${res.period}`;
             if (!excelKeys.has(key)) {
                tasks.push(() => deleteDoc(doc(colRef, res.id)));
                deleteCount++;
             }
          }
          
          if (excelKeys.size === 0) {
            showToast("有効な予約行が見つかりません。列名（日付・施設・時間帯・予約者（クラス））を確認してください。");
            return;
          }
          if (tasks.length === 0) {
            showToast("変更はありませんでした。");
            return;
          }
          const ok = window.confirm(
            `Excelの内容で予約を上書きします。\n\n追加 ${addCount}件\n更新 ${updateCount}件\n削除 ${deleteCount}件` +
            (skipCount ? `\n(施設名・時間帯が読めない行／重複した行 ${skipCount}件は飛ばします)` : '') +
            `\n\nよろしいですか？`
          );
          if (!ok) {
            showToast("取り込みを中止しました。");
            return;
          }
          await Promise.all(tasks.map(fn => fn()));
          showToast(`同期完了: 追加${addCount}件, 更新${updateCount}件, 削除${deleteCount}件`);
        } catch (error) {
          console.error("Import Error:", error);
          showToast("ファイルの読み込みに失敗しました。");
        } finally {
          e.target.value = ""; // 入力リセット
        }
      };
      reader.readAsArrayBuffer(file);
    }

        purpose = reservation.purpose || '';

        userName = storageGet('localStorage', 'teacherName') || '';
        purpose = '';
      }

      conflictInfo = null;
      skipResult = null;

      renderModal();

      renderModal();

    // 保存処理
    async function handleSave() {
      // 保存時にフォーマットを適用
      userName = formatClassName(userName);

      if (!userName.trim() || !user) return;

      const { date, facilityId, periodId, reservation } = modalState.data;

      // 保存対象日付リスト
      const datesToSave = [];
      if (!reservation && isRecurring && recurringEndDate) {
        let currDate = parseDateStr(date);
        const endDate = parseDateStr(recurringEndDate);
        while (currDate <= endDate) {
          datesToSave.push(formatDateForInput(currDate));
          currDate.setDate(currDate.getDate() + 7);
        }
      } else {
        datesToSave.push(date);
      }

      isSaving = true;
      saveError = '';
      renderModal();

      // 重複チェック(表示していない先の日付もサーバーに問い合わせて確認する)
      // conflictInfo がある＝「空いている日だけ予約する」を押した後なので、確認済み
      if (!reservation && !conflictInfo) {
        let conflictDocs = [];
        try {
          const colRefCheck = collection(db, 'artifacts', appId, 'public', 'data', 'facility_reservations');
          const snap = await getDocs(query(colRefCheck, where('facilityId', '==', facilityId), where('period', '==', periodId)));
          const targetDates = new Set(datesToSave);
          const seen = new Set();
          conflictDocs = snap.docs
            .map(d => d.data())
            .filter(r => targetDates.has(r.date) && !seen.has(r.date) && seen.add(r.date))
            .sort((x, y) => x.date.localeCompare(y.date));
        } catch (error) {
          console.error("Conflict Check Error:", error);
          isSaving = false;
          saveError = '予約状況の確認に失敗しました。通信状況を確認してください。';
          renderModal();
          return;
        }
        if (conflictDocs.length > 0) {
          isSaving = false;
          const conflictDates = new Set(conflictDocs.map(r => r.date));
          const freeDates = datesToSave.filter(d => !conflictDates.has(d));
          if (freeDates.length === 0) {
            saveError = datesToSave.length === 1
              ? 'この日はすでに予約が入っています。'
              : `選んだ日程はすべて予約が入っているため予約できません: ${conflictDocs.map(r => formatDateForDisplay(r.date)).join(', ')}`;
          } else {
            conflictInfo = {
              conflicts: conflictDocs.map(r => ({ date: r.date, teacherName: r.teacherName || '', purpose: r.purpose || '' })),
              freeDates
            };
          }
          renderModal();
          return;
        }
      }
      const finalDates = (!reservation && conflictInfo) ? conflictInfo.freeDates : datesToSave;

      try {
        storageSet('localStorage', 'teacherName', userName);
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'facility_reservations');

        if (reservation) {
          const docRef = doc(colRef, reservation.id);
          await updateDoc(docRef, {
            teacherName: userName,
            purpose: purpose,
            updatedAt: new Date().toISOString()
          });
        } else {
          const promises = finalDates.map(d => addDoc(colRef, {
            date: d,
            facilityId: facilityId,
            period: periodId,
            teacherName: userName,
            purpose: purpose,
            userId: user.uid,
            createdAt: new Date().toISOString()
          }));
          await Promise.all(promises);
        }
        if (!reservation && conflictInfo) {
          // 空いている日だけ予約した → 結果と「できなかった日」を表示
          skipResult = {
            savedCount: finalDates.length,
            skipped: conflictInfo.conflicts,
            facilityName: FACILITIES.find(f => f.id === facilityId)?.name || facilityId,
            periodName: PERIODS.find(p => p.id === periodId)?.name || periodId,
            teacherName: userName
          };
          conflictInfo = null;
        } else {
          closeModal();
        }
      } catch (error) {
        console.error("Save Error:", error);
        saveError = '保存に失敗しました。通信状況を確認してください。';
        renderModal();
      } finally {
        isSaving = false;
        if(modalState.isOpen) renderModal();
      }
    }

    // 削除処理
    async function handleDelete() {
      if (!isConfirmingDelete) {
        isConfirmingDelete = true;
        renderModal();
        return;
      }
      
      isSaving = true;
      renderModal();
      try {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'facility_reservations', modalState.data.reservation.id);
        await deleteDoc(docRef);
        closeModal();
      } catch (error) {
        console.error("Delete Error:", error);
        saveError = '削除に失敗しました。通信状況を確認してください。';
        renderModal();
      } finally {
        isSaving = false;
        if(modalState.isOpen) renderModal();
      }
    }

    // イベントリスナー設定
    function setupEventListeners() {
      // 日付変更
      const changeDate = (direction) => {
        const daysToMove = viewMode === 'facility' ? 7 : 1;
        currentDateStr = addDaysToDateStr(currentDateStr, direction * daysToMove);
        updateControlsUI();
        renderTable();
      };

      document.getElementById('btnPrevDate').addEventListener('click', () => changeDate(-1));
      document.getElementById('btnNextDate').addEventListener('click', () => changeDate(1));
      
      document.getElementById('dateInput').addEventListener('change', (e) => {
        if (e.target.value) {
          currentDateStr = e.target.value;
          renderTable();
        }
      });

      document.getElementById('btnToday').addEventListener('click', () => {
        currentDateStr = formatDateForInput(new Date());
        updateControlsUI();
        renderTable();
      });

      // ビュー切り替え
      document.getElementById('btnDailyView').addEventListener('click', () => {
        viewMode = 'daily';
        updateControlsUI();
        renderTable();
      });

      document.getElementById('btnFacilityView').addEventListener('click', () => {
        viewMode = 'facility';
        updateControlsUI();
        renderTable();
      });

      // 施設切り替え
      document.getElementById('facilitySelect').addEventListener('change', (e) => {
        selectedFacilityId = e.target.value;
        renderTable();
      });

      // Excel入出力
      document.getElementById('btnExportExcel').addEventListener('click', handleExportExcel);
      document.getElementById('excelInput').addEventListener('change', handleImportExcel);

      // モーダル閉じる
      document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    }

    // --- 表を1画面に収める：画面の残りの高さを実測し、行の高さを割り当てる ---
    const ROW_MIN = 32;   // これより低くなる画面では、表の中だけスクロールさせる
    const ROW_MAX = 110;  // 大きな画面で行が間延びしすぎないように
    function fitTableToScreen() {
      const active = document.activeElement;
      const modal = document.getElementById('reservationModal');
      if (active && modal.contains(active) && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return; // キーボード表示中
      const scroller = document.querySelector('.table-scroll');
      const thead = document.getElementById('tableHead');
      const rows = document.getElementById('tableBody').rows.length;
      if (!scroller || !rows) return;
      // いったんスクロールバーを消してから測る(Windowsではバーが幅を取り、そのせいで横のバーまで出るため)
      scroller.style.overflowX = 'hidden';
      scroller.style.overflowY = 'hidden';
      document.documentElement.style.overflowY = 'hidden';
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const mainPadBottom = parseFloat(getComputedStyle(document.querySelector('main')).paddingBottom) || 0;
      const avail = Math.floor(vh - scroller.getBoundingClientRect().top - (window.scrollY || 0) - mainPadBottom - 2);
      scroller.style.maxHeight = `${Math.max(avail, 150)}px`;
      let rowH = Math.floor((avail - thead.offsetHeight - 2) / rows);
      rowH = Math.max(ROW_MIN, Math.min(ROW_MAX, rowH));
      document.documentElement.style.setProperty('--row-h', `${rowH}px`);
      // 丸めや枠線のぶんで1〜2pxはみ出した時は、少しずつ縮めて合わせる
      for (let i = 0; i < 3 && rowH > ROW_MIN && scroller.scrollHeight > scroller.clientHeight; i++) {
        const over = scroller.scrollHeight - scroller.clientHeight;
        rowH = Math.max(ROW_MIN, rowH - Math.ceil(over / rows));
        document.documentElement.style.setProperty('--row-h', `${rowH}px`);
      }
      // 本当にはみ出している方向だけスクロールバーを出す(数pxの誤差では出さない)
      const TOL = 2;
      scroller.style.overflowY = (scroller.scrollHeight - scroller.clientHeight > TOL) ? 'auto' : 'hidden';
      scroller.style.overflowX = (scroller.scrollWidth - scroller.clientWidth > TOL) ? 'auto' : 'hidden';
      document.documentElement.style.overflowY = (document.documentElement.scrollHeight - window.innerHeight > TOL) ? '' : 'hidden';
    }
    let fitTimer = null;
    function scheduleFit() {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(fitTableToScreen, 60);
    }
    ['resize', 'pageshow'].forEach(t => window.addEventListener(t, scheduleFit));
    window.addEventListener('orientationchange', () => setTimeout(fitTableToScreen, 300));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleFit);
    window.addEventListener('load', fitTableToScreen);

    // --- iOS 対策：ピンチ拡大の抑止・拡大の自己修復・高さの実測 ---
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
      document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
    });
    function resetZoomIfNeeded() {
      if (!window.visualViewport || window.visualViewport.scale <= 1.02) return;
      const meta = document.querySelector('meta[name="viewport"]');
      if (!meta) return;
      const original = meta.getAttribute('content');
      meta.setAttribute('content', original + ', maximum-scale=1.0');
      requestAnimationFrame(() => meta.setAttribute('content', original));
    }
    function setAppHeight() {
      const el = document.activeElement;
      if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;  // キーボード表示中は縮めない
      const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      if (h > 0) document.documentElement.style.setProperty('--app-h', `${Math.round(h)}px`);
    }
    setAppHeight();
    ['resize', 'pageshow'].forEach(t => window.addEventListener(t, setAppHeight));
    window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 250));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => { setAppHeight(); resetZoomIfNeeded(); });
      window.visualViewport.addEventListener('scroll', () => { setAppHeight(); resetZoomIfNeeded(); });
    }
    document.addEventListener('gestureend', () => setTimeout(resetZoomIfNeeded, 50), { passive: true });

    // アプリ起動
    initApp();

  </script>
</body>
</html>
